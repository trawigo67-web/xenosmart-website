name: Çeyrekmatik Goldpreis

# Aktualisiert markaistanbul/price.json automatisch jeden Tag (Ersatzpreis,
# falls der Live-Kurs in der App einmal nicht geladen werden kann).
on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 06:17 Uhr (Köln, Winterzeit)
    - cron: "17 11 * * *"  # täglich ca. 12:17 Uhr
    - cron: "17 16 * * *"  # täglich ca. 17:17 Uhr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Goldpreis holen
        run: |
          set -e
          curl -fsS https://api.gold-api.com/price/XAU/EUR -o /tmp/g.json
          python3 - <<'EOF'
          import json
          j = json.load(open('/tmp/g.json'))
          p = float(j['price'])
          assert 1000 < p < 20000, p
          json.dump({'ozEur': round(p, 2), 'updatedAt': j.get('updatedAt'), 'source': 'gold-api.com'},
                    open('markaistanbul/price.json', 'w'))
          print('Preis pro Unze EUR:', p)
          EOF
      - name: Speichern
        run: |
          git config user.name "Çeyrekmatik Bot"
          git config user.email "actions@users.noreply.github.com"
          git add markaistanbul/price.json
          git diff --cached --quiet || (git commit -m "Goldpreis aktualisiert" && git push)
