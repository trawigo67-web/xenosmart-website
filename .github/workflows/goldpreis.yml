name: Çeyrekmatik Goldpreis

# Aktualisiert markaistanbul/price.json automatisch jeden Tag (Ersatzpreis,
# falls der Live-Kurs in der App einmal nicht geladen werden kann).
on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 06:17 Uhr (Köln, Winterzeit)
    - cron: "17 11 * * *"  # täglich ca. 12:17 Uhr
    - cron: "17 16 * * *"  # täglich ca. 17:17 Uhr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Goldpreis holen (Kitco, sonst gold-api.com)
        run: |
          set -e
          python3 - <<'EOF'
          import json, urllib.request, datetime
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=20).read().decode()
          try:
              f = get('https://proxy.kitco.com/getPM?symbol=AU&currency=EUR').strip().split(',')
              p, src = float(f[4]), 'Kitco'
          except Exception as e:
              print('Kitco Fehler:', e)
              p, src = float(json.loads(get('https://api.gold-api.com/price/XAU/EUR'))['price']), 'gold-api.com'
          assert 1000 < p < 20000, p
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump({'ozEur': round(p, 2), 'updatedAt': now, 'source': src}, open('markaistanbul/price.json', 'w'))
          print(src, 'EUR/oz:', p)
          EOF
      - name: Speichern
        run: |
          git config user.name "Çeyrekmatik Bot"
          git config user.email "actions@users.noreply.github.com"
          git add markaistanbul/price.json
          git diff --cached --quiet || (git commit -m "Goldpreis aktualisiert" && git push)
