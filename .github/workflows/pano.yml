name: Çeyrekmatik Tagespreis-Bild 10 Uhr

# Erstellt jeden Morgen gegen 10:00 Uhr (Köln) das Preis-Bild für Instagram/WhatsApp
# und legt es unter markaistanbul/pano/latest.png ab (Admin-Bereich: "Günlük paylaşım").
on:
  schedule:
    - cron: "5,25,45 3-11 * * *"   # alle 20 Min. zwischen ca. 05:00 und 13:00 Uhr Köln; die Uhrzeit pro Wochentag steht in config.json (Admin)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pano
  cancel-in-progress: false

jobs:
  bild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uhrzeit prüfen (Wochenplan aus dem Admin)
        id: zeit
        run: |
          python3 - <<'EOF' >> $GITHUB_OUTPUT
          import json, datetime, zoneinfo, os
          now = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Berlin"))
          d = now.strftime("%Y-%m-%d"); print("datum=" + d)
          if os.environ.get("EV") == "workflow_dispatch":
              print("los=1"); raise SystemExit
          cfg = json.load(open("markaistanbul/config.json"))
          t = (cfg.get("paylasim") or {}).get(str(now.isoweekday()), "10:00")
          try: last = json.load(open("markaistanbul/pano/latest.json"))["date"]
          except Exception: last = ""
          if not t or last == d: raise SystemExit
          h, m = map(int, t.split(":"))
          ziel = now.replace(hour=h, minute=m, second=0, microsecond=0)
          # ca. 25 Min. vorher starten, damit das Bild zur gewählten Uhrzeit fertig ist; bis 2 Std. danach nachholen
          if ziel - datetime.timedelta(minutes=25) <= now <= ziel + datetime.timedelta(hours=2):
              print("los=1")
          EOF
        env:
          EV: ${{ github.event_name }}
      - name: Browser installieren
        if: steps.zeit.outputs.los == '1'
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Bild erstellen
        if: steps.zeit.outputs.los == '1'
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          mkdir -p markaistanbul/pano
          cat > /tmp/shot.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1080,height:1920},deviceScaleFactor:1});
          await p.goto('http://localhost:8765/markaistanbul/pano.html');
          await p.waitForSelector('body[data-ready="1"]',{timeout:60000});await p.waitForTimeout(800);
          await p.locator('#pano').screenshot({path:'markaistanbul/pano/latest.png'});await b.close();})();
          JS
          NODE_PATH=$(pwd)/node_modules node /tmp/shot.js
          echo "{\"date\":\"${{ steps.zeit.outputs.datum }}\",\"created\":\"$(date -u +%FT%TZ)\"}" > markaistanbul/pano/latest.json
      - name: Speichern
        if: steps.zeit.outputs.los == '1'
        run: |
          git config user.name "Çeyrekmatik Bot"
          git config user.email "actions@users.noreply.github.com"
          git add markaistanbul/pano/latest.png markaistanbul/pano/latest.json
          git commit -m "Tagespreis-Bild ${{ steps.zeit.outputs.datum }}" || exit 0
          git pull --rebase -q && git push
