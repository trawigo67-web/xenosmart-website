<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pkg/app/static/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1640}
body{font-family:"Instrument Sans","DejaVu Sans",sans-serif;color:#14213d}
#stage{position:absolute;left:0;top:0;overflow:hidden}
.scene{position:absolute;inset:0;overflow:hidden}
.scene.dark{background:radial-gradient(120% 90% at 60% 35%,#1d3fb8 0%,#0f2a8a 38%,#0a1440 100%);color:#fff}
.scene.light{background:#eef1f6}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.06}
.sub{color:#5b6478;font-weight:500}
.dark .sub{color:#c9d4ff}
.kick{font-weight:700;color:#1d4ed8;display:flex;flex-direction:column;gap:14px}
.dashes{display:flex;gap:10px}.dashes i{width:54px;height:8px;border-radius:4px;background:#cbd5ee}.dashes i.on{background:#1d4ed8}
ul.bul{list-style:none;display:flex;flex-direction:column;gap:18px}
ul.bul li{display:flex;gap:16px;align-items:center;font-weight:500;color:#334}
ul.bul li::before{content:"";width:14px;height:14px;border-radius:50%;background:#facc15;flex:none}
.phone{position:absolute;background:#0b1220;border-radius:calc(var(--sw)*.15);padding:calc(var(--sw)*.028);box-shadow:0 40px 90px rgba(10,20,60,.35),0 0 0 2px rgba(255,255,255,.08) inset}
.screen{position:relative;width:var(--sw);height:calc(var(--sw)*844/390);border-radius:calc(var(--sw)*.125);overflow:hidden;background:#fff}
.inner{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;transform:scale(calc(var(--k)))}
.scr{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden;background:#eef1f6}
.scr img.full{width:390px;height:844px;display:block}
.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(250,204,21,.5);border:4px solid #facc15;box-shadow:0 0 0 0 rgba(250,204,21,.5);opacity:0}
.chip{position:absolute;background:#fff;border-radius:18px;padding:14px 20px;box-shadow:0 14px 40px rgba(10,20,60,.22);display:flex;flex-direction:column;gap:2px;white-space:nowrap;border:2px solid #e3eafd}
.chip small{font-size:.62em;font-weight:700;color:#5b6478;text-transform:uppercase;letter-spacing:.06em}
.chip b{font-family:"Bricolage Grotesque";font-weight:800}
.chip.warn{border-color:#facc15}.chip.red b{color:#b42318}
#cap{position:absolute;z-index:50;background:rgba(15,23,42,.92);color:#fff;font-weight:600;border-radius:22px;line-height:1.3;text-wrap:balance}
#src{position:absolute;z-index:40;color:rgba(255,255,255,.55);font-size:17px}
.paper{position:absolute;background:#fff;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.3);padding:22px;color:#14213d;display:flex;flex-direction:column;gap:10px}
.paper b{font-family:"Bricolage Grotesque";font-weight:800}
.paper i{display:block;height:9px;border-radius:5px;background:#d8deea}
.paper em{font-style:normal;font-weight:700;color:#5b6478;align-self:flex-end;margin-top:auto}
.stamp{position:absolute;font-family:"Bricolage Grotesque";font-weight:800;color:#fff;background:#dc2626;border:6px solid #fff;border-radius:14px;padding:10px 30px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo{border-radius:22%;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 30px 70px rgba(0,0,0,.35)}
.pill{display:inline-block;border-radius:999px;font-weight:800}
.pill.y{background:#facc15;color:#14213d}.pill.o{border:3px solid rgba(255,255,255,.7);color:#fff}
.lchips{display:flex;flex-wrap:wrap;gap:12px}
.lchips span{background:#fff;border:2px solid #d8deea;border-radius:999px;padding:8px 20px;font-weight:700;font-family:"Instrument Sans","DejaVu Sans",sans-serif}
.dark .lchips span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.row{background:#fff;color:#14213d;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:30px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:4px solid transparent}
.row.hot{border-color:#facc15}
.row div{display:flex;flex-direction:column}.row b{font-weight:700}.row small{color:#5b6478}
.row strong{font-family:"Bricolage Grotesque";font-weight:800;color:#b42318;white-space:nowrap}
.barw{display:flex;flex-direction:column;gap:10px}
.bar{height:92px;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;padding:0 26px;color:#fff;font-family:"Bricolage Grotesque";font-weight:800;overflow:hidden;white-space:nowrap}
/* Handy-Nachbauten (schematisch) */
.m{font-family:"Instrument Sans",sans-serif;color:#111;font-size:15px}
.m .sb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:15px;z-index:5}
.m .sb i{width:60px;height:12px;border-radius:6px;background:currentColor;opacity:.75}
.m .page{position:absolute;left:0;right:0;top:0;bottom:0}
.m .page img{width:390px;display:block}
.sbar{position:absolute;left:10px;right:10px;bottom:22px;height:54px;display:flex;gap:8px;align-items:center;z-index:6}
.sbar .addr{flex:1;height:54px;border-radius:27px;background:rgba(245,246,250,.96);box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;color:#111}
.sbar .ib{width:54px;height:54px;border-radius:27px;background:rgba(245,246,250,.96);box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;place-items:center;color:#1d4ed8;position:relative}
.ring{position:absolute;inset:-7px;border-radius:50%;border:5px solid #facc15;opacity:0}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet2{position:absolute;left:0;right:0;bottom:0;background:#f2f2f7;border-radius:26px 26px 0 0;overflow:hidden}
.sh-h{display:flex;gap:12px;align-items:center;padding:18px 18px 14px}
.sh-h b{font-size:17px}.sh-h small{color:#777;display:block}
.circs{display:flex;gap:18px;padding:6px 18px 18px}.circs i{width:62px;height:62px;border-radius:50%;background:#d5d8e0;flex:none}
.lst{margin:0 16px 14px;background:#fff;border-radius:16px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;padding:0 18px;height:56px;border-bottom:1px solid #e6e6ea;font-size:17px;position:relative}
.li:last-child{border-bottom:0}
.li svg{width:24px;height:24px;color:#333}
.li.hl{background:#fff7cc;font-weight:700}
.li.hl::after{content:"";position:absolute;inset:0;border:4px solid #facc15;border-radius:6px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px;font-size:17px}
.dlg-h b{font-weight:700}.dlg-h span{color:#1d4ed8}.dlg-h span.go{font-weight:800;position:relative;padding:6px 10px}
.home{position:absolute;inset:0;background:linear-gradient(160deg,#27408b,#6b3fa0 55%,#d16d6d)}
.grid4{position:absolute;left:26px;right:26px;top:84px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;font-size:12px;font-weight:600}
.app i{width:66px;height:66px;border-radius:16px;display:block}
.app u{display:block;width:44px;height:8px;border-radius:4px;background:rgba(255,255,255,.6);text-decoration:none}
.dock{position:absolute;left:14px;right:14px;bottom:20px;height:92px;border-radius:30px;background:rgba(255,255,255,.25);display:flex;justify-content:space-around;align-items:center}
.dock i{width:62px;height:62px;border-radius:15px;display:block}
.cbar{position:absolute;left:0;right:0;top:44px;height:56px;background:#fff;display:flex;gap:10px;align-items:center;padding:0 12px;border-bottom:1px solid #e3e3e3;z-index:6}
.cbar .addr{flex:1;height:40px;border-radius:20px;background:#eef1f6;display:flex;align-items:center;padding:0 16px;font-size:16px}
.cbar .dots{width:40px;height:40px;display:grid;place-items:center;position:relative;border-radius:50%}
.cmenu{position:absolute;right:8px;top:52px;width:292px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:8px 0;z-index:8}
.cmenu .li{border:0;height:50px;font-size:16px;justify-content:flex-start;gap:14px}
.platform{display:inline-flex;align-items:center;gap:10px;background:#14213d;color:#fff;border-radius:999px;font-weight:800;padding:8px 22px}
</style></head><body><div id="stage"></div>
<script>
const C=window.CFG, V=C.fmt==="v", W=C.W, H=C.H, L=C.lang;
const st=document.getElementById("stage"); st.style.width=W+"px"; st.style.height=H+"px";
const LOGO=s=>`<svg class="logo" width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1d4ed8"/><rect x="18" y="28" width="64" height="46" rx="6" fill="#fff"/><path d="M22 33L50 54L78 33" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 86L74 16" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/><path d="M30 86L74 16" stroke="#facc15" stroke-width="5" stroke-linecap="round"/></svg>`;
const SHARE=`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
const PLUSQ=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`;
const DOTSH=`<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;
const DOTSV=`<svg viewBox="0 0 24 24" width="24" height="24" fill="#444"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`;
const A=(t,extra="")=>`class="a ${extra}" data-a="${t}"`;
const X={de:{copy:"Kopieren",read:"Zur Leseliste hinzufügen",bm:"Lesezeichen hinzufügen",home:"Zum Home-Bildschirm",print:"Drucken",cancel:"Abbrechen",add:"Hinzufügen",web:"Als Web-App öffnen",nt:"Neuer Tab",hist:"Verlauf",dl:"Downloads",bms:"Lesezeichen",inst:"Installieren und Verknüpfung erstellen",set:"Einstellungen"},
 tr:{copy:"Kopyala",read:"Okuma Listesine Ekle",bm:"Yer İmi Ekle",home:"Ana Ekrana Ekle",print:"Yazdır",cancel:"Vazgeç",add:"Ekle",web:"Web Uygulaması Olarak Aç",nt:"Yeni sekme",hist:"Geçmiş",dl:"İndirilenler",bms:"Yer işaretleri",inst:"Yükle ve kısayol oluştur",set:"Ayarlar"}}[L]||{};
const SB=(c="#111")=>`<div class="sb" style="color:${c}"><span>9:41</span><i></i></div>`;
const COLS=["#f59e0b","#10b981","#ef4444","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f97316","#64748b","#22c55e","#eab308","#06b6d4"];
function mock(m){
  const page=`<div class="page"><img src="shots/${L}/welcome.jpg"></div>`;
  if(m.k==="safari") return `<div class="m">${page}${SB("#fff")}<div class="sbar"><div class="addr"><span class="type" data-a="${m.type||-9}" data-text="mailcut.app"></span></div><div class="ib">${SHARE}<span class="ring" data-ring="${m.r1||-9}"></span></div><div class="ib">${DOTSH}<span class="ring" data-ring="${m.r2||-9}"></span></div></div></div>`;
  if(m.k==="share") return `<div class="m">${page}<div class="dim"></div><div class="sheet2" style="height:640px"><div class="sh-h">${LOGO(48)}<div><b>Mailcut</b><small>app.mailcut.de</small></div></div><div class="circs"><i></i><i></i><i></i><i></i><i></i></div><div class="scrl" data-a="${m.scroll}" data-dy="-112"><div class="lst"><div class="li">${X.copy}</div><div class="li">${X.read}</div><div class="li">${X.bm}</div></div><div class="lst"><div class="li hlr" data-hl="${m.hl}">${X.home}${PLUSQ}</div><div class="li">${X.print}</div></div><div class="lst"><div class="li">&nbsp;</div><div class="li">&nbsp;</div></div></div></div></div>`;
  if(m.k==="add") return `<div class="m">${page}<div class="dim"></div><div class="sheet2" style="height:470px"><div class="dlg-h"><span>${X.cancel}</span><b>${X.home}</b><span class="go">${X.add}<span class="ring" style="border-radius:14px;inset:-4px" data-ring="${m.r}"></span></span></div><div class="lst"><div class="li" style="height:84px;justify-content:flex-start;gap:14px">${LOGO(56)}<div><b>Mailcut</b><div style="color:#777;font-size:14px">app.mailcut.de</div></div></div></div><div class="lst"><div class="li">${X.web}<span style="width:52px;height:32px;border-radius:16px;background:#34c759;display:block;position:relative"><span style="position:absolute;right:2px;top:2px;width:28px;height:28px;border-radius:50%;background:#fff"></span></span></div></div></div></div>`;
  if(m.k==="home") return `<div class="m"><div class="home"></div>${SB("#fff")}<div class="grid4">${COLS.slice(0,9).map(c=>`<div class="app"><i style="background:${c}"></i><u></u></div>`).join("")}<div class="app pop" data-a="${m.pop}">${LOGO(66).replace('class="logo"','style="border-radius:16px;box-shadow:0 0 0 4px #facc15"')}<span>Mailcut</span></div></div><div class="dock">${COLS.slice(8,12).map(c=>`<i style="background:${c}"></i>`).join("")}</div></div>`;
  if(m.k==="chrome") return `<div class="m"><div class="page" style="top:100px"><img src="shots/${L}/welcome.jpg"></div><div style="position:absolute;left:0;right:0;top:0;height:44px;background:#fff"></div>${SB()}<div class="cbar"><div class="addr"><span class="type" data-a="${m.type}" data-text="mailcut.app"></span></div><div class="dots">${DOTSV}<span class="ring" data-ring="${m.r}"></span></div></div><div ${A(m.menu,"cmenu")}><div class="li">${X.nt}</div><div class="li">${X.hist}</div><div class="li">${X.dl}</div><div class="li">${X.bms}</div><div class="li hlr" data-hl="${m.hl}" style="height:66px;line-height:1.2">${X.inst}</div><div class="li">${X.set}</div></div></div>`;
  return "";
}
function phone(sc,sw,x,y,rot){
  const k=sw/390;
  const scr=(sc.screens||[]).map((s,i)=>`<div class="scr" data-a="${i?s.at:-99}">${s.mock?mock(s.mock):`<img class="full" src="shots/${s.lang||L}/${s.src}.jpg">`}</div>`).join("");
  const taps=(sc.taps||[]).map(tp=>`<div class="tap" data-tap="${tp.at}" style="left:${tp.x}px;top:${tp.y}px"></div>`).join("");
  return `<div class="phone" style="--sw:${sw}px;--k:${k};left:${x}px;top:${y}px;${rot?`rotate:${rot}deg;`:""}"><div class="screen"><div class="inner">${scr}${taps}</div></div></div>`;
}
function chips(sc,sw,px,py){ const k=sw/390, fs=V?30:24;
  return (sc.chips||[]).map(c=>`<div ${A(c.at,"chip "+(c.cls||""))} style="font-size:${fs}px;${c.side==="l"?`right:${W-px+ (V?-70:20)}px`:`left:${px+sw+(V?-60:40)}px`};top:${py+c.y*k}px"><small>${c.label}</small><b>${c.value}</b></div>`).join(""); }
function build(sc){
  const t=sc.t0; let h="";
  if(sc.kind==="papers"){
    const P=[["Finanzamt","412,00 €"],["Inkasso","96,50 €"],["Krankenkasse","—"],["Schule","20,00 €"],["Mahnung","58,90 €"],["Versicherung","—"]];
    const pos=V?[[90,640,-7],[420,600,5],[720,700,-4],[130,1010,6],[470,980,-3],[330,1280,4]]:[[980,150,-6],[1260,110,5],[1540,190,-4],[1020,520,6],[1320,470,-3],[1560,580,4]];
    const pw=V?300:270, ph=V?330:300;
    h+=`<h1 ${A(t+.1)} style="position:absolute;${V?`left:80px;right:80px;top:210px;text-align:center;font-size:88px`:`left:140px;top:330px;width:760px;font-size:92px`}">${sc.h}</h1>`;
    h+=`<div ${A(t+.5,"sub")} style="position:absolute;${V?`left:80px;right:80px;top:420px;text-align:center;font-size:40px`:`left:140px;top:${sc.hl2?560:560}px;width:760px;font-size:38px`}">${sc.s||""}</div>`;
    P.forEach((p,i)=>{ h+=`<div ${A(t+.25+i*.22,"paper")} style="left:${pos[i][0]}px;top:${pos[i][1]}px;width:${pw}px;height:${ph}px;rotate:${pos[i][2]}deg"><b style="font-size:${V?30:27}px;${p[0]==="Mahnung"?"color:#dc2626":""}">${p[0]}</b><i></i><i style="width:80%"></i><i style="width:90%"></i><i style="width:60%"></i><em style="font-size:${V?24:22}px">${p[1]}</em></div>`; });
    h+=`<div ${A(sc.stampAt,"stamp pop")} style="${V?"left:300px;top:930px;font-size:92px":"left:1180px;top:390px;font-size:84px"};rotate:-8deg">${sc.stamp}</div>`;
  } else if(sc.kind==="phone"){
    const sw=V?480:416, px=V?(W-sw)/2-14:1310, py=V?440:74;
    if(V){ h+=`${sc.plat?`<div ${A(t+.05)} style="position:absolute;left:0;right:0;top:120px;text-align:center"><span class="platform" style="font-size:34px">${sc.plat}</span></div>`:""}<h1 ${A(t+.1)} style="position:absolute;left:60px;right:60px;top:${sc.plat?200:170}px;text-align:center;font-size:${(sc.h||"").length>24?66:78}px">${sc.h||""}</h1><div ${A(t+.3,"sub")} style="position:absolute;left:60px;right:60px;top:${sc.plat?(sc.h.length>24?350:300):(sc.h.length>24?330:278)}px;text-align:center;font-size:38px">${sc.s||""}</div>`; }
    else { h+=`<div style="position:absolute;left:150px;top:${sc.kick?250:300}px;width:1050px;display:flex;flex-direction:column;gap:30px">${sc.kick?`<div ${A(t+.05,"kick")} style="font-size:30px"><div class="dashes">${[1,2,3,4,5].map(i=>`<i class="${i<=sc.step?"on":""}"></i>`).join("")}</div>${sc.kick}</div>`:""}<h1 ${A(t+.15)} style="font-size:84px">${sc.h||""}</h1>${sc.s?`<div ${A(t+.3,"sub")} style="font-size:36px">${sc.s}</div>`:""}<ul class="bul" style="font-size:36px">${(sc.bullets||[]).map((b,i)=>`<li ${A(t+.5+i*.35)}>${b}</li>`).join("")}</ul></div>`; }
    h+=phone(sc,sw,px,py)+chips(sc,sw,px+ (V?14:14),py);
  } else if(sc.kind==="langs"){
    const names=["Deutsch","Türkçe","English","العربية","Kurdî","Shqip","Français","Русский","Українська","Polski","Română","فارسی"];
    const ls=sc.langs;
    if(V){ h+=`<h1 ${A(t+.1)} style="position:absolute;left:60px;right:60px;top:170px;text-align:center;font-size:78px">${sc.h}</h1><div ${A(t+.3,"sub")} style="position:absolute;left:60px;right:60px;top:278px;text-align:center;font-size:38px">${sc.s||""}</div>`;
      h+=phone({screens:[{src:"start",lang:ls[1]}]},360,60,560,-7)+phone({screens:[{src:"start",lang:ls[2]}]},360,W-60-380,560,7)+phone({screens:[{src:"start",lang:ls[0]}]},430,(W-454)/2,470);
      h+=`<div class="lchips" style="position:absolute;left:70px;right:70px;top:1450px;justify-content:center;font-size:30px">${names.map((n,i)=>`<span ${A(t+.6+i*.1)}>${n}</span>`).join("")}</div>`; }
    else { h+=`<div style="position:absolute;left:150px;top:230px;width:900px;display:flex;flex-direction:column;gap:30px"><h1 ${A(t+.1)} style="font-size:84px">${sc.h}</h1><div ${A(t+.3,"sub")} style="font-size:36px">${sc.s||""}</div><div class="lchips" style="font-size:30px;margin-top:10px">${names.map((n,i)=>`<span ${A(t+.6+i*.1)}>${n}</span>`).join("")}</div></div>`;
      h+=phone({screens:[{src:"start",lang:ls[1]}]},300,1090,200,-6)+phone({screens:[{src:"start",lang:ls[2]}]},300,1550,200,6)+phone({screens:[{src:"start",lang:ls[0]}]},360,1290,120); }
  } else if(sc.kind==="logo"){
    const s=V?260:210;
    h+=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${V?34:26}px;padding-bottom:${V?120:60}px"><div ${A(t+.1,"pop")}>${LOGO(s)}</div><h1 ${A(t+.3)} style="font-size:${V?150:130}px">Mailcut</h1><div ${A(t+.5)} style="font-size:${V?48:42}px;font-weight:600;text-align:center;padding:0 60px">${sc.tag}</div><div ${A(t+.8,"pill y")} style="font-size:${V?50:44}px;padding:14px 44px;margin-top:20px">${sc.url}</div>${sc.trial?`<div ${A(t+1.1,"pill o")} style="font-size:${V?36:32}px;padding:10px 34px">${sc.trial}</div>`:""}</div>`;
  } else if(sc.kind==="title"){
    h+=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 70px 160px;text-align:center"><div ${A(t+.1,"pop")}>${LOGO(220)}</div><h1 ${A(t+.3)} style="font-size:96px">${sc.h}</h1><div ${A(t+.6,"pill y")} style="font-size:46px;padding:12px 40px">${sc.s}</div></div>`;
  } else if(sc.kind==="number"){
    h+=`<div style="position:absolute;left:150px;top:280px;width:1500px;display:flex;flex-direction:column;gap:18px"><h1 ${A(t+.1,"pop")} style="font-size:250px;color:#facc15;transform-origin:0 60%">${sc.num}</h1><div ${A(t+.5)} style="font-size:62px;font-weight:700;max-width:1300px;line-height:1.15">${sc.label}</div><div ${A(t+.8,"sub")} style="font-size:34px">${sc.s||""}</div></div>`;
  } else if(sc.kind==="list"){
    h+=`<h1 ${A(t+.1)} style="position:absolute;left:150px;top:330px;width:640px;font-size:80px">${sc.h}</h1>`;
    h+=`<div style="position:absolute;left:850px;top:110px;width:940px;display:flex;flex-direction:column;gap:18px">${sc.rows.map(r=>`<div ${A(r.at,"row")} data-hot="${r.at}" data-cool="${r.cool}" style="padding:20px 30px"><div><b style="font-size:33px">${r.n}</b><small style="font-size:24px">${r.s||""}</small></div><strong style="font-size:46px">${r.v}</strong></div>`).join("")}</div>`;
  } else if(sc.kind==="compare"){
    h+=`<h1 ${A(t+.1)} style="position:absolute;left:150px;top:300px;width:700px;font-size:78px">${sc.h}</h1>`;
    h+=`<div style="position:absolute;left:940px;top:300px;width:840px;display:flex;flex-direction:column;gap:46px;font-size:30px;font-weight:700;color:#5b6478">${sc.bars.map((b,i)=>`<div class="barw"><span ${A(t+.4+i*1.6)}>${b.l}</span><div class="bar" data-bar="${t+.6+i*1.6}" data-w="${b.w}" style="background:${b.c};font-size:46px">${b.v}</div></div>`).join("")}</div>`;
  }
  return `<div class="scene ${sc.bg||"light"}" data-t0="${sc.t0}">${h}</div>`;
}
st.innerHTML=C.scenes.map(build).join("")+`<div id="cap"></div>`+(C.src?`<div id="src">${C.src}</div>`:"");
const cap=document.getElementById("cap");
Object.assign(cap.style, V?{left:"70px",right:"70px",bottom:"120px",padding:"26px 34px",fontSize:"44px",textAlign:"center"}:{left:"150px",bottom:"70px",maxWidth:"1100px",padding:"20px 30px",fontSize:"36px"});
const src=document.getElementById("src"); if(src) Object.assign(src.style,{left:"150px",top:"40px"});
const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, back=x=>{x=clamp(x);const c=1.7;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const scenes=[...document.querySelectorAll(".scene")];
window.render=function(t){
  scenes.forEach((el,i)=>{ const t0=+el.dataset.t0, nx=i+1<scenes.length?+scenes[i+1].dataset.t0:1e9;
    const vis=t>=t0-.3&&t<nx+.3; el.style.display=vis?"block":"none"; if(!vis) return;
    el.style.opacity=i?ease((t-(t0-.25))/.5):1; el.style.zIndex=i;
    el.querySelectorAll(".a").forEach(a=>{ const p=ease((t-(+a.dataset.a))/.5); a.style.opacity=p;
      if(a.classList.contains("pop")){ a.style.scale=.6+.4*back((t-(+a.dataset.a))/.55); } else a.style.translate=`0 ${(1-p)*26}px`; });
    el.querySelectorAll(".scr").forEach(s=>{ s.style.opacity=ease((t-(+s.dataset.a))/.4); });
    el.querySelectorAll(".tap").forEach(s=>{ const a=+s.dataset.tap, p=(t-a)/.7; if(t<a-.5||p>1){s.style.opacity=0;return;} if(t<a){ s.style.opacity=clamp((t-(a-.5))/.25)*.9; s.style.scale=1; s.style.boxShadow="none"; } else { s.style.opacity=1-p; s.style.scale=1-.25*Math.sin(Math.min(1,p*2)*Math.PI); s.style.boxShadow=`0 0 0 ${p*46}px rgba(250,204,21,${.45*(1-p)})`; } });
    el.querySelectorAll(".ring").forEach(s=>{ const a=+s.dataset.ring; if(t<a){s.style.opacity=0;return;} const q=(t-a)%1.1/1.1; s.style.opacity=t-a<3.3?(1-q*.7):0; s.style.scale=1+.18*q; });
    el.querySelectorAll(".type").forEach(s=>{ const a=+s.dataset.a, tx=s.dataset.text; s.textContent=a<-5?tx:tx.slice(0,Math.max(0,Math.floor((t-a)/.09))); });
    el.querySelectorAll(".scrl").forEach(s=>{ s.style.translate=`0 ${ease((t-(+s.dataset.a))/.9)*(+s.dataset.dy)}px`; });
    el.querySelectorAll(".hlr").forEach(s=>{ s.classList.toggle("hl",t>=+s.dataset.hl); });
    el.querySelectorAll(".row").forEach(s=>{ s.classList.toggle("hot",t>=+s.dataset.hot&&t<+s.dataset.cool); });
    el.querySelectorAll(".bar").forEach(s=>{ s.style.width=(8+ease((t-(+s.dataset.bar))/.9)*(+s.dataset.w-8))+"%"; s.style.opacity=t>=+s.dataset.bar-.1?1:0; });
  });
  let cur=null; for(const c of C.caps){ if(t>=c.t0-.05&&t<c.t1) cur=c; }
  if(cur){ if(cap.dataset.c!==cur.text){cap.textContent=cur.text;cap.dataset.c=cur.text} cap.style.opacity=Math.min(clamp((t-cur.t0+.05)/.2),clamp((cur.t1-t)/.15)); } else cap.style.opacity=0;
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{render(0);return true});
</script></body></html>
