:root{color-scheme:light;--bg:#fff;--surf:#fff;--soft:#f3f1ec;--ink:#16181b;--mut:#5b6168;--line:#e3e0da;--or:#c2410c;--orInk:#fff;--band:#c2410c;--bandInk:#fff;--go:#22803a;--goSoft:#e5f3e8;--brk:#e8a400;--brkSoft:#fff3d1;--bad:#c92a2a;--badSoft:#fdeaea;--off:#868e96;--board:#fbfaf7;--grid:#eeebe5;--sh:0 1px 2px rgba(20,20,20,.1),0 3px 8px rgba(20,20,20,.08)}
:root[data-theme=dark]{color-scheme:dark;--bg:#121416;--surf:#1a1d20;--soft:#25292d;--ink:#f1f2f3;--mut:#a3aab2;--line:#31363b;--or:#ff7a2e;--orInk:#1c0c03;--band:#6b2607;--bandInk:#ffe3d3;--go:#51cf66;--goSoft:#17301f;--brk:#fcc419;--brkSoft:#3a3112;--bad:#ff6b6b;--badSoft:#3b1d1d;--off:#7d868f;--board:#16191c;--grid:#22272b;--sh:0 1px 2px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121416;--surf:#1a1d20;--soft:#25292d;--ink:#f1f2f3;--mut:#a3aab2;--line:#31363b;--or:#ff7a2e;--orInk:#1c0c03;--band:#6b2607;--bandInk:#ffe3d3;--go:#51cf66;--goSoft:#17301f;--brk:#fcc419;--brkSoft:#3a3112;--bad:#ff6b6b;--badSoft:#3b1d1d;--off:#7d868f;--board:#16191c;--grid:#22272b;--sh:0 1px 2px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.35)}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.num{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}
.top{background:var(--band);color:var(--bandInk);padding:16px max(4vw,16px)}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.brand{margin-right:auto}
.brand h1{margin:0;display:flex;align-items:center;gap:12px;font:700 clamp(30px,4vw,38px)/1.05 "Barlow Semi Condensed",Barlow,sans-serif;letter-spacing:-.01em}
.brand h1 span{font:600 14px/1 Barlow,sans-serif;border:1.5px solid currentColor;border-radius:999px;padding:5px 10px}
.brand p{margin:4px 0 0;font-size:15px;max-width:70ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 14px;min-height:44px;font-weight:600}
.seg.b button[aria-pressed=true]{background:var(--bandInk);color:var(--band)}
.ghost{display:inline-flex;align-items:center;border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:0 16px;min-height:44px;font-weight:600}
.try{background:var(--soft);border-bottom:1px solid var(--line);padding:10px max(4vw,16px)}
.try p{max-width:1320px;margin:0 auto;font-size:15px}
.switch{display:none;max-width:1320px;margin:14px auto 0;padding:0 max(4vw,16px)}
.switch .seg{display:flex;width:100%;border-color:var(--line)}
.switch button{flex:1;min-height:46px}
.switch button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.app{max-width:1320px;margin:0 auto;padding:20px max(4vw,16px) 28px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
#phoneCol{position:sticky;top:12px}
.phone{width:390px;max-width:100%;margin:0 auto;border-radius:46px;padding:11px;background:#0e1012;box-shadow:0 0 0 2px #2b2f34,0 22px 44px rgba(0,0,0,.2)}
.screen{position:relative;border-radius:36px;overflow:hidden;background:var(--surf);height:780px;height:clamp(600px,calc(100svh - 40px),790px);display:flex;flex-direction:column}
.sbar{height:36px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px 0 32px;font:600 15px/1 Barlow,sans-serif}
.sbar svg{width:62px;height:13px;fill:currentColor}
.pscroll{flex:1;overflow-y:auto;padding:8px 18px 22px;display:flex;flex-direction:column;gap:14px}
@media (max-width:979px){.app{grid-template-columns:minmax(0,1fr)}.switch{display:block}#phoneCol{position:static}body[data-view=panel] #phoneCol,body[data-view=worker] #panelCol{display:none}}
@media (max-width:519px){.phone{width:auto;border-radius:0;padding:0;background:none;box-shadow:none}.screen{height:auto;min-height:72vh;min-height:72svh;border-radius:18px;border:1px solid var(--line);overflow:visible}.sbar{display:none}.pscroll{overflow:visible;padding-top:16px}}
.p-logo{font:700 20px/1 "Barlow Semi Condensed",sans-serif;color:var(--or);padding-top:4px}
.p-title{margin:0;font:700 30px/1.08 "Barlow Semi Condensed",sans-serif;letter-spacing:-.01em}
.p-sub{margin:-8px 0 0;color:var(--mut)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wbtn{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surf);min-height:66px;text-align:left}
.wbtn b{display:block;font-weight:600;line-height:1.15}
.wbtn small{display:block;color:var(--mut);font-size:13px;line-height:1.2}
.wbtn .dot{position:absolute;top:9px;right:9px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px/1 Barlow,sans-serif;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.28)}
.av.s{width:34px;height:34px;font-size:13px}
.av.l{width:72px;height:72px;font-size:26px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.d-work{background:var(--go)}
.d-break{background:var(--brk)}
.d-done{background:var(--ink)}
.p-head{display:flex;align-items:center;gap:10px;padding-top:4px}
.p-head b{display:block;line-height:1.15}
.p-head small{display:block;color:var(--mut);font-size:13px}
.icb{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf)}
.lnk{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;border:0;background:none;padding:0;min-height:44px;font-weight:600;color:var(--or)}
.lnk .ic{width:18px;height:18px}
.center{text-align:center}
.pin-who{display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-who b{font-size:20px}
.pdots{display:flex;gap:16px;justify-content:center}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pdots i.on{background:var(--ink)}
.pdots.err{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:auto}
.keys button{height:62px;border-radius:18px;border:0;background:var(--soft);font:600 28px/1 "Barlow Semi Condensed",sans-serif;display:grid;place-items:center}
.keys button:active{background:var(--line)}
.hint{margin:0;font-size:14px;color:var(--mut)}
.hint.bad{color:var(--bad);font-weight:600}
.greet{margin:0;font:700 30px/1.08 "Barlow Semi Condensed",sans-serif}
.lbl{margin:0;font-weight:600}
.slist{display:flex;flex-direction:column;gap:8px}
.site{display:flex;align-items:center;gap:12px;padding:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);min-height:54px;text-align:left;width:100%}
.site b{display:block;line-height:1.15}
.site small{display:block;color:var(--mut);font-size:13px}
.site .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto}
.site .ic{margin-left:auto;color:var(--mut)}
.site[aria-checked=true]{border-color:var(--or)}
.site[aria-checked=true] .rad{border:7px solid var(--or)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);margin:0}
.note .ic{width:18px;height:18px;margin-top:2px}
.simrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.seg.s{border-color:var(--line);color:var(--ink)}
.seg.s button{min-height:40px;padding:0 12px;font-size:14px}
.seg.s button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.big{width:100%;min-height:76px;border:0;border-radius:22px;font:700 26px/1 "Barlow Semi Condensed",sans-serif;display:flex;align-items:center;justify-content:center;gap:12px}
.big .ic{width:28px;height:28px}
.b-or{background:var(--or);color:var(--orInk)}
.b-brk{background:var(--brk);color:#1d1500}
.b-go{background:var(--go);color:#fff}
.b-ink{background:var(--ink);color:var(--bg)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2 .big{font-size:22px;min-height:70px}
.stpill{align-self:center;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;background:var(--soft)}
.timer{margin:0;text-align:center;font:700 clamp(54px,16vw,68px)/1 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tlab{margin:-6px 0 0;text-align:center;color:var(--mut);font-size:14px}
.wsite{margin:0;text-align:center;font-weight:600}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px;margin:0;padding:12px 14px;border-radius:14px;background:var(--soft)}
.facts dt{color:var(--mut)}
.facts dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ok{color:var(--go)}
.warn{color:var(--bad)}
.sx{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sx .ic{width:16px;height:16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;font-size:15px;color:var(--ink)}
.banner.ok{background:var(--goSoft)}
.banner.ok .ic{color:var(--go)}
.banner.warn{background:var(--badSoft)}
.banner.warn .ic{color:var(--bad)}
.wkline{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.kpi{background:var(--soft);border-radius:14px;padding:10px 14px}
.kpi small{display:block;color:var(--mut)}
.kpi b{font-size:30px;font-weight:700;line-height:1.1}
.hlist{list-style:none;margin:0;padding:0}
.hlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.hlist small{color:var(--mut);font-size:13px}
.hlist b{font-size:20px}
.locing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600;min-height:300px}
.locing .ic{width:56px;height:56px;color:var(--or);animation:pl .9s ease-in-out infinite alternate}
@keyframes pl{to{opacity:.35;transform:translateY(-5px)}}
.psheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.psheet .in{background:var(--surf);width:100%;border-radius:24px 24px 0 0;padding:20px 18px 22px;display:flex;flex-direction:column;gap:12px;max-height:85%;overflow:auto}
.psheet h3{margin:0;font:700 24px/1.1 "Barlow Semi Condensed",sans-serif}
@media (max-width:519px){.psheet{position:fixed;z-index:40}}
#panelCol{background:var(--surf);border:1px solid var(--line);border-radius:22px}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding:18px 22px 4px}
.ph h2{margin:0;font:700 30px/1.05 "Barlow Semi Condensed",sans-serif;letter-spacing:-.01em}
.ph p{margin:0;color:var(--mut);font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 12px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0 12px;min-height:46px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--or)}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:13px;font-weight:700}
.tb{padding:18px 22px 26px}
.tb h3{margin:0 0 4px;font:700 28px/1.1 "Barlow Semi Condensed",sans-serif;text-wrap:balance}
.tb .lead{margin:0 0 16px;color:var(--mut)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;background-color:var(--board);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:16px;padding:14px}
.col{display:flex;flex-direction:column;gap:8px}
.tape{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-weight:600;line-height:1.2;background:var(--ink);color:var(--bg)}
.tape small{display:block;font-weight:500;opacity:.85;font-size:13px}
.tape .num{font-size:22px}
.tp-break{background:var(--brk);color:#1d1500}
.tp-none{background:var(--off);color:#fff}

let S=null,DL=null;
const canNative=()=>!(window.claude&&typeof window.claude.use==='function');
const Wk=id=>S.W.find(w=>w.id===id);
const Sk=id=>S.S.find(s=>s.id===id);
const sN=(id,L)=>{const s=Sk(id);return s?(s.name[L]||s.name.tr):'?'};
const rN=(w,L)=>w.role[L]||w.role.tr;
const first=n=>String(n).trim().split(/\s+/)[0];
const ini=n=>String(n).trim().split(/\s+/).slice(0,2).map(x=>x.charAt(0)).join('').toLocaleUpperCase('tr-TR');
const t=(k,v,L)=>{const D=T[L||S.lang]||T.tr;let s=D[k]!=null?D[k]:(T.tr[k]!=null?T.tr[k]:k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const ic=(n,c)=>'<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const av=(w,c)=>'<span class="av'+(c?' '+c:'')+'" style="background:'+w.col+'">'+esc(ini(w.name))+'</span>';

/* time maths */
const brMs=(e,v)=>{const T1=v==null?now():v,end=e.b==null?T1:e.b;let s=0;for(const b of e.br)s+=Math.max(0,Math.min(b[1]==null?end:b[1],end)-b[0]);return s};
const dur=(e,v)=>{const T1=v==null?now():v;if(e.b==null&&e.a<dayStart(T1))return 0;const end=e.b==null?T1:e.b;return Math.max(0,end-e.a-brMs(e,T1))};
const todays=id=>{const t0=today();return S.E.filter(e=>e.w===id&&e.a>=t0).sort((a,b)=>a.a-b.a)};
const status=id=>{const es=todays(id),cur=es.find(e=>e.b==null);if(cur){const ob=cur.br.find(b=>b[1]==null);return {s:ob?'break':'work',e:cur,es,ob}}return {s:es.length?'done':'none',es}};
const worked=id=>todays(id).reduce((s,e)=>s+dur(e),0);
const brToday=id=>todays(id).reduce((s,e)=>s+brMs(e),0);
const sumRange=(id,a,b)=>S.E.reduce((s,e)=>e.w===id&&e.a>=a&&e.a<b?s+dur(e):s,0);
const lastSite=id=>{let best=null;for(const e of S.E)if(e.w===id&&(!best||e.a>best.a))best=e;return best?best.s:null};
function dayInfo(id,d){const es=S.E.filter(e=>e.w===id&&dayStart(e.a)===d).sort((a,b)=>a.a-b.a);if(!es.length)return null;const t0=today(),net=es.reduce((s,e)=>s+dur(e),0),br=es.reduce((s,e)=>s+brMs(e),0),open=es.some(e=>e.b==null&&d<t0),req=net>9*HOUR?45*MIN:net>6*HOUR?30*MIN:0,brBad=d<t0&&!open&&br<req;return {es,net,br,open,req,brBad,ot:net>8*HOUR,bad:net>10*HOUR||brBad}}
function alerts(){const out=[],t0=today(),from=addDays(t0,-21);
for(const e of S.E){if(e.a<from)continue;const d=dayStart(e.a),w=Wk(e.w);if(!w)continue;if(e.b==null&&d<t0)out.push({k:'o'+e.id,type:'open',e,w,d});if(e.la&&e.la.d>500&&S.ok.indexOf('a'+e.id)<0)out.push({k:'a'+e.id,type:'away',e,w,d})}
for(const w of S.W)for(let d=from;d<t0;d=addDays(d,1)){const i=dayInfo(w.id,d);if(i&&i.brBad&&S.ok.indexOf('b'+w.id+d)<0)out.push({k:'b'+w.id+d,type:'br',w,d,i})}
return out.sort((a,b)=>b.d-a.d)}

/* sample month: same data for every viewer, built around today */
function seed(){
const R=rng(20261127),N=now(),T0=dayStart(N),ri=k=>Math.floor(R()*k);
const W=W0.map((r,i)=>({id:r[0],name:r[1],role:{tr:r[2],de:r[3]},lang:r[4],home:r[5],pin:'1234',col:PAL[i]}));
const Ss=S0.map(r=>({id:r[0],name:{tr:r[1],de:r[2]},area:r[3]}));
const E=[],log=[];let n=0;
const mk=(w,s,a,b,br,la,lb)=>{const e={id:'e'+(++n),w,s,a,b,br,la,lb};E.push(e);return e};
const days=[];for(let d=monthStart(T0,-1);d<T0;d=addDays(d,1))if(new Date(d).getDay()!==0)days.push(d);
for(const d of days){const sat=new Date(d).getDay()===6;for(const w of W){if(sat?R()<.72:R()<.04)continue;const st=at(d,405+5*ri(8));const net=sat?240+15*ri(8):(R()<.15?510+5*ri(7):450+5*ri(7));const bm=net>540?45:net>360?30:0;const b0=at(d,690+5*ri(7));const site=R()<.1?Ss[ri(4)].id:w.home;mk(w.id,site,st,st+(net+bm)*MIN,bm?[[b0,b0+bm*MIN]]:[],{d:20+ri(190)},{d:20+ri(190)})}}
const wd=days.filter(d=>new Date(d).getDay()!==6),L=wd.length;
const get=(w,d)=>E.find(e=>e.w===w&&dayStart(e.a)===d)||mk(w,W.find(x=>x.id===w).home,at(d,420),at(d,930),[[at(d,720),at(d,750)]],{d:70},{d:90});
if(L>0){const e=get('w2',wd[L-1]);e.b=null;e.lb=null}
if(L>1){const d=wd[L-2],e=get('w4',d);e.a=at(d,390);e.br=[[at(d,720),at(d,750)]];e.b=at(d,990)}
if(L>2){const e=get('w5',wd[L-3]);e.la={d:1850}}
if(L>6){const d=wd[L-7],e=get('w3',d);e.b=at(d,960);e.lb=null;e.fx={r:1};log.push({t:at(addDays(d,1),490),e:e.id,w:'w3',d,end:e.b,r:1})}
const lunch=N>at(T0,760);
for(const [w,s,m,dd] of [['w1','s1',418,85],['w2','s2',425,60],['w3','s4',432,2400],['w4','s2',410,140],['w6','s3',420,45],['w7','s4',415,110]])mk(w,s,at(T0,m),null,lunch&&w!=='w4'?[[at(T0,720),at(T0,750)]]:[],{d:dd},null);
const hz=E.find(e=>e.w==='w4'&&e.b==null&&e.a>=T0);if(hz)hz.br.push([N-12*MIN,null]);
return {v:VER,rday:RDAY,off:OFF,lang:'tr',W,S:Ss,E,log,ok:[],

/* ---------- worker phone ---------- */
function phoneHTML(){const P=S.ph;if(!P.w)return loginV();const w=Wk(P.w);if(!w){P.w=null;return loginV()}const L=w.lang;
if(P.step==='pin')return pinV(w,L);
if(P.step==='hours')return headV(w,L)+hoursV(w,L);
if(P.busy)return headV(w,L)+'<div class="locing">'+ic('pin')+'<span>'+t('locing',0,L)+'</span></div>';
const st=status(w.id);return headV(w,L)+(st.s==='work'||st.s==='break'?workV(w,st,L):homeV(w,st,L))+sheetV(w,st,L)}
function loginV(){const L=S.lang;return '<div class="p-logo">EkipZeit</div><h2 class="p-title">'+t('who',0,L)+'</h2><p class="p-sub">'+t('tapName',0,L)+'</p><div class="wgrid">'+S.W.map(w=>{const s=status(w.id).s;return '<button class="wbtn" data-act="pick" data-id="'+w.id+'">'+av(w)+'<span><b>'+esc(first(w.name))+'</b><small>'+esc(rN(w,L))+'</small></span><i class="dot d-'+s+'" title="'+t('st_'+s,0,L)+'"></i></button>'}).join('')+'</div><p class="note">'+ic('lock')+'<span>'+t('locNote',0,L)+'</span></p>'}
function pinV(w,L){const P=S.ph;return '<button class="lnk" data-act="logout">'+ic('back')+t('back',0,L)+'</button><div class="pin-who">'+av(w,'l')+'<b>'+esc(w.name)+'</b><span class="mut">'+t('pinT',0,L)+'</span></div><div class="pdots'+(P.err?' err':'')+'">'+[0,1,2,3].map(i=>'<i class="'+(i<P.pin.length?'on':'')+'"></i>').join('')+'</div><p class="hint center'+(P.err?' bad':'')+'">'+(P.err?t('pinBad',0,L):t('pinHint',0,L))+'</p><div class="keys">'+[1,2,3,4,5,6,7,8,9].map(k=>'<button data-act="key" data-k="'+k+'">'+k+'</button>').join('')+'<span></span><button data-act="key" data-k="0">0</button><button data-act="key" data-k="x" aria-label="'+t('del',0,L)+'">'+ic('del')+'</button></div>'}
function headV(w,L){return '<div class="p-head">'+av(w,'s')+'<div><b>'+esc(w.name)+'</b><small>'+esc(rN(w,L))+'</small></div><button class="icb" data-act="logout" aria-label="'+t('logout',0,L)+'" title="'+t('logout',0,L)+'">'+ic('out')+'</button></div>'}
function weekLine(w,L){const T0=today(),wk=sumRange(w.id,mondayOf(T0),addDays(T0,1));return '<div class="wkline"><span class="mut">'+t('week',0,L)+': <b class="num" style="color:var(--ink)">'+ld(wk,L)+'</b></span><button class="lnk" data-act="hours">'+t('myH',0,L)+ic('next')+'</button></div>'}
function locSpan(l,L,short){if(!l)return '';return l.d>500?'<span class="warn sx">'+ic('warn')+dist(l.d,L)+'</span>':'<span class="ok sx">'+ic('check')+(short?'':dist(l.d,L))+'</span>'}
function homeV(w,st,L){const P=S.ph,N=now(),h=new Date(N).getHours(),g=h<11?t('gm',0,L):h<17?t('gd',0,L):t('ge',0,L),sel=P.site||lastSite(w.id)||w.home;
const top=st.s==='done'?'<div class="banner ok">'+ic('check')+'<span><b>'+t('done',0,L)+'</b><br>'+t('today',0,L)+': '+ld(worked(w.id),L)+'</span></div>':'';
return top+'<div><h2 class="greet">'+g+', '+esc(first(w.name))+'</h2><p class="mut" style="margin:2px 0 0">'+fdt(N,L,{weekday:'long',day:'numeric',month:'long'})+'</p></div><p class="lbl">'+t('which',0,L)+'</p><div class="slist" role="radiogroup">'+S.S.map(s=>'<button class="site" role="radio" aria-checked="'+(s.id===sel)+'" data-act="site" data-id="'+s.id+'"><span><b>'+esc(s.name[L]||s.name.tr)+'</b><small>'+esc(s.area)+'</small></span><i class="rad"></i></button>').join('')+'</div><button class="big b-or" data-act="start">'+ic('play','f')+(st.s==='done'?t('again',0,L):t('start',0,L))+'</button><p class="note">'+ic('lock')+'<span>'+t('locNote',0,L)+'</span></p><div class="simrow"><span>'+t('sim',0,L)+'</span><span class="seg s"><button data-act="sim" data-v="on" aria-pressed="'+(P.sim==='on')+'">'+t('simOn',0,L)+'</button><button data-act="sim" data-v="away" aria-pressed="'+(P.sim==='away')+'">'+t('simAway',0,L)+'</button></span></div>'+weekLine(w,L)}
function workV(w,st,L){const P=S.ph,e=st.e,brk=st.s==='break',res=P.res;let ban='';

/* ---------- German PDF: page drawn on a canvas, wrapped in a minimal PDF ---------- */
function drawPage(r,rows,pi,pn){const W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),F='Barlow, Arial, Helvetica, sans-serif';

const txt=(s,x,y,font,col,al)=>{g.font=font;g.fillStyle=col||'#141414';g.textAlign=al||'left';g.fillText(s,x,y)};
const clip=(s,w)=>{if(g.measureText(s).width<=w)return s;while(s.length>1&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
txt('DEMO · Beispieldaten',1140,110,'700 22px '+F,'#c2410c','right');
txt('Arbeitszeitnachweis',100,140,'700 54px '+F);txt('Aufzeichnung nach § 17 Mindestlohngesetz (MiLoG)',100,186,'400 26px '+F,'#555');

y+=24;const cols=[['Datum',100,'left'],['Baustelle',330,'left'],['Beginn',760,'right'],['Ende',880,'right'],['Pause',1010,'right'],['Std.',1140,'right']];
g.fillStyle='#f1efe9';g.fillRect(90,y,1060,54);cols.forEach(([h,x,al])=>txt(h,x,y+36,'600 24px '+F,'#333',al));y+=54;
rows.forEach((x,i)=>{if(i%2){g.fillStyle='#faf9f6';g.fillRect(90,y,1060,46)}g.font='400 24px '+F;const site=clip(x.site,380);[x.date,site,x.start,x.end,x.pause,x.hours].forEach((v,j)=>txt(String(v),cols[j][1],y+32,'400 24px '+F,'#141414',cols[j][2]));y+=46});
g.strokeStyle='#141414';g.lineWidth=2;g.beginPath();g.moveTo(90,y+4);g.lineTo(1150,y+4);g.stroke();
if(pi===pn-1){y+=48;txt('Summe',100,y,'700 27px '+F);txt(r.total,1140,y,'700 27px '+F,'#141414','right');y+=130;g.strokeStyle='#999';g.lineWidth=1.5;g.beginPath();g.moveTo(100,y);g.lineTo(520,y);g.moveTo(700,y);g.lineTo(1140,y);g.stroke();txt('Datum, Unterschrift Mitarbeiter',100,y+34,'400 22px '+F,'#555');txt('Datum, Unterschrift Arbeitgeber',700,y+34,'400 22px '+F,'#555')}
txt('Erstellt am '+ddmmyy(now())+' mit EkipZeit (Demo) · Aufbewahrung mindestens 2 Jahre',100,H-80,'400 20px '+F,'#777');txt('Seite '+(pi+1)+' von '+pn,1140,H-80,'400 20px '+F,'#777','right');
const b64=c.toDataURL('image/jpeg',.9).split(',')[1],bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return {jpg:u,w:W,h:H}}
function buildPdf(imgs){const enc=new TextEncoder(),parts=[],off=[];let len=0;const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
put('%PDF-1.4\n%âãÏÓ\n');const n=imgs.length,total=2+3*n;
off[1]=len;put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
off[2]=len;put('2 0 obj\n<< /Type /Pages /Kids ['+imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
imgs.forEach((im,i)=>{const p=3+3*i,x=p+1,c=p+2,cs='q 595.28 0 0 841.89 0 0 cm /Im'+i+' Do Q';
off[p]=len;put(p+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im'+i+' '+x+' 0 R >> >> /Contents '+c+' 0 R >>\nendobj\n');
off[x]=len;put(x+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.jpg.length+' >>\nstream\n');put(im.jpg);put('\nendstream\nendobj\n');
off[c]=len;put(c+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n')});
const xr=len;let xs='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';for(let i=1;i<=total;i++)xs+=String(off[i]).padStart(10,'0')+' 00000 n \n';
put(xs+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');const out=new Uint8Array(len);let o=0;for(const u of parts){out.set(u,o);o+=u.length}return out}
async function makePdf(r){try{await document.fonts.load('600 26px Barlow')}catch(e){}const per=26,pages=[];for(let i=0;i<Math.max(1,r.rows.length);i+=per)pages.push(r.rows.slice(i,i+per));return buildPdf(pages.map((rows,i)=>drawPage(r,rows,i,pages.length)))}
function csvText(r,sep,bom){const q=v=>{v=String(v);return /[;\t"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},out=[['Arbeitszeitnachweis',r.name,r.period].map(q).join(sep),['Datum','Baustelle','Beginn','Ende','Pause (Min.)','Arbeitszeit (Std.)'].join(sep)];r.rows.forEach(x=>out.push([x.date,x.site,x.start,x.end,x.pmin,x.hnum].map(q).join(sep)));out.push(['Summe','','','','',r.tnum].join(sep));return (bom?'﻿':'')+out.join('\r\n')}
async function saveFile(name,data){if(DL){await DL.save({filename:name,data});return}const blob=new Blob([data],{type:/\.pdf$/.test(name)?'application/pdf':'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}

let toastT=0;

const narrow=()=>window.matchMedia('(max-width:979px)').matches;

const ACT={

logout(){Object.assign(S.ph,{w:null,step:'login',pin:'',err:0,sheet:null,res:null,busy:0});renderPhone()},

start(){const P=S.ph,w=cur();if(!w||P.busy)return;const s0=status(w.id).s;if(s0==='work'||s0==='break')return;const s=P.site||lastSite(w.id)||w.home;busy(()=>{const d=simD(),e={id:newId(),w:w.id,s,a:now(),b:null,br:[],la:{d},lb:null};S.E.push(e);P.res={e:e.id,ok:d<=500,d};P.site=null;bump(w.id);toast(t('toastIn',{n:w.name,s:sN(s,S.lang)}),seeBtn())})},

finOpen(){S.ph.sheet='fin';renderPhone()},

sw(b){const P=S.ph,w=cur(),st=w&&status(w.id),s=b.dataset.id;if(!st||!st.e)return;P.sheet=null;busy(()=>{const T1=now();if(st.ob)st.ob[1]=T1;st.e.b=T1;st.e.lb={d:simD()};const d=simD(),e={id:newId(),w:w.id,s,a:T1,b:null,br:[],la:{d},lb:null};S.E.push(e);P.res={e:e.id,ok:d<=500,d};bump(w.id);toast(t('toastSw',{n:w.name,s:sN(s,S.lang)}),seeBtn())})},
tab(b){S.ui.tab=b.dataset.t2;renderPanel();const sel=$('.tabs [aria-selected=true]');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest',inline:'nearest'})},

fixOpen(b){S.ui.modal={type:'fix',id:b.dataset.id};renderModal()},
fixSave(b){const e=S.E.find(x=>x.id===b.dataset.id),er=$('#fx-err');if(!e)return;const m=/^(\d{1,2}):(\d{2})/.exec(($('#fx-end')||{}).value||'');if(!m){er.textContent=t('fixBad');return}const end=at(dayStart(e.a),(+m[1])*60+(+m[2])),lastBr=e.br.reduce((x,y)=>Math.max(x,y[1]==null?y[0]:y[1]),e.a);if(end<=lastBr){er.textContent=t('fixBad');return}const r=+(($('#fx-r')||{}).value||0);e.br.forEach(x=>{if(x[1]==null)x[1]=Math.min(end,x[0]+30*MIN)});e.b=end;e.lb=null;e.fx={r};S.log.unshift({t:now(),e:e.id,w:e.w,d:dayStart(e.a),end,r});S.ui.modal=null;renderModal();renderPanel();toast(t('fixedToast'))},

addW(){const n=($('#nw-n').value||'').trim(),r=($('#nw-r').value||'').trim(),l=$('#nw-l').value==='de'?'de':'tr',p=($('#nw-p').value||'').trim(),er=$('#nw-err');if(n.length<2){er.textContent=t('nameReq');return}if(!/^\d{4}$/.test(p)){er.textContent=t('pinBad4');return}S.W.push({id:'w'+Date.now().toString(36),name:n,role:{tr:r||'İşçi',de:r||'Mitarbeiter'},lang:l,home:S.S[0].id,pin:p,col:PAL[S.W.length%PAL.length]});renderAll();toast(t('addedW',{n}))},

let lastKey='';

$$('[data-wb]').forEach(el=>{const st=status(el.dataset.wb);if(st.ob)el.textContent=Math.floor((N-st.ob[0])/MIN)+' '+mn(S.lang)});

function boot(hot){const st=hot&&hot.v===VER?hot:load();
if(st&&st.rday===RDAY&&Array.isArray(st.E)){OFF=st.off||0;S=st;S.ui.modal=null;S.ph.busy=0}else{OFF=makeOff();S=seed();S.off=OFF}
readHash();renderAll();save();setInterval(tick,1000);
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(x=>{DL=x||null;if(DL&&S.ui.tab==='rep')renderPanel()}).catch(()=>{})}catch(e){}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>S)}catch(e){}}
const startFn=d=>boot(d&&typeof d==='object'&&Object.keys(d).length?d:null);
try{const h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(startFn);else startFn(h&&h.data)}catch(e){startFn(null)}
}
