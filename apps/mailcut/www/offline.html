<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mailcut</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0f2a8a,#1d4ed8);color:#fff;font:17px/1.5 -apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
button{background:#facc15;color:#14213d;border:0;border-radius:14px;font:700 1.05rem system-ui;padding:14px 26px;min-height:48px}</style></head>
<body><svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#fff" fill-opacity=".15"/><rect x="18" y="28" width="64" height="46" rx="6" fill="#fff"/><path d="M22 33L50 54L78 33" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 86L74 16" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/><path d="M30 86L74 16" stroke="#facc15" stroke-width="5" stroke-linecap="round"/></svg>
<div id="t"><b>Keine Internetverbindung</b><br>Mailcut braucht Internet, um deine Briefe zu laden.</div>
<button id="b" type="button">Erneut versuchen</button>
<script>
const L=(navigator.language||"de").slice(0,2);
const T={tr:["İnternet bağlantısı yok","Mailcut mektuplarını yüklemek için internete ihtiyaç duyar.","Tekrar dene"],en:["No internet connection","Mailcut needs the internet to load your letters.","Try again"],ar:["لا يوجد اتصال بالإنترنت","يحتاج Mailcut إلى الإنترنت لتحميل رسائلك.","حاول مرة أخرى"]};
if(T[L]){document.getElementById("t").innerHTML="<b>"+T[L][0]+"</b><br>"+T[L][1];document.getElementById("b").textContent=T[L][2];if(L==="ar")document.dir="rtl";}
document.getElementById("b").onclick=()=>location.href="https://app.mailcut.de/?native=1";
</script></body></html>
