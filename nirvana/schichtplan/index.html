:root[data-theme="dark"] {
  --bg: #0D1A1C; --surface: #132427; --surface-2: #1A3135; --ink: #E9E4D7; --ink-2: #A8B5B2; --line: #2B4448;
  --head-bg: #0A2B32; --head-ink: #EDE7DA; --accent: #5DB7B3; --accent-ink: #062126; --brass: #D1AE72; --brass-soft: #3A3122;
  --ok: #5BBF85; --warn: #E2A24A; --err: #EE7A6E; --info: #78B2D6; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 600 24px/1.2 var(--font-display); letter-spacing: .2px; }
h1 small { font: 400 14px var(--font-body); color: var(--ink-2); margin-left: 6px; }
h2 { font: 600 17px/1.3 var(--font-body); }
h3 { font: 600 14px/1.3 var(--font-body); margin: 18px 0 8px; display: flex; gap: 6px; align-items: center; }
p { margin: 6px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; }
.ic.mini { width: 12px; height: 12px; }
.muted { color: var(--ink-2); }
.hint { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; max-width: 78ch; }
.lead { color: var(--ink-2); max-width: 70ch; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; }
.row.gap, .gap { gap: 8px; }
.wrap { flex-wrap: wrap; }
.nowrap { white-space: nowrap; }
.r { text-align: right; }
.c { text-align: center; }
.neg { color: var(--err); font-weight: 600; }
.wrn { color: var(--warn); font-weight: 600; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 20; background: var(--head-bg); color: var(--head-ink); display: flex; align-items: center; gap: 18px; padding: 0 18px; padding-top: env(safe-area-inset-top, 0px); min-height: 58px; }
.brand { display: flex; flex-direction: column; line-height: 1.05; padding: 8px 0; min-width: 0; }
.logo { font: 600 20px var(--font-display); letter-spacing: .6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.brand .sub { font-size: 12px; color: var(--brass-soft); letter-spacing: .3px; }
:root[data-theme="dark"] .brand .sub { color: var(--brass); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab { color: var(--head-ink); text-decoration: none; padding: 18px 12px 16px; font-size: 14px; white-space: nowrap; opacity: .82; border-bottom: 3px solid transparent; }
.tab:hover { opacity: 1; }
.tab.on { opacity: 1; border-bottom-color: var(--brass); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 10px; }
.langs { display: inline-flex; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; overflow: hidden; }
.langs .lg { background: transparent; border: 0; color: inherit; padding: 4px 9px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: .4px; }
.langs .lg.on { background: var(--head-ink); color: var(--head-bg); }
.langs.big { border-color: var(--line); margin: 14px 0; }
.langs.big .lg { padding: 8px 16px; font-size: 14px; }
.langs.big .lg.on { background: var(--accent); color: var(--accent-ink); }
.status { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.12); white-space: nowrap; }
.status::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #7fd3a4; vertical-align: 1px; }
.status.busy::before { background: #f0c46a; }
.status.local::before { background: #9fc3e6; }
.status.ro::before { background: #f09a8f; }

main { padding: 16px 20px 90px; max-width: 1680px; margin: 0 auto; }
.banner { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; font-size: 14px; }
.banner.demo { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 40%, transparent); }
.banner.warn { border-color: var(--warn); }
.banner.info { border-left: 4px solid var(--info); }
.banner.local, .banner.ro { border-left: 4px solid var(--info); }
.banner span { flex: 1; }

/* Steuerelemente */
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
.btn.danger:not(.ghost) { background: var(--err); color: #fff; border-color: var(--err); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 30px; padding: 4px 9px; font-size: 13px; }
.btn.icon { padding: 6px; width: 36px; justify-content: center; }
.btn.wa { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.btn.rec { background: var(--err); color: #fff; border-color: var(--err); }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 13px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-f { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chip-f i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip-f.on { border-color: var(--ink); background: var(--surface-2); font-weight: 600; }
input[type=search], input[type=text], input:not([type]), input[type=number], input[type=time], input[type=date], input[type=tel], input[type=email], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px; min-height: 36px; max-width: 100%;
}
input[type=number] { font-variant-numeric: tabular-nums; }
.q { width: 190px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
.fld > span { font-size: 12.5px; color: var(--ink-2); }
.fld.sm { min-width: 96px; max-width: 140px; }
.fld.sm input { width: 100%; }
.fld.grow { flex: 1; min-width: 200px; }
.fld.chk { flex-direction: row; align-items: center; gap: 8px; min-width: 0; padding-top: 18px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 10px 0; }
.fs { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 12px 0; }
.fs legend { font-size: 12.5px; color: var(--ink-2); padding: 0 4px; }
.fs.inline { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; margin: 0; }
.dchk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.card.narrow { max-width: 620px; margin: 40px auto; }
.center { text-align: center; padding: 60px 16px; }
.empty { padding: 22px; color: var(--ink-2); text-align: center; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.hol { background: color-mix(in srgb, var(--err) 14%, var(--surface)); color: var(--err); }
.tag.sp { background: var(--brass-soft); color: color-mix(in srgb, var(--brass) 70%, var(--ink)); }
.tag.ev { background: color-mix(in srgb, var(--info) 14%, var(--surface)); color: var(--info); }
.tag.yo { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.pill { display: inline-flex; align-items: center; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.pub, .pill.good { background: color-mix(in srgb, var(--ok) 15%, var(--surface)); color: var(--ok); }
.pill.draft { background: var(--brass-soft); color: color-mix(in srgb, var(--brass) 75%, var(--ink)); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.ticks { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
.ticks li { margin: 4px 0; }

/* Leisten */
.bar1, .bar2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.bar1 h1 { margin-right: 8px; }
.wknav { display: inline-flex; align-items: center; gap: 4px; }
.wklabel { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.1; padding: 4px 12px; min-width: 150px; }
.wkn { font: 600 17px var(--font-display); }
.wklabel small { font-size: 12px; color: var(--ink-2); }

/* Kennzahlen */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpis.small { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { position: relative; display: flex; flex-direction: column; gap: 1px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 16px; overflow: hidden; }
button.kpi { cursor: pointer; }
button.kpi:hover { border-color: var(--ink-2); }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.kpi.good::before { background: var(--ok); }
.kpi.warn::before { background: var(--warn); }
.kpi.bad::before { background: var(--err); }
.kl { font-size: 12.5px; color: var(--ink-2); }
.kv { font: 600 23px/1.2 var(--font-body); font-variant-numeric: tabular-nums; }
.kpi.bad .kv { color: var(--err); }
.ks { font-size: 12.5px; color: var(--ink-2); }
.kb { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.kb i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }
.kpi.warn .kb i { background: var(--warn); }

/* Planraster */
.gridwrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: calc(100vh - 290px); min-height: 360px; }
.grid { --cols: minmax(196px, 220px) repeat(7, minmax(118px, 1fr)); min-width: 1040px; }
.g-head, .g-row { display: grid; grid-template-columns: var(--cols); }
.g-head { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); }
.g-corner { position: sticky; left: 0; z-index: 5; background: var(--surface); padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: flex-end; border-right: 1px solid var(--line); }
.g-day { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); min-width: 0; }
.g-day:hover { background: var(--surface-2); }
.g-day:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
.g-day.today { background: var(--brass-soft); }
.dn { font-size: 13px; color: var(--ink-2); }
.dn b { color: var(--ink); font-weight: 600; }
.dg { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; }
.cov { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.cov i { display: block; height: 100%; background: var(--ok); }
.cov.low i { background: var(--warn); }
.covn { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.g-group { position: sticky; left: 0; display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; width: 100%; }
.g-group span { display: inline-flex; align-items: center; gap: 7px; position: sticky; left: 12px; }
.g-group i, .daylist h3 i, .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
.g-group small { font-weight: 400; color: var(--ink-2); position: sticky; left: 200px; }
.g-row { border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.g-row:hover .g-name, .g-row:hover .g-cell { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
.g-name { all: unset; box-sizing: border-box; position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px 6px 12px; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; align-items: center; cursor: pointer; min-width: 0; }
.g-name.static { cursor: default; }
.g-name:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
.nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct { font-size: 11px; color: var(--ink-2); background: var(--surface-2); padding: 0 6px; border-radius: 4px; justify-self: end; }
.ct.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); font-weight: 600; }
.hrs { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hrs b { color: var(--ink); font-weight: 600; }
.hrs.over b { color: var(--warn); }
.hrs.under b { color: var(--info); }
.hb { height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; align-self: center; }
.hb i { display: block; height: 100%; background: var(--ok); }
.hb.over i { background: var(--warn); }
.hb.under i { background: var(--info); }
.g-cell { padding: 4px; display: flex; flex-direction: column; gap: 3px; min-height: 46px; border-right: 1px solid color-mix(in srgb, var(--line) 55%, transparent); cursor: pointer; min-width: 0; }
.g-shifts .g-cell, .openrow .g-cell { cursor: default; }
.g-cell.today { background: color-mix(in srgb, var(--brass-soft) 45%, transparent); }
.g-cell.na { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--line) 55%, transparent) 7px 8px); }
.g-cell.abs { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.openrow .g-name { background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.sc { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 6px; border-radius: 6px; background: color-mix(in srgb, var(--c, #888) 15%, var(--surface)); border-left: 3px solid var(--c, #888); cursor: pointer; font-size: 12px; line-height: 1.25; min-width: 0; }
.sc b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sc span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc:hover { background: color-mix(in srgb, var(--c, #888) 26%, var(--surface)); }
.sc:focus-visible { outline: 2px solid var(--brass); }
.sc.open { background: transparent; border: 1px dashed var(--c, #888); border-left-width: 3px; }
.sc.lk { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
.sc.bad { box-shadow: inset 0 0 0 1.5px var(--err); }
.sc.wrn { box-shadow: inset 0 0 0 1.5px var(--warn); }
.sc.evs b::after { content: ' ●'; color: var(--info); font-size: 9px; vertical-align: 1px; }
.sc .ic.mini { color: var(--ink-2); }
.sc.bad .ic.mini { color: var(--err); }
.sn { all: unset; box-sizing: border-box; cursor: pointer; font-size: 12.5px; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c, #888) 14%, var(--surface)); border-left: 3px solid var(--c, #888); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn small { color: var(--ink-2); font-size: 11px; }
.sn.bad { box-shadow: inset 0 0 0 1.5px var(--err); }
.sn.wrn { box-shadow: inset 0 0 0 1.5px var(--warn); }
.cnt { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cnt.low { color: var(--warn); font-weight: 600; }
.ab { display: inline-block; align-self: flex-start; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.ab.k-urlaub { background: color-mix(in srgb, var(--info) 16%, var(--surface)); color: var(--info); }
.ab.k-krank { background: color-mix(in srgb, var(--err) 14%, var(--surface)); color: var(--err); }
.ab.k-wunsch { background: var(--brass-soft); color: color-mix(in srgb, var(--brass) 75%, var(--ink)); }
.ab.k-schule { background: color-mix(in srgb, #7a62c9 15%, var(--surface)); color: #6d55be; }
:root[data-theme="dark"] .ab.k-schule { color: #b7a6ef; }

/* Tagesansicht */
.dayview { padding: 12px; }
.daypick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.daypick button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 64px; }
.daypick button span { font-size: 12px; color: var(--ink-2); }
.daypick button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.daypick button.on span { color: inherit; }
.daypick button.today:not(.on) { border-color: var(--brass); }
.dayinfo { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin: 10px 0; }
.dayinfo .g-day { border: 1px solid var(--line); border-radius: var(--r); min-width: 220px; }
.dstats { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: 14px; color: var(--ink-2); }
.dstats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.daylist { margin-top: 8px; }
.daylist h3 { margin-top: 16px; }
.dl-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 110px 1fr 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border-left: 3px solid var(--c); border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
.dl-row:hover { background: var(--surface-2); }
.dl-row .tm { font-weight: 600; font-variant-numeric: tabular-nums; }
.dl-row.open .who em { color: var(--warn); font-style: normal; font-weight: 600; }
.dl-row.bad { box-shadow: inset 0 0 0 1.5px var(--err); }

/* Diagramme */
.chartbox { margin: 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.chartbox figcaption { font-weight: 600; font-size: 14px; }
.chart { width: 100%; max-width: 920px; height: auto; display: block; margin-top: 6px; }
.chart .bar { fill: var(--c); }
.chart .gl { stroke: var(--line); stroke-width: 1; opacity: .7; }
.chart .ax { fill: var(--ink-2); font-size: 10px; font-family: var(--font-body); }
.chart .vl { fill: var(--ink); font-size: 10.5px; font-weight: 600; font-family: var(--font-body); }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.qrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-variant-numeric: tabular-nums; font-size: 13px; text-align: center; }
.qrow small { display: block; color: var(--ink-2); font-size: 11px; }
#tip { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: pre; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

/* Tabellen */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl tr[data-a] { cursor: pointer; }
.tbl tr[data-a]:hover td { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.tbl tr.inactive td { opacity: .55; }
.tbl .rl { display: inline-block; font-size: 11.5px; padding: 1px 7px; margin: 1px 3px 1px 0; border-radius: 4px; background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-left: 3px solid var(--c); }
.tbl .rl.main { font-weight: 600; }
.tbl.tpl td { vertical-align: middle; padding: 5px 6px; }
.tbl.tpl input.tn { min-width: 150px; }
.tbl.tpl .num { width: 64px; }
.tbl.tpl .num.sm { width: 54px; text-align: center; }
