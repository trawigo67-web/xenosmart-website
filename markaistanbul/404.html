<!DOCTYPE html>
<html lang="tr">
<head>
<script>if(/(^|\.)xenosmart\.de$/.test(location.hostname)){location.replace("https://marka22.de/")}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı – Marka Istanbul</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
html{background:#1c1c1a}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#1f2a37;line-height:1.6;background:radial-gradient(120% 70% at 50% 35%,#fffdf6 0%,#fbf4df 70%,#f5e9c4 100%) fixed}
.zband{background:#1c1c1a;height:calc(14px + env(safe-area-inset-top));border-bottom:2px solid #c9a647}
.wrap{max-width:520px;margin:0 auto;padding:40px 22px;text-align:center}
img{display:block;width:min(86%,360px);height:auto;margin:0 auto 26px}
h1{font-family:'Playfair Display',serif;color:#8f6b1e;font-size:24px;margin:0 0 8px}
p{margin:6px 0;font-size:15px}
.de{color:#7a8494;font-size:13px}
a.btn{display:inline-block;margin-top:22px;padding:13px 26px;border-radius:12px;background:linear-gradient(100deg,#8f6b1e,#e3c66b 55%,#8f6b1e);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="zband"></div>
<div class="wrap">
  <img src="/lockup.png" alt="Zen Diamond × Marka Istanbul">
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığınız sayfa yok ya da taşındı.</p>
  <p class="de">Diese Seite gibt es nicht (mehr).</p>
  <a class="btn" href="/">Güncel altın fiyatları</a>
</div>
</body>
</html>
