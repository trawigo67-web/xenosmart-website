<style>
:root{
  --bg:#ffffff; --card:#ffffff; --card2:#fbf6f0; --line:#ead7c3;
  --cop:#c4702a; --cop2:#a85a1c; --cop3:#e3a15a; --copbg:#fdf5ec;
  --text:#1d1d1f; --muted:#8a8178; --navy:#1d1d1f;
  --grad:linear-gradient(135deg,#a85a1c 0%,#e3a15a 45%,#c4702a 70%,#8f4a14 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#fff}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.waves{position:absolute;pointer-events:none;z-index:0;height:auto}
.waves.tl{left:0;top:0;width:min(15vw,80px)}
.waves.br{right:0;bottom:0;width:min(14vw,75px)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:flex-end}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.lang button{background:none;border:0;color:var(--muted);padding:6px 11px;font-weight:600;font-size:12px;cursor:pointer;letter-spacing:1px}
.lang button.on{background:var(--grad);color:#fff}
.hero{text-align:center;margin:4px 0 14px}
.hero img{width:min(78%,330px);height:auto;display:block;margin:0 auto}
.hero small{display:block;color:var(--cop);font-size:11px;letter-spacing:4px;text-transform:uppercase;margin-top:6px;font-weight:600}
.spot{text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 6px;margin-bottom:14px}
.spot .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:2px}
.spot .big{font-size:28px;font-weight:600;margin:2px 0;letter-spacing:1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.spot .row{display:flex;justify-content:center;color:var(--muted);font-size:12px;gap:14px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2e9e6a;margin-right:6px;animation:p 2s infinite}
.dot.off{background:#e3a008;animation:none}
@keyframes p{50%{opacity:.35}}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--muted);padding:10px 8px;border-radius:24px;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.tabs button.on{border-color:transparent;color:#fff;background:var(--grad)}
/* Preisliste wie im Aushang */
.plist{padding:0 6px}
.prow{display:grid;grid-template-columns:1fr 2px 1fr;align-items:center;padding:16px 4px;border-bottom:1px solid var(--cop3)}
.prow .pn{letter-spacing:3px;font-size:16px;text-transform:uppercase;font-weight:500}
.prow .bar{width:2px;height:24px;background:var(--cop);justify-self:center}
.prow .pv{text-align:right;font-size:20px;letter-spacing:1.5px;font-variant-numeric:tabular-nums;padding-right:6px}
.prow .pv small{font-size:11px;color:var(--muted);letter-spacing:0}
.prow.gend{border-bottom:1.5px solid #1d1d1f}
.prow:last-child{border-bottom:1px solid var(--cop3)}
.pfoot{text-align:center;font-size:13px;line-height:1.5;margin:14px auto 0;max-width:260px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.orn i{display:block;height:1px;width:60px;background:var(--cop3)}
.orn b{display:block;width:9px;height:9px;background:var(--cop);transform:rotate(45deg)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.item .n{font-weight:600;letter-spacing:1px}
.item .s{color:var(--muted);font-size:12px}
.item .col{text-align:right}
.item .col .v{font-weight:600;font-size:16px;color:var(--cop2)}
.v.buy{color:var(--cop2)} .v.sell{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:10px;color:var(--cop2);letter-spacing:3px;text-transform:uppercase;font-weight:600}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--cop)}
.res{margin-top:14px;padding:14px;border-radius:12px;background:var(--copbg);border:1px solid var(--line);text-align:center}
.res .big{font-size:28px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.res .s{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--grad);color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:12px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.foot{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
.foot a{color:var(--cop2)}
.cta{display:flex;gap:8px;margin-top:14px}
.cta a{flex:1;display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:600;font-size:13px}
.cta .wa{background:#1f8a55;color:#fff}.cta .tel{background:#fff;color:var(--cop2);border:1px solid var(--cop)}
.cta .ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4);color:#fff}
.cta .dm{background:#fff;color:#833ab4;border:1px solid #d9c2ee}
.install{display:none;background:#fff;border:1px solid var(--cop3);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;align-items:center;gap:10px}
.install.on{display:flex}
.install b{color:var(--cop2)}
.install button{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.install .x{background:none;color:var(--muted);padding:4px 6px}
.adm table{width:100%;border-collapse:collapse;font-size:13px}
.adm th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;padding:4px}
.adm td{padding:4px}
.adm td input{padding:8px;font-size:14px}
.warn{background:var(--copbg);border:1px solid var(--line);color:var(--cop2);border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;line-height:1.5}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cop);color:#fff;padding:10px 16px;border-radius:20px;font-weight:600;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
.shop{margin-top:18px}
.shop h3{letter-spacing:2px}
.shop .tag{color:var(--muted);font-size:12px;letter-spacing:.5px;margin:-4px 0 10px}
.shop .srow{font-size:14px;margin:6px 0}
.shop .srow a{color:var(--cop2);text-decoration:none;font-weight:600}
</style>
</head>

  call:"Call",pFoot:"Gold prices change with the current rate.",zGremse:"2.5 / Gremse (pcs)",zR5:"5-piece (pcs)",tZekat:"Zakat",zTitle:"Calculate zakat",zIntro:"Enter your gold and savings – we calculate your zakat with the current fine gold price.",zCeyrek:"Çeyrek (pcs)",zYarim:"Yarım (pcs)",zTam:"Tam (pcs)",zAta:"Ata Lira (pcs)",zResat:"Reşat (pcs)",zGram24:"Gold bar 24K (g)",zG22:"22K bangle/jewellery (g)",zG18:"18K jewellery (g)",zG14:"14K jewellery (g)",zCash:"Cash / savings (€)",zDue:"Your zakat",zNone:"No zakat due",zHas:"Fine gold",zTotal:"Total value",zNisab:"Nisab",zRate:"2.5% (1/40)",zNote:"Nisab: 80.18 g of gold (Diyanet). Zakat is due on wealth that reaches the nisab and has been held for one lunar year. This calculation is for guidance only; please consult an imam on religious questions.",shopTag:"Jewellery & watches · Gold jewellery • Wedding rings • Gifts",orderVia:"Orders & enquiries via WhatsApp / DM",dm:"Send message",imprint:"Imprint / Privacy",hours:"Mon–Sat 10:00–19:00",

  apply:"Preview",copyCfg:"Copy settings",copied:"Copied",perGram:"/ g labour",
  waMsg:"Hello Marka Istanbul, I'm writing from Çeyrekmatik. I'd like a quote:"}
};

let lang = "tr", cfg = null, spotG = null, src = "offline", priceTime = null, srcName = "", chg = null;
const $ = id => document.getElementById(id);
const t = k => T[lang][k] || k;
const fmt = v => isFinite(v) ? v.toLocaleString({tr:"tr-TR",de:"de-DE",en:"en-GB"}[lang],{style:"currency",currency:"EUR",maximumFractionDigits:2}) : "—";
const nm = o => o[lang] || o.tr;
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

async function getJSON(url, ms=6000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try{ const r = await fetch(url,{signal:ctl.signal, cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }
  finally{ clearTimeout(tm); }
}

async function getText(url, ms=6000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try{ const r = await fetch(url,{signal:ctl.signal, cache:"no-store"}); if(!r.ok) throw 0; return await r.text(); }
  finally{ clearTimeout(tm); }
}
async function loadConfig(){
  try{ cfg = await getJSON("config.json?v="+Date.now()); ls.set("mi_cfg", JSON.stringify(cfg)); }
  catch(e){ try{ cfg = JSON.parse(ls.get("mi_cfg")); }catch(_){ } }
  if (!cfg) cfg = {products:[],bracelets:[],fallbackOzEur:3485};
}

async function fetchSpot(){
  if (cfg.manualSpot){ spotG = +cfg.manualSpot; src = "manual"; priceTime = new Date(); return renderAll(); }
  chg = null;
  try{
    // 1) Kitco (Bid, EUR je Unze)
    const txt = await getText("https://proxy.kitco.com/getPM?symbol=AU&currency=EUR");
    const f = txt.trim().split(",");
    const bid = parseFloat(f[4]);
    if (!(bid > 1000)) throw 0;
    spotG = bid/OZ; src = "live"; priceTime = new Date(); srcName = "Kitco";
    chg = parseFloat(f[8]);
  }catch(e0){ try{
    // 2) gold-api.com
    const j = await getJSON("https://api.gold-api.com/price/XAU/EUR");
    if (!j.price) throw 0;
    spotG = j.price/OZ; src = "live"; priceTime = new Date(j.updatedAt || Date.now()); srcName = "gold-api";
  }catch(e){
    try{
      const d = await getJSON("price.json?v="+Date.now());
      if (!d.ozEur) throw 0;
      spotG = d.ozEur/OZ; src = "daily"; priceTime = new Date(d.updatedAt);
    }catch(_){
      let last=null; try{ last = JSON.parse(ls.get("mi_last")); }catch(__){}
      if (last){ spotG = last.g; priceTime = new Date(last.d); } else { spotG = cfg.fallbackOzEur/OZ; priceTime = null; }
      src = "offline";
    }
  }}
  if (src !== "offline") ls.set("mi_last", JSON.stringify({g:spotG, d:priceTime.toISOString()}));
  renderAll();
}

function priceOf(p){
  // satisMilyem: Verkauf = Gewicht × Milyem/1000 × Feingoldpreis (inkl. Arbeit, z. B. Çeyrek 960)
  const sell = p.satisMilyem ? p.gram*(p.satisMilyem/1000)*spotG : p.gram*p.purity*spotG*(1+p.satis/100) + (+p.iscilik||0);
  return { sell };
}
function braceletPrice(b, g){
  // satisMilyem je Gramm, sonst Feingold × Aufschlag + Arbeit je Gramm
  const sell = b.satisMilyem ? g*(b.satisMilyem/1000)*spotG : g*b.purity*spotG*(1+b.satis/100) + g*(+b.iscilik||0);
  return { sell };
}

function renderTexts(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  renderInstall();
}
function renderSpot(){
  $("spotG").textContent = spotG ? fmt(spotG) : "—";
  $("spotOz").textContent = spotG ? `${t("ozLbl")}: ${fmt(spotG*OZ)}` : "";
  const loc = {tr:"tr-TR",de:"de-DE",en:"en-GB"}[lang];
  let when = "";
  if (priceTime && !isNaN(priceTime)){
    const today = priceTime.toDateString() === new Date().toDateString();
    when = today ? priceTime.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"})
                 : priceTime.toLocaleDateString(loc) + " " + priceTime.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"});
  }
  const ch = (src==="live" && Number.isFinite(chg)) ? `  ${chg>=0?"▲":"▼"} ${Math.abs(chg).toLocaleString(loc,{maximumFractionDigits:2})}%` : "";
  $("status").textContent = t(src) + (src==="live" && srcName ? " (" + srcName + ")" : "") + (when ? " · " + when : "") + ch;
  $("dot").classList.toggle("off", src!=="live" && src!=="manual");
}
const euro0 = v => isFinite(v) ? Math.round(v).toLocaleString({tr:"tr-TR",de:"de-DE",en:"en-GB"}[lang]) + " €" : "—";
function renderList(){
  const rows = [...cfg.products.map(p=>({n:nm(p), v:priceOf(p).sell, g:p.grup||1})),
                ...cfg.bracelets.map(b=>({n:nm(b), v:braceletPrice(b,1).sell, g:b.grup||3, per:true}))];
  $("list").innerHTML = rows.map((r,i)=>{
    const end = rows[i+1] && rows[i+1].g !== r.g;
    return `<div class="prow${end?" gend":""}"><div class="pn">${r.n}</div><div class="bar"></div><div class="pv">${euro0(r.v)}${r.per?` <small>/g</small>`:""}</div></div>`;
  }).join("");
}
function renderBilezik(){
  const sel = $("bKarat"), cur = sel.value;
  sel.innerHTML = cfg.bracelets.map(b=>`<option value="${b.id}">${nm(b)}</option>`).join("");
  if (cur) sel.value = cur;
  const b = cfg.bracelets.find(x=>x.id===sel.value) || cfg.bracelets[0]; if (!b) return;
  const g = +$("bGram").value||0, n = Math.max(1, +$("bAdet").value||1);
  const r = braceletPrice(b, g);
  $("bRes").textContent = fmt(r.sell*n);
  $("bDet").textContent = `${n} × ${g} g · ${fmt(braceletPrice(b,1).sell)} / g`;
}
function renderBudget(){
  const amt = +$("buAmt").value||0;
  $("buList").innerHTML = cfg.products.map(p=>{
    const s = priceOf(p).sell, k = Math.floor(amt/s);
    return `<div class="item" style="grid-template-columns:1fr auto"><div><div class="n">${nm(p)}</div><div class="s">${fmt(s)} · ${t("rest")}: ${fmt(amt-k*s)}</div></div>
      <div class="col"><div class="v buy">${k} ${t("pieces")}</div></div></div>`;
  }).join("");
}
function renderZekat(){
  const v = {}; document.querySelectorAll(".zi").forEach(i=> v[i.dataset.k] = Math.max(0, +i.value||0));
  const P = id => cfg.products.find(x=>x.id===id) || {gram:0,purity:0};
  let has = 0;
  ["ceyrek","yarim","tam","gremse","r5"].forEach(id=>{ const p=P(id); has += (v[id]||0)*p.gram*p.purity; });
  has += (v.g24||0)*0.995 + (v.g22||0)*0.916 + (v.g18||0)*0.750 + (v.g14||0)*0.585;
  const total = has*spotG + (v.cash||0);
  const nisabG = +cfg.zekatNisabGram || 80.18, nisab = nisabG*spotG;
  const loc = {tr:"tr-TR",de:"de-DE",en:"en-GB"}[lang];
  const hg = has.toLocaleString(loc,{maximumFractionDigits:2});
  if (total <= 0){ $("zRes").textContent = "—"; $("zDet").textContent = `${t("zNisab")}: ${nisabG.toLocaleString(loc)} g = ${fmt(nisab)}`; return; }
  if (total < nisab){
    $("zRes").textContent = t("zNone");
    $("zDet").innerHTML = `${t("zHas")}: ${hg} g · ${t("zTotal")}: ${fmt(total)}<br>${t("zNisab")}: ${nisabG.toLocaleString(loc)} g = ${fmt(nisab)}`;
  } else {
    $("zRes").textContent = fmt(total/40);
    $("zDet").innerHTML = `${t("zHas")}: ${hg} g · ${t("zTotal")}: ${fmt(total)}<br>${t("zNisab")}: ${nisabG.toLocaleString(loc)} g = ${fmt(nisab)} · ${t("zRate")}`;
  }
}
function renderLinks(){
  const wa = (cfg.whatsapp||"").replace(/\D/g,"");
  $("waLink").classList.toggle("hide", !wa);
  $("waLink").href = `https://wa.me/${wa}?text=${encodeURIComponent(t("waMsg"))}`;
  if (cfg.telefon) $("telLink").href = "tel:" + cfg.telefon;
}
function renderAll(){ renderTexts(); renderSpot(); if(spotG && cfg){ renderList(); renderBilezik(); renderBudget(); renderZekat(); } renderLinks(); }

/* "Uygulama olarak ekle" */
let deferredPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){
  const box = $("install");
  if (standalone || ls.get("mi_noinstall")) return box.classList.remove("on");
  if (isIos){ $("installTxt").innerHTML = t("installIos"); $("installBtn").classList.add("hide"); box.classList.add("on"); }
  else if (deferredPrompt){ $("installTxt").innerHTML = t("installAnd"); $("installBtn").classList.remove("hide"); box.classList.add("on"); }
}
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; renderInstall(); });
$("installBtn").addEventListener("click", async ()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("install").classList.remove("on"); });
$("installX").addEventListener("click", ()=>{ ls.set("mi_noinstall","1"); $("install").classList.remove("on"); });

/* Yönetici önizleme (?admin) */
function renderAdm(){
  const rows = [...cfg.products.map(p=>["products",p]), ...cfg.bracelets.map(b=>["bracelets",b])];
  $("admRows").innerHTML = rows.map(([g,o])=>`<tr><td style="font-size:12px">${nm(o)}</td>
    <td><input data-g="${g}" data-id="${o.id}" data-f="satis" type="number" step="0.1" value="${o.satis}"></td>
    <td><input data-g="${g}" data-id="${o.id}" data-f="iscilik" type="number" step="0.5" value="${o.iscilik}"></td></tr>`).join("");
  $("manSpot").value = cfg.manualSpot || "";
}
function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1600); }
$("admApply").addEventListener("click",()=>{
  document.querySelectorAll("#admRows input").forEach(inp=>{ const o = cfg[inp.dataset.g].find(x=>x.id===inp.dataset.id); o[inp.dataset.f] = +inp.value||0; });
  cfg.manualSpot = $("manSpot").value ? +$("manSpot").value : null;
  fetchSpot();
});
$("admCopy").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(cfg,null,2)); toast(t("copied")); }catch(e){ toast("—"); }
});

document.addEventListener("click", e=>{
  const l = e.target.closest(".lang button"); if (l){ lang=l.dataset.l; ls.set("mi_lang",lang); renderAll(); }
  const tb = e.target.closest(".tabs button");
  if (tb){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===tb));
    ["prices","bilezik","budget","zekat"].forEach(id=>$(id).classList.toggle("hide", id!==tb.dataset.tab)); }
});
["bKarat","bGram","bAdet"].forEach(id=>$(id).addEventListener("input",renderBilezik));
$("buAmt").addEventListener("input",renderBudget);
document.querySelectorAll(".zi").forEach(i=>i.addEventListener("input",renderZekat));

(async function start(){
  lang = ls.get("mi_lang") || ({de:"de",en:"en"}[(navigator.language||"tr").slice(0,2)] || "tr"); if(!T[lang]) lang="tr";
  renderTexts();
  await loadConfig();
  if (new URLSearchParams(location.search).has("admin")){ $("adm").classList.remove("hide"); renderAdm(); }
  await fetchSpot();
  setInterval(fetchSpot, 60000);
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) fetchSpot(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
