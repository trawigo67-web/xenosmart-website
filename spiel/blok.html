    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.lineWidth=3+beat*2; rr(bx-6,by-6,w+12,h+12,16); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; rr(bx-3.5,by-3.5,w+7,h+7,13); ctx.stroke(); ctx.restore();
    if (fever>0){ const fw=w*Math.min(1,fever/10); const fg=ctx.createLinearGradient(bx,0,bx+w,0); fg.addColorStop(0,'#ffd23f'); fg.addColorStop(1,'#ff4f6d'); ctx.fillStyle=fg; rr(bx+(w-fw)/2,by-14,fw,5,3); ctx.fill(); }
    for (const tr of trails){ const g=ctx.createLinearGradient(0,by+tr.y0*cell,0,by+(tr.y1+1)*cell); g.addColorStop(0,hexA(tr.color)+'0)'); g.addColorStop(1,hexA(tr.color)+Math.min(1,tr.life*1.8)+')');
      ctx.fillStyle=g; ctx.fillRect(bx+tr.c*cell+cell*0.15, by+tr.y0*cell, cell*0.7, (tr.y1-tr.y0+1)*cell); }
    ctx.save(); rr(bx-2,by-2,w+4,h+4,12); ctx.clip();
    for (let r=0;r<ROWS;r++){ const row=grid[r]; const clr = clearing && clearing.rows.includes(r);
      for (let c=0;c<COLS;c++){ const v=row[c]; if(!v) continue; const x=bx+c*cell, y=by+r*cell;
        if (clr){ const k=Math.min(1, clearing.t/0.38); const delay=Math.abs(c-4.5)/5*0.4; const kk=Math.max(0,Math.min(1,(k-delay)/(1-delay))); const sc=1+kk*0.45, s2=cell*sc;
          ctx.globalAlpha=1-kk; ctx.drawImage(sprite(v,cell),x+cell/2-s2/2,y+cell/2-s2/2,s2,s2); ctx.globalAlpha=1; }
        else ctx.drawImage(sprite(v,cell),x,y,cell,cell);
      } }
    if (clearing){ const k=clearing.t/0.38; ctx.globalCompositeOperation='lighter'; clearing.rows.forEach(r=>{ ctx.fillStyle=`rgba(255,255,255,${0.7*(1-k)})`; ctx.fillRect(bx,by+r*cell,w,cell);
      const x=bx+w*k, bg=ctx.createLinearGradient(x-cell*1.5,0,x+cell*1.5,0); bg.addColorStop(0,'rgba(255,255,255,0)'); bg.addColorStop(.5,'rgba(255,255,255,.95)'); bg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=bg; ctx.fillRect(x-cell*1.5, by+r*cell-cell*0.15, cell*3, cell*1.3);
      const x2=bx+w*(1-k); ctx.fillRect(x2-cell*1.5, by+r*cell-cell*0.15, cell*3, cell*1.3); }); ctx.globalCompositeOperation='source-over'; }
    if (lockFlashT>0){ ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,255,255,${lockFlashT/0.22*0.5})`; lockFlash.forEach(([c,r])=>{ if(r>=0){ rr(bx+c*cell+2,by+r*cell+2,cell-4,cell-4,cell*0.2); ctx.fill(); } }); ctx.globalCompositeOperation='source-over'; }
    if (cur && (state==='play'||state==='count'||state==='paused')){
      const col=SHAPES[cur.k].c;
      if (state!=='count'){ let gy=cur.y; while(!collide(cur.m,cur.x,gy+1)) gy++;
        if (gy!==cur.y){ const gs=ghostSpr(col,cell); ctx.globalAlpha=0.75+0.2*Math.sin(time*5); cur.m.forEach((row,r)=>row.forEach((v,c)=>{ if(v && gy+r>=0) ctx.drawImage(gs,bx+(cur.x+c)*cell,by+(gy+r)*cell,cell,cell); })); ctx.globalAlpha=1; } }
      const gl=glowSpr(col), sp=sprite(col,cell); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,(fever>0?0.6:0.38)+beat*0.4);
      cur.m.forEach((row,r)=>row.forEach((v,c)=>{ if(v && cur.y+r>=0) ctx.drawImage(gl,bx+(cur.x+c)*cell-cell*0.5,by+(cur.y+r)*cell-cell*0.5,cell*2,cell*2); }));
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      const lk = grounded() ? Math.min(1,lockT/LOCK_DELAY) : 0;
      cur.m.forEach((row,r)=>row.forEach((v,c)=>{ if(v && cur.y+r>=0){ const x=bx+(cur.x+c)*cell, y=by+(cur.y+r)*cell; ctx.drawImage(sp,x,y,cell,cell);
        if (lk>0){ ctx.fillStyle=`rgba(255,255,255,${lk*0.3})`; rr(x+cell*0.06,y+cell*0.06,cell*0.88,cell*0.88,cell*0.2); ctx.fill(); } } }));
    }
    ctx.restore();
    drawSide();
  }
  function drawFx(){
    for (const g of rings){ const a=g.life/0.6; ctx.strokeStyle=g.c; ctx.globalAlpha=a*0.35; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(g.x,g.y,g.r,g.r*0.42,0,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=a; ctx.lineWidth=2.5; ctx.stroke(); }
    ctx.globalAlpha=1;
    for (const p of particles){ if (!p.shard) continue; const s=p.r*Math.min(1,p.life*1.6+0.3); ctx.globalAlpha=Math.min(1,p.life*2);
      ctx.setTransform(dpr*Math.cos(p.rot),dpr*Math.sin(p.rot),-dpr*Math.sin(p.rot),dpr*Math.cos(p.rot),(p.x+shakeX)*dpr,(p.y+shakeY)*dpr); ctx.drawImage(sprite(p.color,Math.round(cell*0.4)),-s/2,-s/2,s,s); }
    ctx.setTransform(dpr,0,0,dpr,shakeX*dpr,shakeY*dpr);
    ctx.globalCompositeOperation='lighter';
    for (const p of particles){ if (p.shard) continue; ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); const s=p.r*3; ctx.drawImage(dotSpr(p.color),p.x-s,p.y-s,s*2,s*2); }
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    for (const f of floaters){ const age=1.3-f.life, sc=age<0.15?0.6+age/0.15*0.4+Math.sin(age/0.15*Math.PI)*0.15:1; ctx.globalAlpha=Math.min(1,f.life*1.5);
      const fs=Math.round(f.size*sc); fitFont(f.text,cell*COLS+40,fs,900); ctx.lineWidth=Math.max(3,fs*0.2); ctx.strokeStyle='rgba(0,40,50,.75)'; ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y); }
    ctx.globalAlpha=1;
    if (banner){ const b=banner, k=b.t/b.dur, a=k<0.12?k/0.12:(k>0.8?(1-k)/0.2:1), w=cell*COLS+24, cx=bx+cell*COLS/2, cy=by+cell*ROWS*0.4, bh=Math.max(54,cell*2.8);
      const sc=k<0.12?1.4-0.4*(k/0.12):1;
      ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.translate(cx,cy); ctx.scale(sc,sc);
      const bg=ctx.createLinearGradient(-w/2,0,w/2,0); bg.addColorStop(0,'rgba(46,230,200,0)'); bg.addColorStop(.2,'rgba(46,230,200,.88)'); bg.addColorStop(.5,'rgba(166,255,77,.92)'); bg.addColorStop(.8,'rgba(255,210,63,.88)'); bg.addColorStop(1,'rgba(255,210,63,0)');
      ctx.fillStyle=bg; ctx.fillRect(-w/2,-bh/2,w,bh);
      ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(-w/2,-bh/2,w,2); ctx.fillRect(-w/2,bh/2-2,w,2);
      const shx=-w/2+w*((b.t*1.4)%1.3); const sg=ctx.createLinearGradient(shx-40,0,shx+40,0); sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(.5,'rgba(255,255,255,.6)'); sg.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=sg; ctx.fillRect(-w/2,-bh/2,w,bh);
      const fs=fitFont('⬆ '+b.text,w-30,Math.round(bh*0.46),900); ctx.lineWidth=Math.max(3,fs*0.16); ctx.strokeStyle='rgba(10,60,50,.8)'; ctx.strokeText('⬆ '+b.text,0,-bh*0.1); ctx.fillStyle='#fff'; ctx.fillText('⬆ '+b.text,0,-bh*0.1);
      fitFont(b.sub,w-30,Math.round(bh*0.22),800); ctx.fillStyle='#0e3a2c'; ctx.fillText(b.sub,0,bh*0.28);
      ctx.restore(); }
    ctx.textBaseline='alphabetic';
  }

  let shakeX=0, shakeY=0;
  function frame(ts){
    const raw=(ts-(lastT||ts))/1000, dt0=Math.min(0.05,raw); lastT=ts;
    // otomatik kalite: oyunun ilk ~2 sn ortalama kare süresi > 22 ms ise LITE
    if (!perf.done && state==='play' && raw>0 && raw<0.25){ perf.acc+=raw; perf.n++; if (perf.acc>=2){ perf.done=true; if (perf.acc/perf.n*1000>22){ LITE=true; layout(); } } }
    let dt=dt0; if (hitStop>0){ hitStop-=dt0; dt=0; }   // hit-stop: oyun bir an donar
    time+=dt0;
    tickHeld(dt);
    if (scorePop>0) scorePop=Math.max(0,scorePop-dt0*3.5); if (lvlPop>0) lvlPop=Math.max(0,lvlPop-dt0*1.6); if (goalPop>0) goalPop=Math.max(0,goalPop-dt0*3);
    const pzOn=ACTIVE.includes(state); if (pzOn!==pzShown){ pzShown=pzOn; $('pz').classList.toggle('on',pzOn); }
    if (state==='play' && cur){
      dropT+=dt;
      if (dropT>=speed()){ dropT=0; if(!collide(cur.m,cur.x,cur.y+1)) cur.y++; }
      if (grounded()){ lockT+=dt; if (lockT>LOCK_DELAY) lock(); } else lockT=0;
    }
    if (state==='play' && fever>0){ fever-=dt; if(fever<=0){ fever=0; hud(); } }
    if (flashT>0) flashT-=dt; if (shake>0) shake-=dt; if (lockFlashT>0) lockFlashT-=dt;
    if (banner){ banner.t+=dt; if (banner.t>=banner.dur) banner=null; }
    if (analyser && freq){ analyser.getByteFrequencyData(freq); let b=0; for(let i=1;i<6;i++) b+=freq[i]; b=b/5/255; beat = Math.max(beat*Math.pow(0.88,dt0*60), Math.pow(Math.max(0,b-0.35)/0.65,1.6)); }
    else beat = Math.max(beat*Math.pow(0.9,dt0*60), Math.pow(Math.max(0,Math.sin(time*Math.PI*2*100/60)),8)*0.6);
    for (const g of ghosts){ g.y+=g.vy*dt; g.r+=g.vr*dt; if(g.y>H+g.s*3){ g.y=-g.s*3; g.x=Math.random()*W; } }
    const sp = 120 + level*35 + (fever>0?300:0);
    for (const k of streaks){ k.y+=sp*k.v*dt; if(k.y>H){ k.y=-k.l; k.x=Math.random()*W; } }
    if (state==='play' && cur && Math.random()<dt*(LITE?5:14)){ const cells=[]; cur.m.forEach((r,ri)=>r.forEach((v,ci)=>{ if(v&&cur.y+ri>=0) cells.push([cur.x+ci,cur.y+ri]); }));
      const q=cells[Math.floor(Math.random()*cells.length)]; if(q) particles.push({x:bx+q[0]*cell+Math.random()*cell,y:by+q[1]*cell+Math.random()*cell,vx:(Math.random()-.5)*30,vy:-20-Math.random()*30,life:0.5,color:SHAPES[cur.k].c,r:1+Math.random()*1.5}); }
    for (const g of rings){ g.r+=dt*cell*18; g.life-=dt; } rings=rings.filter(g=>g.life>0);
    if (clearing && state==='clearing'){ clearing.t+=dt; if (clearing.t>=0.38){ finishClear(); } }
    for (const tr of trails) tr.life-=dt; trails=trails.filter(x=>x.life>0);
    if (scoreShown<score){ scoreShown=Math.min(score, scoreShown+Math.max(1,Math.ceil((score-scoreShown)*(1-Math.exp(-dt0*10))))); $('score').textContent=fmt(scoreShown); }
    else if (scoreShown>score){ scoreShown=score; $('score').textContent=fmt(score); }
    if ((state==='menu' && !tutDone) || state==='over'){ if (Math.random()<dt*3 && demo.length<40){ const k=KEYS[Math.floor(Math.random()*KEYS.length)]; demo.push({k,x:Math.random()*W,y:-60,v:60+Math.random()*90,r:Math.random()*6,vr:(Math.random()-.5)*2,s:16+4*Math.floor(Math.random()*6)}); } }
    for (const d of demo){ d.y+=d.v*dt; d.r+=d.vr*dt; } demo=demo.filter(d=>d.y<H+80);
    const damp=Math.pow(0.96,dt*60);
    for(const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=damp; p.vy=p.vy*damp+500*dt; if (p.rot!==undefined) p.rot+=p.vr*dt; } particles=particles.filter(p=>p.life>0);
    for(const f of floaters){ f.life-=dt; f.y-=35*dt; } floaters=floaters.filter(f=>f.life>0);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawBg();
    for (const d of demo){ ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.r); ctx.globalAlpha=0.8; drawPieceMini(d.k,0,0,d.s); ctx.restore(); }
    if (grid && (state!=='menu' || tutDone)){
      const sk = RM ? 0 : (shake>0 ? 14*Math.min(0.6,shake) : 0); shakeX = sk ? (Math.random()-.5)*sk : 0; shakeY = sk ? (Math.random()-.5)*sk : 0;
      ctx.setTransform(dpr,0,0,dpr,shakeX*dpr,shakeY*dpr);
      drawBoard(); drawFx();
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    if (flashT>0){ ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,240,200,${Math.min(RM?0.2:0.5,flashT*1.4)})`; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over'; }
    requestAnimationFrame(frame);
  }
  addEventListener('resize',layout);
  layout(); grid=Array.from({length:ROWS},()=>Array(COLS).fill(null)); queue=[nextKey(),nextKey(),nextKey()]; level=1; lines=0; score=0; combo=-1; fever=0; hud();
  menu(); requestAnimationFrame(frame);

  // ---------- test kancası (yalnızca ?debug) ----------
  if (/[?&]debug/.test(location.search)) window.__NB={
    fill(){ for (let r=12;r<ROWS;r++) for (let c=0;c<COLS;c++){ const hole = c===9 || (r<16 && (c*7+r*3)%5===0); grid[r][c]= hole?null:SHAPES[KEYS[(c+r)%7]].c; } hold='T'; },
    clear4(){ lines=6; cur={k:'I', m:rotate(SHAPES.I.m.map(r=>r.slice())), x:7, y:0}; state='play'; hard(); },
    over(){ lives=1; loseLife(); },
    sym(on){ SAVE.cb=!!on; SPR={}; }, skin(s){ skin=s; SPR={}; },
    st(){ return {state, score, lines, level, lives, cur:cur&&{k:cur.k,x:cur.x,y:cur.y}, hold, LITE, filled:grid.flat().filter(Boolean).length}; },
    near(){ lines=7; hard(); }
  };
})();
</script>
