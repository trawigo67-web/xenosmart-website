function update(f,inp,pin,o){

 const onG=f.y>=GROUND;
 if(f.flash>0)f.flash--;if(f.sayT>0)f.sayT--;
 if(f.state==='ko'||f.state==='win'){f.t++;phys(f,true);return}
 if(game.state!=='fight'){f.vx=0;f.state=onG?'idle':'jump';phys(f);return}
 if(f.stun>0){f.stun--;if(f.dizzy>0)f.dizzy--;if(f.netted>0)f.netted--;phys(f,true);if(!f.stun){f.state='idle';f.dizzy=0}return}

  if(inp.punch&&!pin.punch){startAtk(f,'punch')}else if(inp.kick&&!pin.kick){startAtk(f,'kick')}}

  const a=ATK[f.atk];f.atkT++;
  if(f.atk!=='special'&&!f.hitDone&&f.atkT>a.start&&f.atkT<=a.start+a.active){
   const dx=(o.x-f.x)*f.facing,dy=Math.abs(o.y-f.y);
   if(dx>0&&dx<a.range&&dy<115){f.hitDone=true;damage(o,a.dmg*f.look.pow,f.facing,a.push,f);spark(f.x+f.facing*a.range*.8,f.y-(f.atk==='kick'?170:185),'#fff3a0',10)}
  }

  if(f.atk==='punch'&&f.atkT===a.start&&f.look.razor&&Math.random()<f.look.razor){proj.push({x:f.x+f.facing*90,y:f.y-195,vx:f.facing*12,owner:f,kind:'razor',t:0,razor:1,dmg:5});pop(f.x,f.y-330,'PERMATİK!','#dfe6ee',true)}
  if(f.atk==='special'&&f.look.spType==='dash'&&f.atkT>a.start&&f.atkT<=a.start+16){f.vx=f.facing*15;if(f.look.multi){const dx=(o.x-f.x)*f.facing;if(f.atkT===a.start+1)f.mh=0;if(dx>-20&&dx<160&&Math.abs(o.y-f.y)<120&&f.mh<f.look.multi&&f.atkT%3===0){f.mh++;f.vx=f.facing*4;damage(o,6*f.look.pow,f.facing,2,f);o.stun=Math.max(o.stun,24);spark(o.x,o.y-200,'#ffffff',14);for(let k=0;k<6;k++)parts.push({x:o.x,y:o.y-260,vx:(Math.random()-.5)*7,vy:-Math.random()*4,life:28,c:'#3a2a1a'});if(f.mh===f.look.multi){pop(o.x,o.y-340,T().shaved,'#ffffff',true);shake=12}}}
  else if(!f.hitDone){const dx=(o.x-f.x)*f.facing;if(dx>0&&dx<150&&Math.abs(o.y-f.y)<120){f.hitDone=true;damage(o,20*f.look.pow,f.facing,16,f);spark(o.x,o.y-170,f.look.spark,26);shake=10}}if(time%2)parts.push({x:f.x-f.facing*40,y:f.y-60-Math.random()*120,vx:-f.facing*3,vy:0,life:14,c:f.look.bar})}
  if(f.atkT>=a.start+a.active+a.rec){f.atk=null;f.state='idle'}
  if(onG&&!(f.atk==='special'&&f.look.spType==='dash'&&f.atkT<=ATK.special.start+16))f.vx=0;
  phys(f);return;
 }
 f.facing=o.x>f.x?1:-1;
 if(inp.block&&onG){f.state='block';f.vx=0}
 else{
  const mv=(inp.right?1:0)-(inp.left?1:0);
  if(onG)f.vx=mv*4.8*f.look.spd;
  if(inp.up&&!pin.up&&onG){f.vy=-17.5}
  if(inp.punch&&!pin.punch){startAtk(f,'punch')}
  else if(inp.kick&&!pin.kick){startAtk(f,'kick')}
  else if(inp.special&&!pin.special&&f.meter>=100&&onG){f.meter=0;startAtk(f,'special');sfx('special');banner={txt:f.look.sp+'!',t:55,c:f.look.bar};if(f.look.shout){f.say=f.look.shout[Math.random()*f.look.shout.length|0];f.sayT=80}}

}
function phys(f,fric){

 if(f.y>=GROUND){f.y=GROUND;f.vy=0;if(f.juggle&&wasAir){f.juggle=0;f.stun=Math.min(f.stun,26);shake=8;spark(f.x,GROUND-10,'#d8c7a0',12)}if(f.state==='ko')f.vx*=0.8}

function fire(f){

 if(L.heal){f.hp=Math.min(f.maxhp,f.hp+L.heal);f.ghost=Math.max(f.ghost,f.hp);pop(f.x,f.y-320,'+'+L.heal+' ❤️ '+T().heroP,'#7dff8a',true);spark(f.x,f.y-150,'#7dff8a',24)}

 if(L.spType==='net'){proj.push({x:f.x+f.facing*110,y:f.y-170,vx:f.facing*10,owner:f,kind:L.kind,t:0,net:1});return}

/* ---------- AI ---------- */
function runAI(){
 const me=P[1],you=P[0];
 const h=ai.hold;h.punch=h.kick=h.special=0;h.up=0;
 if(--ai.t>0)return;
 Object.assign(h,mkIn());
 const d=Math.abs(you.x-me.x),dir=Math.sign(you.x-me.x)||1,r=Math.random();
 const incoming=proj.some(p=>p.owner!==me&&Math.sign(me.x-p.x)===Math.sign(p.vx)&&Math.abs(me.x-p.x)<280);
 const D=DIFFS[DIFF];
 if(incoming&&Math.random()<D.blk+0.25){if(r<0.55)h.up=1;else h.block=1;ai.t=22;return}
 if(you.atk&&d<140&&r<D.blk){h.block=1;ai.t=18;return}
 if(me.meter>=100&&d>200&&r<D.sp){h.special=1;ai.t=24;return}
 if(d>105){if(dir>0)h.right=1;else h.left=1;if(r<0.06)h.up=1;ai.t=(8+Math.random()*10)*D.t;return}
 if(r<0.42)h.punch=1;else if(r<0.72)h.kick=1;else if(r<0.84){if(dir>0)h.left=1;else h.right=1}else h.block=1;

}

 if(winner){winner.wins++;game.msg=winner.look.name+' '+T().won;game.msg2=winner.hp>=winner.maxhp-0.01?T().perfect:winner.hp<winner.maxhp*.15?T().great:'';if(game.msg2)setTimeout(()=>voice(game.msg2===T().perfect?'perfect':'great'),1500);if(winner.state!=='ko'){winner.state='win';winner.atk=null}}

function step(){
 time++;
 if(banner&&--banner.t<=0)banner=null;
 for(const x of texts){x.y-=1.1;x.life--}texts=texts.filter(x=>x.life>0);
 if(freeze>0){freeze--;return}
 if(slow>0){slow--;if(slow%2)return}
 for(const f of P){if(f.ghostT>0)f.ghostT--;else if(f.ghost>f.hp)f.ghost=Math.max(f.hp,f.ghost-0.7);if(f.comboT>0&&--f.comboT===0)f.combo=0}
 // inputs
 for(let i=0;i<2;i++){const k=keyIn[i],t=touchIn[i],o={};for(const n in k)o[n]=k[n]||t[n];inputs[i]=o}
 if(game.prac&&P.length){const d=P[1];if(d.hp<d.maxhp*.3){d.hp=d.ghost=d.maxhp}P[0].meter=Math.min(100,P[0].meter+.35);if(P[0].hp<P[0].maxhp*.3)P[0].hp=P[0].maxhp}
 if(game.mode===1){
  // 1P: P2 keys also control P1
  for(const n in inputs[0])inputs[0][n]=inputs[0][n]||inputs[1][n];
  if(game.prac){inputs[1]=mkIn()}else{runAI();inputs[1]={...ai.hold}}
 }
 if(game.state==='intro'){game.msgT--;if(game.msgT===35){game.msg=T().fight;voice('fight')}if(game.msgT<=0)game.state='fight'}
 if(game.state==='fight'){
  game.timer--;
  if(game.prac)game.timer=60*60;
  if(game.timer<=0){game.timer=0;banner={txt:T().timeup,t:70,c:'#ffd84a'};voice('timeup');const w=P[0].hp===P[1].hp?null:(P[0].hp>P[1].hp?P[0]:P[1]);endRound(w)}
 }
 if(game.state==='roundEnd'){
  game.msgT--;
  if(game.msgT<=0){
   if(P[0].wins>=game.need||P[1].wins>=game.need){matchEnd();return}
   game.round++;startRound();
  }
 }
 update(P[0],inputs[0],prev[0],P[1]);
 update(P[1],inputs[1],prev[1],P[0]);
 // separation
 const a=P[0],b=P[1],dx=b.x-a.x;
 if(Math.abs(dx)<110&&Math.abs(a.y-b.y)<100&&a.state!=='ko'&&b.state!=='ko'){
  const push=(110-Math.abs(dx))/2*(Math.sign(dx)||1);a.x-=push;b.x+=push;
  a.x=Math.max(85,Math.min(W-85,a.x));b.x=Math.max(85,Math.min(W-85,b.x));
 }
 // projectiles
 for(const p of proj){

  const hw=W/2/z,hh=H/2/z,cx=Math.max(hw,Math.min(W-hw,W/2+(c.x-W/2)*k*.9)),cy=Math.max(hh,Math.min(H-hh,H/2+(c.y-H/2)*k*.9));ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy)}

 if(P.length){
  const order=P[0].atk?[1,0]:[0,1];

let last=performance.now(),acc=0;

/* ---------- Input ---------- */
const KEYS={KeyA:[0,'left'],KeyD:[0,'right'],KeyW:[0,'up'],KeyS:[0,'block'],KeyF:[0,'punch'],KeyG:[0,'kick'],KeyH:[0,'special'],
 ArrowLeft:[1,'left'],ArrowRight:[1,'right'],ArrowUp:[1,'up'],ArrowDown:[1,'block'],KeyK:[1,'punch'],KeyL:[1,'kick'],Semicolon:[1,'special'],KeyJ:[1,'special']};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(k){keyIn[k[0]][k[1]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){keyIn[k[0]][k[1]]=0}});
addEventListener('blur',()=>{keyIn=[mkIn(),mkIn()];touchIn=[mkIn(),mkIn()]});

function btn(p,k,label,cls,sub){
 const b=document.createElement('button');b.className='btn '+(cls||'');b.innerHTML=label+(sub?'<small>'+sub+'</small>':'');
 const on=e=>{e.preventDefault();touchIn[p][k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){} };
 const off=e=>{touchIn[p][k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
 b.addEventListener('contextmenu',e=>e.preventDefault());
 return b;
}
let BS=56;
function joy(p){
 const d=document.createElement('div');d.className='joy';const k=document.createElement('div');k.className='knob';d.appendChild(k);
 let id=null;
 const set=(cx,cy)=>{const r=d.getBoundingClientRect(),R=r.width/2;let dx=cx-(r.left+R),dy=cy-(r.top+R);const m=Math.hypot(dx,dy),mx=R*.62;if(m>mx){dx*=mx/m;dy*=mx/m}
  k.style.transform=`translate(${dx}px,${dy}px)`;const t=touchIn[p];t.left=dx<-R*.22?1:0;t.right=dx>R*.22?1:0;t.up=dy<-R*.38?1:0;t.block=dy>R*.42&&Math.abs(dx)<R*.45?1:0;d.classList.toggle('on',!!(t.left||t.right||t.up||t.block))};
 const end=()=>{id=null;k.style.transform='';const t=touchIn[p];t.left=t.right=t.up=t.block=0;d.classList.remove('on')};
 d.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{d.setPointerCapture(id)}catch(_){}set(e.clientX,e.clientY)});
 d.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e.clientX,e.clientY)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>d.addEventListener(ev,e=>{if(e.pointerId===id||ev==='lostpointercapture')end()}));
 d.addEventListener('contextmenu',e=>e.preventDefault());
 return d;
}
function cluster(p){
 const c=document.createElement('div');c.className='clu';
 [btn(p,'special',SPI[PICK[p]],'sp',T().sp),btn(p,'kick','🦵','atk',T().kick),btn(p,'block','🛡','',T().block),btn(p,'punch','👊','atk big',T().punch)].forEach(b=>c.appendChild(b));
 return c;
}
function buildControls(){
 controls.innerHTML='';
 const L=document.createElement('div'),Rr=document.createElement('div');L.className='side';Rr.className='side r';
 if(game.mode===1){L.appendChild(joy(0));Rr.appendChild(cluster(0))}
 else{L.appendChild(joy(0));L.appendChild(cluster(0));Rr.appendChild(cluster(1));Rr.appendChild(joy(1));
  [0,1].forEach(p=>{const lb=document.createElement('div');lb.className='lbl2';lb.textContent=RK(PICK[p]).name;lb.style.color=RK(PICK[p]).bar;(p?Rr:L).prepend(lb)})}

function layout(){
 const vw=innerWidth,vh=innerHeight,touch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
 const port=vh>vw,two=game.mode===2,playing=!document.body.classList.contains('menu')&&P.length>0;
 document.body.classList.toggle('land',touch);
 document.getElementById('rot').classList.toggle('hidden',!(touch&&port&&playing));
 controls.classList.toggle('hidden',!touch);
 const sh=Math.min(vw,vh);
 const J=Math.round(Math.max(92,Math.min(two?125:150,sh*(two?.3:.34))));
 const B=Math.round(Math.max(40,Math.min(two?56:72,sh*(two?.13:.165))));
 document.documentElement.style.setProperty('--J',J+'px');document.documentElement.style.setProperty('--B',B+'px');
 let sw=touch?Math.min(vw,vh*16/9):Math.min(vw-24,(vh-20)*16/9,1400);
 stage.style.width=sw+'px';stage.style.height=sw*9/16+'px';
}
async function goLandscape(){
 const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;if(!touch)return;
 try{const de=document.documentElement;if(!document.fullscreenElement&&de.requestFullscreen)await de.requestFullscreen({navigationUI:'hide'})}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
 setTimeout(layout,300);
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,250));

 tr:`<rect width="60" height="40" fill="#e30a17"/><circle cx="22" cy="20" r="10" fill="#fff"/><circle cx="24.6" cy="20" r="8" fill="#e30a17"/><polygon fill="#fff" points="31.5,20 40.9,16.9 35.1,24.9 35.1,15.1 40.9,23.1"/>`,
 de:`<rect width="60" height="40" fill="#000"/><rect y="13.33" width="60" height="13.34" fill="#dd0000"/><rect y="26.67" width="60" height="13.33" fill="#ffce00"/>`,
 en:`<rect width="60" height="40" fill="#fff"/>${[0,2,4,6,8,10,12].map(i=>`<rect y="${i*40/13}" width="60" height="${40/13}" fill="#b22234"/>`).join('')}<rect width="26" height="${40*7/13}" fill="#3c3b6e"/>${[0,1,2,3,4].map(r=>[0,1,2,3,4,5].map(c=>`<circle cx="${2.4+c*4.2+(r%2)*2.1}" cy="${2.4+r*4.2}" r="0.9" fill="#fff"/>`).join('')).join('')}`};

 <div class="hero"><img src="musa/musa_win.webp" alt=""><span class="vs">VS</span><img src="musa/storm_idle.webp" style="transform:scaleX(-1)" alt=""></div><h1>MUSA</h1><h2>${t.sub}</h2>

 card.classList.remove('wide');const t=T();
 const sub=x=>`<br><small style="font-weight:600;font-size:13px">${x}</small>`;
 card.innerHTML=`<h1 style="font-size:clamp(26px,7vw,46px)">${t.p1}</h1><h2>${t.how}</h2>

 <button class="big alt" id="mf">${t.free}${sub(t.frees)}</button>

  game.arc={list:[...o,boss],i:0};PICK[1]=game.arc.list[0];diff()},false,mode1);
 document.getElementById('ms').onclick=()=>pick(0,t.surv+' – '+t.pickMe,k=>{PICK[0]=k;const o=others(k);
  game.surv={n:0,hp:null,pool:o};PICK[1]=o[Math.random()*o.length|0];diff()},false,mode1);
 document.getElementById('mp').onclick=()=>pick(0,t.prac+' – '+t.pickMe,k=>{PICK[0]=k;pick(1,t.pickOpp,k2=>{PICK[1]=k2;game.prac=true;start(1)},false,mode1)},false,mode1);

function pick(slot,title,done,rnd,back){
 card.classList.add('wide');const t=T();if(!slot){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}voice('choose')}
 const st=r=>`<span class="st">⚡${Math.round(r.spd*10)} 💪${Math.round(r.pow*10)} ❤️${r.hp}</span>`;
 card.innerHTML=`<h1 style="font-size:clamp(24px,min(7vw,9vh),44px)">${title}</h1>${slot?`<div class="pk">${t.p1is}${RK(PICK[0]).name}</div>`:''}
 <div class="roster">${ROSTER.map(r=>`<button class="rc${slot&&r.kind===PICK[0]?' taken':''}${r.star?' star':''}" data-k="${r.kind}" style="border-color:${r.bar}55">${r.star?`<em class="stb">${t.special}</em>`:''}<img src="musa/${r.kind}_idle.webp" alt="" ${slot?'style="transform:scaleX(-1)"':''}><b style="color:${r.bar}">${r.name}</b><i>${r.tag} · ${r.sp}</i>${st(r)}</button>`).join('')}</div>
 ${rnd?`<button class="big alt" id="rnd" style="padding:10px">${t.rnd}</button>`:''}<button class="big" style="background:#ffffff1a;box-shadow:none;padding:10px" id="bk">${t.back}</button>`;

 const a=RK(PICK[0]),b=RK(PICK[1]),ar=game.arc,t=T();

function matchEnd(){
 game.state='over';const t=T();
 const w=P[0].wins>=game.need?P[0]:P[1],won=w===P[0];
 const ar=game.arc,sv=game.surv,last=ar&&ar.i===ar.list.length-1,arcNext=ar&&won&&!last;
 let btn1=`<button class="big alt" id="r1">${t.again}</button>`,msg,extra='';
 if(ar){
  msg=won?(last?t.arcDone(P[0].look.name):t.arcWin):t.arcLose(w.look.name);
  {const li=ar.i;if(won)ar.i++;extra=ladder();ar.i=li}
  btn1=`<button class="big alt" id="r1">${arcNext?t.next+RK(ar.list[ar.i+1]).name:won?t.arcAgain:t.cont}</button>`;
  if(won&&last){ar.i=-1;const boss=PICK[0]==='storm'?'musa':'storm';ar.list=ar.list.filter(x=>x!==boss).sort(()=>Math.random()-.5).concat(boss)}
 }else if(sv){
  if(won){sv.n++;sv.hp=Math.min(P[0].maxhp,P[0].hp+P[0].maxhp*.3);msg=t.survWin+' ('+sv.n+')';btn1=`<button class="big alt" id="r1">${t.survNext}</button>`}
  else{let best=0;try{best=Math.max(sv.n,+localStorage.getItem('musaSurv')||0);localStorage.setItem('musaSurv',best)}catch(e){}
   msg=t.survEnd(sv.n)+' · '+t.survBest(best);btn1=`<button class="big alt" id="r1">${t.again}</button>`}
 }else msg=game.mode===1?(won?t.champ1(w.look.name):t.lose1(w.look.name)):t.champ2(w.look.name);
 if(won||game.mode===2)voice('win');

 document.getElementById('r1').onclick=()=>{P=[];
  if(arcNext){ar.i++;PICK[1]=ar.list[ar.i]}else if(ar&&won&&last){ar.i=0;PICK[1]=ar.list[0]}
  else if(sv){if(!won){sv.n=0;sv.hp=null}const o=sv.pool.filter(x=>x!==PICK[1]);PICK[1]=o[Math.random()*o.length|0]}

}
