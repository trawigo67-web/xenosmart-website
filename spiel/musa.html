const STORY=[
 {opp:'abdullah',st:'imamlar',d:'kolay',
  t:['1. BÖLÜM · YALANIN İZİ','KAPITEL 1 · DIE SPUR DER LÜGE','CHAPTER 1 · THE TRAIL OF LIES'],
  x:["Bir sabah Çaycuma'nın üstüne kara bulutlar çöker. Kara Fırtına geri dönmüştür! Musa pandasıyla yola çıkar. İmamlar Köyü'nde Apo karşısına çıkar: 'Fırtınayı ben gördüm abi, Bartın'a gitti!' Musa bunun yalan olduğunu bilir…",
     "Eines Morgens ziehen schwarze Wolken über Çaycuma auf. Kara Fırtına ist zurück! Musa macht sich mit seinem Panda auf den Weg. Im Dorf İmamlar stellt sich ihm Apo in den Weg: 'Ich hab den Sturm gesehen, Abi, er ist nach Bartın!' Musa weiß, dass das gelogen ist…",
     "One morning black clouds roll over Çaycuma. Kara Fırtına is back! Musa sets out with his panda. In İmamlar village, Apo blocks his way: 'I saw the storm, bro, it went to Bartın!' Musa knows it's a lie…"]},
 {opp:'nazif',st:'kisla',d:'kolay',
  t:['2. BÖLÜM · AVCININ SINAVI','KAPITEL 2 · DIE PRÜFUNG DES JÄGERS','CHAPTER 2 · THE HUNTER\'S TEST'],
  x:["Kışla Köyü'nde sis var. Avcı Nazif fırtınanın izlerini çoktan bulmuştur ama bir şartı vardır: 'İzleri sana göstereyim – önce beni geç!' Köpeği havlar, ağ hazırdır.",
     "Im Dorf Kışla liegt Nebel. Jäger Nazif hat die Spuren des Sturms längst gefunden, aber er hat eine Bedingung: 'Ich zeig dir die Spuren – aber erst musst du an mir vorbei!' Sein Hund bellt, das Netz ist bereit.",
     "Fog lies over Kışla village. Hunter Nazif has already found the storm's tracks, but on one condition: 'I'll show you the trail – but first you have to get past me!' His dog barks, the net is ready."]},
 {opp:'soner',st:'yenikoy',d:'kolay',
  t:['3. BÖLÜM · TAKSİ 67T3011','KAPITEL 3 · TAXI 67T3011','CHAPTER 3 · TAXI 67T3011'],
  x:["İzler Yeniköy'e çıkar. Kahvehanenin önünde sarı taksisiyle Soner bekliyor: 'Fırtınanın peşindeysen seni götürürüm abi… ama önce bir el dövüşelim!'",
     "Die Spuren führen nach Yeniköy. Vor dem Teehaus wartet Soner mit seinem gelben Taxi: 'Wenn du hinter dem Sturm her bist, fahr ich dich, Abi… aber erst ein Kampf!'",
     "The trail leads to Yeniköy. In front of the teahouse, Soner waits with his yellow taxi: 'If you're chasing the storm, I'll drive you, bro… but first, let's fight!'"]},
 {opp:'sinasi',st:'meydan2',d:'orta',
  t:['4. BÖLÜM · ESKİ HARİTA','KAPITEL 4 · DIE ALTE KARTE','CHAPTER 4 · THE OLD MAP'],
  x:["Akşam Çaycuma merkezinde kırtasiyeci Şinasi dükkânını kapatıyor. Elinde eski bir harita var: fırtınanın saklandığı yer. 'Pardon efendim, ama haritayı hak etmeniz lazım!'",
     "Abends schließt Schreibwarenhändler Şinasi im Zentrum von Çaycuma seinen Laden. In der Hand hält er eine alte Karte: das Versteck des Sturms. 'Verzeihung, mein Herr, aber die Karte müssen Sie sich verdienen!'",
     "In the evening, stationer Şinasi is closing his shop in central Çaycuma. In his hand: an old map showing where the storm hides. 'Pardon me, sir, but you'll have to earn this map!'"]},
 {opp:'yusuf',st:'saltukova',d:'orta',
  t:['5. BÖLÜM · SIFIR NUMARA','KAPITEL 5 · NULLERSCHNITT','CHAPTER 5 · ZERO CUT'],
  x:["Harita Saltukova Havalimanı'nı gösteriyor. Pistin ortasında Berber Yusuf, makası elinde: 'Fırtınayla dövüşeceksen önce bir tıraş olman lazım!'",
     "Die Karte zeigt auf den Flughafen Saltukova. Mitten auf dem Rollfeld: Barbier Yusuf, die Schere in der Hand. 'Wenn du gegen den Sturm kämpfen willst, brauchst du erst einen Haarschnitt!'",
     "The map points to Saltukova Airport. In the middle of the runway stands Barber Yusuf, scissors in hand: 'If you want to fight the storm, you need a haircut first!'"]},
 {opp:'timur',st:'filyos',d:'orta',
  t:['6. BÖLÜM · JARVIS HESAPLIYOR','KAPITEL 6 · JARVIS RECHNET','CHAPTER 6 · JARVIS CALCULATES'],
  x:["Filyos sahilinde Timur ve robotu Jarvis fırtınanın yerini hesaplıyor. 'Koordinatları vereceğim Musa – ama önce bakalım hazır mısın!' Jarvis'in gözleri parlar.",
     "Am Strand von Filyos berechnen Timur und sein Roboter Jarvis den Ort des Sturms. 'Ich geb dir die Koordinaten, Musa – aber erst zeig mir, ob du bereit bist!' Jarvis' Augen leuchten.",
     "On Filyos beach, Timur and his robot Jarvis are calculating the storm's location. 'I'll give you the coordinates, Musa – but first let's see if you're ready!' Jarvis's eyes light up."]},
 {opp:'mevlut',st:'bartin',d:'orta',
  t:['7. BÖLÜM · DEMİR KAFA','KAPITEL 7 · EISENSCHÄDEL','CHAPTER 7 · IRON HEAD'],
  x:["Jarvis'in hesabı Bartın'ı gösteriyor. Irmak kıyısında Mevlüt bekliyor – Apo'nun babası. 'Oğlumu yenmişsin… bakalım beni de geçebilecek misin?'",
     "Jarvis' Berechnung zeigt nach Bartın. Am Fluss wartet Mevlüt – Apos Vater. 'Du hast meinen Sohn besiegt… mal sehen, ob du auch an mir vorbeikommst!'",
     "Jarvis's calculation points to Bartın. By the river waits Mevlüt – Apo's father. 'You beat my son… let's see if you can get past me too!'"]},
 {opp:'cevat',st:'imamlar',d:'orta',
  t:['8. BÖLÜM · HOCANIN DUASI','KAPITEL 8 · DAS GEBET DES HOCA','CHAPTER 8 · THE HOCA\'S PRAYER'],
  x:["Musa yorgun düşüp İmamlar Köyü'ne döner. Cevat Hoca onu camide bekliyordur: 'Kara Fırtına'ya yalnız kuvvetle gidilmez evlat, yürek de lazım. Göster bana yüreğini!'",
     "Erschöpft kehrt Musa ins Dorf İmamlar zurück. Cevat Hoca erwartet ihn an der Moschee: 'Gegen Kara Fırtına reicht Kraft allein nicht, mein Sohn – du brauchst auch Herz. Zeig mir dein Herz!'",
     "Exhausted, Musa returns to İmamlar village. Cevat Hoca is waiting for him at the mosque: 'Strength alone won't beat Kara Fırtına, my son – you need heart too. Show me your heart!'"]},
 {opp:'storm',st:'zonguldak',d:'zor',
  t:['9. BÖLÜM · MADENDEKİ FIRTINA','KAPITEL 9 · DER STURM IM BERGWERK','CHAPTER 9 · THE STORM IN THE MINE'],
  x:["Hocanın duasını alan Musa Zonguldak'a gider. Maden kulesinin tepesinde şimşekler çakar: Kara Fırtına oradadır! 'Çaycuma artık benim!' Musa yumruklarını sıkar.",
     "Mit dem Segen des Hoca zieht Musa nach Zonguldak. Über dem Förderturm zucken Blitze: Kara Fırtına ist da! 'Çaycuma gehört jetzt mir!' Musa ballt die Fäuste.",
     "With the Hoca's blessing, Musa heads to Zonguldak. Lightning flashes above the mine tower: Kara Fırtına is there! 'Çaycuma is mine now!' Musa clenches his fists."]},
 {opp:'kemal',st:'kisla',d:'zor',
  t:['10. BÖLÜM · RÜYADAKİ ASLAN','KAPITEL 10 · DER LÖWE IM TRAUM','CHAPTER 10 · THE LION IN THE DREAM'],
  x:["Fırtına dağılır, Çaycuma'ya güneş doğar. O gece Musa bir rüya görür: sisli Kışla Köyü'nde, kasketiyle gülümseyen Kürt Kemal. 'Aferin oğlum… ama sana son bir dersim var.'",
     "Der Sturm verzieht sich, über Çaycuma geht die Sonne auf. In dieser Nacht hat Musa einen Traum: im nebligen Dorf Kışla, mit Schiebermütze und Lächeln – Kürt Kemal. 'Gut gemacht, mein Sohn… aber eine letzte Lektion habe ich noch für dich.'",
     "The storm breaks up, the sun rises over Çaycuma. That night Musa has a dream: in misty Kışla village, smiling under his flat cap – Kürt Kemal. 'Well done, my son… but I have one last lesson for you.'"]},
 {opp:'dursun',st:'imamlar',d:'zor',
  t:['SON BÖLÜM · DEDENİN HAKKI','LETZTES KAPITEL · DER SEGEN DES GROSSVATERS','FINAL CHAPTER · GRANDPA\'S BLESSING'],
  x:["Rüya devam eder. İmamlar Köyü'nde gün batarken Kel Dursun belirir – dev dede. Yere bir vurur, bütün köy sallanır: 'Bakalım torunlarım bu memleketi korumaya hazır mı?'",
     "Der Traum geht weiter. Im Dorf İmamlar erscheint bei Sonnenuntergang Kel Dursun – der Riesen-Opa. Er schlägt auf den Boden und das ganze Dorf bebt: 'Mal sehen, ob meine Enkel bereit sind, diese Heimat zu beschützen!'",
     "The dream continues. As the sun sets over İmamlar village, Kel Dursun appears – the giant grandpa. He strikes the ground and the whole village shakes: 'Let's see if my grandchildren are ready to protect this homeland!'"]}];
const STORY_END=["Dursun dede gülümser, Musa'nın omzuna elini koyar: 'Hakkım helal olsun evlat. Çaycuma artık sana emanet.' Musa uyandığında güneş Çaycuma'nın üstünde parlıyordur.\n\nRahmetli Kürt Kemal ve Kel Dursun dedenin hatırasına. 🤲",
 "Opa Dursun lächelt und legt Musa die Hand auf die Schulter: 'Du hast meinen Segen, mein Junge. Çaycuma ist jetzt in deinen Händen.' Als Musa aufwacht, scheint die Sonne über Çaycuma.\n\nIn Erinnerung an Kürt Kemal und Opa Kel Dursun. 🤲",
 "Grandpa Dursun smiles and puts his hand on Musa's shoulder: 'You have my blessing, my boy. Çaycuma is in your hands now.' When Musa wakes up, the sun is shining over Çaycuma.\n\nIn loving memory of Kürt Kemal and Grandpa Kel Dursun. 🤲"];

const BIO={
tr:{
 musa:["Çaycuma'nın kahramanı. Mahallede kim zor durumda kalsa ilk koşan odur. Koca yüreği, kocaman yumrukları ve yanından hiç ayrılmayan sevimli pandasıyla meydanı Kara Fırtına'ya karşı korur.","Panda Dalgası blokla durdurulamaz – ve Musa'nın canını 15 doldurur. Bu güç sadece kahramanda var!"],
 cevat:["Ailenin büyüklerinden, herkesin saygı duyduğu Hoca. Sakin görünür ama dua okumaya başladığında meydanı altın bir ışık kaplar. Tecrübesi en büyük silahıdır.","'Sübhanallah! Allahu Ekber!' – ışık küresi rakibi uzun süre sersemletir, kafası döner, yıldızlar uçuşur."],
 dursun:["Timur'un büyük babası, ailenin dev dedesi. Yaşına bakmayın: yere bir vurdu mu bütün Çaycuma sallanır. Yavaştır ama vuruşları en ağır olandır.","Dede Depremi: yerden kayalar fırlatır. Zıplayan rakibe işlemez – ama yerdekini fena sarsar."],
 kemal:["Namı değer Kürt Kemal – Musa amcanın babası, köyün sevilen büyüğü. Güler yüzlü, tatlı dilli ama dağ gibi güçlü; bir kere hızlandı mı önünde kimse duramaz. Rahmetli Kemal amcanın hatırasına. 🤲","Dağ Yumruğu: rakibin üstüne fırtına gibi atılır, tek darbede büyük hasar verir."],
 mevlut:["Affan ve Abdullah'ın babası. Kafası kel ama demir gibi sert – kafa atışından kimse kaçamaz. Sakin adamdır, sinirlenince dikkat!","Demir Kafa: havaya sıçrayıp kafasıyla rakibe dalar."],
 timur:["Ailenin teknoloji ustası. Yanında uçan robotu Jarvis, kolunda neon ışıklar. Kaba kuvvet yerine aklını kullanır – ve kimsede olmayan bir gücü var.","Jarvis: Zaman Durdur – rakip donar ve maviye kesilir, Timur o sırada lazerle vurur. Bu güç sadece Timur'da var!"],
 nazif:["Çaycuma'nın en usta avcısı. Sadık av köpeği hep yanında, yayı hep hazır. Sabırlıdır, avını kollar ve doğru anda tuzağı kurar.","Av Tuzağı: fırlattığı ağ rakibi yakalar, rakip bir süre kıpırdayamaz."],
 abdullah:["Abdullah, ama herkes ona Apo der. Mevlüt'ün oğlu, Affan'ın kardeşi. Ailenin en tatlı dili, en büyük yalancısı! Öyle güzel yalan atar ki herkes inanır – ama ona bir şey sorsan hep aynı cevap: 'Hayır, yalan!' Kedisi Şirin hep yanında; yalanı tutunca Şirin rakibe atlayıp tırmalıyor.","Yalan Atma: rakip yalana inanır, kafası döner, sersemler – üstelik sağ ve sol tuşları bir süre ters çalışır!"],
 yusuf:["Çaycuma'nın usta berberi – özel karakter! Kel kafası parlar, gözlükleri hiç düşmez. Makası ve tıraş makinesi elinden eksik olmaz; koltuğa oturan sıfır numara kalkar.","Sıfır Numara: makaslarla 5 kez art arda vurur. Ayrıca yumruk atarken bazen Permatik fırlatır!"],
 soner:["Çaycuma'nın en hızlı taksicisi, plakası 67T3011. Cılızdır ama çok çeviktir; elinden şişe hiç düşmez. Tek sorunu: çok dayak yerse midesi bulanır ve kusar – ama dikkat, o kusmuğa basan kayıp düşer!","Taksi Geldi: sarı taksisi arkadan gelip rakibe çarpar, havaya uçurur. Tekme yerine şişe fırlatır."],
 sinasi:["Çaycuma'nın kırtasiyecisi, tam bir efendi. Cılız, uzun ak saçlı; kimseye sesini yükseltmez, her vuruştan önce 'Pardon efendim' der. Ama dükkânındaki her şey onun elinde silaha dönüşür: kalemler, cetvel, yapıştırıcı...","Yapıştırıcı: dev tüpten fışkıran yapıştırıcı rakibi yere yapıştırır – bir süre yürüyemez, zıplayamaz. Yumruk yerine kalem fırlatır, tekme yerine cetvelle vurur."],
 muaz:["Ailenin minik pandası Muaz – daha 2,5 yaşında! Boyu küçük ama gücü kocaman, tombul ve kocaman yürekli. Panda kapüşonunu giyince kendini gerçek bir panda gibi hisseder. Sarılması da vuruşu da sağlamdır.","Panda Yuvarlanması: top gibi kıvrılıp rakibin üstüne yuvarlanır. Tekme yerine oyuncak ayıcık fırlatır! Canı azalınca ALTIN GÜÇ'e dönüşür."],
 selim:["Ailenin kung fu golcüsü Selim – daha 5 yaşında! Küçücük ama sportif, hızlı ve çok güçlü. Sırtında 10 numara, alnında kung fu bandı.","Minik Ordu: oyuncak askerlerini rakibin üstüne gönderir! Uçan kung fu tekmesiyle de uzaktan vurur. Canı azalınca ALTIN GÜÇ'e dönüşür."],
 buko:["Buko Games'in maskotu, sihirli bukalemun Buko! Oyunların içinden çıkıp Çaycuma'ya gelmiş, iki ayağı üstünde dövüşen en fantastik savaşçı. Rengi her an değişir, dili bir kırbaç gibi uzar, kuyruğu yay gibi savrulur. Kıpırdamadan durursa kamufle olup neredeyse görünmez olur.","Kopyala: rakibin özel gücünü anında kopyalar ve ona karşı kullanır – Musa'nın pandası, Hoca'nın duası, Soner'in taksisi… hepsi Buko'da!"],
 storm:["Gizemli kötü adam. Kara bulutlarla gelir, Çaycuma'yı karanlığa boğmak ister. Arcade modunun son boss'u – onu yenen gerçek şampiyondur.","Şimşek: gökten yıldırım indirir, uzaktan büyük hasar verir."]},
de:{
 musa:["Der Held von Çaycuma. Wenn jemand in Not ist, ist er als Erster da. Mit großem Herz, großen Fäusten und seinem treuen Panda beschützt er den Marktplatz vor Kara Fırtına.","Die Panda-Welle kann nicht geblockt werden – und heilt Musa um 15. Diese Kraft hat nur der Held!"],
 cevat:["Der weise Hoca der Familie, von allen respektiert. Er wirkt ruhig, doch wenn er betet, erfüllt goldenes Licht den Platz. Erfahrung ist seine stärkste Waffe.","'Sübhanallah! Allahu Ekber!' – die Lichtkugel macht den Gegner lange benommen, Sterne kreisen um seinen Kopf."],
 dursun:["Timurs Großvater, der Riesen-Opa der Familie. Lass dich vom Alter nicht täuschen: Schlägt er auf den Boden, bebt ganz Çaycuma. Langsam, aber mit den härtesten Schlägen.","Opa-Beben: schleudert Felsen über den Boden. Trifft keine springenden Gegner – aber alle am Boden."],
 kemal:["Genannt Kürt Kemal – der Vater von Onkel Musa, der beliebte Älteste des Dorfes. Immer ein Lächeln im Gesicht, aber stark wie ein Berg; wenn er einmal Anlauf nimmt, hält ihn niemand auf. In liebevoller Erinnerung an Onkel Kemal. 🤲","Bergfaust: stürmt wie ein Orkan auf den Gegner zu, riesiger Schaden mit einem Schlag."],
 mevlut:["Vater von Affan und Abdullah. Glatze, aber hart wie Eisen – seinem Kopfstoß entkommt keiner. Ein ruhiger Mann – aber Vorsicht, wenn er wütend wird!","Eisenschädel: springt hoch und rammt den Gegner mit dem Kopf."],
 timur:["Der Technik-Meister der Familie. Neben ihm schwebt sein Roboter Jarvis, an den Armen leuchten Neonlichter. Er nutzt Köpfchen statt Muskeln – und hat eine Kraft, die sonst niemand hat.","Jarvis-Zeitstopp: der Gegner erstarrt und wird blau, Timur trifft ihn mit dem Laser. Diese Kraft hat nur Timur!"],
 nazif:["Der beste Jäger von Çaycuma. Sein treuer Jagdhund ist immer dabei, der Bogen immer bereit. Er ist geduldig, beobachtet seine Beute und stellt im richtigen Moment die Falle.","Jagdnetz: das Netz fängt den Gegner, der sich eine Weile nicht bewegen kann."],
 abdullah:["Abdullah – aber alle nennen ihn Apo. Mevlüts Sohn, Affans Bruder. Der Charmeur der Familie – und der größte Lügner! Er lügt so gut, dass ihm jeder glaubt – aber fragt man ihn etwas, kommt immer: 'Hayır, yalan!' (Nein, gelogen!) Seine Katze Şirin ist immer dabei; wirkt seine Lüge, springt Şirin den Gegner an und kratzt.","Lügen-Attacke: der Gegner glaubt die Lüge, ist benommen – und links und rechts sind eine Weile vertauscht!"],
 yusuf:["Der Meisterbarbier von Çaycuma – Spezialfigur! Die Glatze glänzt, die Brille sitzt immer. Schere und Haarschneider hat er immer in der Hand; wer sich in seinen Stuhl setzt, steht mit Nullerschnitt auf.","Nullerschnitt: 5 schnelle Treffer mit der Schere. Beim Schlagen wirft er manchmal eine Rasierklinge (Permatik)!"],
 soner:["Der schnellste Taxifahrer von Çaycuma, Kennzeichen 67T3011. Schmächtig, aber sehr flink – eine Flasche hat er immer in der Hand. Einziges Problem: Steckt er zu viele Treffer ein, wird ihm schlecht und er übergibt sich – wer da reintritt, rutscht aus!","Taxi kommt: sein gelbes Taxi rast von hinten heran und schleudert den Gegner in die Luft. Statt zu treten wirft er Flaschen."],
 sinasi:["Der Schreibwarenhändler von Çaycuma, ein echter Gentleman. Schmächtig, lange weiße Haare; er wird nie laut und sagt vor jedem Treffer 'Verzeihung, mein Herr'. Doch alles aus seinem Laden wird in seiner Hand zur Waffe: Stifte, Lineal, Kleber...","Kleber-Falle: ein Strahl Kleber klebt den Gegner am Boden fest – er kann eine Weile weder laufen noch springen. Statt zu schlagen wirft er Stifte, statt zu treten haut er mit dem Lineal."],
 muaz:["Der kleine Panda der Familie: Muaz – erst 2½ Jahre alt! Klein, aber riesig stark, rundlich und mit großem Herz. Mit seiner Panda-Kapuze fühlt er sich wie ein echter Panda. Seine Umarmung ist so stark wie sein Schlag.","Panda-Rolle: rollt sich zusammen wie eine Kugel und rollt über den Gegner. Statt zu treten wirft er Teddybären! Mit wenig Leben wird er zur GOLDKRAFT."],
 selim:["Der Kung-Fu-Torjäger der Familie: Selim – erst 5 Jahre alt! Klein, aber sportlich, flink und stark. Die 10 auf dem Rücken, Kung-Fu-Band um die Stirn.","Mini-Armee: schickt seine Spielzeugsoldaten auf den Gegner! Mit dem fliegenden Kung-Fu-Tritt trifft er auch aus der Distanz. Mit wenig Leben wird er zur GOLDKRAFT."],
 buko:["Das Maskottchen von Buko Games, das magische Chamäleon Buko! Direkt aus den Spielen nach Çaycuma gekommen – der fantastischste Kämpfer von allen. Seine Farbe wechselt ständig, seine Zunge schnellt wie eine Peitsche, sein Schwanz schwingt wie eine Feder. Steht er still, tarnt er sich und wird fast unsichtbar.","Kopieren: kopiert sofort die Spezialkraft des Gegners und setzt sie gegen ihn ein – Musas Panda, das Gebet des Hoca, Soners Taxi… alles kann Buko!"],
 storm:["Der geheimnisvolle Bösewicht. Er kommt mit schwarzen Wolken und will Çaycuma in Dunkelheit stürzen. Endboss des Arcade-Modus – wer ihn besiegt, ist der wahre Champion.","Blitz: schleudert Blitze vom Himmel und trifft aus der Ferne."]},
en:{
 musa:["The hero of Çaycuma. Whenever someone is in trouble, he is the first to run in. With a big heart, big fists and his loyal panda, he protects the town square from Kara Fırtına.","The Panda Wave can't be blocked – and heals Musa by 15. Only the hero has this power!"],
 cevat:["The family's wise Hoca, respected by everyone. He looks calm, but when he starts to pray, golden light fills the square. Experience is his strongest weapon.","'Sübhanallah! Allahu Ekber!' – the orb of light leaves the rival dizzy for a long time, stars spinning around his head."],
 dursun:["Timur's grandfather, the family's giant grandpa. Don't be fooled by his age: when he hits the ground, all of Çaycuma shakes. Slow, but with the heaviest blows.","Grandpa Quake: sends rocks along the ground. Misses jumping rivals – but rocks anyone standing."],
 kemal:["Known as Kürt Kemal – Uncle Musa's father, the village's beloved elder. Always smiling, but strong as a mountain; once he gets going, nobody can stop him. In loving memory of Uncle Kemal. 🤲","Mountain Fist: charges at the rival like a storm, huge damage in one hit."],
 mevlut:["Father of Affan and Abdullah. Bald, but hard as iron – nobody escapes his headbutt. A calm man – but watch out when he gets angry!","Iron Head: leaps up and rams the rival head first."],
 timur:["The family's tech master. His flying robot Jarvis hovers beside him, neon lights glow on his arms. He uses brains instead of brawn – and has a power nobody else has.","Jarvis Time Stop: the rival freezes and turns blue while Timur blasts him with the laser. Only Timur has this power!"],

function sfx(type){
 if(!AC||MUTE)return;
 try{
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.connect(g);g.connect(AC.destination);
  if(type==='honk'){[0,.18].forEach(d=>{const o2=AC.createOscillator(),g2=AC.createGain();o2.type='square';o2.frequency.value=440;o2.connect(g2);g2.connect(AC.destination);g2.gain.setValueAtTime(.06,AC.currentTime+d);g2.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.15);o2.start(AC.currentTime+d);o2.stop(AC.currentTime+d+.16)});return}
  const s={hit:['square',200,60,.13,.25],block:['triangle',700,500,.07,.18],special:['sawtooth',250,900,.32,.15],ko:['sawtooth',160,35,.7,.25],whoosh:['sine',400,200,.06,.06]}[type];
  o.type=s[0];o.frequency.setValueAtTime(s[1],n);o.frequency.exponentialRampToValueAtTime(s[2],n+s[3]);
  g.gain.setValueAtTime(s[4]*0.45,n);g.gain.exponentialRampToValueAtTime(.001,n+s[3]);
  o.start(n);o.stop(n+s[3]+.02);
 }catch(e){}
}

 document.getElementById('sgo').onclick=()=>{PICK[0]='musa';PICK[1]=c.opp;DIFF=c.d;game.story={i};game.stage=c.st;card.classList.remove('wide');start(1)};
 document.getElementById('bk').onclick=storyMenu;overlay.scrollTop=0;
}
function storyEnd(){
 const t=T(),L=({tr:0,de:1,en:2})[LANG];card.classList.add('wide');overlay.classList.remove('hidden');document.body.classList.add('menu');window.setTrack&&window.setTrack(RAP,.15);
 card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,52px)">${t.theEnd}</h1><div class="hero"><img src="musa/kemal_win.webp" alt=""><img src="musa/musa_win.webp" alt=""><img src="musa/dursun_win.webp" alt=""></div><p class="sten">${STORY_END[L].replace(/\n/g,'<br>')}</p>
 <button class="big alt" id="r2">${t.menu}</button>`;
 document.getElementById('r2').onclick=()=>{card.classList.remove('wide');menu()};
}
function helpHTML(){const t=T(),touch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
 const row=(ic,tx)=>`<div class="hr"><span class="hi">${ic}</span><span>${tx}</span></div>`;
 const tch=`<h3>${t.hTouch}</h3>${row('🕹️',t.hJoy)}${row(ICO.punch,t.hPunch)}${row(ICO.kick,t.hKick)}${row(ICO.block,t.hBlock)}${row(ICO.special,t.hSp)}${row(ICO.joker,t.hJk)}`;
 const kb=`<h3>${t.hKeys}</h3><table class="kt"><tr><th></th><th>${t.p1k}</th><th>${t.p2k}</th></tr>
 <tr><td>${t.kMove}</td><td>A / D</td><td>← / →</td></tr><tr><td>${t.kJump}</td><td>W</td><td>↑</td></tr><tr><td>${t.kBlock}</td><td>S</td><td>↓</td></tr><tr><td>${t.kPunch}</td><td>F</td><td>K</td></tr><tr><td>${t.kKick}</td><td>G</td><td>L</td></tr><tr><td>${t.kSp}</td><td>H</td><td>J</td></tr><tr><td>${t.kJk}</td><td>R</td><td>U</td></tr></table><p class="hp">${t.kPause}</p>`;
 return `<div class="hlpb">${touch?tch+kb:kb+tch}<p class="hp">${t.hTips}</p></div>`}
function helpScreen(back){const t=T();card.classList.add('wide');overlay.classList.remove('hidden');
 card.innerHTML=`<h1 style="font-size:clamp(22px,min(6vw,8vh),40px);margin:0 0 6px">${t.helpT}</h1>${helpHTML()}<button class="big alt" id="hbk" style="padding:10px">${t.back}</button>`;
 document.getElementById('hbk').onclick=()=>{card.classList.remove('wide');back()};overlay.scrollTop=0}
function pauseGame(){if(!P.length||!['fight','intro','roundEnd'].includes(game.state)||game.paused)return;game.paused=true;keyIn=[mkIn(),mkIn()];touchIn=[mkIn(),mkIn()];bgm.volume=.04;showPause()}
function showPause(){const t=T();overlay.classList.remove('hidden');card.classList.remove('wide');
 card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,52px)">${t.pause}</h1><button class="big alt" id="pr">${t.resume}</button><button class="big" id="ph" style="background:linear-gradient(#3a6fd8,#1d3c7a)">${t.helpT}</button><button class="big" id="pq" style="background:#ffffff1a;box-shadow:none">${t.quit}</button>`;
 document.getElementById('pr').onclick=resumeGame;document.getElementById('ph').onclick=()=>helpScreen(showPause);document.getElementById('pq').onclick=()=>{game.paused=false;P=[];menu()}}
function resumeGame(){game.paused=false;overlay.classList.add('hidden');card.classList.remove('wide');bgm.volume=.1;last=performance.now();acc=0}
function mode1(){
 game.story=null;card.classList.remove('wide');const t=T();
 const sub=x=>`<br><small style="font-weight:600;font-size:13px">${x}</small>`;
 card.innerHTML=`<h1 style="font-size:clamp(26px,7vw,46px)">${t.p1}</h1><h2>${t.how}</h2>
 <button class="big" id="mst" style="background:linear-gradient(#d4a017,#7a5200);width:100%">${t.storyM}${sub(t.storys)}</button>
 <div id="ov2"><button class="big" id="ma" style="background:linear-gradient(#c0392b,#7a1d14)">${t.arc}${sub(t.arcs)}</button>
 <button class="big alt" id="mf">${t.free}${sub(t.frees)}</button>
 <button class="big" id="ms" style="background:linear-gradient(#8e44ad,#4a1d6e)">${t.surv}${sub(t.survs)}</button>
 <button class="big" id="mp" style="background:linear-gradient(#27ae60,#145a32)">${t.prac}${sub(t.pracs)}</button></div>
 <button class="big" style="background:#ffffff1a;box-shadow:none" id="bk">${t.back}</button>`;
 const others=k=>ROSTER.map(r=>r.kind).filter(x=>x!==k);
 document.getElementById('mst').onclick=()=>storyMenu();
 document.getElementById('mf').onclick=()=>pick(0,t.pickMe,k=>{PICK[0]=k;pick(1,t.pickOpp,k2=>{PICK[1]=k2;diff()},true,mode1)},false,mode1);
 document.getElementById('ma').onclick=()=>pick(0,'ARCADE – '+t.pickMe,k=>{PICK[0]=k;
  const boss=k==='storm'?'musa':'storm';const o=others(k).filter(x=>x!==boss).sort(()=>Math.random()-.5);
  game.arc={list:[...o,boss],i:0};PICK[1]=game.arc.list[0];diff()},false,mode1);
 document.getElementById('ms').onclick=()=>pick(0,t.surv+' – '+t.pickMe,k=>{PICK[0]=k;const o=others(k);
  game.surv={n:0,hp:null,pool:o};PICK[1]=o[Math.random()*o.length|0];diff()},false,mode1);
 document.getElementById('mp').onclick=()=>pick(0,t.prac+' – '+t.pickMe,k=>{PICK[0]=k;pick(1,t.pickOpp,k2=>{PICK[1]=k2;game.prac=true;stageSel(()=>start(1),mode1)},false,mode1)},false,mode1);
 document.getElementById('bk').onclick=menu;
}
function pick(slot,title,done,rnd,back){
 card.classList.add('wide');const t=T();if(!slot){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}voice('choose')}
 const st=r=>`<span class="st">⚡${Math.round(r.spd*10)} 💪${Math.round(r.pow*10)} ❤️${r.hp}</span>`;
 card.innerHTML=`<h1 style="font-size:clamp(24px,min(7vw,9vh),44px)">${title}</h1>${slot?`<div class="pk">${t.p1is}${RK(PICK[0]).name}</div>`:''}
 <div class="roster">${ROSTER.map(r=>`<button class="rc${slot&&r.kind===PICK[0]?' taken':''}${r.star?' star':''}" data-k="${r.kind}" style="border-color:${r.bar}55">${r.star?`<em class="stb">${t.special}</em>`:''}<img src="${skinImg(r.kind,'idle').src}" alt="" style="${skinImg(r.kind,'idle').st}${slot?'transform:scaleX(-1)':''}"><b style="color:${r.bar}">${r.name}</b><i>${r.tag} · ${r.sp}</i>${st(r)}</button>`).join('')}</div>
 ${rnd?`<button class="big alt" id="rnd" style="padding:10px">${t.rnd}</button>`:''}<button class="big" style="background:#ffffff1a;box-shadow:none;padding:10px" id="bk">${t.back}</button>`;
 card.querySelectorAll('.rc').forEach(b=>b.onclick=()=>{sfx('whoosh');done(b.dataset.k)});
 if(rnd)document.getElementById('rnd').onclick=()=>{const o=ROSTER.filter(r=>r.kind!==PICK[0]);done(o[Math.random()*o.length|0].kind)};
 document.getElementById('bk').onclick=()=>{card.classList.remove('wide');game.arc=game.surv=null;game.prac=false;(back||menu)()};
 overlay.scrollTop=0;
}
function ladder(){const a=game.arc;if(!a)return'';return `<div class="lad">${a.list.map((k,i)=>`<img src="musa/${k}_idle.webp" class="${i<a.i?'dn':i===a.i?'cu':''}" style="transform:scaleX(-1)" alt="">`).join('')}</div>`}
function vsScreen(cb){
 const a=RK(PICK[0]),b=RK(PICK[1]),ar=game.arc,t=T();
 const st=game.story?STORY[game.story.i].t[({tr:0,de:1,en:2})[LANG]]:ar?(ar.i===ar.list.length-1?t.vsBoss:t.vsArc(ar.i+1,ar.list.length)):game.surv?t.vsSurv(game.surv.n+1):game.prac?t.vsPrac:(game.mode===2?t.vs2:t.vsFree);
 const d=document.createElement('div');d.id='vsx';
 d.innerHTML=`<div class="st">${st}<br><small style="font-size:.6em;opacity:.8">📍 ${stName(game.stage)}</small></div><div class="sd l"><img src="musa/${a.kind}_win.webp" alt=""><b style="color:${a.bar}">${a.name}</b><i>${a.tag}</i></div><div class="v">VS</div><div class="sd r"><img src="musa/${b.kind}_idle.webp" style="transform:scaleX(-1)" alt=""><b style="color:${b.bar}">${b.name}</b><i>${b.tag}</i></div>`;
 document.body.appendChild(d);sfx('special');
 let done=false;const go=()=>{if(done)return;done=true;d.remove();cb()};
 d.onclick=go;setTimeout(go,2600);
}
function stageSel(go,back){
 const t=T();card.classList.add('wide');
 card.innerHTML=`<h1 style="font-size:clamp(22px,min(6vw,8vh),40px);margin:0 0 6px">${t.stage}</h1>
 <div class="stg">${STK.map(k=>`<button class="sg${k===game.stage?' on':''}${k==='fightclub'?' fc':''}" data-s="${k}"><img src="musa/${STG[k].bg}_t.jpg" alt="" loading="lazy"><b>${stName(k)}</b></button>`).join('')}</div>
 <button class="big alt" id="srnd" style="padding:10px">${t.rndStage}</button><button class="big" style="background:#ffffff1a;box-shadow:none;padding:10px" id="bk">${t.back}</button>`;
 card.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{game.stage=b.dataset.s;sfx('whoosh');card.classList.remove('wide');go()});
 document.getElementById('srnd').onclick=()=>{game.stage=STK[Math.random()*STK.length|0];card.classList.remove('wide');go()};
 document.getElementById('bk').onclick=()=>{card.classList.remove('wide');(back||menu)()};
 overlay.scrollTop=0;
}
function diff(){
 card.classList.remove('wide');const t=T();
 const h=game.arc?RK(PICK[0]).name+' – '+t.ladderTxt(game.arc.list.length):game.surv?RK(PICK[0]).name+' – '+t.survs:RK(PICK[0]).name+' vs '+RK(PICK[1]).name;
 card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,48px)">${t.diff}</h1><h2>${h} – ${t.diffQ}</h2>${ladder()}
  <div id="ov2"><button class="big" data-d="kolay">${t.easy}</button><button class="big alt" data-d="orta">${t.mid}</button></div><button class="big" data-d="zor" style="background:linear-gradient(#c0392b,#7a1d14)">${t.hard}</button><button class="big" style="background:#ffffff1a;box-shadow:none" id="bk">${t.back}</button>`;
 card.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{DIFF=b.dataset.d;if(game.arc||game.surv)start(1);else stageSel(()=>start(1),diff)});document.getElementById('bk').onclick=mode1;
}
function start(mode){card.classList.remove('wide');goLandscape();
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
 if(mode===2){game.arc=game.surv=null;game.prac=false}
 if(game.story){}else if(game.arc)game.stage=game.arc.i===game.arc.list.length-1?'fightclub':ARC_ST[game.arc.i%ARC_ST.length];else if(game.surv)game.stage=STK[Math.random()*STK.length|0];
 bgI(STG[game.stage].bg);
 game.mode=mode;game.need=game.surv?1:2;game.round=1;P=[];overlay.classList.add('hidden');document.body.classList.remove('menu');window.setTrack(RAP,.1);
 game.state='vs';vsScreen(()=>{buildControls();startRound();layout()});
}
function matchEnd(){
 game.state='over';const t=T();
 const w=P[0].wins>=game.need?P[0]:P[1],won=w===P[0];
 const ar=game.arc,sv=game.surv,last=ar&&ar.i===ar.list.length-1,arcNext=ar&&won&&!last;
 recMatch(w,won);if(ar&&won&&last)stAdd('arc');if(sv&&won)stMax('survMax',sv.n+1);if(game.story&&won&&game.story.i===STORY.length-1)stAdd('story');
 let btn1=`<button class="big alt" id="r1">${t.again}</button>`,msg,extra='';
 if(game.story){const si=game.story.i,last=si===STORY.length-1;
  if(won){try{localStorage.setItem('musaStory',Math.max(storyProg(),si+1))}catch(e){}}
  if(won&&last){voice('win');storyEnd();return}
  overlay.classList.remove('hidden');document.body.classList.add('menu');window.setTrack&&window.setTrack(RAP,.15);if(won)voice('win');
  card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,54px)">${w.look.name}<br>${t.won}</h1><img src="musa/${w.look.kind}_win.webp" style="height:min(28vh,190px);filter:drop-shadow(0 8px 16px #000a)" alt="">
  <button class="big alt" id="r1">${won?t.stCont:t.retry}</button><button class="big" id="r2">${t.chapters}</button>`;
  document.getElementById('r1').onclick=()=>{P=[];won?storyCard(si+1):storyCard(si)};
  document.getElementById('r2').onclick=()=>{P=[];storyMenu()};return}
 if(ar){
  msg=won?(last?t.arcDone(P[0].look.name):t.arcWin):t.arcLose(w.look.name);
  {const li=ar.i;if(won)ar.i++;extra=ladder();ar.i=li}
  btn1=`<button class="big alt" id="r1">${arcNext?t.next+RK(ar.list[ar.i+1]).name:won?t.arcAgain:t.cont}</button>`;
  if(won&&last){ar.i=-1;const boss=PICK[0]==='storm'?'musa':'storm';ar.list=ar.list.filter(x=>x!==boss).sort(()=>Math.random()-.5).concat(boss)}
 }else if(sv){
  if(won){sv.n++;sv.hp=Math.min(P[0].maxhp,P[0].hp+P[0].maxhp*.3);msg=t.survWin+' ('+sv.n+')';btn1=`<button class="big alt" id="r1">${t.survNext}</button>`}
  else{let best=0;try{best=Math.max(sv.n,+localStorage.getItem('musaSurv')||0);localStorage.setItem('musaSurv',best)}catch(e){}
   msg=t.survEnd(sv.n)+' · '+t.survBest(best);btn1=`<button class="big alt" id="r1">${t.again}</button>`}
 }else msg=game.mode===1?(won?t.champ1(w.look.name):t.lose1(w.look.name)):t.champ2(w.look.name);
 if(won||game.mode===2)voice('win');
 overlay.classList.remove('hidden');document.body.classList.add('menu');
 card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,54px)">${w.look.name}<br>${t.won}</h1><h2>${msg}</h2>${extra}
 <img src="musa/${w.look.kind}_win.webp" style="height:min(28vh,190px);filter:drop-shadow(0 8px 16px #000a)" alt="">${btn1}<button class="big" id="r2">${t.menu}</button><a class="big" style="text-decoration:none;background:#ffffff1a;box-shadow:none" href="index.html">🏠 BUKO GAMES</a>`;
 document.getElementById('r1').onclick=()=>{P=[];
  if(arcNext){ar.i++;PICK[1]=ar.list[ar.i]}else if(ar&&won&&last){ar.i=0;PICK[1]=ar.list[0]}
  else if(sv){if(!won){sv.n=0;sv.hp=null}const o=sv.pool.filter(x=>x!==PICK[1]);PICK[1]=o[Math.random()*o.length|0]}
  start(game.mode)};
 document.getElementById('r2').onclick=()=>{P=[];menu()};
}

let MUSIC_OFF=false;try{MUSIC_OFF=localStorage.getItem('musaMusicOff')==='1'}catch(e){}
const snd=document.getElementById('snd'),mus=document.getElementById('mus');const si=()=>{snd.textContent=MUTE?'🔇':'🔊';mus.classList.toggle('off',MUSIC_OFF)};si();
const bgm=document.getElementById('bgm');bgm.volume=0.12;
window.musaMusic=()=>{if(MUSIC_OFF){bgm.pause();return}const pr=bgm.play();pr&&pr.catch(()=>{})};
const RAPS=['rap1.mp3','rap2.mp3'];let rapI=Math.random()*RAPS.length|0;let RAP=RAPS[rapI],userTap=false;
bgm.loop=false;bgm.addEventListener('ended',()=>{rapI=(rapI+1)%RAPS.length;RAP=RAPS[rapI];bgm.src='musa/'+RAP;window.musaMusic()});
window.setTrack=(f,vol)=>{if(!/rap\d\.mp3$/.test(bgm.src)){bgm.src='musa/'+RAP}bgm.volume=vol;if(userTap)window.musaMusic()};
addEventListener('pointerdown',()=>{if(userTap)return;userTap=true;if(game.state==='menu'||game.state==='over')window.setTrack(RAP,.15);window.musaMusic()},{once:true});
snd.onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('musaMute',MUTE?'1':'0')}catch(e){}si()};
document.getElementById('pse').onclick=()=>game.paused?resumeGame():pauseGame();
document.getElementById('hlp').onclick=()=>{if(P.length&&['fight','intro','roundEnd'].includes(game.state)){pauseGame();helpScreen(showPause)}else helpScreen(menu)};
addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape'){game.paused?resumeGame():pauseGame()}});
addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
mus.onclick=()=>{MUSIC_OFF=!MUSIC_OFF;try{localStorage.setItem('musaMusicOff',MUSIC_OFF?'1':'0')}catch(e){}si();window.musaMusic()};
menu();layout();requestAnimationFrame(loop);
})();
</script>
