<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#070b18;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.land #stage{border-radius:0;box-shadow:none}
body.land #controls{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none;width:auto!important}
body.land .pad{pointer-events:auto}
body.land .btn{background:#ffffff22;backdrop-filter:blur(2px)}
body.land .btn.atk{background:#ff8a2a44}body.land .btn.sp{background:#3aa0ff44}

body.land #tb{top:auto;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom))}

.btn.on{background:#ff8a2a;transform:scale(.94)}
.btn.atk{background:#ff8a2a55}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#070b18aa,#070b18f0),url(musa/bg_meydan.jpg) center/cover;z-index:10;padding:20px;overflow:auto;align-items:safe center}
@media (max-height:520px){.hero img{height:24vh!important}.help{display:none}.card h2{margin:2px 0 8px!important}.big{padding:10px!important;margin:6px 0!important}.card{max-width:640px}#ov2{display:grid;grid-template-columns:1fr 1fr;gap:8px}}

#tb a,#tb button{width:40px;height:40px;border-radius:50%;border:none;background:#0008;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 0 0 2px #ffffff30;cursor:pointer}
</style>

<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls"></div>
  <div id="rot">📱↻ Telefonu yan çevir – oyun daha büyük olur</div>
</div>
<div id="tb"><a href="index.html" title="Buko Games">🏠</a><button id="snd" title="Ses">🔊</button></div>
<audio id="bgm" src="musa/musa-music.mp3" loop preload="auto"></audio>
<div id="overlay">
  <div class="card" id="card"></div>
</div>
<script>
(()=>{
window.__dbg=()=>({game,P});
const W=960,H=540,GROUND=470;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingQuality='high';
const stage=document.getElementById('stage'),controls=document.getElementById('controls');
const overlay=document.getElementById('overlay'),card=document.getElementById('card');

const LOOKS={
 musa:{name:'MUSA',skin:'#e2b48c',skinD:'#c99570',hair:'#2a1a12',beard:'#2f1d14',top:'#1b2b55',trim:'#e8f4ff',emblem:'#ff8a2a',pants:'#141922',shoe:'#0a0a0a',wide:1.3,kind:'musa',sp:'PANDA DALGASI',bar:'#3aa0ff'},
 storm:{name:'KARA FIRTINA',skin:'#d39c72',skinD:'#b07c55',hair:'#9aa0a8',beard:'#8d939b',top:'#3a2d4d',trim:'#d9d2e6',emblem:'#ffd84a',pants:'#22202a',shoe:'#111',wide:1.0,kind:'storm',sp:'ŞİMŞEK',bar:'#ffd84a'}
};
const ATK={
 punch:{start:5,active:5,rec:9,range:150,dmg:6,push:4},
 kick:{start:9,active:6,rec:14,range:170,dmg:10,push:7},
 special:{start:12,active:0,rec:16}
};
const mkIn=()=>({left:0,right:0,up:0,punch:0,kick:0,block:0,special:0});
let inputs=[mkIn(),mkIn()],prev=[mkIn(),mkIn()],keyIn=[mkIn(),mkIn()],touchIn=[mkIn(),mkIn()];
let P=[],proj=[],parts=[],shake=0,time=0;
let game={mode:1,state:'menu',round:1,timer:0,msg:'',msgT:0};
let ai={t:0,hold:mkIn()};
let freeze=0,slow=0,texts=[],banner=null,DIFF='orta';
const DIFFS={kolay:{t:1.7,blk:0.15,sp:0.3},orta:{t:1,blk:0.4,sp:0.7},zor:{t:0.55,blk:0.65,sp:0.9}};
function pop(x,y,txt,c,big){texts.push({x,y,txt,c,life:45,big})}

/* ---------- Sound ---------- */
let AC=null,MUTE=false;try{MUTE=localStorage.getItem('musaMute')==='1'}catch(e){}
function sfx(type){
 if(!AC||MUTE)return;
 try{
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.connect(g);g.connect(AC.destination);
  const s={hit:['square',200,60,.13,.25],block:['triangle',700,500,.07,.18],special:['sawtooth',250,900,.32,.15],ko:['sawtooth',160,35,.7,.25],whoosh:['sine',400,200,.06,.06]}[type];
  o.type=s[0];o.frequency.setValueAtTime(s[1],n);o.frequency.exponentialRampToValueAtTime(s[2],n+s[3]);
  g.gain.setValueAtTime(s[4]*0.45,n);g.gain.exponentialRampToValueAtTime(.001,n+s[3]);
  o.start(n);o.stop(n+s[3]+.02);
 }catch(e){}
}

/* ---------- Fighters ---------- */
function newFighter(look,x,facing){return{look,x,y:GROUND,vx:0,vy:0,facing,hp:100,meter:0,state:'idle',t:0,atk:null,atkT:0,hitDone:false,stun:0,walk:0,wins:0,flash:0,ghost:100,ghostT:0,combo:0,comboT:0}}

function startAtk(f,type){f.atk=type;f.atkT=0;f.hitDone=false;f.state=type;if(type!=='special')sfx('whoosh')}

function damage(o,d,dir,push,att){
 if(o.state==='ko'||game.state!=='fight')return;
 const blocked=o.state==='block';
 if(blocked){
  o.hp-=d*0.2;o.ghostT=30;o.x+=dir*push;pop(o.x,o.y-280,'BLOK','#9fd8ff');spark(o.x-dir*20,o.y-120,'#9fd8ff',8);sfx('block');o.meter=Math.min(100,o.meter+3);
 }else{
  const chain=o.stun>0||o.state==='hit';att.combo=chain?att.combo+1:1;att.comboT=70;if(att.combo>=2)pop(att.x,att.y-310,att.combo+' KOMBO!','#ffcc33',true);
  o.hp-=d;o.ghostT=30;pop(o.x+(Math.random()-.5)*30,o.y-280,'-'+Math.round(d),'#ff6a4a');freeze=d>=10?6:4;o.state='hit';o.stun=14;o.vx=dir*push;o.atk=null;o.flash=8;
  att.meter=Math.min(100,att.meter+9);o.meter=Math.min(100,o.meter+5);
  spark(o.x-dir*30,o.y-180,'#fff3a0',14);shake=7;sfx('hit');
 }
 if(o.hp<=0){o.hp=0;o.state='ko';o.t=0;o.vy=-9;o.vx=dir*6;sfx('ko');shake=14;freeze=18;slow=70;banner={txt:'K.O.!',t:80,c:'#ff4a4a'};endRound(att)}
}

function update(f,inp,pin,o){
 const onG=f.y>=GROUND;
 if(f.flash>0)f.flash--;
 if(f.state==='ko'||f.state==='win'){f.t++;phys(f,true);return}
 if(game.state!=='fight'){f.vx=0;f.state=onG?'idle':'jump';phys(f);return}
 if(f.stun>0){f.stun--;phys(f,true);if(!f.stun)f.state='idle';return}
 if(f.atk){
  const a=ATK[f.atk];f.atkT++;
  if(f.atk!=='special'&&!f.hitDone&&f.atkT>a.start&&f.atkT<=a.start+a.active){
   const dx=(o.x-f.x)*f.facing,dy=Math.abs(o.y-f.y);
   if(dx>0&&dx<a.range&&dy<115){f.hitDone=true;damage(o,a.dmg,f.facing,a.push,f);spark(f.x+f.facing*a.range*.8,f.y-(f.atk==='kick'?170:185),'#fff3a0',10)}
  }
  if(f.atk==='special'&&f.atkT===a.start)fire(f);
  if(f.atkT>=a.start+a.active+a.rec){f.atk=null;f.state='idle'}
  if(onG)f.vx=0;
  phys(f);return;
 }
 f.facing=o.x>f.x?1:-1;
 if(inp.block&&onG){f.state='block';f.vx=0}
 else{
  const mv=(inp.right?1:0)-(inp.left?1:0);
  if(onG)f.vx=mv*4.8;
  if(inp.up&&!pin.up&&onG){f.vy=-17.5}
  if(inp.punch&&!pin.punch){startAtk(f,'punch')}
  else if(inp.kick&&!pin.kick){startAtk(f,'kick')}
  else if(inp.special&&!pin.special&&f.meter>=100&&onG){f.meter=0;startAtk(f,'special');sfx('special');banner={txt:f.look.sp+'!',t:55,c:f.look.bar}}
  if(!f.atk)f.state=!onG?'jump':(mv?'walk':'idle');
  if(f.state==='walk')f.walk+=0.28;
 }
 phys(f);
}
function phys(f,fric){
 f.x+=f.vx;if(fric)f.vx*=0.86;
 f.vy+=0.9;f.y+=f.vy;
 if(f.y>=GROUND){f.y=GROUND;f.vy=0;if(f.state==='ko')f.vx*=0.8}
 f.x=Math.max(85,Math.min(W-85,f.x));
}
function fire(f){
 proj.push({x:f.x+f.facing*110,y:f.y-150,vx:f.facing*9,owner:f,kind:f.look.kind,t:0});
}
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:20+Math.random()*12,c})}}

/* ---------- AI ---------- */
function runAI(){
 const me=P[1],you=P[0];
 const h=ai.hold;h.punch=h.kick=h.special=0;h.up=0;
 if(--ai.t>0)return;
 Object.assign(h,mkIn());
 const d=Math.abs(you.x-me.x),dir=Math.sign(you.x-me.x)||1,r=Math.random();
 const incoming=proj.some(p=>p.owner!==me&&Math.sign(me.x-p.x)===Math.sign(p.vx)&&Math.abs(me.x-p.x)<280);
 const D=DIFFS[DIFF];
 if(incoming&&Math.random()<D.blk+0.25){if(r<0.55)h.up=1;else h.block=1;ai.t=22;return}
 if(you.atk&&d<140&&r<D.blk){h.block=1;ai.t=18;return}
 if(me.meter>=100&&d>200&&r<D.sp){h.special=1;ai.t=24;return}
 if(d>105){if(dir>0)h.right=1;else h.left=1;if(r<0.06)h.up=1;ai.t=(8+Math.random()*10)*D.t;return}
 if(r<0.42)h.punch=1;else if(r<0.72)h.kick=1;else if(r<0.84){if(dir>0)h.left=1;else h.right=1}else h.block=1;
 ai.t=(14+Math.random()*14)*D.t;
}

/* ---------- Rounds ---------- */
function startRound(){
 const w=[P[0]?P[0].wins:0,P[1]?P[1].wins:0];
 P=[newFighter(LOOKS.musa,240,1),newFighter(LOOKS.storm,720,-1)];
 P[0].wins=w[0];P[1].wins=w[1];
 proj=[];parts=[];texts=[];banner=null;freeze=slow=0;game.timer=60*60;game.state='intro';game.msg='RAUND '+game.round;game.arena=arena().name;game.msgT=110;
}
function endRound(winner){
 if(game.state!=='fight')return;
 game.state='roundEnd';game.msgT=170;
 if(winner){winner.wins++;game.msg=winner.look.name+' KAZANDI!';if(winner.state!=='ko'){winner.state='win';winner.atk=null}}
 else game.msg='BERABERE!';
}
function step(){
 time++;
 if(banner&&--banner.t<=0)banner=null;
 for(const x of texts){x.y-=1.1;x.life--}texts=texts.filter(x=>x.life>0);
 if(freeze>0){freeze--;return}
 if(slow>0){slow--;if(slow%2)return}
 for(const f of P){if(f.ghostT>0)f.ghostT--;else if(f.ghost>f.hp)f.ghost=Math.max(f.hp,f.ghost-0.7);if(f.comboT>0&&--f.comboT===0)f.combo=0}
 // inputs
 for(let i=0;i<2;i++){const k=keyIn[i],t=touchIn[i],o={};for(const n in k)o[n]=k[n]||t[n];inputs[i]=o}
 if(game.mode===1){
  // 1P: P2 keys also control P1
  for(const n in inputs[0])inputs[0][n]=inputs[0][n]||inputs[1][n];
  runAI();inputs[1]={...ai.hold};
 }
 if(game.state==='intro'){game.msgT--;if(game.msgT===35)game.msg='DÖVÜŞ!';if(game.msgT<=0)game.state='fight'}
 if(game.state==='fight'){
  game.timer--;
  if(game.timer<=0){game.timer=0;const w=P[0].hp===P[1].hp?null:(P[0].hp>P[1].hp?P[0]:P[1]);endRound(w)}
 }
 if(game.state==='roundEnd'){
  game.msgT--;
  if(game.msgT<=0){
   if(P[0].wins>=2||P[1].wins>=2){matchEnd();return}
   game.round++;startRound();
  }
 }
 update(P[0],inputs[0],prev[0],P[1]);
 update(P[1],inputs[1],prev[1],P[0]);
 // separation
 const a=P[0],b=P[1],dx=b.x-a.x;
 if(Math.abs(dx)<110&&Math.abs(a.y-b.y)<100&&a.state!=='ko'&&b.state!=='ko'){
  const push=(110-Math.abs(dx))/2*(Math.sign(dx)||1);a.x-=push;b.x+=push;
  a.x=Math.max(85,Math.min(W-85,a.x));b.x=Math.max(85,Math.min(W-85,b.x));
 }
 // projectiles
 for(const p of proj){
  p.x+=p.vx;p.t++;
  const o=p.owner===P[0]?P[1]:P[0];
  if(!p.dead&&Math.abs(p.x-o.x)<60&&o.y>GROUND-80&&o.state!=='ko'){p.dead=1;damage(o,18,Math.sign(p.vx),11,p.owner);spark(p.x,p.y,p.kind==='musa'?'#7fd0ff':'#ffe066',22)}
  if(p.x<-80||p.x>W+80)p.dead=1;
 }
 for(let i=0;i<proj.length;i++)for(let j=i+1;j<proj.length;j++){
  const p=proj[i],q=proj[j];if(p.owner!==q.owner&&Math.abs(p.x-q.x)<40){p.dead=q.dead=1;spark((p.x+q.x)/2,p.y,'#fff',26);sfx('block');shake=6}
 }
 proj=proj.filter(p=>!p.dead);
 for(const s of parts){s.x+=s.vx;s.y+=s.vy;s.vy+=0.25;s.life--}
 parts=parts.filter(s=>s.life>0);
 if(shake>0)shake*=0.85;if(shake<0.3)shake=0;
 prev=[{...inputs[0]},{...inputs[1]}];
}

/* ---------- Drawing ---------- */
function limb(a,b,c,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke()}
function circ(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}

function prog(f){
 if(!f.atk)return 0;const a=ATK[f.atk],t=f.atkT;
 if(t<=a.start)return t/a.start;if(t<=a.start+a.active)return 1;return Math.max(0,1-(t-a.start-a.active)/a.rec);
}

const META={"musa": {"idle": {"w": 266, "h": 342, "ax": 115.0}, "walk": {"w": 251, "h": 345, "ax": 116.0}, "punch": {"w": 332, "h": 339, "ax": 141.0}, "kick": {"w": 311, "h": 343, "ax": 132.0}, "block": {"w": 231, "h": 342, "ax": 107.0}, "hit": {"w": 290, "h": 342, "ax": 124.0}, "special": {"w": 374, "h": 345, "ax": 158.0}, "win": {"w": 230, "h": 380, "ax": 94.0}, "head": [88, 0, 88, 88]}, "storm": {"idle": {"w": 247, "h": 360, "ax": 104.0}, "walk": {"w": 217, "h": 373, "ax": 97.0}, "punch": {"w": 305, "h": 365, "ax": 108.0}, "kick": {"w": 306, "h": 357, "ax": 128.0}, "block": {"w": 204, "h": 361, "ax": 87.0}, "hit": {"w": 212, "h": 357, "ax": 99.0}, "special": {"w": 323, "h": 360, "ax": 90.0}, "win": {"w": 141, "h": 379, "ax": 74.0}, "head": [109, 0, 93, 93]}, "fx": {"panda": {"w": 308, "h": 244, "ax": 158.5}, "wave": {"w": 253, "h": 259, "ax": 59.0}, "bolt": {"w": 285, "h": 124, "ax": 150.0}, "cloud": {"w": 212, "h": 177, "ax": 106.0}}};
const IMG={};const BGS=['bg_meydan','bg_filyos','bg_meydan2'];
function li(n,src){const i=new Image();i.decoding='async';i.src='musa/'+src;IMG[n]=i;return i}
for(const ch of ['musa','storm'])for(const p of ['idle','walk','punch','kick','block','hit','special','win'])li(ch+'_'+p,ch+'_'+p+'.webp');
for(const f of ['panda','wave','bolt','cloud'])li('fx_'+f,'fx_'+f+'.webp');
for(const b of BGS)li(b,b+'.jpg');
const ok=i=>i&&i.complete&&i.naturalWidth>0;
const K=0.74;
const ARENAS=[{bg:'bg_meydan',name:'ÇAYCUMA · CUMHURİYET MEYDANI'},{bg:'bg_filyos',name:'FİLYOS SAHİLİ · ÇAYCUMA'},{bg:'bg_meydan2',name:'ÇAYCUMA · AKŞAM ÜSTÜ'}];
const arena=()=>ARENAS[(game.round-1)%3];
function bg(){
 const im=IMG[arena().bg];
 if(ok(im)){const s=Math.max(W/im.naturalWidth,H/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;ctx.drawImage(im,(W-w)/2,(H-h),w,h)}
 else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f4b56a');g.addColorStop(1,'#5a4a46');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 // floating dust / light motes
 ctx.fillStyle='#fff6d0';for(let i=0;i<18;i++){const x=(i*173+time*.3*(1+i%3))%W,y=120+((i*97)%300)+Math.sin(time*.02+i)*8;ctx.globalAlpha=.15+.15*Math.sin(time*.05+i);ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
 const v=ctx.createRadialGradient(W/2,H*.55,H*.35,W/2,H*.55,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function poseOf(f){
 const st=f.state,p=prog(f);
 if(st==='ko')return 'hit';
 if(st==='win')return 'win';
 if(st==='hit')return 'hit';
 if(st==='block')return 'block';
 if(f.atk==='punch')return p>.3?'punch':'idle';
 if(f.atk==='kick')return p>.3?'kick':'walk';
 if(f.atk==='special')return p>.25?'special':'block';
 if(st==='walk')return (Math.floor(f.walk/1.6)%2)?'walk':'idle';
 if(st==='jump')return 'walk';
 return 'idle';
}
function drawFighter(f){
 const ch=f.look.kind,pose=poseOf(f),im=IMG[ch+'_'+pose],m=META[ch][pose];
 const air=GROUND-f.y;
 ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(f.x,GROUND+3,72*(1-Math.min(.6,air/300)),12*(1-Math.min(.6,air/300)),0,0,7);ctx.fill();
 // companion
 if(f.state!=='ko'){
  const ci=IMG[ch==='musa'?'fx_panda':'fx_cloud'],full=f.meter>=100,cw=full?84:68,bob=Math.sin(time*.07+(ch==='musa'?0:2))*7;
  if(ok(ci)){ctx.save();ctx.translate(f.x-f.facing*70,f.y-255+bob);ctx.scale(f.facing,1);
   if(full){ctx.globalAlpha=.35+.25*Math.sin(time*.2);ctx.fillStyle=f.look.bar;ctx.beginPath();ctx.arc(0,0,cw*.75,0,7);ctx.fill();ctx.globalAlpha=1}
   ctx.drawImage(ci,-cw/2,-cw*ci.naturalHeight/ci.naturalWidth/2,cw,cw*ci.naturalHeight/ci.naturalWidth);ctx.restore()}
 }
 if(!ok(im))return;
 ctx.save();ctx.translate(f.x,f.y);
 if(f.state==='ko'){const r=Math.min(1.5,f.t*.09);ctx.translate(0,-6);ctx.rotate(-f.facing*r)}
 ctx.scale(f.facing,1);
 if(f.state==='hit')ctx.translate(-6,0);
 const br=(pose==='idle'&&f.state==='idle')?1+Math.sin(time*.12)*.012:1;
 const w=m.w*K,h=m.h*K;
 ctx.scale(1,br);
 if(f.y<GROUND&&f.state!=='ko')ctx.rotate(-.08);
 ctx.drawImage(im,-m.ax*K,-h,w,h);
 if(f.flash&&f.flash%2){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.55;ctx.drawImage(im,-m.ax*K,-h,w,h);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
 ctx.restore();
}
function drawProj(p){
 const im=IMG[p.kind==='musa'?'fx_wave':'fx_bolt'];if(!ok(im))return;
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(Math.sign(p.vx)*(p.kind==='storm'?-1:1),1);
 const w=p.kind==='musa'?120:170,h=w*im.naturalHeight/im.naturalWidth;
 ctx.shadowColor=p.kind==='musa'?'#7fd0ff':'#ffe066';ctx.shadowBlur=24;
 if(p.kind==='storm')ctx.translate(0,(Math.random()-.5)*6);
 ctx.drawImage(im,-w/2,-h/2,w,h);
 if(p.kind==='musa'){const pi=IMG.fx_panda;if(ok(pi))ctx.drawImage(pi,-14,-22,46,46*pi.naturalHeight/pi.naturalWidth)}
 ctx.restore();
}
function face(ch,x,y,r,flip){
 const im=IMG[ch+'_idle'],hd=META[ch].head;
 ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=ch==='musa'?'#1b2b55':'#3a2d4d';ctx.fill();ctx.clip();
 if(ok(im)){ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(im,hd[0],hd[1],hd[2],hd[3],-r*1.1,-r*1.0,r*2.2,r*2.2)}
 ctx.restore();ctx.lineWidth=3;ctx.strokeStyle=ch==='musa'?'#ff8a2a':'#ffd84a';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function hud(){
 const bw=330;
 for(let i=0;i<2;i++){
  const f=P[i],x=i?W-96-bw:96,L=f.look;face(L.kind,i?W-50:50,52,36,i===1);
  rr(x-3,23,bw+6,30,8,'#0009');
  const gW=bw*f.ghost/100;ctx.fillStyle='#ff3b3b';if(i)ctx.fillRect(x+bw-gW,26,gW,24);else ctx.fillRect(x,26,gW,24);
  const hpW=bw*f.hp/100;
  ctx.fillStyle=f.hp>30?'#46d36b':'#ff4a4a';
  if(i)ctx.fillRect(x+bw-hpW,26,hpW,24);else ctx.fillRect(x,26,hpW,24);
  ctx.fillStyle='#fff';ctx.font='800 18px system-ui';ctx.textAlign=i?'right':'left';
  ctx.fillText(L.name,i?x+bw:x,78);
  // wins
  for(let k=0;k<2;k++){circ(i?x+bw-150-k*20:x+150+k*20,72,7,k<f.wins?'#ffcc33':'#ffffff33')}
  // meter
  rr(x-2,88,bw*0.6+4,14,6,'#0009');
  const mx=i?x+bw-bw*0.6:x,mw=bw*0.6*f.meter/100;
  ctx.fillStyle=f.meter>=100&&time%20<10?'#fff':L.bar;
  if(i)ctx.fillRect(mx+bw*0.6-mw,90,mw,10);else ctx.fillRect(mx,90,mw,10);
  if(f.meter>=100){ctx.font='800 12px system-ui';ctx.fillStyle=L.bar;ctx.fillText(L.sp+' HAZIR!',i?x+bw:x,120)}
 }
 for(const x of texts){ctx.globalAlpha=Math.min(1,x.life/20);ctx.font=(x.big?'900 30px':'900 24px')+' system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000a';ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.c;ctx.fillText(x.txt,x.x,x.y)}ctx.globalAlpha=1;
 if(banner){const k=banner.t;ctx.fillStyle='rgba(255,255,255,'+Math.max(0,(k-45)/30)+')';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2+60);const sc=1+Math.max(0,(k-40)/40);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,k/15);
  ctx.fillStyle='#000a';ctx.fillRect(-W,-38,W*2,60);ctx.font='900 46px system-ui';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(banner.txt,0,8);ctx.fillStyle=banner.c;ctx.fillText(banner.txt,0,8);ctx.restore();ctx.globalAlpha=1}
 rr(W/2-38,18,76,46,10,'#000a');
 ctx.fillStyle=game.timer<600?'#ff6a6a':'#fff';ctx.font='900 32px system-ui';ctx.textAlign='center';
 ctx.fillText(Math.ceil(game.timer/60),W/2,53);
 if(game.state==='intro'||game.state==='roundEnd'){
  const s=game.state==='intro'&&game.msg==='DÖVÜŞ!'?1.2:1;
  ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(s,s);
  ctx.font='900 64px system-ui';ctx.lineWidth=10;ctx.strokeStyle='#7a2f00';ctx.strokeText(game.msg,0,0);
  ctx.fillStyle='#ffb347';ctx.fillText(game.msg,0,0);
  if(game.state==='intro'){ctx.font='800 20px system-ui';ctx.lineWidth=5;ctx.strokeText(game.arena,0,40);ctx.fillStyle='#fff';ctx.fillText(game.arena,0,40)}ctx.restore();
 }
}

function draw(){
 ctx.save();
 if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 bg();
 if(P.length){
  const order=P[0].atk?[1,0]:[0,1];
  for(const i of order)drawFighter(P[i]);
  for(const p of proj)drawProj(p);
  for(const s of parts){ctx.globalAlpha=Math.min(1,s.life/15);circ(s.x,s.y,3,s.c)}
  ctx.globalAlpha=1;
 }
 ctx.restore();
 if(P.length&&game.state!=='menu')hud();
}

/* ---------- Loop ---------- */
let last=performance.now(),acc=0;
function loop(now){
 acc+=Math.min(100,now-last);last=now;
 while(acc>=1000/60){if(game.state!=='menu'&&game.state!=='over')step();else time++;acc-=1000/60}
 draw();requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
const KEYS={KeyA:[0,'left'],KeyD:[0,'right'],KeyW:[0,'up'],KeyS:[0,'block'],KeyF:[0,'punch'],KeyG:[0,'kick'],KeyH:[0,'special'],
 ArrowLeft:[1,'left'],ArrowRight:[1,'right'],ArrowUp:[1,'up'],ArrowDown:[1,'block'],KeyK:[1,'punch'],KeyL:[1,'kick'],Semicolon:[1,'special'],KeyJ:[1,'special']};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(k){keyIn[k[0]][k[1]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){keyIn[k[0]][k[1]]=0}});
addEventListener('blur',()=>{keyIn=[mkIn(),mkIn()];touchIn=[mkIn(),mkIn()]});

function btn(p,k,label,cls,sub){
 const b=document.createElement('button');b.className='btn '+(cls||'');b.innerHTML=label+(sub?'<small>'+sub+'</small>':'');
 const on=e=>{e.preventDefault();touchIn[p][k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){} };
 const off=e=>{touchIn[p][k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
 b.addEventListener('contextmenu',e=>e.preventDefault());
 return b;
}
let BS=56;
function buildControls(){
 controls.innerHTML='';
 const mk=(cols)=>{const d=document.createElement('div');d.className='pad';d.style.gridTemplateColumns='repeat('+cols+','+BS+'px)';return d};
 const size=b=>{b.style.width=b.style.height=BS+'px';return b};
 if(game.mode===1){
  const l=mk(3),r=mk(3);
  [btn(0,'left','◀'),btn(0,'up','▲'),btn(0,'right','▶')].forEach(b=>l.appendChild(size(b)));
  const blk=size(btn(0,'block','🛡','', 'BLOK'));blk.style.gridColumn='2';l.appendChild(blk);
  [btn(0,'punch','👊','atk','YUMRUK'),btn(0,'kick','🦵','atk','TEKME'),btn(0,'special','🐼','sp','ÖZEL')].forEach(b=>r.appendChild(size(b)));
  controls.append(l,r);
 }else{
  for(let p=0;p<2;p++){
   const d=mk(4);const lb=document.createElement('div');lb.className='lbl';lb.textContent=p?'KARA FIRTINA':'MUSA';lb.style.color=p?'#ffd84a':'#7fc4ff';d.appendChild(lb);
   [btn(p,'left','◀'),btn(p,'up','▲'),btn(p,'right','▶'),btn(p,'block','🛡'),btn(p,'punch','👊','atk'),btn(p,'kick','🦵','atk'),btn(p,'special',p?'⚡':'🐼','sp')].forEach(b=>d.appendChild(size(b)));
   controls.appendChild(d);
  }
 }
 layout();
}
function layout(){
 const vw=innerWidth,vh=innerHeight,touch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
 const land=touch&&vw>vh,two=game.mode===2,short=Math.min(vw,vh);
 document.body.classList.toggle('land',land);
 document.getElementById('rot').classList.toggle('hidden',!touch||land||short>700);
 const cols=two?4:3;
 if(land){BS=Math.max(40,Math.min(two?62:84,vh*(two?0.11:0.15)))}
 else{BS=Math.max(40,Math.min(two?76:92,(vw-36)/(two?8.8:6.6)))}
 controls.querySelectorAll('.btn').forEach(b=>{b.style.width=b.style.height=BS+'px';b.style.fontSize=(BS*.42)+'px'});
 controls.querySelectorAll('.btn small').forEach(x=>x.style.fontSize=Math.max(8,BS*.15)+'px');
 controls.querySelectorAll('.pad').forEach(d=>{d.style.gridTemplateColumns='repeat('+cols+','+BS+'px)';d.style.gap=(BS*.14)+'px'});
 controls.classList.toggle('hidden',!touch);
 let sw;
 if(land){sw=Math.min(vw,vh*16/9)}
 else{const ch=touch?(controls.offsetHeight||BS*2.6)+40:0;sw=Math.min(vw-(touch?0:24),(vh-ch-20)*16/9,1400)}
 stage.style.width=sw+'px';stage.style.height=sw*9/16+'px';
 if(!land)controls.style.width=Math.min(vw,Math.max(sw,two?vw:Math.min(vw,620)))+'px';
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,250));

/* ---------- Menus ---------- */
function menu(){
 game.state='menu';overlay.classList.remove('hidden');document.body.classList.add('menu');
 card.innerHTML=`<div class="hero"><img src="musa/musa_win.webp" alt=""><span class="vs">VS</span><img src="musa/storm_idle.webp" style="transform:scaleX(-1)" alt=""></div><h1>MUSA</h1><h2>Çaycuma'nın Kahramanı – Dövüş Oyunu</h2>
 <div id="ov2"><button class="big alt" id="m1">1 OYUNCU<br><small style="font-weight:600;font-size:13px">Musa vs. Bilgisayar</small></button>
 <button class="big" id="m2">2 OYUNCU<br><small style="font-weight:600;font-size:13px">Aynı cihazda karşılıklı</small></button></div>
 <div class="help">Çaycuma'yı Kara Fırtına'dan koru! Rakibi vur, <b>güç barını</b> doldur, sonra <b>🐼 Panda Dalgası</b>nı fırlat!<br>2 raundu kazanan şampiyon olur.<br>
 <b>Klavye</b> – Musa: A/D yürü · W zıpla · S blok · F yumruk · G tekme · H özel<br>Rakip: ← → yürü · ↑ zıpla · ↓ blok · K yumruk · L tekme · J özel</div>
 <a class="big" style="text-decoration:none;background:#ffffff1a;box-shadow:none" href="index.html">🏠 BUKO GAMES</a>`;
 document.getElementById('m1').onclick=()=>{card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,48px)">ZORLUK</h1><h2>Kara Fırtına ne kadar güçlü olsun?</h2>
  <button class="big" data-d="kolay">🙂 KOLAY</button><button class="big alt" data-d="orta">😤 ORTA</button><button class="big" data-d="zor" style="background:linear-gradient(#c0392b,#7a1d14)">🔥 ZOR</button><button class="big" style="background:#ffffff1a;box-shadow:none" id="bk">← GERİ</button>`;
  card.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{DIFF=b.dataset.d;start(1)});document.getElementById('bk').onclick=menu};
 document.getElementById('m2').onclick=()=>start(2);
}
function start(mode){
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
 game.mode=mode;game.round=1;P=[];overlay.classList.add('hidden');document.body.classList.remove('menu');window.musaMusic&&window.musaMusic();
 buildControls();startRound();
}
function matchEnd(){
 game.state='over';
 const w=P[0].wins>=2?P[0]:P[1];
 const winMsg=game.mode===1?(w===P[0]?'Tebrikler! Musa Çaycuma\'yı korudu! 🌊🐼':'Kara Fırtına kazandı… Bir daha dene!'):(w.look.name+' şampiyon oldu!');
 overlay.classList.remove('hidden');document.body.classList.add('menu');
 card.innerHTML=`<h1 style="font-size:clamp(28px,8vw,54px)">${w.look.name}<br>KAZANDI!</h1><h2>${winMsg}</h2>
 <button class="big alt" id="r1">TEKRAR OYNA</button><button class="big" id="r2">ANA MENÜ</button><a class="big" style="text-decoration:none;background:#ffffff1a;box-shadow:none" href="index.html">🏠 BUKO GAMES</a>`;
 document.getElementById('r1').onclick=()=>{P=[];start(game.mode)};
 document.getElementById('r2').onclick=()=>{P=[];menu()};
}

const snd=document.getElementById('snd');const si=()=>snd.textContent=MUTE?'🔇':'🔊';si();
const bgm=document.getElementById('bgm');bgm.volume=0.28;
window.musaMusic=()=>{if(MUTE){bgm.pause();return}const pr=bgm.play();pr&&pr.catch(()=>{})};
snd.onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('musaMute',MUTE?'1':'0')}catch(e){}si();window.musaMusic()};
menu();layout();requestAnimationFrame(loop);
})();
</script>
