<style>
html,body{margin:0;height:100%;background:#0c0a1e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.tc{position:fixed;pointer-events:none;z-index:5}
.tc.hide,#home.hide{display:none}
.btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.38);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:none}
.btn.on{background:rgba(255,214,80,.42);border-color:#ffe58a}
.btn svg{width:58%;height:58%;pointer-events:none}
.lab{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:900 11px system-ui,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none}
#bF{background:rgba(255,138,61,.35);border-color:#ffb37a}
#pad{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:184px;height:196px}
#bF2{left:6px;bottom:108px;width:84px;height:84px;background:rgba(255,138,61,.35);border-color:#ffb37a}
#dpad{left:0;bottom:0;width:184px;height:88px;border-radius:44px;justify-content:space-between;padding:0 14px;box-sizing:border-box}
#dpad svg{width:52px;height:52px}
#dpad .half{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#dpad .half.on{background:rgba(255,214,80,.42)}
#act{right:calc(10px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:212px;height:200px}
#bJ{right:0;bottom:6px;width:108px;height:108px}
#bF{right:120px;bottom:10px;width:88px;height:88px}
#bS{right:26px;bottom:138px;width:56px;height:56px}
#bP{right:122px;bottom:130px;width:62px;height:62px;opacity:.45}#bP.ready{opacity:1;background:rgba(255,227,90,.4);border-color:#fff36b;animation:pz .6s infinite alternate}@keyframes pz{to{transform:scale(1.12)}}
#home{position:fixed;z-index:6;left:calc(10px + env(safe-area-inset-left));top:10px;width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(20,14,50,.55);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#home svg{width:30px;height:30px}
#snd{position:fixed;z-index:6;right:calc(10px + env(safe-area-inset-right));top:62px;width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(20,14,50,.55);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#snd svg{width:30px;height:30px}#snd.hide{display:none}
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(8,6,26,.42);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ov.hide{display:none}
.card{width:min(560px,92vw);max-height:92vh;overflow:auto;box-sizing:border-box;padding:18px 20px 16px;border-radius:26px;background:linear-gradient(160deg,rgba(46,28,110,.94),rgba(20,12,56,.95));border:2px solid rgba(255,255,255,.18);box-shadow:0 18px 60px rgba(0,0,0,.5);text-align:center}
.brand{font-size:12px;letter-spacing:3px;opacity:.7;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:clamp(26px,6.5vw,44px);font-weight:900;letter-spacing:1px;background:linear-gradient(#fff36b,#ff9a3c 60%,#ff5f7a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
h2{margin:6px 0;font-size:clamp(22px,5vw,34px);font-weight:900;color:#ffe35a}
h3{margin:12px 0 6px;font-size:14px;letter-spacing:2px;opacity:.8;text-transform:uppercase}
.sub{margin:0 0 10px;opacity:.85}
.mb{font:800 clamp(16px,4vw,20px) system-ui,sans-serif;padding:12px 26px;margin:6px;border-radius:18px;border:none;cursor:pointer;color:#3a1d00;background:linear-gradient(#ffe35a,#ff9f1c);box-shadow:0 5px 0 #b45f00;-webkit-tap-highlight-color:transparent}
.mb:active{transform:translateY(3px);box-shadow:0 2px 0 #b45f00}
.mb.alt{color:#fff;background:linear-gradient(#7c6cff,#5240d6);box-shadow:0 5px 0 #2d2180}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lb{border:none;border-radius:16px;padding:8px 2px;cursor:pointer;color:#fff;background:linear-gradient(#3fc3ff,#2a7bdc);box-shadow:0 4px 0 #1a4f97;font:inherit;-webkit-tap-highlight-color:transparent}
.lb b{display:block;font-size:22px;font-weight:900}
.lb small{display:block;font-size:10px;line-height:1.15;min-height:24px;opacity:.95}
.lb.locked{background:#3b3566;box-shadow:0 4px 0 #221d44;cursor:default;opacity:.7}
.lb svg{width:18px;height:18px}
.skr{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}.skr small{opacity:.8;font-size:12px}
.etn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}.etn h3{margin:0;min-width:120px}.sb:disabled{opacity:.3}
.row{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.sb{min-width:52px;height:42px;border-radius:13px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font:800 15px system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 10px}
.sb.on{background:#ffd23f;color:#3a1d00;border-color:#ffd23f}
.sb svg{width:26px;height:26px}
.help{font-size:12.5px;opacity:.75;margin:12px 0 0;line-height:1.45}
.stat{display:flex;justify-content:center;gap:22px;font-size:18px;margin:8px 0 6px}
.stat b{color:#ffe35a;font-size:24px}
</style>

addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();initAudio();
 if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')openMenu(true);else if(state==='pause')resume()}
 else if((e.code==='Enter'||e.code==='Space')&&state!=='play'){const b=ovEl.querySelector('.mb');if(b){e.preventDefault();b.click()}}});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;for(const k in touch)touch[k]=0});
const kBtns=document.querySelectorAll('[data-k]');const kUpd=ks=>{for(const k of ks)touch[k]=[...kBtns].some(x=>x.dataset.k.split(',').includes(k)&&x.classList.contains('on'))?1:0};
kBtns.forEach(b=>{const k=b.dataset.k.split(',');
 const on=e=>{e.preventDefault();b.classList.add('on');kUpd(k);initAudio();try{b.setPointerCapture(e.pointerId)}catch(_){}};
 const off=e=>{e.preventDefault();b.classList.remove('on');kUpd(k)};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
(function(){const d=document.getElementById('dpad'),hl=document.getElementById('hl'),hr=document.getElementById('hr');const ids=new Map();
 const upd=()=>{let l=0,r=0;for(const v of ids.values()){if(v<0)l=1;else r=1}touch.l=l;touch.r=r;hl.classList.toggle('on',!!l);hr.classList.toggle('on',!!r)};
 const pos=e=>{const b=d.getBoundingClientRect();return e.clientX<b.left+b.width/2?-1:1};
 d.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{d.setPointerCapture(e.pointerId)}catch(_){}ids.set(e.pointerId,pos(e));upd()});
 d.addEventListener('pointermove',e=>{if(ids.has(e.pointerId)){ids.set(e.pointerId,pos(e));upd()}});
 const end=e=>{ids.delete(e.pointerId);upd()};d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);d.addEventListener('lostpointercapture',end)})();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')openMenu(true);if(AC)AC.suspend()}else if(AC)AC.resume()});

/* ================= Menüler ================= */
const ovEl=document.getElementById('ov');const homeB=document.getElementById('home');
const lockSvg='<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3" fill="#ffd23f"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#ffd23f" stroke-width="2.6"/></svg>';
function volSvg(){const v=save.vol;let w='';for(let i=1;i<=3;i++)w+=`<path d="M${12+i*4} ${16-i*3.2}q${3+i} ${i*3.2} 0 ${i*6.4}" fill="none" stroke="${i<=v?'#fff':'rgba(255,255,255,.22)'}" stroke-width="2.4" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 32 32"><path d="M4 12h5l6-5v18l-6-5H4z" fill="${v?'#ffd23f':'#888'}"/>${w}${v?'':'<path d="M18 11l9 10M27 11l-9 10" stroke="#ff5f7a" stroke-width="3" stroke-linecap="round"/>'}</svg>`}
const sndB=document.getElementById('snd');sndB.addEventListener('click',()=>{initAudio();setVol((save.vol+1)%4);sndB.innerHTML=volSvg();if(save.vol)sfx('coin')});
function setControls(show){sndB.classList.toggle('hide',!show);sndB.innerHTML=volSvg();sndB.style.top=(OY+62)+'px';const s=S();document.getElementById('lF').textContent=s.fire;document.getElementById('lP').textContent=s.pwLab;document.getElementById('lF2').textContent=s.fj;document.getElementById('lJ').textContent=s.jump;document.getElementById('lS').textContent=s.swap;document.querySelectorAll('.tc').forEach(e=>e.classList.toggle('hide',!(show&&isTouch)));homeB.classList.toggle('hide',!show)}
let mEtap=-1,mSkin=-1;
function openMenu(paused,keepMusic){
 state=paused?'pause':'menu';if(!paused){lv=null;if(!keepMusic)playMusic(0)}setControls(false);
 const s=S();let lvh='';
 if(mEtap<0)mEtap=Math.min(20,Math.floor((save.unlocked-1)/5));if(mSkin<0)mSkin=save.skin||0;
 for(let k=0;k<5;k++){const i=mEtap*5+k,open=i<save.unlocked;lvh+=`<button class="lb ${open?'':'locked'}" data-lv="${i}" ${open?'':'disabled'}><b>${i+1}</b><small>${open?s.names[LDEF(i).th]:lockSvg}</small></button>`}
 ovEl.innerHTML=`<div class="card"><a class="brand homeLink" style="color:#a6ff4d;text-decoration:none;font-weight:900">🦎 BUKO GAMES</a><h1>${s.title}</h1><p class="sub">${s.sub}</p>
 ${paused?`<button class="mb" data-act="cont">${s.cont}</button><button class="mb alt" data-act="menu">${s.menu}</button>`:`<button class="mb" data-act="play">${s.play}</button>`}
 ${paused?'':`<div class="etn"><button class="sb" data-et="-1" ${mEtap>0?'':'disabled'}>◀</button><h3>${s.etap} ${mEtap+1} / 21</h3><button class="sb" data-et="1" ${mEtap<20?'':'disabled'}>▶</button></div><div class="lvls">${lvh}</div>`}
 ${paused?'':`<div class="skr"><button class="sb" data-sk="-1">◀</button><div><canvas id="skc" style="width:84px;height:92px;display:block;margin:0 auto"></canvas><b>${s.skin}: ${s.skinN[mSkin]}</b><br><small>${skinOpen(mSkin)?(mSkin===(save.skin||0)?'✓':''):s.skinAt(SKINS[mSkin].at)}</small></div><button class="sb" data-sk="1">▶</button></div>`}
 <div class="row">${['tr','de','en'].map(l=>`<button class="sb ${save.lang===l?'on':''}" data-lang="${l}">${l.toUpperCase()}</button>`).join('')}<button class="sb" data-act="vol" aria-label="Ses">${volSvg()}</button></div>
 <p class="help">${s.helpT}${isTouch?'':'<br>'+s.help}</p></div>`;
 ovEl.classList.remove('hide');setHome();drawSkinPreview();
}
const HOME=/xenosmart\./.test(location.hostname)?'../':'https://xenosmart.de/spiel/';
function setHome(){ovEl.querySelectorAll('.homeLink').forEach(a=>{a.href=HOME})}
function resume(){state='play';ovEl.classList.add('hide');setControls(true);last=performance.now();acc=0}
function startLevel(i){i=clamp(i,0,NLV-1);setTimeout(()=>{if(state==='play')say(introDone?'start':'intro',true);introDone=true},500);mEtap=Math.floor(i/5);buildLevel(i);state='play';ovEl.classList.add('hide');setControls(true);playMusic(LDEF(i).th);last=performance.now();acc=0}
function fmtT(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
let WLsnap=1;
function completeLevel(){
 if(state!=='play')return;state='complete';sfx('win');say('win',true);setControls(false);
 const uBefore=save.unlocked||1;WLsnap=WL()+1;save.unlocked=Math.max(save.unlocked,Math.min(NLV,lvIdx+2));const b=save.best[lvIdx];if(!b||levelTime<b)save.best[lvIdx]=Math.round(levelTime);persist();
 const wBefore=WLsnap;const s=S(),last=lvIdx===NLV-1,etd=lvIdx%5===4,wNow=WL()+1,wUp=wNow>wBefore;
 ovEl.innerHTML=`<div class="card"><h2>${last?s.win:s.complete}</h2><p class="sub">${last?s.winTxt:(etd?s.etapDone(Math.floor(lvIdx/5)+1):s.names[LDEF(lvIdx).th])}</p>
 ${SKINS.map((k,i)=>k.at>uBefore&&k.at<=save.unlocked?`<p class="sub" style="color:#7dff8a;font-weight:900">👕 ${s.skinNew(s.skinN[i])}</p>`:'').join('')}${wUp?`<p class="sub" style="color:#ffe35a;font-weight:900">⚡ ${s.wup(wNow)}</p>`:''}<div class="stat"><div>${s.coins}<br><b>${P.coins}</b></div><div>${s.time}<br><b>${fmtT(levelTime)}</b></div></div>
 ${last?'':`<button class="mb" data-act="next">${s.next}</button>`}<button class="mb alt" data-act="menu">${s.menu}</button></div>`;
 ovEl.classList.remove('hide');
}
function showOver(){setControls(false);say('over',true);const s=S();
 ovEl.innerHTML=`<div class="card"><h2>${s.over}</h2><p class="sub">${s.lv} ${lvIdx+1} · ${s.names[LDEF(lvIdx).th]}</p><button class="mb" data-act="retry">${s.retry}</button><button class="mb alt" data-act="menu">${s.menu}</button></div>`;
 ovEl.classList.remove('hide')}
ovEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;initAudio();
 if(b.dataset.lv!==undefined){startLevel(+b.dataset.lv);return}
 if(b.dataset.sk){mSkin=(mSkin+(+b.dataset.sk)+SKINS.length)%SKINS.length;if(skinOpen(mSkin)){save.skin=mSkin;persist();applySkin(mSkin)}openMenu(false,true);return}
 if(b.dataset.et){mEtap=clamp(mEtap+(+b.dataset.et),0,20);openMenu(false,true);return}
 if(b.dataset.lang){save.lang=b.dataset.lang;persist();document.documentElement.lang=save.lang;openMenu(state==='pause');return}
 switch(b.dataset.act){
 case'play':startLevel(Math.min(save.unlocked-1,NLV-1));break;
 case'cont':resume();break;
 case'menu':openMenu(false);break;
 case'next':startLevel(lvIdx+1);break;
 case'retry':startLevel(lvIdx);break;
 case'vol':setVol((save.vol+1)%4);b.innerHTML=volSvg();if(save.vol)sfx('coin');break;
 }});
homeB.addEventListener('click',()=>{initAudio();if(state==='play')openMenu(true)});

function resize(){
 DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 SC=Math.min(H/VH,W/560);VW=W/SC;const gh=VH*SC;OY=H-gh>4?Math.max(0,(H-gh)*.28):0;
 homeB.style.top=(OY+10)+'px';
}
addEventListener('resize',resize);resize();
document.documentElement.lang=save.lang;
applySkin(skinOpen(save.skin||0)?(save.skin||0):0);
openMenu(false);
requestAnimationFrame(frame);
</script>
