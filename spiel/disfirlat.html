    SAVE.streak = SAVE.lastDay===y ? (SAVE.streak||0)+1 : 1; SAVE.lastDay = today;
    SAVE.bank = (SAVE.bank||0) + 500*Math.min(SAVE.streak,7); persist();

  // ================= ÇİZİM =================
  // Statik çizimler (çark gövdesi, dişler, parlama) ekran dışı tuvallere önbelleklenir → telefonda hafif
  const spriteCache = new Map();
  let pops={}, punch=[], kick=0, bgc=null, bgx=null;
  const toothW = () => Math.PI*2*u*0.42;
  function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w*dpr)); c.height=Math.max(1,Math.ceil(h*dpr)); const x=c.getContext('2d'); x.scale(dpr,dpr); return [c,x]; }
  // yuvarlatılmış yamuk diş: kök x0'da, uç x0+th'de
  function toothPath(c,x0,w){
    const tw=w*0.64, rr=Math.min(th*0.3, tw*0.32);
    c.beginPath(); c.moveTo(x0,-w/2); c.lineTo(x0+th-rr,-tw/2); c.quadraticCurveTo(x0+th,-tw/2,x0+th,-tw/2+rr);
    c.lineTo(x0+th,tw/2-rr); c.quadraticCurveTo(x0+th,tw/2,x0+th-rr,tw/2); c.lineTo(x0,w/2); c.closePath();
  }
  function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=p<0?0:255,a=Math.abs(p);
    return `rgb(${Math.round((t-r)*a+r)},${Math.round((t-g)*a+g)},${Math.round((t-b)*a+b)})`; }
  function hexA(hex){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},`; }

  function toothSprite(color, glow){
    const w=toothW(), key='t|'+color+'|'+(glow?1:0)+'|'+Math.round(th*10)+'|'+Math.round(w*10);
    let sp=spriteCache.get(key); if (sp) return sp;
    const pad = glow ? Math.ceil(th*0.7)+4 : 3, cw=th+pad*2, ch=w+pad*2;
    const [c,x]=mkCanvas(cw,ch); x.translate(pad, ch/2);
    toothPath(x,0,w);
    if (glow){ x.save(); x.shadowColor=color; x.shadowBlur=th*0.75; x.fillStyle=color; x.fill(); x.restore(); }
    const gr=x.createLinearGradient(0,0,th,0);
    gr.addColorStop(0,shade(color,-0.5)); gr.addColorStop(0.3,color); gr.addColorStop(0.78,shade(color,0.32)); gr.addColorStop(1,shade(color,0.05));
    x.fillStyle=gr; x.fill();
    x.save(); x.clip();
    const rg=x.createLinearGradient(0,-w/2,0,w/2);
    rg.addColorStop(0,'rgba(0,20,30,.28)'); rg.addColorStop(0.28,'rgba(255,255,255,0)'); rg.addColorStop(0.44,'rgba(255,255,255,.42)'); rg.addColorStop(0.58,'rgba(255,255,255,0)'); rg.addColorStop(1,'rgba(0,20,30,.3)');
    x.fillStyle=rg; x.fillRect(0,-w/2,th+2,w);
    x.fillStyle='rgba(255,255,255,.4)'; x.fillRect(th*0.84,-w*0.22,Math.max(1,th*0.07),w*0.44);
    x.restore();
    x.globalAlpha=0.75; x.strokeStyle=shade(color,-0.55); x.lineWidth=1; x.stroke();
    sp={c, ox:-pad, oy:-ch/2, w:cw, h:ch}; spriteCache.set(key,sp); return sp;
  }
  function drawToothAt(c, color, x0, glow, scale){
    const sp=toothSprite(color,glow);
    if (scale && scale!==1){ c.save(); c.translate(x0,0); c.scale(scale,scale); c.drawImage(sp.c,sp.ox,sp.oy,sp.w,sp.h); c.restore(); }
    else c.drawImage(sp.c, x0+sp.ox, sp.oy, sp.w, sp.h);
  }

  // çark gövdesi: metal çember (bevel), fırçalanmış plaka, delik pencereler, perçinler, krom göbek
  function gearSprite(g, look){
    const r=R[g], n=N[g], key='g|'+g+'|'+look+'|'+SAVE.theme+'|'+Math.round(r*10)+'|'+n;
    let sp=spriteCache.get(key); if (sp) return sp;
    const pad=3, S=r*2+pad*2, [c,x]=mkCanvas(S,S); x.translate(S/2,S/2);
    const pal = look ? T.body : T.idle, lite=pal[0], base=pal[1], mid=pal[2], acc = look===2 ? '#ff3d5e' : T.a;
    const rimIn=r*0.79, TAU=Math.PI*2;
    const rg=x.createRadialGradient(0,0,rimIn*0.98,0,0,r);
    rg.addColorStop(0,shade(base,-0.3)); rg.addColorStop(0.22,shade(lite,0.5)); rg.addColorStop(0.5,shade(lite,0.12)); rg.addColorStop(0.82,shade(mid,-0.12)); rg.addColorStop(1,shade(base,-0.5));
    x.fillStyle=rg; x.beginPath(); x.arc(0,0,r,0,TAU); x.fill();
    const pg=x.createRadialGradient(0,0,0,0,0,rimIn);
    pg.addColorStop(0,shade(mid,0.28)); pg.addColorStop(0.75,mid); pg.addColorStop(1,shade(base,-0.38));
    x.fillStyle=pg; x.beginPath(); x.arc(0,0,rimIn,0,TAU); x.fill();
    x.lineWidth=1; for (let k=0;k<5;k++){ x.strokeStyle=`rgba(255,255,255,${k%2?0.07:0.04})`; x.beginPath(); x.arc(0,0,rimIn*(0.34+k*0.12),0,TAU); x.stroke(); }
    // pencereler (arkası görünür)
    const hc = n>=9?6:n>=6?5:4, ri=r*0.37, ro=r*0.67, half=Math.PI/hc*0.6;
    const winPath = a => { x.beginPath(); x.arc(0,0,ro,a-half,a+half); x.arc(0,0,ri,a+half*0.72,a-half*0.72,true); x.closePath(); };
    x.lineJoin='round';
    for (let i=0;i<hc;i++){ const a=i*TAU/hc+0.3; winPath(a);
      x.globalCompositeOperation='destination-out'; x.fill(); x.lineWidth=(ro-ri)*0.28; x.stroke();
      x.globalCompositeOperation='source-atop'; x.lineWidth=(ro-ri)*0.28+Math.max(2.5,r*0.03); x.strokeStyle='rgba(0,30,38,.42)'; x.stroke();
      x.globalCompositeOperation='source-over'; }
    // ince oluklar
    x.lineWidth=Math.max(1,r*0.014); x.strokeStyle='rgba(0,30,38,.4)'; x.beginPath(); x.arc(0,0,rimIn,0,TAU); x.stroke();
    x.strokeStyle='rgba(255,255,255,.4)'; x.lineWidth=Math.max(1,r*0.01); x.beginPath(); x.arc(0,0,rimIn+Math.max(1.5,r*0.018),0,TAU); x.stroke();
    // perçinler (her diş hizasında)
    const br=Math.max(1.3,r*0.026);
    for (let i=0;i<n;i++){ const a=i*TAU/n, bx=Math.cos(a)*r*0.895, by=Math.sin(a)*r*0.895;
      const bg=x.createRadialGradient(bx-br*0.35,by-br*0.35,0,bx,by,br); bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.5,shade(lite,0.2)); bg.addColorStop(1,shade(base,-0.45));
      x.fillStyle=bg; x.beginPath(); x.arc(bx,by,br,0,TAU); x.fill(); }
    // göbek: renkli halka + krom + altıgen cıvata
    x.fillStyle='rgba(0,30,38,.35)'; x.beginPath(); x.arc(0,r*0.015,r*0.315,0,TAU); x.fill();
    const ag=x.createLinearGradient(0,-r*0.3,0,r*0.3); ag.addColorStop(0,shade(acc,0.35)); ag.addColorStop(1,shade(acc,-0.3));
    x.fillStyle=ag; x.beginPath(); x.arc(0,0,r*0.3,0,TAU); x.fill();
    const hg=x.createRadialGradient(-r*0.07,-r*0.08,0,0,0,r*0.245);
    hg.addColorStop(0,'#ffffff'); hg.addColorStop(0.35,'#dff6f2'); hg.addColorStop(0.8,'#82aaa8'); hg.addColorStop(1,'#3e6a6c');
    x.fillStyle=hg; x.beginPath(); x.arc(0,0,r*0.245,0,TAU); x.fill();
    if (look!==2){
      x.beginPath(); for (let k=0;k<6;k++){ const a=k*TAU/6, hr=r*0.1; x[k?'lineTo':'moveTo'](Math.cos(a)*hr,Math.sin(a)*hr); } x.closePath();
      const bg=x.createLinearGradient(0,-r*0.1,0,r*0.1); bg.addColorStop(0,'#5e8e8e'); bg.addColorStop(1,'#24494c');
      x.fillStyle=bg; x.fill(); x.strokeStyle='rgba(255,255,255,.45)'; x.lineWidth=1; x.stroke();
    }
    x.strokeStyle='rgba(0,30,38,.45)'; x.lineWidth=1; x.beginPath(); x.arc(0,0,r-0.5,0,TAU); x.stroke();
    sp={c,S}; spriteCache.set(key,sp); return sp;
  }
  // dönmeyen ışık: sol üstten parlama + kenar yansıması
  function glossSprite(r){
    const key='o|'+Math.round(r*10); let sp=spriteCache.get(key); if (sp) return sp;
    const S=r*2+6, [c,x]=mkCanvas(S,S); x.translate(S/2,S/2);
    x.save(); x.beginPath(); x.arc(0,0,r,0,Math.PI*2); x.arc(0,0,r*0.79,0,Math.PI*2,true); x.clip();
    const lg=x.createLinearGradient(-r*0.75,-r*0.75,r*0.75,r*0.75);
    lg.addColorStop(0,'rgba(255,255,255,.42)'); lg.addColorStop(0.45,'rgba(255,255,255,.03)'); lg.addColorStop(0.6,'rgba(0,25,35,0)'); lg.addColorStop(1,'rgba(0,25,35,.34)');
    x.fillStyle=lg; x.fillRect(-r,-r,r*2,r*2); x.restore();
    x.save(); x.beginPath(); x.arc(0,0,r*0.79,0,Math.PI*2); x.clip();

  function drawGear(g){

    const pu = punch[g]||0;

    if (pu<0) ctx.translate(Math.sin(time*70)*(-pu)*th*0.3, 0);

    sg.addColorStop(0,'rgba(0,35,42,.42)'); sg.addColorStop(1,'rgba(0,35,42,0)');

  // dekor: arka plandaki büyük, bulanık çark siluetleri (derinlik)
  function silGear(x,X,Y,r,n,rot){
    x.beginPath();
    for (let i=0;i<n;i++){ const a=rot+i*Math.PI*2/n, d=Math.PI/n;
      x.lineTo(X+Math.cos(a-d*0.55)*r, Y+Math.sin(a-d*0.55)*r); x.lineTo(X+Math.cos(a-d*0.35)*r*1.14, Y+Math.sin(a-d*0.35)*r*1.14);
      x.lineTo(X+Math.cos(a+d*0.35)*r*1.14, Y+Math.sin(a+d*0.35)*r*1.14); x.lineTo(X+Math.cos(a+d*0.55)*r, Y+Math.sin(a+d*0.55)*r); }
    x.closePath(); x.moveTo(X+r*0.45,Y); x.arc(X,Y,r*0.45,0,Math.PI*2,true); x.fill();
  }
  function drawBg(){
    const g0 = fever>0 ? ['#ff9a2e','#e0447a','#7a2a7a'] : (T.cham ? chamBg(time) : T.bg);

    x.globalCompositeOperation='lighter';

      x.fillStyle=g; x.fillRect(0,0,bw,bh);
    }
    for (const b of bokeh){
      const px=((b.x + Math.sin(time*0.05*b.s+b.p)*0.05)%1)*bw, py=(((b.y - time*0.012*b.s)%1)+1)%1*bh, r=b.r*m*1.3;
      const g=x.createRadialGradient(px,py,0,px,py,r); const c=bl[b.c];
      g.addColorStop(0,hexA(c)+'0.26)'); g.addColorStop(0.7,hexA(c)+'0.08)'); g.addColorStop(1,hexA(c)+'0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill();
    }
    x.globalCompositeOperation='source-over';
    x.fillStyle='rgba(255,255,255,.07)';
    silGear(x, bw*0.1, bh*0.2, m*0.32, 10, time*0.05);
    silGear(x, bw*0.95, bh*0.62, m*0.42, 12, -time*0.04);
    silGear(x, bw*0.2, bh*0.95, m*0.28, 9, time*0.06);
    const tg=x.createLinearGradient(0,0,0,bh); tg.addColorStop(0,'rgba(255,255,255,.12)'); tg.addColorStop(.45,'rgba(255,255,255,0)'); tg.addColorStop(1,'rgba(0,25,35,.3)');
    x.fillStyle=tg; x.fillRect(0,0,bw,bh);
    const vg=x.createRadialGradient(bw/2,bh*0.45,m*0.35,bw/2,bh*0.45,M*0.8); vg.addColorStop(0,'rgba(0,20,30,0)'); vg.addColorStop(1,'rgba(0,20,30,.3)');
    x.fillStyle=vg; x.fillRect(0,0,bw,bh);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='low'; ctx.drawImage(bgc,0,0,W,H);
    // yıldız tozları
    ctx.fillStyle='#ffffff';
    for (const s of stars){ ctx.globalAlpha=0.3+0.6*Math.sin(time*1.6+s.p)**2;
      const yy = fever>0 ? ((s.y - time*80*s.r)%H+H)%H : s.y;
      ctx.beginPath(); ctx.arc(s.x, yy, s.r, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    // ince perspektif ızgara (alt kısımda)
    ctx.save(); ctx.globalAlpha=0.09; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    const hy=H*0.8; ctx.beginPath();
    for (let i=0;i<8;i++){ const yy=hy+(H-hy)*Math.pow(((i+(time*0.3)%1)/8),2); ctx.moveTo(0,yy); ctx.lineTo(W,yy); }
    for (let i=-8;i<=8;i++){ ctx.moveTo(W/2+i*W*0.04,hy); ctx.lineTo(W/2+i*W*0.25,H); }
    ctx.stroke(); ctx.restore();
    // ekolayzer (müziğe göre), sade
    const nb = device==='tablet'?36:26, bwid=W/nb;
    for (let i=0;i<nb;i++){
      const v = freq && SAVE.music ? freq[Math.min(freq.length-1, 1+Math.floor(i*freq.length*0.7/nb))]/255 : (0.22+0.18*Math.sin(time*3+i*0.7)*Math.sin(time*1.3+i));
      const h=Math.max(3, v*H*0.13), bx=i*bwid+bwid*0.2, ww=bwid*0.6;
      ctx.fillStyle=hexA(T.pal[i%T.pal.length])+'0.28)'; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx,H-h,ww,h+ww,ww/2); else ctx.rect(bx,H-h,ww,h); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(bx+ww/2,H-h+ww/2,ww*0.32,0,Math.PI*2); ctx.fill();
    }
    // hız çizgileri
    if (!LITE || fever>0){
      ctx.save(); ctx.globalAlpha=0.12+beat*0.22; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.lineCap='round';
      const sp=(80+(level||0)*12+(fever>0?260:0)); ctx.beginPath();
      for (const st of stars.slice(0,LITE?10:22)){ const yy=((st.y+time*sp*(0.6+st.r*0.4))%(H+80))-80; ctx.moveTo(st.x,yy); ctx.lineTo(st.x,yy+30+st.r*40); }

  }
  function drawVignette(){

  function drawArcs(){

  // ================= DÖNGÜ =================
  function updateBoss(dt){
    if (!L.boss || state!=='play') return;
    if (boss.pause>0){ boss.pause-=dt; if (boss.pause<=0) boss.next=time+3.2+Math.random()*2; }
    else if (time>boss.next-0.55 && boss.warn<=0 && time<boss.next){ boss.warn=0.55; sfx.warn(); }
    if (boss.warn>0){ boss.warn-=dt; if (boss.warn<=0){ boss.pause=0.45; } }
    if (time>boss.lockAt){
      const g=active, empt=[]; for(let i=0;i<N[g];i++) if(!filled[g][i]) empt.push(i);
      if (empt.length>1){ boss.lock={g, i:empt[Math.floor(Math.random()*empt.length)], until:time+2.2}; }
      boss.lockAt=time+4.5+Math.random()*2;
    }
  }

  let pzShown=null;
  function frame(t){
    const rdt=Math.min(0.05,(t-(lastT||t))/1000); lastT=t;
    // otomatik kalite: oyunun ilk ~2 sn'sinde ortalama kare süresi
    if (!qMeasure.done && state==='play' && !paused && rdt>0){ qMeasure.n++; qMeasure.sum+=rdt;
      if (qMeasure.sum>2){ qMeasure.done=true; const avg=qMeasure.sum/qMeasure.n*1000;
        if (avg>22 && !LITE){ LITE=true; layout(); if (particles.length>160) particles.splice(0, particles.length-160); } } }
    if (wantPause){ wantPause=false; if (canPause()) pauseGame(); }
    let dt = paused ? 0 : rdt;
    if (hitStop>0){ hitStop-=rdt; dt=0; }                         // kısa donma: büyük anlar "oturur"
    time+=dt;
    if (failTimer && dt>0){ failTimer.t-=dt; if (failTimer.t<=0){ const f=failTimer.fn; failTimer=null; f(); } }
    // skor yumuşakça sayar
    if (shownScore!==score){ const d=score-shownScore; shownScore = Math.abs(d)<2 ? score : shownScore + d*Math.min(1, rdt*12) + Math.sign(d); if ((d>0 && shownScore>score)||(d<0 && shownScore<score)) shownScore=score; }
    const ss=fmt(Math.round(shownScore)); if (scoreEl.textContent!==ss) scoreEl.textContent=ss;
    const showPz = runActive && (state==='play'||state==='fail') && !paused && !tutOn;
    if (showPz!==pzShown){ pzShown=showPz; pzBtn.classList.toggle('hid', !showPz); }
    const running = state==='play'||state==='fail';
    if (L){
      if (running && L.flip && time>flipAt){ dir*=-1; flipAt=time+3+Math.random()*2.5; }
      if (running) updateBoss(dt);
      rot0 += (running ? L.w*speedFactor() : 0.5)*dir*dt; computeRots();
    }
    musicAdapt();
    const f60=rdt*60;
    if (analyser && freq && SAVE.music){ analyser.getByteFrequencyData(freq); let b=0; for(let i=1;i<6;i++) b+=freq[i]; b=b/5/255; beat=Math.max(beat*Math.pow(0.88,f60), Math.pow(Math.max(0,b-0.35)/0.65,1.6)); }
    else beat=Math.max(beat*Math.pow(0.9,f60), Math.pow(Math.max(0,Math.sin(time*Math.PI*2*100/60)),8)*0.5);
    for (const w of waves){ w.r+=dt*(w.v||th*10); w.life-=dt; } waves=waves.filter(w=>w.life>0);
    updateShards(dt);
    if (slowT>0){ slowT-=dt; if (slowT<=0) slowBtn.classList.remove('on'); }
    if (fever>0 && running){ fever-=dt; if (fever<=0) updateHud(); }
    if (doubleT>0 && running){ doubleT-=dt; if (doubleT<=0) updateHud(); }
    if (lives===1 && running && time>heartAt){ sfx.heart(); heartAt=time+0.9; }
    if (flying){
      if (!flying.miss){ flying.t+=dt; if (flying.t>=FLY) land(); }
      else { flying.vy+=1000*dt; flying.mx+=flying.vx*dt; flying.my+=flying.vy*dt; flying.spin+=9*dt; }
    }
    const dmp=Math.pow(.96,dt*60);
    for (const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=dmp; p.vy=p.vy*dmp+(p.sp?120:300)*dt; }
    particles=particles.filter(p=>p.life>0);
    for (const f of floaters){ f.life-=dt*1.1; f.y-=40*dt; } floaters=floaters.filter(f=>f.life>0);
    for (const a of arcs) a.life-=dt; arcs=arcs.filter(a=>a.life>0);
    if (shake>0) shake-=rdt;
    if (kick>0) kick=Math.max(0,kick-dt*7);
    for (let j=0;j<punch.length;j++) if (punch[j]) { punch[j] = punch[j]>0 ? Math.max(0,punch[j]-dt*5) : Math.min(0,punch[j]+dt*2.2); }

    drawBg();
    if (L){
      ctx.save();
      if (shake>0 && !paused){ const a=Math.min(1,shake/.4)*(RM?2:10); const tt=t/1000; ctx.translate(Math.sin(tt*93)*a,Math.cos(tt*71)*a); }
      for (let j=K-1;j>=0;j--) drawGear(j);
      drawShards(); drawArcs(); drawHelper(); drawLauncher();
      for (const w of waves){ const al=Math.max(0,Math.min(1,w.life*1.6)); ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2);
        ctx.globalAlpha=al*0.35; ctx.strokeStyle=w.c; ctx.lineWidth=9; ctx.stroke(); ctx.globalAlpha=al; ctx.lineWidth=2.5; ctx.stroke(); }
      ctx.globalAlpha=1;
      if (flying){
        const g=flying.g;
        if (!flying.miss){
          const [x0,y0]=LP(g,3.7), k=Math.min(1,flying.t/FLY), j=flying.j;
          let x1,y1,a1=LB[g];
          if (j.ok){ const a=rots[g]+j.bi*Math.PI*2/N[g]; x1=cx[g]+Math.cos(a)*(R[g]+th*0.5); y1=cy[g]+Math.sin(a)*(R[g]+th*0.5); a1=LB[g]+norm(a-LB[g]); }
          else [x1,y1]=LP(g,0.5);
          const xk=x0+(x1-x0)*k, yk=y0+(y1-y0)*k, ak=LB[g]+(a1-LB[g])*k;
          ctx.save(); ctx.globalAlpha=.4; ctx.strokeStyle=flying.color; ctx.lineWidth=toothW()*0.55; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xk,yk); ctx.stroke();
          ctx.globalAlpha=.7; ctx.strokeStyle='#fff'; ctx.lineWidth=toothW()*0.14; ctx.stroke(); ctx.restore();
          drawLooseTooth(xk, yk, 0, flying.color, ak);
        } else drawLooseTooth(flying.mx, flying.my, flying.spin, flying.color, LB[flying.g]);
      }
      ctx.globalCompositeOperation='lighter';
      for (const p of particles){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.3)); ctx.fillStyle=p.color;
        if (p.sp){ const r=p.r*(0.5+0.5*p.life); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+time*3); ctx.beginPath();
          ctx.moveTo(0,-r); ctx.quadraticCurveTo(0,0,r,0); ctx.quadraticCurveTo(0,0,0,r); ctx.quadraticCurveTo(0,0,-r,0); ctx.quadraticCurveTo(0,0,0,-r); ctx.fill(); ctx.restore(); }
        else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); } }
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      ctx.textAlign='center'; ctx.lineJoin='round';
      for (const f of floaters){ const age=1-f.life, sc = age<0.12 ? 0.5+age/0.12*0.75 : age<0.24 ? 1.25-(age-0.12)/0.12*0.25 : 1;
        const fs=f.size*sc*(f.big?1.1:1); ctx.font=`900 ${fs}px 'Bricolage Grotesque', sans-serif`;
        const tw=ctx.measureText(f.text).width, fx=Math.max(tw/2+8, Math.min(W-tw/2-8, f.x));
        ctx.globalAlpha=Math.min(1,f.life*1.6); ctx.lineWidth=Math.max(3,fs*0.2); ctx.strokeStyle='rgba(0,45,50,.62)'; ctx.strokeText(f.text,fx,f.y);
        ctx.fillStyle=f.color; ctx.fillText(f.text,fx,f.y); }
      ctx.globalAlpha=1;
      ctx.restore();
      drawVignette();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', ()=>{ if (L) layout(); });
  menu();
  requestAnimationFrame(frame);
})();
</script>
