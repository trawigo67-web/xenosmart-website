  };
  const FLAGS = {tr:'🇹🇷', de:'🇩🇪', en:'🇬🇧'};
  if (!SAVE.lang){ const nl=(navigator.language||'tr').slice(0,2); SAVE.lang = I18N[nl] ? nl : (nl==='de'?'de':'en'); if(!I18N[SAVE.lang]) SAVE.lang='tr'; }
  const t = (k, ...a) => { const d=I18N[SAVE.lang]||I18N.tr; const v = d[k] ?? I18N.tr[k]; return typeof v==='function' ? v(...a) : v; };
  const fmt = n => n.toLocaleString(t('loc'));
  function langHtml(){ return `<div class="langs">${Object.keys(FLAGS).map(k=>`<button class="lg ${SAVE.lang===k?'sel':''}" data-l="${k}">${FLAGS[k]}</button>`).join('')}</div>`; }

  // ================= DOM =================
  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), $=id=>document.getElementById(id);
  const lvlEl=$('lvl'), scoreEl=$('score'), heartsEl=$('hearts'), subEl=$('sub'), comboEl=$('combo'), dotsEl=$('dots'), hint=$('hint'), toast=$('toast'), card=$('card'), box=$('box'), slowBtn=$('slow'), musBtn=$('mus');

  // ================= DURUM =================
  let W,H,dpr,u,th, N=[], K=0, L=null, R=[], cx=[], cy=[], phi=[], rots=[], rot0=0;
  let level=0, endless=false, round=0, lives=MAX_LIVES, filled=[], active=0, flying=null, state='menu';
  let score=0, combo=0, perfStreak=0, fever=0, slowT=0, slowUsed=false;
  let bonusSlots=[], doubleT=0, shield=false, levelStart=0, gearPerfect=[], pendingDouble=0;
  let lvStats={lost:0, hits:0, perf:0};
  let shake=0, time=0, dir=1, flipAt=0, particles=[], floaters=[], arcs=[], lastT, stars=[];
  let boss={next:0, warn:0, pause:0, lockAt:0, lock:null}, heartAt=0;

  // ================= YERLEŞİM =================
  let device='phone';
  function layout(){
    dpr=Math.min(2.5, window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const short=Math.min(W,H);
    device = short>=700 ? 'tablet' : (W>H ? 'landscape' : 'phone');
    document.body.dataset.device = device;
    const cs=getComputedStyle(document.documentElement);
    const safeT=parseFloat(cs.getPropertyValue('--sat'))||0, safeB=parseFloat(cs.getPropertyValue('--sab'))||0;
    // oyun alanı: üst göstergeler ile alt düğmeler arası
    const topUI = (device==='tablet'?150:device==='landscape'?92:128) + safeT;
    const botUI = (device==='tablet'?120:device==='landscape'?70:96) + safeB;
    const AW = W*(device==='landscape'?0.80:0.92), AH = Math.max(120, H-topUI-botUI);
    const t1=1.8;
    const pats=[];
    if (K<=1) pats.push([0]);
    else {
      const hz = K===2 ? [0,0.35,0.6,0.85] : [0.42,0.3,0.55,0.7,0.2];
      for (const ang of hz) pats.push(Array.from({length:K},(_,j)=> j===0?0 : (K===2?ang:(j%2?ang:-ang))));
      for (const dl of [0.45,0.6,0.75,0.9]) pats.push(Array.from({length:K},(_,j)=> j===0?0 : Math.PI/2+(j%2?-dl:dl)));
    }
    const BASES=[Math.PI/2, Math.PI, 0, -Math.PI/2];
    let best=null;
    for (const ph of pats){
      const px=[0], py=[0];
      for (let j=1;j<K;j++){ const d=N[j-1]+N[j]+t1*1.05; px[j]=px[j-1]+Math.cos(ph[j])*d; py[j]=py[j-1]+Math.sin(ph[j])*d; }
      // her çark için fırlatıcı yönü: tercihen alttan, olmazsa yandan/üstten
      const lb=[]; let ok=true;
      for (let j=0;j<K && ok;j++){
        let found=null;
        for (const bb of BASES){
          const ux=Math.cos(bb), uy=Math.sin(bb); let clear=true;
          for (let k=0;k<K && clear;k++){ if(k===j) continue;
            for (let q=0;q<=6;q++){ const dd=N[j]+t1*5*q/6, sx=px[j]+ux*dd, sy=py[j]+uy*dd;
              if (Math.hypot(px[k]-sx,py[k]-sy) < N[k]+t1*2.2){ clear=false; break; } } }
          if (clear){ found=bb; break; }
        }
        if (found===null) ok=false; else lb[j]=found;
      }
      if (!ok) continue;
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for (let j=0;j<K;j++){ const e=N[j]+t1; x0=Math.min(x0,px[j]-e); x1=Math.max(x1,px[j]+e); y0=Math.min(y0,py[j]-e); y1=Math.max(y1,py[j]+e);
        const lx=px[j]+Math.cos(lb[j])*(N[j]+t1*5.5), ly=py[j]+Math.sin(lb[j])*(N[j]+t1*5.5); x0=Math.min(x0,lx-t1*1.5); x1=Math.max(x1,lx+t1*1.5); y0=Math.min(y0,ly-t1*1.5); y1=Math.max(y1,ly+t1*1.5); }
      const downs = lb.filter(v=>v===Math.PI/2).length;
      const uu=Math.min(AW/(x1-x0), AH/(y1-y0)) * (1 + downs*0.04);   // alttan fırlatmayı hafif tercih et
      if (!best || uu>best.score) best={score:uu,u:Math.min(AW/(x1-x0), AH/(y1-y0)),px,py,ph,lb,x0,x1,y0,y1};
    }
    // çark çok büyümesin (tek çarkta)
    const maxR = short*(device==='tablet'?0.26:0.3);
    u = Math.min(best.u, maxR/N[0]); th=t1*u; phi=best.ph; LB=best.lb;
    const ox=W/2-(best.x0+best.x1)/2*u, oy=topUI+AH/2-(best.y0+best.y1)/2*u;
    R=N.map(n=>n*u); cx=best.px.map(x=>ox+x*u); cy=best.py.map(y=>oy+y*u);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6}));
    bokeh=Array.from({length:device==='tablet'?18:12},(_,i)=>({x:Math.random(),y:Math.random(),r:0.04+Math.random()*0.09,s:0.2+Math.random()*0.5,p:Math.random()*6,c:i%4}));
  }
  let bokeh=[], LB=[];
  const LU = g => [Math.cos(LB[g]||Math.PI/2), Math.sin(LB[g]||Math.PI/2)];
  const LP = (g,ext) => { const [ux,uy]=LU(g); return [cx[g]+ux*(R[g]+th*ext), cy[g]+uy*(R[g]+th*ext)]; };
  function computeRots(){
    rots[0]=rot0;
    for (let j=1;j<K;j++){ const sj=Math.PI*2/N[j]; rots[j]=phi[j]+Math.PI-sj/2-(rots[j-1]-phi[j])*N[j-1]/N[j]; }
  }
  const omegaOf = j => L.w*N[0]/N[j];

  function endlessLevel(r){
    const k = 2 + (r % 3), n = [];
    let top = Math.min(12, 7 + Math.floor(r/2) + Math.floor(Math.random()*2));
    for (let j=0;j<k;j++){ n.push(Math.max(4, top)); top -= 1 + Math.floor(Math.random()*2); }
    return {n, w:Math.min(2.4, 1.5 + r*0.05), win:Math.max(0.13, 0.22 - r*0.004), flip:r>0, wobble:r>2, boss:(r+1)%5===0};
  }

  function startLevel(i){
    shards=[]; exploded=[];
    if (endless){ round=i; L=endlessLevel(i); } else { level=i; L=LEVELS[i]; }
    N=L.n; K=N.length; rot0=0; filled=N.map(n=>Array(n).fill(null));
    active=0; flying=null; dir=1; flipAt=time+2+Math.random()*2;
    slowUsed=false; slowT=0; lvStats={lost:0,hits:0,perf:0}; makeBonusSlots();
    if (pendingDouble){ doubleT=pendingDouble; pendingDouble=0; }
    boss={next:time+2.5, warn:0, pause:0, lockAt:time+1.5, lock:null};
    layout(); computeRots(); updateHud();
  }
  const BONUS = {
    star:   {icon:'⭐', color:'#ffd23f'},
    gem:    {icon:'💎', color:'#38e1ff'},
    clock:  {icon:'⏱️', color:'#9be7ff'},
    heart:  {icon:'❤️', color:'#ff4f6d'},
    shield: {icon:'🛡️', color:'#7dff6a'},
  };
  function makeBonusSlots(){
    bonusSlots = N.map(n => Array(n).fill(null));
    for (let g=0; g<K; g++){
      const cnt = N[g]>=9 ? 2 : 1;
      for (let c=0;c<cnt;c++){
        const i = Math.floor(Math.random()*N[g]); if (bonusSlots[g][i]) continue;
        const r = Math.random();
        bonusSlots[g][i] = r<0.42?'star' : r<0.62?'gem' : r<0.78?'clock' : r<0.9?'shield' : (lives<MAX_LIVES?'heart':'star');
      }
    }
    gearPerfect = N.map(()=>true); levelStart = time;
  }
  function applyBonus(type, x, y){
    const B = BONUS[type];
    burst(x, y, B.color, 26, 260);
    if (type==='star'){ const pts=500*mult(); score+=pts; floatText(x, y-th*3.2, `⭐ +${pts}`, B.color, 20); }
    if (type==='gem'){ doubleT=10; floatText(x, y-th*3.2, t('gem1'), B.color, 18); showToast(t('gem2'), B.color, 1200); }
    if (type==='clock'){ slowUsed=false; floatText(x, y-th*3.2, t('clock'), B.color, 18); }
    if (type==='heart'){ lives=Math.min(MAX_LIVES, lives+1); floatText(x, y-th*3.2, t('heart'), B.color, 20); }
    if (type==='shield'){ shield=true; floatText(x, y-th*3.2, t('shield1'), B.color, 20); showToast(t('shield2'), B.color, 1200); }
    tone(1568,0.25,'sine',0.07); tone(2093,0.3,'sine',0.05,0.08); buzz([15,30,15]);
  }
  function retryGear(g){ filled[g]=Array(N[g]).fill(null); gearPerfect[g]=true; flying=null; state='play'; boss.lock=null; updateHud(); }
  function retryLevel(){ filled=N.map(n=>Array(n).fill(null)); active=0; flying=null; state='play'; boss.lock=null; makeBonusSlots(); updateHud(); }

  function updateHud(){
    lvlEl.textContent = endless ? t('round',round+1) : t('lvl',level+1,TOTAL);
    scoreEl.textContent = fmt(score); slowBtn.innerHTML=`<b>⏱</b>${t('slow')}`;
    heartsEl.innerHTML = Array.from({length:MAX_LIVES},(_,i)=>`<span class="${i<lives?'':'off'}">❤️</span>`).join('');
    const n = filled[active].filter(Boolean).length;
    subEl.textContent = `${L.boss?'👹 BOSS · ':''}${t('gear')} ${active+1}/${K} · ${t('tooth')} ${n}/${N[active]}`;
    dotsEl.innerHTML = endless ? '' : LEVELS.map((lv,i)=>`<i class="${i<level?'done':i===level?'cur':''} ${lv.boss?'boss':''}"></i>`).join('');
    const ex=[]; if(L.flip) ex.push(t('flip')); if(L.wobble) ex.push(t('wobble')); if(L.boss) ex.push(t('bossHint'));
    hint.textContent = ex.length ? ex.join(' · ') : t('tapHint');
    slowBtn.classList.toggle('used', slowUsed);
    const m = mult();
    comboEl.textContent = [fever>0 ? `🔥 FEVER x${m*2}` : combo>=3 ? `${t('combo')} ${combo} · x${m}` : '', doubleT>0?'💎 x2':'', shield?'🛡️':''].filter(Boolean).join('  ');
  }
  const mult = () => Math.min(5, 1 + Math.floor(combo/3));

  function showToast(text, color, ms=1000){
    toast.textContent=text; toast.style.color=color; toast.classList.add('show');
    clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'), ms);
  }
  // kart: html + düğmeler [{label, ghost, go}]
  function showCard(html, buttons, withThemes){
    box.innerHTML = html + `<div class="btns">${buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}">${b.label}</button>`).join('')}</div>` + (withThemes ? themesHtml() : '');
    card.classList.remove('hide');
    box.querySelectorAll('.btn').forEach(el => el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio(); card.classList.add('hide'); buttons[+el.dataset.i].go();
    }));
    box.querySelectorAll('.lg').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); SAVE.lang=el.dataset.l; persist(); document.documentElement.lang=SAVE.lang; menu(); }));
    box.querySelectorAll('.tg').forEach(el => el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio(); const k=el.dataset.t;
      if (k==='music') setMusic(!SAVE.music); else { SAVE[k]=!SAVE[k]; persist(); }
      el.classList.toggle('on', SAVE[k]); el.textContent = (k==='music'?t('gm'):k==='helper'?t('helper'):t('sfx')) + ': ' + (SAVE[k]?t('on'):t('off'));
    }));
    box.querySelectorAll('.lnk').forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
    box.querySelectorAll('.shr').forEach(el => el.addEventListener('click', e => {

  function updateShards(dt){

        ctx.strokeStyle=p.e; ctx.lineWidth=2.5; ctx.stroke();      // parlayan kırık kenar

  }
  // ---------- GÜNLÜK BONUS ----------
  function dailyBonus(){
    const today = new Date().toISOString().slice(0,10);
    if (SAVE.lastDay === today) return 0;
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);

  function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=p<0?0:255,a=Math.abs(p);
    return `rgb(${Math.round((t-r)*a+r)},${Math.round((t-g)*a+g)},${Math.round((t-b)*a+b)})`; }
  function fillTooth(color,x0,glow){
    const gr=ctx.createLinearGradient(x0,0,x0+th,0); gr.addColorStop(0,shade(color,-0.35)); gr.addColorStop(0.6,color); gr.addColorStop(1,shade(color,0.4));

  }

  function drawGear(g){
    if (exploded[g]) return;

    const isActive = g===active && (state==='play'||state==='fail');

      const col = isBoss ? 'rgba(255,60,90,' : hexA(isActive?T.a:T.b);

    }

      }

    ctx.save(); ctx.shadowColor='rgba(20,0,60,.45)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;

    const ring=ctx.createLinearGradient(-r,-r,r,r);
    ring.addColorStop(0,'rgba(255,255,255,.55)'); ring.addColorStop(.5,'rgba(255,255,255,.05)'); ring.addColorStop(1,'rgba(255,255,255,.35)');

    const holes = n>=8?6:n>=5?5:4;
    for(let i=0;i<holes;i++){
      const a=i*Math.PI*2/holes+0.4, hx=Math.cos(a)*r*0.58, hy=Math.sin(a)*r*0.58, hr=r*0.13;

    ctx.fillStyle=hub; ctx.beginPath(); ctx.arc(0,0,r*0.26,0,Math.PI*2); ctx.fill();

    else { ctx.fillStyle = done?'#7dff6a':isActive?T.a:'#555c88'; if(isActive||done){ ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12; }

    ctx.restore();
  }
  function hexA(hex){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},`; }

    const bl = fever>0 ? ['#ffd23f','#ff4f8b','#ff9f1c','#ffffff'] : (T.cham ? chamBl(time) : T.blobs);
    const M=Math.max(W,H);
    ctx.globalCompositeOperation='lighter';
    for (let i=0;i<4;i++){
      const x=W*(0.5+0.42*Math.sin(time*0.13+i*1.7)), y=H*(0.45+0.38*Math.cos(time*0.11+i*2.3)), r=M*(0.45+0.1*Math.sin(time*0.2+i));
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(bl[i])+'0.32)'); g.addColorStop(1,hexA(bl[i])+'0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    // ışık bulanıkları (bokeh)
    for (const b of bokeh){
      const x=((b.x + Math.sin(time*0.05*b.s+b.p)*0.05)%1)*W, y=(((b.y - time*0.012*b.s)%1)+1)%1*H, r=b.r*Math.min(W,H);
      const g=ctx.createRadialGradient(x,y,0,x,y,r); const c=bl[b.c];
      g.addColorStop(0,hexA(c)+'0.22)'); g.addColorStop(0.7,hexA(c)+'0.08)'); g.addColorStop(1,hexA(c)+'0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // yıldız tozları
    for (const s of stars){ ctx.globalAlpha=0.35+0.55*Math.sin(time*1.6+s.p)**2; ctx.fillStyle='#ffffff';
      const yy = fever>0 ? ((s.y - time*80*s.r)%H+H)%H : s.y;
      ctx.beginPath(); ctx.arc(s.x, yy, s.r, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    // ince perspektif ızgara (alt kısımda)
    ctx.save(); ctx.globalAlpha=0.12; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    const hy=H*0.78; for (let i=0;i<8;i++){ const yy=hy+(H-hy)*Math.pow(((i+(time*0.3)%1)/8),2); ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
    for (let i=-8;i<=8;i++){ ctx.beginPath(); ctx.moveTo(W/2+i*W*0.04,hy); ctx.lineTo(W/2+i*W*0.25,H); ctx.stroke(); }
    ctx.restore();
    // ekolayzer (müziğe göre)
    const nb = device==='tablet'?36:26, bw=W/nb;
    for (let i=0;i<nb;i++){
      const v = freq && SAVE.music ? freq[Math.min(freq.length-1, 1+Math.floor(i*freq.length*0.7/nb))]/255 : (0.22+0.18*Math.sin(time*3+i*0.7)*Math.sin(time*1.3+i));
      const h=Math.max(4, v*H*0.26);
      const g=ctx.createLinearGradient(0,H-h,0,H); g.addColorStop(0,'rgba(255,255,255,.5)'); g.addColorStop(0.3,hexA(T.pal[i%T.pal.length])+'0.4)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(i*bw+bw*0.18,H-h,bw*0.64,h,bw*0.3); else ctx.rect(i*bw+bw*0.18,H-h,bw*0.64,h); ctx.fill();
    }
    // hız çizgileri
    ctx.save(); ctx.globalAlpha=0.14+beat*0.25; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    const sp=(80+(level||0)*12+(fever>0?260:0));
    for (const st of stars.slice(0,22)){ const yy=((st.y+time*sp*(0.6+st.r*0.4))%(H+80))-80; ctx.beginPath(); ctx.moveTo(st.x,yy); ctx.lineTo(st.x,yy+30+st.r*40); ctx.stroke(); }
    ctx.restore();
  }
  function drawVignette(){
    if (lives===1 && (state==='play'||state==='fail')){
      const p=0.35+0.25*Math.sin(time*7);
      const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
      v.addColorStop(0,'rgba(255,0,40,0)'); v.addColorStop(1,`rgba(255,0,40,${p})`); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    }
    if (fever>0){
      const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);
      v.addColorStop(0,'rgba(255,140,0,0)'); v.addColorStop(1,`rgba(255,140,0,${0.25+0.1*Math.sin(time*12)})`); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    }
    if (slowT>0){ ctx.fillStyle='rgba(120,200,255,.08)'; ctx.fillRect(0,0,W,H); }
  }
  function drawArcs(){
    for (const a of arcs){
      const x0=cx[a.a], y0=cy[a.a], x1=cx[a.b], y1=cy[a.b];
      ctx.save(); ctx.globalAlpha=a.life/0.3; ctx.strokeStyle='#cfefff'; ctx.shadowColor=T.a; ctx.shadowBlur=16; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(x0,y0);
      for (let k=1;k<10;k++){ const t=k/10; ctx.lineTo(x0+(x1-x0)*t+(Math.random()-.5)*th*1.6, y0+(y1-y0)*t+(Math.random()-.5)*th*1.6); }
      ctx.lineTo(x1,y1); ctx.stroke(); ctx.restore();
    }
  }

  // ================= DÖNGÜ =================
  function updateBoss(dt){
    if (!L.boss || state!=='play') return;
    if (boss.pause>0){ boss.pause-=dt; if (boss.pause<=0) boss.next=time+3.2+Math.random()*2; }
    else if (time>boss.next-0.55 && boss.warn<=0 && time<boss.next){ boss.warn=0.55; sfx.warn(); }
    if (boss.warn>0){ boss.warn-=dt; if (boss.warn<=0){ boss.pause=0.45; } }
    if (time>boss.lockAt){
      const g=active, empt=[]; for(let i=0;i<N[g];i++) if(!filled[g][i]) empt.push(i);
      if (empt.length>1){ boss.lock={g, i:empt[Math.floor(Math.random()*empt.length)], until:time+2.2}; }
      boss.lockAt=time+4.5+Math.random()*2;
    }
  }

  function frame(t){
    const dt=Math.min(0.05,(t-(lastT||t))/1000); lastT=t; time+=dt;
    const running = state==='play'||state==='fail';
    if (L){
      if (running && L.flip && time>flipAt){ dir*=-1; flipAt=time+3+Math.random()*2.5; }
      if (running) updateBoss(dt);
      rot0 += (running ? L.w*speedFactor() : 0.5)*dir*dt; computeRots();
    }
    musicAdapt();
    if (analyser && freq && SAVE.music){ analyser.getByteFrequencyData(freq); let b=0; for(let i=1;i<6;i++) b+=freq[i]; b=b/5/255; beat=Math.max(beat*0.88, Math.pow(Math.max(0,b-0.35)/0.65,1.6)); }
    else beat=Math.max(beat*0.9, Math.pow(Math.max(0,Math.sin(time*Math.PI*2*100/60)),8)*0.5);
    for (const w of waves){ w.r+=dt*th*30; w.life-=dt; } waves=waves.filter(w=>w.life>0);
    updateShards(dt);
    if (slowT>0){ slowT-=dt; if (slowT<=0) slowBtn.classList.remove('on'); }
    if (fever>0 && running){ fever-=dt; if (fever<=0) updateHud(); }
    if (doubleT>0 && running){ doubleT-=dt; if (doubleT<=0) updateHud(); }
    if (lives===1 && running && time>heartAt){ sfx.heart(); heartAt=time+0.9; }
    if (flying){
      if (!flying.miss){ flying.t+=dt; if (flying.t>=FLY) land(); }
      else { flying.vy+=1000*dt; flying.mx+=flying.vx*dt; flying.my+=flying.vy*dt; flying.spin+=9*dt; }
    }
    for (const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; }
    particles=particles.filter(p=>p.life>0);
    for (const f of floaters){ f.life-=dt*1.1; f.y-=40*dt; } floaters=floaters.filter(f=>f.life>0);
    for (const a of arcs) a.life-=dt; arcs=arcs.filter(a=>a.life>0);
    if (shake>0) shake-=dt;

    drawBg();
    if (L){
      ctx.save();
      if (shake>0) ctx.translate((Math.random()-.5)*12*shake/.4,(Math.random()-.5)*12*shake/.4);
      for (let j=K-1;j>=0;j--) drawGear(j);
      drawShards(); drawArcs(); drawHelper(); drawLauncher();
      for (const w of waves){ ctx.save(); ctx.globalAlpha=Math.max(0,w.life*1.6); ctx.strokeStyle=w.c; ctx.lineWidth=3; ctx.shadowColor=w.c; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
      if (flying){
        const g=flying.g;
        if (!flying.miss){
          const [x0,y0]=LP(g,3.7), [x1,y1]=LP(g,0.5), k=Math.min(1,flying.t/FLY), xk=x0+(x1-x0)*k, yk=y0+(y1-y0)*k;
          ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle=flying.color; ctx.lineWidth=toothW()*0.5; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xk,yk); ctx.stroke(); ctx.restore();
          drawLooseTooth(xk, yk, 0, flying.color, LB[g]);
        } else drawLooseTooth(flying.mx, flying.my, flying.spin, flying.color, LB[flying.g]);
      }
      for (const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      for (const f of floaters){ const sc=1+0.3*Math.max(0,f.life-0.8)*5;
        ctx.globalAlpha=Math.min(1,f.life*1.5); ctx.font=`800 ${f.size*sc}px 'Bricolage Grotesque', sans-serif`; ctx.textAlign='center';
        ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=14; ctx.fillText(f.text,f.x,f.y); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      ctx.restore();
      drawVignette();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', ()=>{ if (L) layout(); });
  menu();
  requestAnimationFrame(frame);
})();
</script>
