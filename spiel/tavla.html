    if (dice.opening){
      const pos=[[F+7+3,MID],[F+3,MID]];
      for (let i=0;i<2;i++){ const [sx,sy]=toScreen(...pos[i]); const slide=(1-ease(Math.min(1,ph)))*sz*3; drawDie(sx+(i?-slide:slide),sy,sz,face(i,dice.vals[i]),i,ph,1,i*1.7+0.3); }
      return; }
    const p=dice.side, base=p===0?F+7+3:F+3, dbl=dice.vals[0]===dice.vals[1];
    let used=[false,false];
    if (ph>=1 && (phase==='move'||phase==='bot'||phase==='wait')){
      if (dbl){ used=[rem.length<=2,rem.length===0]; }
      else { const r2=rem.slice(); for (let i=0;i<2;i++){ const j=r2.indexOf(dice.vals[i]); if (j>=0) r2.splice(j,1); else used[i]=true; } }
    }
    for (let i=0;i<2;i++){ const [sx,sy]=toScreen(base+(i?0.75:-0.75),MID); const slide=(1-ease(Math.min(1,ph)))*sz*3*(p===0?1:-1); drawDie(sx+(ROT?0:slide),sy+(ROT?slide:0),sz,face(i,dice.vals[i]),p,ph,used[i]?0.38:1,i*2.3+dice.vals[i]*0.37); }
    if (dbl && ph>=1 && rem.length){ const [sx,sy]=toScreen(base,MID); const yy=ROT?sy:sy+sz*0.95, xx=ROT?sx-sz*0.95:sx;
      for (let i=0;i<4;i++){ const on=i<rem.length; ctx.fillStyle=on?'#facc15':'rgba(255,255,255,.25)'; ctx.shadowColor='#facc15'; ctx.shadowBlur=on?8:0;
        ctx.beginPath(); ctx.arc(ROT?xx:xx+(i-1.5)*sz*0.32, ROT?yy+(i-1.5)*sz*0.32:yy, sz*0.09,0,Math.PI*2); ctx.fill(); } ctx.shadowBlur=0; }
  }
  function drawScene(){
    if (!boardCache) buildBoard();
    boardTf(); ctx.drawImage(boardCache,0,0,BW,BH);
    const pulse=0.5+0.5*Math.sin(time*5);
    // hedef haneleri parlat
    if (targets && phase==='move'){
      for (const r of targets.keys()){
        if (r===0){ ctx.fillStyle=cham(time,0,60,0.25+0.25*pulse); ctx.fillRect(TX+0.04,F+5.6,TRAY-0.08,5.36); ctx.strokeStyle=cham(time,0,65,0.9); ctx.lineWidth=0.06; ctx.strokeRect(TX+0.06,F+5.62,TRAY-0.12,5.32); continue; }
        const idx=idxOf(0,r); triPath(idx); ctx.fillStyle=cham(time,idx*0.1,62,0.3+0.3*pulse); ctx.fill(); ctx.strokeStyle=cham(time,idx*0.1,70,0.95); ctx.lineWidth=0.06; ctx.stroke(); }
    }
    // toplanmış pullar (yan görünüm)
    for (const p of [0,1]){ const n=st.off[p]-(hide['off'+p]||0);
      for (let k=0;k<n;k++){ const [x,y]=slotPos({t:'off',p},k,n); const g=ctx.createLinearGradient(0,y-0.13,0,y+0.13);
        if (p===0){ g.addColorStop(0,'#fffaf0'); g.addColorStop(.5,'#ecd5a6'); g.addColorStop(1,'#a8834a'); } else { g.addColorStop(0,'#9a4630'); g.addColorStop(.5,'#4a150b'); g.addColorStop(1,'#1a0502'); }
        rr(ctx,x-0.44,y-0.13,0.88,0.26,0.1); ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle=p?'rgba(217,169,79,.7)':'rgba(120,80,30,.6)'; ctx.lineWidth=0.02; ctx.stroke(); } }
    screenTf();
    // pullar
    const big=[];
    for (let idx=0;idx<24;idx++){ const v=st.pts[idx]; if(!v) continue; const p=v>0?0:1, n=Math.abs(v), sl={t:'pt',idx,key:'pt'+idx}, vis=n-(hide[sl.key]||0);
      for (let k=0;k<vis;k++){ const [sx,sy]=toScreen(...slotPos(sl,k,n)); drawChecker(p,sx,sy); }
      if (n>5 && vis>0){ big.push([toScreen(...slotPos(sl,vis-1,n)),vis,p]); } }
    for (const p of [0,1]){ const n=st.bar[p], sl={t:'bar',p,key:'bar'+p}, vis=n-(hide[sl.key]||0); for (let k=0;k<vis;k++){ const [sx,sy]=toScreen(...slotPos(sl,k,n)); drawChecker(p,sx,sy); } if (vis>4) big.push([toScreen(...slotPos(sl,vis-1,n)),vis,p]); }
    ctx.font=`900 ${Math.max(11,S*0.42)}px 'Bricolage Grotesque',system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const [[x,y],n,p] of big){ ctx.fillStyle=p?'#f6cf6a':'#5a3510'; ctx.fillText(n,x,y+1); }
    // oynanabilir pullar / seçim
    if (phase==='move' && !busy){
      if (sel==null){ for (const r of sourcesNow()){ const [sx,sy]=toScreen(...topPos(0,r)); ctx.strokeStyle=cham(time,r*0.07,62,0.45+0.4*pulse); ctx.lineWidth=Math.max(2,S*0.08); ctx.beginPath(); ctx.arc(sx,sy,S*0.5,0,Math.PI*2); ctx.stroke(); } }
      else { const [sx,sy]=toScreen(...topPos(0,sel)); ctx.save(); ctx.shadowColor=cham(time,0,60); ctx.shadowBlur=18; ctx.strokeStyle=cham(time,0,66); ctx.lineWidth=Math.max(3,S*0.12); ctx.beginPath(); ctx.arc(sx,sy,S*0.54,0,Math.PI*2); ctx.stroke(); ctx.restore();
        if (targets) for (const r of targets.keys()){ const [lx,ly]=toScreen(...landPos(r)); ctx.globalAlpha=0.35+0.25*pulse; drawChecker(0,lx,ly,1,0.45); ctx.globalAlpha=1; ctx.strokeStyle=cham(time,r*0.1,70,0.9); ctx.setLineDash([4,4]); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(lx,ly,S*0.44,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); } }
      if (hint && SAVE.helper){ arrow(topPos(0,hint.from), landPos(hint.to), '#facc15', 0.75+0.25*pulse, true); }
    }
    // Orbo’nun son hamleleri (sönen iz)
    for (const m of botMarks){ const age=time-m.t; if (age<3) arrow(m.a,m.b,'#ff9a6a',Math.max(0,0.55*(1-age/3)),false); }
    // uçan pullar
    for (const a of anims){ if (a.t<0) { continue; } const f=ease(Math.min(1,a.t/a.dur)), lift=Math.sin(Math.PI*Math.min(1,a.t/a.dur));
      const [x1,y1]=toScreen(...a.a), [x2,y2]=toScreen(...a.b); const x=x1+(x2-x1)*f, y=y1+(y2-y1)*f-lift*S*0.9;
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x1+(x2-x1)*f+lift*S*0.25,y1+(y2-y1)*f+S*0.15,S*0.42,S*0.3,0,0,Math.PI*2); ctx.fill();
      drawChecker(a.p,x,y,1+0.22*lift); }
    // flying checkers that have not started yet are drawn at their start position
    for (const a of anims){ if (a.t<0){ const [x,y]=toScreen(...a.a); drawChecker(a.p,x,y); } }
    drawDice();
  }
  function frame(ts){
    const dt=Math.min(0.05,(ts-(lastT||ts))/1000); lastT=ts; time+=dt;
    for (const a of anims){ a.t+=dt; } const done=anims.filter(a=>a.t>=a.dur); if (done.length){ for (const a of done) hide[a.key]=Math.max(0,(hide[a.key]||0)-1); anims=anims.filter(a=>a.t<a.dur); }
    try{ drawBg(); drawScene(); }catch(e){ console.error(e); }
    for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; } parts=parts.filter(p=>p.life>0);
    for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{ layout(); });
  addEventListener('keydown',e=>{
    if(!$('card2').classList.contains('hide')){ if (e.code==='Enter'||e.code==='Space'){ e.preventDefault(); $('box').querySelector('.btn')?.dispatchEvent(new Event('pointerdown')); } return; }
    if ((e.code==='Space'||e.code==='Enter') && phase==='await'){ e.preventDefault(); unlockAudio(); rollFor(0); }
    if (e.code==='KeyU'||(e.code==='KeyZ'&&(e.ctrlKey||e.metaKey))) undo();
    if (e.code==='Escape') menu();
  });

  // ---------- test / hata ayıklama kancası ----------
  window.__tavla={
    engine:{initState,singleMoves,legalNow,allSeqs,applyMove,evalState,chooseSeq,pip,allHome},
    DBG,
    get state(){ return {st:clone(st),phase,turn,rem:rem.slice(),score:score.slice(),sel,targets:targets?[...targets.keys()]:null,legal:legal.map(m=>[m.from,m.to,m.d]),busy,anims:anims.length}; },
    tapBoard(bx,by){ const [sx,sy]=toScreen(bx,by); onTap(sx,sy); },
    tapR(r){ let pos; if(r===0) pos=[TCX,F+8]; else if(r===25) pos=[F+6.5,MID+1]; else { const idx=r-1; pos=[colX(idx),isTop(idx)?F+1:F+10]; } const [sx,sy]=toScreen(...pos); onTap(sx,sy); return [sx,sy]; },
    toScreen,
    load(o){ st=clone(o); memo=new Map(); if (phase==='move'){ snap={s:clone(st),rem:rem.slice()}; afterHumanStep(true); } hud(); },
    auto(on=true,speed=0.02){ AUTO=on; SPEED=on?speed:1; if (on){ newMatch(); $('card2').classList.add('hide'); } },
    simulate(n=20,lA=2,lB=1){ const res={games:0,turns:0,maxTurns:0,wins:[0,0],mars:0,errors:[]};
      for (let g=0;g<n;g++){ let s=initState(), p=Math.random()<0.5?0:1, turns=0;
        while(true){ const a=rnd6(), b=rnd6(), rm=a===b?[a,a,a,a]:[Math.max(a,b),Math.min(a,b)];
          const seq=chooseSeq(s,p,rm,p===0?lA:lB);
          let x=s, rr=rm.slice(); for (const m of seq.path){ const ok=legalNow(x,p,rr,new Map()).some(q=>q.from===m.from&&q.to===m.to&&q.d===m.d); if(!ok) res.errors.push('illegal'); x=applyMove(x,m); rr=removeDie(rr,m.d); } if (legalNow(x,p,rr,new Map()).length) res.errors.push('incomplete');
          s=seq.s; for (const q of [0,1]){ let c=s.bar[q]+s.off[q]; for(let i=0;i<24;i++){ const v=s.pts[i]; if(q===0&&v>0) c+=v; if(q===1&&v<0) c-=v; } if(c!==15) res.errors.push('count'); }
          if (skey(x)!==skey(s)) res.errors.push('pathmismatch');
          turns++; if (s.off[p]===15){ res.wins[p]++; if (s.off[1-p]===0) res.mars++; break; }
          if (turns>3000){ res.errors.push('deadlock'); break; } p=1-p; }
        res.games++; res.turns+=turns; res.maxTurns=Math.max(res.maxTurns,turns); }
      return res; }
  };

  layout(); hud(); menu(); requestAnimationFrame(frame);
})();
</script>
