<style>
  :root{--a:#2ee6c8;--b:#a6ff4d}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#0b2a2f;overflow-x:hidden}
  #bg{position:fixed;inset:0;z-index:0;background:linear-gradient(125deg,#1f8a6a,#145a5a,#1e5fa0,#7a3fa0,#c8642d,#1f8a6a);background-size:500% 500%;animation:cham 40s ease-in-out infinite}
  #bg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.18),transparent 55%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.35),transparent 60%)}
  @keyframes cham{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:6px}
  .logo{width:min(190px,46vw);height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
  h1.bklogo{margin:2px 0 0;display:flex;flex-direction:column;align-items:center;line-height:1}
  h1.bklogo .b{font-family:'Lilita One','Bricolage Grotesque',system-ui,sans-serif;font-weight:400;font-size:clamp(54px,14vw,84px);line-height:.95;color:#7ED957;-webkit-text-stroke:clamp(7px,1.6vw,10px) #12301E;paint-order:stroke fill;text-shadow:0 6px 0 #12301E;letter-spacing:2px}
  h1.bklogo .g{margin-top:8px;font-family:'Lilita One','Bricolage Grotesque',system-ui,sans-serif;font-weight:400;font-size:clamp(17px,4.4vw,24px);letter-spacing:6px;color:#12301E;background:#FFC93C;padding:5px 16px 4px 22px;border-radius:999px;border:3px solid #12301E;box-shadow:0 4px 0 #12301E}
  @keyframes shine{to{background-position:300% 0}}
  .tag{font-size:clamp(15px,3.6vw,19px);color:#eafff6;opacity:.95}
  .langs{display:flex;gap:10px;margin-top:8px}
  .lg{font-size:24px;line-height:1;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);cursor:pointer;opacity:.6}
  .lg.sel{opacity:1;border-color:var(--b);box-shadow:0 0 12px var(--b)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
  .game{position:relative;display:block;text-decoration:none;color:#fff;border-radius:24px;padding:18px 18px 72px;min-height:190px;overflow:hidden;border:1px solid rgba(255,255,255,.3);box-shadow:0 16px 40px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
  .game:active,.game:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 22px 50px rgba(0,0,0,.4)}
  .game::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 62%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite;pointer-events:none}
  @keyframes sheen{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
  .g1{background:linear-gradient(150deg,#2ee6c8,#1f8a6a 55%,#0b3a3a)}
  .g2{background:linear-gradient(150deg,#7b5cff,#2a6fb0 55%,#16234f)}
  .g3{background:linear-gradient(150deg,#c8642d,#6b3a1d 55%,#2a160b)}
  .g5{background:linear-gradient(150deg,#ff9a3c,#7c3fd6 55%,#1a1050)}
  .g4{background:linear-gradient(150deg,#e0a63a,#b3261e 50%,#3a0d08)}
  .thumb{position:absolute;right:12px;top:12px;width:112px;height:112px;border-radius:18px;object-fit:cover;border:3px solid #ffd23f;box-shadow:0 8px 22px rgba(0,0,0,.4);transform:rotate(4deg)}
  .art{position:absolute;right:-6px;top:-6px;width:130px;height:130px;opacity:.95}
  .game h2{margin:0;font-size:28px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  .game p{margin:6px 0 0;max-width:62%;font-size:14px;line-height:1.4;color:#f0fffb}
  .stat{margin-top:10px;font-size:13px;font-weight:800;color:#ffe9a8}
  .play{position:absolute;left:18px;bottom:18px;font-family:'Lilita One','Bricolage Grotesque',system-ui,sans-serif;font-weight:400;letter-spacing:1px;font-size:18px;padding:9px 22px;border-radius:999px;background:#FFC93C;color:#12301E;border:3px solid #12301E;box-shadow:0 4px 0 #12301E}
  .new{position:absolute;right:14px;bottom:16px;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:#ff4f8b;color:#fff}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pill.wa{background:linear-gradient(90deg,#25d366,#2ee6c8);color:#08222c;border:0}
  .pill.off{background:#ffd23f;color:#3a1d00;border:0;cursor:pointer;font:inherit;font-weight:800}
  .pill.apk{background:#3ddc84;color:#08222c;border:0}
  .note{margin-top:14px;text-align:center;font-size:13px;color:#eafff6;opacity:.9}
  footer{margin-top:28px;text-align:center;font-size:12px;color:#d9f5ee;opacity:.85;line-height:1.8}
  footer a{color:#d9f5ee}
  .feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .feat span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.2)}
  .daily{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:15px}
  .daily .fl{padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25)}
  .daily button{font:inherit;font-weight:900;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;background:linear-gradient(90deg,#a6ff4d,#2ee6c8);color:#08222c;box-shadow:0 6px 20px rgba(46,230,200,.45);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .cont{margin-top:12px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:900;font-size:18px;padding:12px 26px;border-radius:999px;background:#fff;color:#13231f;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .coins{margin-top:10px;font-weight:900;font-size:20px;padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#3a2300;box-shadow:0 6px 20px rgba(255,170,30,.45)}
  .panel{margin-top:22px;border-radius:22px;padding:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .panel h3{margin:0 0 10px;font-size:19px}
  .task{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;font-weight:700}
  .task .bar{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;min-width:60px}
  .task .bar i{display:block;height:100%;background:linear-gradient(90deg,#a6ff4d,#2ee6c8);border-radius:9px}
  .task.done{opacity:.65}.task .tx{flex:2}.task .rw{white-space:nowrap;color:#ffe08a}
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .item{border-radius:16px;padding:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);text-align:center;font-size:13px;font-weight:700}
  .item .pv{height:56px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:26px}
  .item button{margin-top:6px;width:100%;font:inherit;font-weight:900;border:0;border-radius:999px;padding:7px;cursor:pointer;background:#fff;color:#13231f}
  .item button.sel{background:#a6ff4d}.item button:disabled{opacity:.45}
  .ach{display:flex;flex-wrap:wrap;gap:8px}.ach span{font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);opacity:.5}.ach span.got{opacity:1;background:rgba(255,159,28,.3);border-color:#ffb347}
  @font-face{font-family:'Orbitron';font-weight:900;font-display:swap;src:url(fonts/orbitron-900.woff2) format('woff2')}
  #gmecha h2{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#fff 0%,#e6ebff 40%,#8b93cc 50%,#3b3f78 52%,#c9d1ff 60%,#f4f6ff 85%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #0b0828;filter:drop-shadow(0 2px 0 #1d1a52) drop-shadow(0 0 8px rgba(0,240,255,.6))}
  .g8{background:linear-gradient(150deg,#ff9a3c,#1b2b55 60%,#0b1020)}
  .g7{background:linear-gradient(150deg,#38e1ff,#6b2fd6 55%,#12082e)}
  .g6{background:linear-gradient(150deg,#e0a23a,#8a4b1f 55%,#3a1c0a)}
</style>
