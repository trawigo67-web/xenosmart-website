<style>
  :root{--a:#2ee6c8;--b:#a6ff4d}

  .logo{width:min(150px,36vw);height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
  h1{margin:4px 0 0;font-size:clamp(40px,9vw,64px);font-weight:800;letter-spacing:1px;line-height:1;background:linear-gradient(90deg,#c8ff5a,#2ee6c8,#ffd23f,#ff8c42,#c8ff5a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .tag{font-size:clamp(15px,3.6vw,19px);color:#eafff6;opacity:.95}
  .langs{display:flex;gap:10px;margin-top:8px}
  .lg{font-size:24px;line-height:1;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);cursor:pointer;opacity:.6}
  .lg.sel{opacity:1;border-color:var(--b);box-shadow:0 0 12px var(--b)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
  .game{position:relative;display:block;text-decoration:none;color:#fff;border-radius:24px;padding:18px 18px 72px;min-height:190px;overflow:hidden;border:1px solid rgba(255,255,255,.3);box-shadow:0 16px 40px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
  .game:active,.game:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 22px 50px rgba(0,0,0,.4)}
  .game::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 62%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite;pointer-events:none}
  @keyframes sheen{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
  .g1{background:linear-gradient(150deg,#2ee6c8,#1f8a6a 55%,#0b3a3a)}
  .g2{background:linear-gradient(150deg,#7b5cff,#2a6fb0 55%,#16234f)}
  .g3{background:linear-gradient(150deg,#c8642d,#6b3a1d 55%,#2a160b)}
  .g4{background:linear-gradient(150deg,#e0a63a,#b3261e 50%,#3a0d08)}
  .thumb{position:absolute;right:12px;top:12px;width:112px;height:112px;border-radius:18px;object-fit:cover;border:3px solid #ffd23f;box-shadow:0 8px 22px rgba(0,0,0,.4);transform:rotate(4deg)}
  .art{position:absolute;right:-6px;top:-6px;width:130px;height:130px;opacity:.95}
  .game h2{margin:0;font-size:28px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  .game p{margin:6px 0 0;max-width:62%;font-size:14px;line-height:1.4;color:#f0fffb}
  .stat{margin-top:10px;font-size:13px;font-weight:800;color:#ffe9a8}
  .play{position:absolute;left:18px;bottom:16px;font-weight:900;font-size:17px;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.95);color:#13231f;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .new{position:absolute;right:14px;bottom:16px;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:#ff4f8b;color:#fff}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;font-weight:800;font-size:15px;padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pill.wa{background:linear-gradient(90deg,#25d366,#2ee6c8);color:#08222c;border:0}
  .pill.apk{background:#3ddc84;color:#08222c;border:0}
  .note{margin-top:14px;text-align:center;font-size:13px;color:#eafff6;opacity:.9}
  footer{margin-top:28px;text-align:center;font-size:12px;color:#d9f5ee;opacity:.85;line-height:1.8}
  footer a{color:#d9f5ee}
  .feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .feat span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.2)}
</style>

<body>

<script>
(() => {
  let S={}; try{ S=JSON.parse(localStorage.getItem('disfirlat2')||'{}'); }catch(e){}
  let B={}, K={}, F={}; try{ F=JSON.parse(localStorage.getItem('surlar1453')||'{}'); }catch(e){} try{ B=JSON.parse(localStorage.getItem('neonblok')||'{}'); K=JSON.parse(localStorage.getItem('neonbatak')||'{}'); }catch(e){}
  let L=S.lang||((navigator.language||'tr').slice(0,2)); if(!['tr','de','en'].includes(L)) L='en';
  const T={
    tr:{tag:'Stres at, eğlen! 4 ücretsiz oyun – reklamsız.', d4:'Fatih Sultan Mehmet ile Konstantinopolis surlarını Şahi topuyla yık! 19 seviye, gemileri karadan yürütme bonusu, mehter marşı.', s4:(n,st)=>`Seviye ${n}/19 · ⭐ ${st}`, feat:['📱 Telefon & tablet','🌍 3 dil','🎵 Özel müzik','🚫 Reklam yok'], d1:'Dönen çarklara dişi tam zamanında fırlat. 15 seviye, boss çarkları, şans çarkı.', d2:'Düşen blokları diz, satırları patlat. Müziğe göre dans eden neon dünya.', d3:'Nostaljik kahvehanede ihaleli batak – 3 rakibe karşı.', play:'▶ Oyna', newT:'YENİ',
        s1:(l,st)=>`Seviye ${l}/15 · ⭐ ${st}`, s2:(h,b)=>`Rekor ${h} · En iyi seviye ${b}`, s3:(w,g)=>`Galibiyet ${w}/${g}`, share:'📤 Arkadaşına gönder', apk:'📱 Android uygulaması', ios:"📱 iPhone'da: Safari → Paylaş ⬆️ → Ana Ekrana Ekle", shareText:'Buko Games’i dene! 🦎🎮 1453 Surları Yık, Diş Fırlat, Neon Blok & Neon Batak – ücretsiz: https://xenosmart.de/spiel/'},
    de:{tag:'Stress abbauen, Spaß haben! 4 kostenlose Spiele – ohne Werbung.', d4:'Brich mit Fatih Sultan Mehmet und der Şahi-Kanone die Mauern Konstantinopels! 19 Level, Bonus: Schiffe über Land, Mehter-Marsch.', s4:(n,st)=>`Level ${n}/19 · ⭐ ${st}`, feat:['📱 Handy & Tablet','🌍 3 Sprachen','🎵 Eigene Musik','🚫 Keine Werbung'], d1:'Schieß die Zähne genau im richtigen Moment in die drehenden Zahnräder. 15 Level, Boss-Räder, Glücksrad.', d2:'Staple Blöcke, sprenge Reihen. Eine Neon-Welt, die zur Musik tanzt.', d3:'Batak mit Ansage im nostalgischen Kahvehane – gegen 3 Gegner.', play:'▶ Spielen', newT:'NEU',
        s1:(l,st)=>`Level ${l}/15 · ⭐ ${st}`, s2:(h,b)=>`Rekord ${h} · Bestes Level ${b}`, s3:(w,g)=>`Siege ${w}/${g}`, share:'📤 An Freunde senden', apk:'📱 Android-App', ios:'📱 Auf dem iPhone: Safari → Teilen ⬆️ → Zum Home-Bildschirm', shareText:'Probier Buko Games! 🦎🎮 1453 Surları Yık, Diş Fırlat, Neon Block & Neon Batak – kostenlos: https://xenosmart.de/spiel/'},
    en:{tag:'Relax and have fun! 4 free games – no ads.', d4:'Break the walls of Constantinople with Sultan Mehmed II and the giant Şahi cannon! 19 levels, ships-over-land bonus, Ottoman march.', s4:(n,st)=>`Level ${n}/19 · ⭐ ${st}`, feat:['📱 Phone & tablet','🌍 3 languages','🎵 Original music','🚫 No ads'], d1:'Shoot teeth into spinning gears at the perfect moment. 15 levels, boss gears, lucky wheel.', d2:'Stack blocks, blast rows. A neon world that dances to the music.', d3:'Bidding Batak in a nostalgic Turkish tea house – against 3 rivals.', play:'▶ Play', newT:'NEW',
        s1:(l,st)=>`Level ${l}/15 · ⭐ ${st}`, s2:(h,b)=>`Record ${h} · Best level ${b}`, s3:(w,g)=>`Wins ${w}/${g}`, share:'📤 Send to a friend', apk:'📱 Android app', ios:'📱 On iPhone: Safari → Share ⬆️ → Add to Home Screen', shareText:'Try Buko Games! 🦎🎮 1453 Surları Yık, Diş Fırlat, Neon Block & Neon Batak – free: https://xenosmart.de/spiel/'},
  };
  const FL={tr:'🇹🇷',de:'🇩🇪',en:'🇬🇧'};
  const $=id=>document.getElementById(id);
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inApp=/wv\)/.test(navigator.userAgent) || location.protocol==='file:';
  function render(){
    const t=T[L]; document.documentElement.lang=L;
    $('tag').textContent=t.tag; $('feat').innerHTML=t.feat.map(f=>`<span>${f}</span>`).join('');
    $('d4').textContent=t.d4;$('p4').textContent=t.play;$('nw4').textContent=t.newT;{const st=(F.stars||[]).reduce((a,v)=>a+(v||0),0);$('s4').textContent=F.unlocked>1?t.s4(Math.min(19,F.unlocked),st):'';}
    $('d1').textContent=t.d1; $('d2').textContent=t.d2; $('d3').textContent=t.d3;
    ['p1','p2','p3'].forEach(k=>$(k).textContent=t.play);
    const stars=(S.stars||[]).reduce((a,v)=>a+(v||0),0);
    $('s1').textContent = (S.lvl||stars) ? t.s1((S.lvl||0)+1, stars) : '';
    $('s2').textContent = B.hi ? t.s2(B.hi.toLocaleString(L), B.best||1) : '';
    $('s3').textContent = K.games ? t.s3(K.wins||0, K.games) : '';
    $('langs').innerHTML=Object.keys(FL).map(k=>`<button class="lg ${k===L?'sel':''}" data-l="${k}">${FL[k]}</button>`).join('');
    document.querySelectorAll('.lg').forEach(b=>b.onclick=()=>{ L=b.dataset.l; S.lang=L; try{ localStorage.setItem('disfirlat2',JSON.stringify(S)); }catch(e){} render(); });
    let acts=`<a class="pill wa" id="shr" href="https://wa.me/?text=${encodeURIComponent(t.shareText)}" target="_blank" rel="noopener">${t.share}</a>`;
    if (!ios && !inApp) acts+=`<a class="pill apk" href="BukoGames.apk" download>${t.apk}</a>`;
    $('actions').innerHTML=acts; $('note').textContent = (ios && !navigator.standalone) ? t.ios : '';
    $('shr').onclick=e=>{ if (navigator.share && !inApp){ e.preventDefault(); navigator.share({text:t.shareText}).catch(()=>{}); } };
  }
  if(location.protocol==='file:')$('g1453').href='https://xenosmart.de/spiel/1453/';
  render();
})();
</script>
