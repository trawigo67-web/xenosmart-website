<style>

  canvas{display:block;width:100vw;height:100vh}
  #top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
  .pill{background:var(--glass);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}

  #score{font-weight:900;font-size:16px;min-width:64px;text-align:center}
  #hearts span{font-size:16px;margin:0 1px;display:inline-block;transition:.3s}
  #hearts .off{filter:grayscale(1);opacity:.25;transform:scale(.8)}
  #sub{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-weight:800;font-size:19px;pointer-events:none;text-shadow:0 0 18px var(--a)}

  #dots{position:fixed;top:calc(106px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}

  #dots i.cur{background:var(--b);box-shadow:0 0 10px var(--b);transform:scale(1.35)}
  #dots i.boss{outline:1.5px solid #ff4d6d;outline-offset:1px}
  #hint{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:90px;text-align:center;color:rgba(255,255,255,.75);font-size:13px;pointer-events:none;padding-left:90px}

  #slow.on{box-shadow:0 0 28px var(--a);border-color:var(--a)}

  .music{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
  .music .row{display:flex;gap:6px;justify-content:center;margin:6px 0}
  .tg{flex:1;font:inherit;font-size:12px;font-weight:700;padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccd}
  .tg.on{border-color:var(--a);color:#fff;box-shadow:0 0 10px var(--a)}
  .lnk{flex:1;display:block;text-decoration:none;font-size:12px;font-weight:800;padding:8px 4px;border-radius:12px;color:#fff}

  body[data-device=tablet] #hearts span{font-size:22px}
  body[data-device=tablet] #sub{font-size:28px;top:calc(76px + env(safe-area-inset-top))}
  body[data-device=tablet] #combo{font-size:20px;top:calc(114px + env(safe-area-inset-top))}
  body[data-device=tablet] #dots{top:calc(142px + env(safe-area-inset-top));gap:8px}
  body[data-device=tablet] #dots i{width:10px;height:10px}
  body[data-device=tablet] #slow{width:84px;height:84px;font-size:13px} body[data-device=tablet] #slow b{font-size:30px}
  body[data-device=tablet] #mus{width:68px;height:68px;font-size:28px}
  body[data-device=tablet] #hint{font-size:16px}

  body[data-device=tablet] .btn{font-size:20px;padding:15px 24px}
  body[data-device=landscape] #sub{font-size:16px;top:calc(48px + env(safe-area-inset-top))}

  .lg{font-size:26px;line-height:1;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;opacity:.6}

  .small{font-size:12px;color:#8a90b8;margin-top:8px}

  const FLAGS = {tr:'🇹🇷', de:'🇩🇪', en:'🇬🇧'};
  if (!SAVE.lang){ const nl=(navigator.language||'tr').slice(0,2); SAVE.lang = I18N[nl] ? nl : (nl==='de'?'de':'en'); if(!I18N[SAVE.lang]) SAVE.lang='tr'; }

  const fmt = n => n.toLocaleString(t('loc'));
  function langHtml(){ return `<div class="langs">${Object.keys(FLAGS).map(k=>`<button class="lg ${SAVE.lang===k?'sel':''}" data-l="${k}">${FLAGS[k]}</button>`).join('')}</div>`; }

  // ================= DOM =================
  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), $=id=>document.getElementById(id);
  const lvlEl=$('lvl'), scoreEl=$('score'), heartsEl=$('hearts'), subEl=$('sub'), comboEl=$('combo'), dotsEl=$('dots'), hint=$('hint'), toast=$('toast'), card=$('card'), box=$('box'), slowBtn=$('slow'), musBtn=$('mus');

  let W,H,dpr,u,th, N=[], K=0, L=null, R=[], cx=[], cy=[], phi=[], rots=[], rot0=0;

  // ================= YERLEŞİM =================
  let device='phone';
  function layout(){
    dpr=Math.min(2.5, window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const short=Math.min(W,H);
    device = short>=700 ? 'tablet' : (W>H ? 'landscape' : 'phone');
    document.body.dataset.device = device;
    const cs=getComputedStyle(document.documentElement);
    const safeT=parseFloat(cs.getPropertyValue('--sat'))||0, safeB=parseFloat(cs.getPropertyValue('--sab'))||0;
    // oyun alanı: üst göstergeler ile alt düğmeler arası
    const topUI = (device==='tablet'?150:device==='landscape'?92:128) + safeT;
    const botUI = (device==='tablet'?120:device==='landscape'?70:96) + safeB;
    const AW = W*(device==='landscape'?0.80:0.92), AH = Math.max(120, H-topUI-botUI);
    const t1=1.8;
    const angles = K<=1 ? [0] : K===2 ? [0,0.35,0.6] : [0.42,0.3,0.55,0.7,0.2];
    let best=null;
    for (const ang of angles){
      const px=[0], py=[0], ph=[0];
      for (let j=1;j<K;j++){ const a=(K===2?ang:(j%2?ang:-ang)), d=N[j-1]+N[j]+t1*1.05; ph[j]=a; px[j]=px[j-1]+Math.cos(a)*d; py[j]=py[j-1]+Math.sin(a)*d; }
      // fırlatıcı yolu diğer çarklara çarpmasın
      let ok=true;
      for (let j=0;j<K && ok;j++) for (let k=0;k<K;k++){ if(k===j) continue;
        const rx0=px[j]-t1*1.3, rx1=px[j]+t1*1.3, ry0=py[j]+N[j], ry1=py[j]+N[j]+t1*5;
        const qx=Math.max(rx0,Math.min(px[k],rx1)), qy=Math.max(ry0,Math.min(py[k],ry1));
        if (Math.hypot(px[k]-qx,py[k]-qy) < N[k]+t1*0.9){ ok=false; break; } }
      if (!ok) continue;
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for (let j=0;j<K;j++){ const e=N[j]+t1; x0=Math.min(x0,px[j]-e); x1=Math.max(x1,px[j]+e); y0=Math.min(y0,py[j]-e); y1=Math.max(y1,Math.max(py[j]+e, py[j]+N[j]+t1*5)); }
      const uu=Math.min(AW/(x1-x0), AH/(y1-y0));
      if (!best || uu>best.u) best={u:uu,px,py,ph,x0,x1,y0,y1};
    }
    // çark çok büyümesin (tek çarkta)
    const maxR = short*(device==='tablet'?0.26:0.3);
    u = Math.min(best.u, maxR/N[0]); th=t1*u; phi=best.ph;
    const ox=W/2-(best.x0+best.x1)/2*u, oy=topUI+AH/2-(best.y0+best.y1)/2*u;
    R=N.map(n=>n*u); cx=best.px.map(x=>ox+x*u); cy=best.py.map(y=>oy+y*u);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6}));
    bokeh=Array.from({length:device==='tablet'?18:12},(_,i)=>({x:Math.random(),y:Math.random(),r:0.04+Math.random()*0.09,s:0.2+Math.random()*0.5,p:Math.random()*6,c:i%4}));
  }
  let bokeh=[];
  function computeRots(){
    rots[0]=rot0;

  }
  const omegaOf = j => L.w*N[0]/N[j];

  function endlessLevel(r){
    const k = 2 + (r % 3), n = [];
    let top = Math.min(12, 7 + Math.floor(r/2) + Math.floor(Math.random()*2));
    for (let j=0;j<k;j++){ n.push(Math.max(4, top)); top -= 1 + Math.floor(Math.random()*2); }
    return {n, w:Math.min(3.4, 2.2 + r*0.08), win:Math.max(0.085, 0.13 - r*0.003), flip:true, wobble:r>1, boss:(r+1)%5===0};
  }

  function startLevel(i){
    if (endless){ round=i; L=endlessLevel(i); } else { level=i; L=LEVELS[i]; }

    slowUsed=false; slowT=0; lvStats={lost:0,hits:0,perf:0}; makeBonusSlots();

    layout(); computeRots(); updateHud();
  }
  const BONUS = {
    star:   {icon:'⭐', color:'#ffd23f'},
    gem:    {icon:'💎', color:'#38e1ff'},
    clock:  {icon:'⏱️', color:'#9be7ff'},
    heart:  {icon:'❤️', color:'#ff4f6d'},
    shield: {icon:'🛡️', color:'#7dff6a'},
  };
  function makeBonusSlots(){
    bonusSlots = N.map(n => Array(n).fill(null));
    for (let g=0; g<K; g++){
      const cnt = N[g]>=9 ? 2 : 1;
      for (let c=0;c<cnt;c++){
        const i = Math.floor(Math.random()*N[g]); if (bonusSlots[g][i]) continue;
        const r = Math.random();
        bonusSlots[g][i] = r<0.42?'star' : r<0.62?'gem' : r<0.78?'clock' : r<0.9?'shield' : (lives<MAX_LIVES?'heart':'star');
      }
    }
    gearPerfect = N.map(()=>true); levelStart = time;
  }
  function applyBonus(type, x, y){
    const B = BONUS[type];
    burst(x, y, B.color, 26, 260);
    if (type==='star'){ const pts=500*mult(); score+=pts; floatText(x, y-th*3.2, `⭐ +${pts}`, B.color, 20); }
    if (type==='gem'){ doubleT=10; floatText(x, y-th*3.2, t('gem1'), B.color, 18); showToast(t('gem2'), B.color, 1200); }
    if (type==='clock'){ slowUsed=false; floatText(x, y-th*3.2, t('clock'), B.color, 18); }

  function retryLevel(){ filled=N.map(n=>Array(n).fill(null)); active=0; flying=null; state='play'; boss.lock=null; makeBonusSlots(); updateHud(); }

  function updateHud(){
    lvlEl.textContent = endless ? t('round',round+1) : t('lvl',level+1,TOTAL);

  // kart: html + düğmeler [{label, ghost, go}]

  const STARS_TXT = n => t('stars', n);
  function themesHtml(){
    const ts=totalStars();
    const web = location.protocol.startsWith('http');
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const getApp = ios
      ? (standalone ? '' : `<div class="small" style="color:#dfe3ff;font-size:13px">${t('ios')}</div>`)
      : `<a class="lnk" style="background:#3ddc84;color:#0b0d1a;display:block" href="https://xenosmart.de/spiel/DisFirlat.apk" download>${t('apk')}</a>`;
    const extra = web ? `<div class="music">${getApp}
      <div class="small"><a href="https://xenosmart.de/" style="color:#8a90b8">XenoSmart</a> · <a href="https://xenosmart.de/impressum.html" style="color:#8a90b8">Impressum</a> · <a href="https://xenosmart.de/datenschutz.html" style="color:#8a90b8">Datenschutz</a></div></div>` : '';

      <div class="row"><button class="tg ${SAVE.music?'on':''}" data-t="music">${t('gm')}: ${SAVE.music?t('on'):t('off')}</button><button class="tg ${SAVE.sfx?'on':''}" data-t="sfx">${t('sfx')}: ${SAVE.sfx?t('on'):t('off')}</button></div>

  const starsHtml = n => `<div class="stars">${[0,1,2].map(i=>`<span class="${i<n?'':'off'}">⭐</span>`).join('')}</div>`;

  // ================= SES =================
  // Telefonda Spotify / YouTube Music arkada çalarken oyun sesleri onu durdurmasın, karışsın
  try{ if (navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
  let ac, musGain, musTimer=null, musNext=0, musStep=0;
  function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume&&ac.resume(); if (SAVE.music && !musTimer) musicStart(); }catch(e){} }
  // ---- dahili sakin "lo-fi" müzik: Am – F – C – G, 84 BPM ----
  const CHORDS=[[220,261.6,329.6],[174.6,220,261.6],[130.8,164.8,196],[196,246.9,293.7]];
  const MEL=[659.3,523.3,587.3,523.3,440,523.3,392,440];
  function mNote(f,t0,d,type,v,dest){ const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+Math.min(0.08,d/3)); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(lp).connect(g).connect(dest); o.start(t0); o.stop(t0+d+0.05); }
  function mKick(t0){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(40,t0+0.15);
    g.gain.setValueAtTime(0.5,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.25); o.connect(g).connect(musGain); o.start(t0); o.stop(t0+0.3); }
  function mHat(t0){ const len=Math.floor(ac.sampleRate*0.04), b=ac.createBuffer(1,len,ac.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    f.type='highpass'; f.frequency.value=7000; g.gain.value=0.12; s.buffer=b; s.connect(f).connect(g).connect(musGain); s.start(t0); }
  // ---- ElevenLabs ile üretilmiş özel müzik (yoksa sentez müziğe düşer) ----
  const MUSIC_URL = 'music-gears.mp3';
  let musicBuf=null, musicTried=false, musicSrc=null, musFilter=null, musMode='';
  function loadMusic(cb){
    musicTried=true;
    try{
      const x=new XMLHttpRequest(); x.open('GET', MUSIC_URL); x.responseType='arraybuffer';
      x.onload=()=>{ if ((x.status===200||x.status===0) && x.response && x.response.byteLength>1000)
          ac.decodeAudioData(x.response, b=>{ musicBuf=b; cb(true); }, ()=>cb(false)); else cb(false); };
      x.onerror=()=>cb(false); x.send();
    }catch(e){ cb(false); }
  }
  function playBuf(){
    if (!musGain){ musGain=ac.createGain(); musGain.gain.value=0.0001; musGain.connect(ac.destination); }
    if (!musFilter){ musFilter=ac.createBiquadFilter(); musFilter.type='lowpass'; musFilter.frequency.value=18000; musFilter.connect(musGain); }
    musicSrc=ac.createBufferSource(); musicSrc.buffer=musicBuf; musicSrc.loop=true; musicSrc.connect(musFilter); musicSrc.start();
    musGain.gain.setTargetAtTime(0.5, ac.currentTime, 0.4); musTimer='buf';
  }
  function musicAdapt(){
    if (!musFilter || !ac) return;
    const mode = slowT>0 ? 'slow' : fever>0 ? 'fever' : 'normal';
    if (mode===musMode) return; musMode=mode;
    musFilter.frequency.setTargetAtTime(mode==='slow'?600:18000, ac.currentTime, 0.15);
    musGain.gain.setTargetAtTime(mode==='fever'?0.7:0.5, ac.currentTime, 0.2);
    if (musicSrc) musicSrc.playbackRate.setTargetAtTime(mode==='slow'?0.85:1, ac.currentTime, 0.2);
  }
  function musicStart(){
    if (!ac || musTimer) return;
    if (musicBuf){ playBuf(); return; }
    if (!musicTried){ musTimer='loading'; loadMusic(ok=>{ musTimer=null; if (!SAVE.music) return; ok ? playBuf() : musicSynth(); }); return; }
    musicSynth();
  }
  function musicSynth(){
    if (!ac || musTimer) return;
    musGain = musGain || (()=>{ const g=ac.createGain(); g.gain.value=0.22; g.connect(ac.destination); return g; })();
    musGain.gain.setTargetAtTime(0.22, ac.currentTime, 0.3);
    const beat = 60/84/2; musNext = ac.currentTime+0.1;
    musTimer = setInterval(()=>{
      while (musNext < ac.currentTime+0.4){
        const st=musStep%32, bar=Math.floor(musStep/8)%4, t0=musNext;
        if (st%8===0) CHORDS[bar].forEach(f=>mNote(f,t0,beat*8,'triangle',0.06,musGain));

  // ================= ÇİZİM =================
  const toothW = () => Math.PI*2*u*0.42;
  function toothShape(x0,w){ ctx.beginPath(); ctx.moveTo(x0,-w/2); ctx.lineTo(x0+th,-w*0.3); ctx.quadraticCurveTo(x0+th*1.08,0,x0+th,w*0.3); ctx.lineTo(x0,w/2); ctx.closePath(); }
  function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=p<0?0:255,a=Math.abs(p);
    return `rgb(${Math.round((t-r)*a+r)},${Math.round((t-g)*a+g)},${Math.round((t-b)*a+b)})`; }
  function fillTooth(color,x0,glow){
    const gr=ctx.createLinearGradient(x0,0,x0+th,0); gr.addColorStop(0,shade(color,-0.35)); gr.addColorStop(0.6,color); gr.addColorStop(1,shade(color,0.4));
    ctx.save(); if(glow){ ctx.shadowColor=color; ctx.shadowBlur=fever>0?22:14; } ctx.fillStyle=gr; ctx.fill(); ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.stroke();
  }

  function drawGear(g){
    const r=R[g], n=N[g], step=Math.PI*2/n, w=toothW();
    const isActive = g===active && (state==='play'||state==='fail');
    const done = filled[g].every(Boolean);
    const isBoss = L.boss && g===0;
    ctx.save(); ctx.translate(cx[g],cy[g]);
    {
      const col = isBoss ? 'rgba(255,60,90,' : hexA(isActive?T.a:T.b);
      const warnGlow = isBoss && boss.warn>0 ? 0.5+0.5*Math.sin(time*30) : 0;
      const halo=ctx.createRadialGradient(0,0,r*0.9,0,0,r*1.7);
      halo.addColorStop(0,col+((isActive||isBoss?0.32:0.12)+warnGlow*0.35)+')'); halo.addColorStop(1,col+'0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,Math.PI*2); ctx.fill();
    }
    ctx.rotate(rots[g]);
    for(let i=0;i<n;i++){
      ctx.save(); ctx.rotate(i*step); toothShape(r-3,w);
      const locked = boss.lock && boss.lock.g===g && boss.lock.i===i && time<boss.lock.until;
      if (filled[g][i]) fillTooth(filled[g][i], r-3, isActive||done);
      else if (locked){
        ctx.fillStyle='rgba(255,40,70,.35)'; ctx.fill(); ctx.strokeStyle='#ff3d5e'; ctx.lineWidth=2; ctx.stroke();
        ctx.beginPath(); const m=r-3+th/2, k=Math.min(th,w)*0.28; ctx.moveTo(m-k,-k); ctx.lineTo(m+k,k); ctx.moveTo(m-k,k); ctx.lineTo(m+k,-k);
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      } else {
        const bt = bonusSlots[g] && bonusSlots[g][i];
        ctx.fillStyle = bt ? hexA(BONUS[bt].color)+(0.25+0.15*Math.sin(time*6))+')' : (isActive?'rgba(255,255,255,.18)':'rgba(255,255,255,.08)'); ctx.fill();
        ctx.setLineDash([5,4]); ctx.lineWidth=2;
        ctx.strokeStyle = bt ? BONUS[bt].color : isActive ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)'; ctx.stroke(); ctx.setLineDash([]);
        if (bt){ const m=r-3+th*0.5; ctx.save(); ctx.translate(m,0); ctx.rotate(-(rots[g]+i*step)); ctx.font=`${Math.min(th,w)*0.62}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(BONUS[bt].icon,0,1); ctx.restore(); }
      }
      ctx.restore();
    }
    const pal = isActive ? T.body : T.idle;
    const body=ctx.createLinearGradient(-r,-r,r,r); body.addColorStop(0,pal[0]); body.addColorStop(.5,pal[1]); body.addColorStop(1,pal[2]);
    ctx.save(); ctx.shadowColor='rgba(20,0,60,.45)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle=body; ctx.fill(); ctx.restore();
    const ring=ctx.createLinearGradient(-r,-r,r,r);
    ring.addColorStop(0,'rgba(255,255,255,.55)'); ring.addColorStop(.5,'rgba(255,255,255,.05)'); ring.addColorStop(1,'rgba(255,255,255,.35)');
    ctx.lineWidth=3; ctx.strokeStyle= isBoss ? '#ff3d5e' : ring; ctx.beginPath(); ctx.arc(0,0,r-1.5,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.stroke();
    ctx.save(); ctx.rotate(-rots[g]);   // sabit ışık parlaması
    const sh=ctx.createLinearGradient(0,-r,0,r*0.2); sh.addColorStop(0,'rgba(255,255,255,.38)'); sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sh; ctx.beginPath(); ctx.ellipse(-r*0.12,-r*0.42,r*0.72,r*0.42,-0.25,0,Math.PI*2); ctx.fill(); ctx.restore();
    const holes = n>=8?6:n>=5?5:4;
    for(let i=0;i<holes;i++){
      const a=i*Math.PI*2/holes+0.4, hx=Math.cos(a)*r*0.58, hy=Math.sin(a)*r*0.58, hr=r*0.13;
      const hg=ctx.createRadialGradient(hx-hr*.3,hy-hr*.3,hr*.2,hx,hy,hr); hg.addColorStop(0,'rgba(15,10,45,.95)'); hg.addColorStop(1,'rgba(45,35,110,.9)');
      ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1; ctx.stroke();
    }
    const hub=ctx.createRadialGradient(-r*.08,-r*.08,0,0,0,r*0.28); hub.addColorStop(0,'#e6e9ff'); hub.addColorStop(.35,'#7a80a8'); hub.addColorStop(1,'#2a2d44');
    ctx.fillStyle=hub; ctx.beginPath(); ctx.arc(0,0,r*0.26,0,Math.PI*2); ctx.fill();
    ctx.rotate(-rots[g]);
    if (isBoss){ ctx.font=`${r*0.32}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('👹',0,r*0.02); }
    else { ctx.fillStyle = done?'#7dff6a':isActive?T.a:'#555c88'; if(isActive||done){ ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12; }
      ctx.beginPath(); ctx.arc(0,0,r*0.07,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
    ctx.restore();
  }
  function hexA(hex){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},`; }

  function drawLooseTooth(x,y,spin,color){ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/2+spin); toothShape(-th/2,toothW()); fillTooth(color,-th/2,true); ctx.restore(); }
  const launcherY = g => cy[g]+R[g]+th*2.8;

  function drawLauncher(){
    if (state!=='play' && state!=='fail') return;
    const g=active, x=cx[g], y=launcherY(g), s=th;
    const ty=cy[g]+R[g]+th*1.35, pulse=0.5+0.5*Math.sin(time*6);
    ctx.save(); ctx.shadowColor=T.b; ctx.shadowBlur=10+pulse*8; ctx.fillStyle=T.b;
    ctx.beginPath(); ctx.moveTo(x,ty-5); ctx.lineTo(x-6,ty+5); ctx.lineTo(x+6,ty+5); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.save(); ctx.shadowColor=T.a; ctx.shadowBlur=12; ctx.strokeStyle=T.a; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-s*1.1,y-s*0.2); ctx.lineTo(x-s*1.1,y+s*1.5); ctx.quadraticCurveTo(x-s*1.1,y+s*1.9,x-s*0.7,y+s*1.9);
    ctx.lineTo(x+s*0.7,y+s*1.9); ctx.quadraticCurveTo(x+s*1.1,y+s*1.9,x+s*1.1,y+s*1.5); ctx.lineTo(x+s*1.1,y-s*0.2); ctx.stroke(); ctx.restore();
    if (!flying && state==='play') drawLooseTooth(x, y+s*0.9, 0, nextColor());
  }

  function drawBg(){
    const g0 = fever>0 ? ['#ff7a18','#b8326a','#4a1450'] : T.bg;
    const lg=ctx.createLinearGradient(0,0,W*0.4,H);
    lg.addColorStop(0,g0[0]); lg.addColorStop(.55,g0[1]); lg.addColorStop(1,g0[2]); ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
    // aurora lekeleri
    const bl = fever>0 ? ['#ffd23f','#ff4f8b','#ff9f1c','#ffffff'] : T.blobs;
    const M=Math.max(W,H);
    ctx.globalCompositeOperation='lighter';
    for (let i=0;i<4;i++){
      const x=W*(0.5+0.42*Math.sin(time*0.13+i*1.7)), y=H*(0.45+0.38*Math.cos(time*0.11+i*2.3)), r=M*(0.45+0.1*Math.sin(time*0.2+i));
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(bl[i])+'0.32)'); g.addColorStop(1,hexA(bl[i])+'0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    // ışık bulanıkları (bokeh)
    for (const b of bokeh){
      const x=((b.x + Math.sin(time*0.05*b.s+b.p)*0.05)%1)*W, y=(((b.y - time*0.012*b.s)%1)+1)%1*H, r=b.r*Math.min(W,H);
      const g=ctx.createRadialGradient(x,y,0,x,y,r); const c=bl[b.c];
      g.addColorStop(0,hexA(c)+'0.22)'); g.addColorStop(0.7,hexA(c)+'0.08)'); g.addColorStop(1,hexA(c)+'0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // yıldız tozları
    for (const s of stars){ ctx.globalAlpha=0.35+0.55*Math.sin(time*1.6+s.p)**2; ctx.fillStyle='#ffffff';
      const yy = fever>0 ? ((s.y - time*80*s.r)%H+H)%H : s.y;
      ctx.beginPath(); ctx.arc(s.x, yy, s.r, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    // ince perspektif ızgara (alt kısımda)
    ctx.save(); ctx.globalAlpha=0.12; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    const hy=H*0.78; for (let i=0;i<8;i++){ const yy=hy+(H-hy)*Math.pow(((i+(time*0.3)%1)/8),2); ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
    for (let i=-8;i<=8;i++){ ctx.beginPath(); ctx.moveTo(W/2+i*W*0.04,hy); ctx.lineTo(W/2+i*W*0.25,H); ctx.stroke(); }
    ctx.restore();
  }
  function drawVignette(){
    if (lives===1 && (state==='play'||state==='fail')){
      const p=0.35+0.25*Math.sin(time*7);
      const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
      v.addColorStop(0,'rgba(255,0,40,0)'); v.addColorStop(1,`rgba(255,0,40,${p})`); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    }
    if (fever>0){
      const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);
      v.addColorStop(0,'rgba(255,140,0,0)'); v.addColorStop(1,`rgba(255,140,0,${0.25+0.1*Math.sin(time*12)})`); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    }
    if (slowT>0){ ctx.fillStyle='rgba(120,200,255,.08)'; ctx.fillRect(0,0,W,H); }
  }
  function drawArcs(){
    for (const a of arcs){
      const x0=cx[a.a], y0=cy[a.a], x1=cx[a.b], y1=cy[a.b];
      ctx.save(); ctx.globalAlpha=a.life/0.3; ctx.strokeStyle='#cfefff'; ctx.shadowColor=T.a; ctx.shadowBlur=16; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(x0,y0);
      for (let k=1;k<10;k++){ const t=k/10; ctx.lineTo(x0+(x1-x0)*t+(Math.random()-.5)*th*1.6, y0+(y1-y0)*t+(Math.random()-.5)*th*1.6); }
      ctx.lineTo(x1,y1); ctx.stroke(); ctx.restore();
    }
  }

  // ================= DÖNGÜ =================
  function updateBoss(dt){
    if (!L.boss || state!=='play') return;
    if (boss.pause>0){ boss.pause-=dt; if (boss.pause<=0) boss.next=time+2.2+Math.random()*1.6; }
    else if (time>boss.next-0.55 && boss.warn<=0 && time<boss.next){ boss.warn=0.55; sfx.warn(); }
    if (boss.warn>0){ boss.warn-=dt; if (boss.warn<=0){ boss.pause=0.6; } }
    if (time>boss.lockAt){
      const g=active, empt=[]; for(let i=0;i<N[g];i++) if(!filled[g][i]) empt.push(i);
      if (empt.length>1){ boss.lock={g, i:empt[Math.floor(Math.random()*empt.length)], until:time+2.2}; }
      boss.lockAt=time+3+Math.random()*1.5;
    }
  }

  function frame(t){
    const dt=Math.min(0.05,(t-(lastT||t))/1000); lastT=t; time+=dt;
    const running = state==='play'||state==='fail';
    if (L){
      if (running && L.flip && time>flipAt){ dir*=-1; flipAt=time+1.8+Math.random()*1.8; }
      if (running) updateBoss(dt);
      rot0 += (running ? L.w*speedFactor() : 0.5)*dir*dt; computeRots();
    }
    musicAdapt();
    if (slowT>0){ slowT-=dt; if (slowT<=0) slowBtn.classList.remove('on'); }
    if (fever>0 && running){ fever-=dt; if (fever<=0) updateHud(); }
    if (doubleT>0 && running){ doubleT-=dt; if (doubleT<=0) updateHud(); }
    if (lives===1 && running && time>heartAt){ sfx.heart(); heartAt=time+0.9; }
    if (flying){
      if (!flying.miss){ flying.t+=dt; if (flying.t>=FLY) land(); }
      else { flying.vy+=1000*dt; flying.mx+=flying.vx*dt; flying.my+=flying.vy*dt; flying.spin+=9*dt; }
    }
    for (const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; }
    particles=particles.filter(p=>p.life>0);
    for (const f of floaters){ f.life-=dt*1.1; f.y-=40*dt; } floaters=floaters.filter(f=>f.life>0);
    for (const a of arcs) a.life-=dt; arcs=arcs.filter(a=>a.life>0);
    if (shake>0) shake-=dt;

    drawBg();
    if (L){
      ctx.save();
      if (shake>0) ctx.translate((Math.random()-.5)*12*shake/.4,(Math.random()-.5)*12*shake/.4);
      for (let j=K-1;j>=0;j--) drawGear(j);
      drawArcs(); drawLauncher();
      if (flying){
        const g=flying.g;
        if (!flying.miss){
          const y0=launcherY(g)+th*0.9, y1=cy[g]+R[g]+th/2, k=Math.min(1,flying.t/FLY);
          ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle=flying.color; ctx.lineWidth=toothW()*0.5; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(cx[g],y0); ctx.lineTo(cx[g],y0+(y1-y0)*k); ctx.stroke(); ctx.restore();
          drawLooseTooth(cx[g], y0+(y1-y0)*k, 0, flying.color);
        } else drawLooseTooth(flying.mx, flying.my, flying.spin, flying.color);
      }
      for (const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      for (const f of floaters){ const sc=1+0.3*Math.max(0,f.life-0.8)*5;
        ctx.globalAlpha=Math.min(1,f.life*1.5); ctx.font=`800 ${f.size*sc}px 'Bricolage Grotesque', sans-serif`; ctx.textAlign='center';
        ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=14; ctx.fillText(f.text,f.x,f.y); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      ctx.restore();
      drawVignette();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', ()=>{ if (L) layout(); });
  menu();
  requestAnimationFrame(frame);
})();
</script>
</body>
