<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Diş Fırlat</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diş Fırlat">
<meta name="description" content="Diş Fırlat – dönen çarklara dişi doğru anda fırlat. 15 seviye, boss çarkları, sonsuz mod. Ücretsiz oyna.">
<style>
  :root{--a:#38e1ff;--b:#ff4fd8;--glass:rgba(255,255,255,.07)}
  html,body{margin:0;height:100%;background:#0b0d1a;color:#eef;font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}
  #top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
  .pill{background:var(--glass);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
  #score{font-weight:900;font-size:16px;min-width:64px;text-align:center}
  #hearts span{font-size:16px;margin:0 1px;display:inline-block;transition:.3s}
  #hearts .off{filter:grayscale(1);opacity:.25;transform:scale(.8)}
  #sub{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-weight:800;font-size:19px;pointer-events:none;text-shadow:0 0 18px var(--a)}
  #combo{position:fixed;top:calc(84px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-weight:900;font-size:15px;color:var(--b);pointer-events:none;height:18px;text-shadow:0 0 12px var(--b)}
  #dots{position:fixed;top:calc(106px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
  #dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
  #dots i.done{background:var(--a);box-shadow:0 0 6px var(--a)}
  #dots i.cur{background:var(--b);box-shadow:0 0 10px var(--b);transform:scale(1.35)}
  #dots i.boss{outline:1.5px solid #ff4d6d;outline-offset:1px}
  #hint{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:90px;text-align:center;color:#8a90b8;font-size:13px;pointer-events:none;padding-left:90px}
  #slow{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.05));color:#fff;font:inherit;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 0 18px rgba(56,225,255,.25)}
  #slow b{font-size:22px;line-height:1}
  #slow.used{opacity:.25;filter:grayscale(1)}
  #slow.on{box-shadow:0 0 28px var(--a);border-color:var(--a)}
  #toast{position:fixed;left:50%;top:21%;transform:translate(-50%,-50%) scale(.9);font-size:22px;font-weight:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;text-shadow:0 0 20px currentColor}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,15,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .3s;z-index:5}
  #card.hide{opacity:0;pointer-events:none}
  .box{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px 24px 20px;text-align:center;width:min(330px,86vw);max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .box h1{margin:0 0 4px;font-size:32px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .box p{margin:6px 0 14px;color:#b9bee0;font-size:15px;line-height:1.45}
  .stars{font-size:38px;letter-spacing:4px;margin:4px 0 2px}
  .stars .off{filter:grayscale(1);opacity:.25}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .btn{font:inherit;font-weight:800;font-size:17px;color:#0b0d1a;border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 22px rgba(255,79,216,.35);cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.08);color:#eef;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
  .themes{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .th{width:52px;padding:6px 0 4px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);font-size:10px;color:#ccd;cursor:pointer}
  .th i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 3px}
  .th.sel{border-color:var(--a);box-shadow:0 0 12px var(--a)}
  .th.lock{opacity:.4}
  #mus{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font-size:22px}
  #mus.off{opacity:.35}
  .music{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
  .music .row{display:flex;gap:6px;justify-content:center;margin:6px 0}
  .tg{flex:1;font:inherit;font-size:12px;font-weight:700;padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ccd}
  .tg.on{border-color:var(--a);color:#fff;box-shadow:0 0 10px var(--a)}
  .lnk{flex:1;display:block;text-decoration:none;font-size:12px;font-weight:800;padding:8px 4px;border-radius:12px;color:#fff}
  .small{font-size:12px;color:#8a90b8;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill" id="lvl">Seviye 1</div><div class="pill" id="score">0</div><div class="pill" id="hearts"></div></div>
<div id="sub"></div>
<div id="combo"></div>
<div id="dots"></div>
<div id="hint"></div>
<button id="mus" title="Oyun müziği">🎵</button>
<button id="slow"><b>⏱</b>YAVAŞ</button>
<div id="toast"></div>
<div id="card"><div class="box" id="box"></div></div>
<script>
(() => {
  // ================= AYARLAR =================
  const LEVELS = [
    {n:[6],         w:1.4, win:0.24},
    {n:[6,4],       w:1.6, win:0.22},
    {n:[7,5],       w:1.8, win:0.20},
    {n:[6,5,4],     w:1.6, win:0.20},
    {n:[7,5,4],     w:1.8, win:0.19, boss:true},
    {n:[8,6,5],     w:1.9, win:0.18, flip:true},
    {n:[8,6,4],     w:2.0, win:0.17, wobble:true},
    {n:[7,6,5,4],   w:1.7, win:0.17},
    {n:[8,6,5,4],   w:1.9, win:0.16, flip:true},
    {n:[9,7,5,4],   w:2.0, win:0.15, wobble:true, boss:true},
    {n:[9,7,6,5],   w:2.1, win:0.14, flip:true, wobble:true},
    {n:[10,8,6,5],  w:2.2, win:0.135, flip:true, wobble:true},
    {n:[11,8,7,5],  w:2.3, win:0.13, flip:true, wobble:true},
    {n:[12,9,7,5],  w:2.4, win:0.12, flip:true, wobble:true},
    {n:[12,10,8,6], w:2.5, win:0.11, flip:true, wobble:true, boss:true},
  ];
  const TOTAL = LEVELS.length, MAX_LIVES = 3, FLY = 0.12;
  const THEMES = {
    neon: {name:'Neon',  need:0,  a:'#38e1ff', b:'#ff4fd8', bg:['#1d2147','#10122a','#07080f'], body:['#5a6290','#2f3456','#4a5180'], idle:['#3e4366','#262a44','#353a5c'], pal:['#38e1ff','#ff4fd8','#7dff6a','#ffc23d','#9b6bff','#ff6b6b']},
    gold: {name:'Altın', need:10, a:'#ffd166', b:'#ff8c42', bg:['#2e2312','#17110a','#0a0705'], body:['#a0784a','#4e3a22','#8a6a3c'], idle:['#6a5236','#30251a','#55432c'], pal:['#ffd166','#ff8c42','#fff1b8','#e8a33a','#ffb36b','#f7e08a']},
    ice:  {name:'Buz',   need:25, a:'#9be7ff', b:'#c3b5ff', bg:['#16304a','#0b1a2b','#050b13'], body:['#7fa6c8','#2f4d6b','#6a90b4'], idle:['#4a6a88','#22384f','#3d5a78'], pal:['#9be7ff','#c3b5ff','#e8fbff','#6fd3ff','#a9c8ff','#d9f0ff']},
    lava: {name:'Lav',   need:40, a:'#ff6b35', b:'#ffd23f', bg:['#3a1208','#1c0905','#0b0302'], body:['#7a3a2a','#3a1a12','#6a3022'], idle:['#4e261c','#2a120c','#432018'], pal:['#ff6b35','#ffd23f','#ff3d2e','#ff9f1c','#ffe066','#ff5e7e']},
  };

  // ================= KAYIT =================
  let SAVE = {lvl:0, stars:[], hi:0, theme:'neon', music:true, sfx:true};
  try{ Object.assign(SAVE, JSON.parse(localStorage.getItem('disfirlat2')||'{}')); }catch(e){}
  const persist = () => { try{ localStorage.setItem('disfirlat2', JSON.stringify(SAVE)); }catch(e){} };
  const totalStars = () => SAVE.stars.reduce((s,v)=>s+(v||0),0);
  let T = THEMES[SAVE.theme] || THEMES.neon;
  function applyTheme(){ document.documentElement.style.setProperty('--a', T.a); document.documentElement.style.setProperty('--b', T.b); }
  applyTheme();

  // ================= DOM =================
  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), $=id=>document.getElementById(id);
  const lvlEl=$('lvl'), scoreEl=$('score'), heartsEl=$('hearts'), subEl=$('sub'), comboEl=$('combo'), dotsEl=$('dots'), hint=$('hint'), toast=$('toast'), card=$('card'), box=$('box'), slowBtn=$('slow'), musBtn=$('mus');

  // ================= DURUM =================
  let W,H,dpr,u,th, N=[], K=0, L=null, R=[], cx=[], cy=[], phi=[], rots=[], rot0=0;
  let level=0, endless=false, round=0, lives=MAX_LIVES, filled=[], active=0, flying=null, state='menu';
  let score=0, combo=0, perfStreak=0, fever=0, slowT=0, slowUsed=false;
  let lvStats={lost:0, hits:0, perf:0};
  let shake=0, time=0, dir=1, flipAt=0, particles=[], floaters=[], arcs=[], lastT, stars=[];
  let boss={next:0, warn:0, pause:0, lockAt:0, lock:null}, heartAt=0;

  // ================= YERLEŞİM =================
  function layout(){
    dpr=Math.min(2, window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const t1=1.8, px=[0], py=[0]; phi=[0];
    for (let j=1;j<K;j++){
      const a = K===2 ? 0 : (j%2 ? 0.42 : -0.42), d = N[j-1]+N[j]+t1*1.05;
      phi[j]=a; px[j]=px[j-1]+Math.cos(a)*d; py[j]=py[j-1]+Math.sin(a)*d;
    }
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for (let j=0;j<K;j++){ const e=N[j]+t1; x0=Math.min(x0,px[j]-e); x1=Math.max(x1,px[j]+e); y0=Math.min(y0,py[j]-e); y1=Math.max(y1,py[j]+e); }
    y1 += t1*4;
    u = Math.min(0.94*W/(x1-x0), 0.52*H/(y1-y0), (H*0.2)/6); th=t1*u;
    const ox=W/2-(x0+x1)/2*u, oy=H*0.48-(y0+y1)/2*u;
    R=N.map(n=>n*u); cx=px.map(x=>ox+x*u); cy=py.map(y=>oy+y*u);
    stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6}));
  }
  function computeRots(){
    rots[0]=rot0;
    for (let j=1;j<K;j++){ const sj=Math.PI*2/N[j]; rots[j]=phi[j]+Math.PI-sj/2-(rots[j-1]-phi[j])*N[j-1]/N[j]; }
  }
  const omegaOf = j => L.w*N[0]/N[j];

  function endlessLevel(r){
    const k = 2 + (r % 3), n = [];
    let top = Math.min(12, 7 + Math.floor(r/2) + Math.floor(Math.random()*2));
    for (let j=0;j<k;j++){ n.push(Math.max(4, top)); top -= 1 + Math.floor(Math.random()*2); }
    return {n, w:Math.min(3.4, 2.2 + r*0.08), win:Math.max(0.085, 0.13 - r*0.003), flip:true, wobble:r>1, boss:(r+1)%5===0};
  }

  function startLevel(i){
    if (endless){ round=i; L=endlessLevel(i); } else { level=i; L=LEVELS[i]; }
    N=L.n; K=N.length; rot0=0; filled=N.map(n=>Array(n).fill(null));
    active=0; flying=null; dir=1; flipAt=time+2+Math.random()*2;
    slowUsed=false; slowT=0; lvStats={lost:0,hits:0,perf:0};
    boss={next:time+2.5, warn:0, pause:0, lockAt:time+1.5, lock:null};
    layout(); computeRots(); updateHud();
  }
  function retryLevel(){ filled=N.map(n=>Array(n).fill(null)); active=0; flying=null; state='play'; boss.lock=null; updateHud(); }

  function updateHud(){
    lvlEl.textContent = endless ? `∞ Tur ${round+1}` : `Seviye ${level+1}/${TOTAL}`;
    scoreEl.textContent = score.toLocaleString('tr-TR');
    heartsEl.innerHTML = Array.from({length:MAX_LIVES},(_,i)=>`<span class="${i<lives?'':'off'}">❤️</span>`).join('');
    const n = filled[active].filter(Boolean).length;
    subEl.textContent = `${L.boss?'👹 BOSS · ':''}Çark ${active+1}/${K} · Diş ${n}/${N[active]}`;
    dotsEl.innerHTML = endless ? '' : LEVELS.map((lv,i)=>`<i class="${i<level?'done':i===level?'cur':''} ${lv.boss?'boss':''}"></i>`).join('');
    const ex=[]; if(L.flip) ex.push('yön değişir'); if(L.wobble) ex.push('hız dalgalanır'); if(L.boss) ex.push('boss: durur, yuva kilitler');
    hint.textContent = ex.length ? ex.join(' · ') : 'Boş yuva alttayken dokun';
    slowBtn.classList.toggle('used', slowUsed);
    const m = mult();
    comboEl.textContent = fever>0 ? `🔥 FEVER x${m*2}` : combo>=3 ? `KOMBO ${combo} · x${m}` : '';
  }
  const mult = () => Math.min(5, 1 + Math.floor(combo/3));

  function showToast(text, color, ms=1000){
    toast.textContent=text; toast.style.color=color; toast.classList.add('show');
    clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'), ms);
  }
  // kart: html + düğmeler [{label, ghost, go}]
  function showCard(html, buttons, withThemes){
    box.innerHTML = html + `<div class="btns">${buttons.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}">${b.label}</button>`).join('')}</div>` + (withThemes ? themesHtml() : '');
    card.classList.remove('hide');
    box.querySelectorAll('.btn').forEach(el => el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio(); card.classList.add('hide'); buttons[+el.dataset.i].go();
    }));
    box.querySelectorAll('.tg').forEach(el => el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio(); const k=el.dataset.t;
      if (k==='music') setMusic(!SAVE.music); else { SAVE.sfx=!SAVE.sfx; persist(); }
      el.classList.toggle('on', SAVE[k]); el.textContent = (k==='music'?'Oyun müziği: ':'Efekt sesi: ') + (SAVE[k]?'Açık':'Kapalı');
    }));
    box.querySelectorAll('.lnk').forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
    box.querySelectorAll('.th').forEach(el => el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); const k=el.dataset.k, t=THEMES[k];
      if (totalStars() < t.need){ el.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:200}); return; }
      SAVE.theme=k; T=t; applyTheme(); persist(); box.querySelectorAll('.th').forEach(x=>x.classList.toggle('sel', x.dataset.k===k));
    }));
  }
  function themesHtml(){
    const ts=totalStars();
    const web = location.protocol.startsWith('http');
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const getApp = ios
      ? (standalone ? '' : `<div class="small" style="color:#dfe3ff;font-size:13px">📱 iPhone'da uygulama gibi: Safari'de <b>Paylaş ⬆️</b> → <b>Ana Ekrana Ekle</b><br>Ses için telefonun sessiz modu kapalı olmalı.</div>`)
      : `<a class="lnk" style="background:#3ddc84;color:#0b0d1a;display:block" href="DisFirlat.apk" download>📱 Android uygulamasını indir (APK)</a>`;
    const extra = web ? `<div class="music">${getApp}
      <div class="small"><a href="../" style="color:#8a90b8">XenoSmart</a> · <a href="../impressum.html" style="color:#8a90b8">Impressum</a> · <a href="../datenschutz.html" style="color:#8a90b8">Datenschutz</a></div></div>` : '';
    return musicHtml() + extra + `<div class="themes">${Object.entries(THEMES).map(([k,t])=>`<div class="th ${SAVE.theme===k?'sel':''} ${ts<t.need?'lock':''}" data-k="${k}"><i style="background:linear-gradient(135deg,${t.a},${t.b})"></i>${ts<t.need?'🔒'+t.need+'★':t.name}</div>`).join('')}</div><div class="small">Toplam yıldız: ${ts} ★</div>`;
  }
  function musicHtml(){
    return `<div class="music"><div style="font-weight:800;font-size:14px">🎵 Müzik</div>
      <div class="row"><button class="tg ${SAVE.music?'on':''}" data-t="music">Oyun müziği: ${SAVE.music?'Açık':'Kapalı'}</button><button class="tg ${SAVE.sfx?'on':''}" data-t="sfx">Efekt sesi: ${SAVE.sfx?'Açık':'Kapalı'}</button></div>
      <div class="row"><a class="lnk" style="background:#ff0033" href="https://music.youtube.com" target="_blank" rel="noopener">YT Music</a><a class="lnk" style="background:#1db954" href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a><a class="lnk" style="background:#c4302b" href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a></div>
      <div class="small" style="margin-top:2px">Kendi müziğin için: uygulamada şarkıyı başlat, oyuna geri dön, müzik arkada çalar (oyun müziğini kapat). YouTube / YT Music için Premium gerekir, Spotify ücretsiz de çalışır.</div></div>`;
  }
  const starsHtml = n => `<div class="stars">${[0,1,2].map(i=>`<span class="${i<n?'':'off'}">⭐</span>`).join('')}</div>`;

  // ================= SES =================
  // Telefonda Spotify / YouTube Music arkada çalarken oyun sesleri onu durdurmasın, karışsın
  try{ if (navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
  let ac, musGain, musTimer=null, musNext=0, musStep=0;
  function unlockAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume&&ac.resume(); if (SAVE.music && !musTimer) musicStart(); }catch(e){} }
  // ---- dahili sakin "lo-fi" müzik: Am – F – C – G, 84 BPM ----
  const CHORDS=[[220,261.6,329.6],[174.6,220,261.6],[130.8,164.8,196],[196,246.9,293.7]];
  const MEL=[659.3,523.3,587.3,523.3,440,523.3,392,440];
  function mNote(f,t0,d,type,v,dest){ const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+Math.min(0.08,d/3)); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(lp).connect(g).connect(dest); o.start(t0); o.stop(t0+d+0.05); }
  function mKick(t0){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(40,t0+0.15);
    g.gain.setValueAtTime(0.5,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.25); o.connect(g).connect(musGain); o.start(t0); o.stop(t0+0.3); }
  function mHat(t0){ const len=Math.floor(ac.sampleRate*0.04), b=ac.createBuffer(1,len,ac.sampleRate), ch=b.getChannelData(0);

    for (const a of arcs){
      const x0=cx[a.a], y0=cy[a.a], x1=cx[a.b], y1=cy[a.b];
      ctx.save(); ctx.globalAlpha=a.life/0.3; ctx.strokeStyle='#cfefff'; ctx.shadowColor=T.a; ctx.shadowBlur=16; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(x0,y0);
      for (let k=1;k<10;k++){ const t=k/10; ctx.lineTo(x0+(x1-x0)*t+(Math.random()-.5)*th*1.6, y0+(y1-y0)*t+(Math.random()-.5)*th*1.6); }
      ctx.lineTo(x1,y1); ctx.stroke(); ctx.restore();
    }
  }

  // ================= DÖNGÜ =================
  function updateBoss(dt){
    if (!L.boss || state!=='play') return;
    if (boss.pause>0){ boss.pause-=dt; if (boss.pause<=0) boss.next=time+2.2+Math.random()*1.6; }
    else if (time>boss.next-0.55 && boss.warn<=0 && time<boss.next){ boss.warn=0.55; sfx.warn(); }
    if (boss.warn>0){ boss.warn-=dt; if (boss.warn<=0){ boss.pause=0.6; } }
    if (time>boss.lockAt){
      const g=active, empt=[]; for(let i=0;i<N[g];i++) if(!filled[g][i]) empt.push(i);
      if (empt.length>1){ boss.lock={g, i:empt[Math.floor(Math.random()*empt.length)], until:time+2.2}; }
      boss.lockAt=time+3+Math.random()*1.5;
    }
  }

  function frame(t){
    const dt=Math.min(0.05,(t-(lastT||t))/1000); lastT=t; time+=dt;
    const running = state==='play'||state==='fail';
    if (L){
      if (running && L.flip && time>flipAt){ dir*=-1; flipAt=time+1.8+Math.random()*1.8; }
      if (running) updateBoss(dt);
      rot0 += (running ? L.w*speedFactor() : 0.5)*dir*dt; computeRots();
    }
    if (slowT>0){ slowT-=dt; if (slowT<=0) slowBtn.classList.remove('on'); }
    if (fever>0 && running){ fever-=dt; if (fever<=0) updateHud(); }
    if (lives===1 && running && time>heartAt){ sfx.heart(); heartAt=time+0.9; }
    if (flying){
      if (!flying.miss){ flying.t+=dt; if (flying.t>=FLY) land(); }
      else { flying.vy+=1000*dt; flying.mx+=flying.vx*dt; flying.my+=flying.vy*dt; flying.spin+=9*dt; }
    }
    for (const p of particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; }
    particles=particles.filter(p=>p.life>0);
    for (const f of floaters){ f.life-=dt*1.1; f.y-=40*dt; } floaters=floaters.filter(f=>f.life>0);
    for (const a of arcs) a.life-=dt; arcs=arcs.filter(a=>a.life>0);
    if (shake>0) shake-=dt;

    drawBg();
    if (L){
      ctx.save();
      if (shake>0) ctx.translate((Math.random()-.5)*12*shake/.4,(Math.random()-.5)*12*shake/.4);
      for (let j=K-1;j>=0;j--) drawGear(j);
      drawArcs(); drawLauncher();
      if (flying){
        const g=flying.g;
        if (!flying.miss){
          const y0=launcherY(g)+th*0.9, y1=cy[g]+R[g]+th/2, k=Math.min(1,flying.t/FLY);
          ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle=flying.color; ctx.lineWidth=toothW()*0.5; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(cx[g],y0); ctx.lineTo(cx[g],y0+(y1-y0)*k); ctx.stroke(); ctx.restore();
          drawLooseTooth(cx[g], y0+(y1-y0)*k, 0, flying.color);
        } else drawLooseTooth(flying.mx, flying.my, flying.spin, flying.color);
      }
      for (const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      for (const f of floaters){ const sc=1+0.3*Math.max(0,f.life-0.8)*5;
        ctx.globalAlpha=Math.min(1,f.life*1.5); ctx.font=`800 ${f.size*sc}px 'Bricolage Grotesque', sans-serif`; ctx.textAlign='center';
        ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=14; ctx.fillText(f.text,f.x,f.y); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
      ctx.restore();
      drawVignette();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', ()=>{ if (L) layout(); });
  menu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
