<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Çaycuma Defense – Buko Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#13201a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#hud{height:50px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#3a5d43,#22382a);border-bottom:2px solid #0e1a12;flex-shrink:0}
.chip{background:rgba(0,0,0,.3);border-radius:20px;padding:5px 10px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:inset 0 2px 0 rgba(0,0,0,.2)}
.sp{flex:1}
.btn{border:none;border-radius:13px;font-weight:800;color:#fff;cursor:pointer;font-size:15px;padding:11px 14px;background:#3f6a4c;box-shadow:0 4px 0 #1d3324;font-family:inherit;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d3324}
.btn.gold,.btn.on{background:#f0b024;box-shadow:0 4px 0 #8a5f07;color:#2b1a00}
.btn.red{background:#c9483b;box-shadow:0 4px 0 #6e1f17}
.btn.blue{background:#3a78c9;box-shadow:0 4px 0 #1c3e6e}
.btn.dis{opacity:.45}
.ibtn{min-width:42px;height:40px;padding:0 9px;font-size:15px;border-radius:12px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;min-height:0;min-width:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#goBtn{position:absolute;right:10px;bottom:10px;width:76px;height:76px;border-radius:50%;padding:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#ffd76a,#f0a417);box-shadow:0 5px 0 #8a5f07,0 6px 16px rgba(0,0,0,.4);color:#3a2300;border:3px solid #fff3c4}
#goBtn small{font-size:11px;font-weight:900;margin-top:-2px}
#goBtn.fast{background:radial-gradient(circle at 35% 30%,#8fd0ff,#2f7fd6);box-shadow:0 5px 0 #17406e,0 6px 16px rgba(0,0,0,.4);color:#fff;border-color:#d7efff}
#goBtn.fast.f2{background:radial-gradient(circle at 35% 30%,#a8ffb0,#2fb54a);box-shadow:0 5px 0 #145e22,0 6px 16px rgba(0,0,0,.4);border-color:#dfffe2}
#goBtn.fast.f3{background:radial-gradient(circle at 35% 30%,#ffb0a8,#e04a35);box-shadow:0 5px 0 #6e1f17,0 6px 16px rgba(0,0,0,.4);border-color:#ffe1dc}
#goBtn:active{transform:translateY(3px)}
#abBtn{position:absolute;left:10px;bottom:10px;width:68px;height:68px;border-radius:50%;padding:0;z-index:2;display:none;font-size:28px;border:3px solid #fff3c4;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#abBtn small{display:block;font-size:11px;font-weight:900}
#panel{flex-shrink:0;height:138px;background:linear-gradient(#28432f,#17251c);border-top:2px solid #0e1a12;padding:7px;padding-bottom:max(7px,env(safe-area-inset-bottom));display:flex;gap:6px;align-items:stretch;justify-content:center;position:relative}
.shop{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:6px;width:100%;max-width:560px}
.card{border:none;border-radius:13px;background:linear-gradient(#3b5c46,#2e4a38);box-shadow:0 3px 0 #1a2e21;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:2px 3px;cursor:pointer;font-family:inherit;touch-action:none;min-width:0;overflow:hidden}
.card img{width:32px;height:32px;pointer-events:none;flex-shrink:0;margin-bottom:-1px}
.card .cd{display:flex;flex-direction:column;align-items:center;pointer-events:none;min-width:0;max-width:100%;line-height:1.1}
.card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .cost{font-weight:900;color:#ffd34d;font-size:13px}
.card.dis{opacity:.45}.card.dis .cost{color:#ff8a7a}
.card.act{background:#f0b024;color:#2b1a00;box-shadow:0 3px 0 #8a5f07}.card.act .cost{color:#5a3a00}
.card.hero{background:linear-gradient(#8a5ad6,#5a35a0);box-shadow:0 3px 0 #2e1a5e}
.tp{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;width:100%;max-width:560px}
.tcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.tinfo{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);border-radius:12px;padding:2px 6px;min-height:40px}
.tinfo img{width:36px;height:36px}
.tinfo div{font-size:11px;line-height:1.2;opacity:.92}
.tinfo b{font-size:14px;display:block;opacity:1}
.tcol .btn{padding:7px 6px;font-size:13px}
.up{border:none;border-radius:13px;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;background:linear-gradient(#45925a,#2e6b3f);box-shadow:0 4px 0 #173a22;text-align:center;min-width:0}
.up:active{transform:translateY(3px);box-shadow:0 1px 0 #173a22}
.up.pB{background:linear-gradient(#4677bb,#2d5590);box-shadow:0 4px 0 #17304f}
.up .pips{font-size:12px;letter-spacing:2px;color:#ffd34d}
.up .nm{font-weight:800;font-size:13px;line-height:1.15}
.up .df{font-size:10.5px;color:#d8ffd0;line-height:1.15;opacity:.95}
.up .cs{font-weight:900;color:#ffd34d;font-size:14px}
.up.dis{opacity:.5}
.up.max{background:#5a4a1a;box-shadow:0 4px 0 #2e250c}
.up.lock{background:#444;box-shadow:0 4px 0 #222;opacity:.7}
.hbox{grid-column:span 2;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.22);border-radius:13px;padding:6px 8px;justify-content:center}
.xp{height:12px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff9a2e)}
.hbox .lv{font-weight:900;font-size:15px;display:flex;justify-content:space-between}
.hbox .hs{font-size:11.5px;opacity:.85}
.xbtn{position:absolute;top:-18px;right:8px;width:36px;height:36px;padding:0;font-size:17px;border-radius:50%;z-index:3}
@media (orientation:landscape) and (max-height:600px),(orientation:landscape) and (min-aspect-ratio:3/2){
  #main{flex-direction:row}
  #panel{height:auto;width:206px;border-top:none;border-left:2px solid #0e1a12;flex-direction:column;justify-content:flex-start;overflow:auto;padding-bottom:7px}
  .shop{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);height:100%}
  .card{flex-direction:column;justify-content:center;gap:0}
  .card img{width:34px;height:34px}.card .cd{align-items:center}
  .tp{grid-template-columns:1fr;max-width:none}
  .hbox{grid-column:auto}
  .up{min-height:70px}
  .xbtn{top:4px;right:4px}
}
.ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(8,16,11,.78);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.box{background:linear-gradient(#3a5d43,#1f3126);border:3px solid #0e1a12;border-radius:22px;padding:18px;width:min(92vw,430px);max-height:92%;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.box h1{margin:0 0 2px;font-size:38px;color:#ffd34d;text-shadow:0 4px 0 #6b4a00;line-height:1.05}
.box h2{margin:0 0 12px;font-size:25px}
.box .sub{opacity:.85;margin-bottom:14px;font-weight:700}
.col{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mapc{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:none;color:#fff;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mapc .mi{width:60px;height:60px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(0,0,0,.2)}
.mapc b{font-size:18px;display:block}
.mapc.lock{filter:grayscale(1);opacity:.55}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.hc{border:none;border-radius:18px;padding:10px 8px;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.hc:active{transform:translateY(3px)}
.hc img{width:84px;height:84px}
.hc b{font-size:20px}
.hc span{font-size:11.5px;opacity:.92;line-height:1.25}
.stars{color:#ffd34d;font-size:18px;letter-spacing:2px}
.big-stars{font-size:46px;color:#ffd34d;letter-spacing:6px;margin:6px 0 14px;text-shadow:0 3px 0 #6b4a00}
.setrow{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 12px;font-weight:700;gap:8px}
.setrow .btn{padding:8px 12px;font-size:14px;min-width:70px}
.lang .btn.act{background:#f0b024;color:#2b1a00;box-shadow:0 4px 0 #8a5f07}
.how{text-align:left;line-height:1.5;font-size:14.5px;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.logo{width:150px;height:120px;margin:-4px auto 0;display:block}
.foot{opacity:.5;font-size:12px;margin-top:12px}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes boxIn{from{transform:scale(.86) translateY(18px);opacity:0}to{transform:none;opacity:1}}
.ov.on{animation:ovIn .25s ease}
.ov.on .box{animation:boxIn .38s cubic-bezier(.2,1.35,.4,1)}
#hud{background:linear-gradient(#4f8a5c,#2b4a34);box-shadow:0 3px 12px rgba(0,0,0,.35);position:relative;z-index:3}
.chip{background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.22));border:1px solid rgba(255,255,255,.14)}
#panel{background:linear-gradient(#305239,#18281e);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 -4px 14px rgba(0,0,0,.3);z-index:3}
.card{border:1.5px solid rgba(255,255,255,.13);box-shadow:0 3px 0 #1a2e21,inset 0 1px 0 rgba(255,255,255,.2);transition:transform .08s}
.card:active{transform:scale(.94)}
.card:not(.dis):not(.act) img{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.up{border:1.5px solid rgba(255,255,255,.16)}
.btn,.up{transition:transform .07s}
.box{border-color:rgba(0,0,0,.6);box-shadow:0 12px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
#goBtn,#abBtn{transition:transform .1s}
#ovMenu,#ovMaps,#ovHero{background:linear-gradient(rgba(8,16,11,.05),rgba(8,16,11,.55)),url(caycuma-defense/img/keyart.webp) center/cover,#1b3a24}
#ovMenu .box,#ovMaps .box,#ovHero .box{background:linear-gradient(rgba(40,70,50,.86),rgba(20,36,26,.9))}
#ovMenu{align-items:flex-end;padding-bottom:4vh}
#ovMenu h1{font-size:40px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip">🥚 <span id="hLives">100</span></div>

    <div class="chip">🚩 <span id="hRound">0/30</span></div>
    <div class="sp"></div>
    <button class="btn ibtn" id="autoBtn" title="Auto">⟳</button>
    <button class="btn ibtn" id="pauseBtn">❚❚</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <button class="btn" id="abBtn"></button>
      <button class="btn" id="goBtn"></button>

      <div class="ov on" id="ovMenu"><div class="box">
        <canvas class="logo" id="logoCv" width="300" height="240" style="display:none"></canvas>
        <h1>Çaycuma<br>Defense</h1>
        <div class="sub" data-t="sub"></div>
        <div class="col">
          <button class="btn gold" style="font-size:22px;padding:16px" data-act="play" data-t="play"></button>
          <button class="btn" data-act="how" data-t="how"></button>
          <button class="btn" data-act="settings" data-t="settings"></button>
        </div>
        <a class="btn" href="./" style="display:block;text-decoration:none;margin-top:12px">🏠 Buko Games</a>
      </div></div>

      <div class="ov" id="ovMaps"><div class="box">
        <h2 data-t="maps"></h2>
        <div class="col" id="mapList"></div>
        <div style="height:12px"></div>
        <button class="btn" data-act="toMenu" data-t="menu"></button>
      </div></div>

      <div class="ov" id="ovHero"><div class="box">
        <h2 data-t="pickHero"></h2>
        <div class="heroes" id="heroList"></div>
        <div style="height:12px"></div>
        <button class="btn" data-act="toMapsFromHero" data-t="back"></button>
      </div></div>

      <div class="ov" id="ovHow"><div class="box">
        <h2 data-t="how"></h2>
        <div class="how" id="howText"></div>
        <button class="btn gold" data-act="closeHow" data-t="closeB"></button>
      </div></div>

      <div class="ov" id="ovSet"><div class="box">
        <h2 data-t="settings"></h2>
        <div class="col">
          <div class="setrow"><span data-t="music"></span><button class="btn" id="sMusic"></button></div>
          <div class="setrow"><span data-t="sound"></span><button class="btn" id="sSfx"></button></div>
          <div class="setrow"><span data-t="voice"></span><button class="btn" id="sVoice"></button></div>
          <div class="setrow"><span data-t="vib"></span><button class="btn" id="sVib"></button></div>
          <div class="setrow"><span data-t="lang"></span><div class="row lang">
            <button class="btn" data-lang="tr">TR</button><button class="btn" data-lang="de">DE</button><button class="btn" data-lang="en">EN</button></div></div>
          <button class="btn red" data-act="reset" data-t="reset"></button>
          <button class="btn gold" data-act="closeSet" data-t="closeB"></button>
        </div>
      </div></div>

      <div class="ov" id="ovConfirm"><div class="box">
        <h2 data-t="resetQ"></h2>
        <div class="row"><button class="btn red" data-act="resetYes" data-t="yes"></button><button class="btn" data-act="resetNo" data-t="no"></button></div>
      </div></div>

      <div class="ov" id="ovPause"><div class="box">
        <h2 data-t="paused"></h2>
        <div class="col">
          <button class="btn gold" data-act="resume" data-t="resume"></button>
          <button class="btn" data-act="restart" data-t="restart"></button>
          <button class="btn" data-act="settings" data-t="settings"></button>
          <button class="btn" data-act="toMaps" data-t="maps"></button>
        </div>
      </div></div>

      <div class="ov" id="ovRes"><div class="box">
        <h2 id="resTitle"></h2>
        <div class="big-stars" id="resStars"></div>
        <div class="col" id="resBtns"></div>
      </div></div>
    </div>
    <div id="panel"></div>
  </div>
</div>

/* ============ Audio: soft & calm ============ */
let AC=null,master,musG,sfxG,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.75;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;master.connect(comp);comp.connect(AC.destination);
    musG=AC.createGain();musG.gain.value=SET.music?.11:0;
    // soft echo for a calm, airy sound
    const dl=AC.createDelay(1);dl.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.32;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
    musG.connect(master);musG.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=SET.sfx?.32:0;const sl=AC.createBiquadFilter();sl.type='lowpass';sl.frequency.value=5000;sfxG.connect(sl);sl.connect(master);
  }catch(e){AC=null}
}
function tone(f,dur,type,vol,slide,dest,when,att){
  if(!AC)return;const t0=AC.currentTime+(when||0),a=att||.005;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol||.2,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,vol,freq,type){
  if(!AC)return;
  if(!noiseBuf){const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
  const t0=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||900;
  const g=AC.createGain();g.gain.setValueAtTime(vol||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(f);f.connect(g);g.connect(sfxG);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);
}
const lastS={};
function sfx(n){
  if(!AC||!SET.sfx)return;const now=performance.now();
  const gap={pop:45,dart:90,boom:110,zap:110,ice:150,clink:120,snip:90,fire:120,coin:60}[n]||0;
  if(lastS[n]&&now-lastS[n]<gap)return;lastS[n]=now;
  switch(n){
    case'pop':tone(620+Math.random()*260,.09,'sine',.16,.55);break;
    case'dart':noise(.04,.05,3000,'highpass');break;
    case'boom':noise(.35,.28,380);tone(90,.3,'sine',.25,.5);break;
    case'zap':tone(1200,.1,'triangle',.07,.4);break;
    case'ice':tone(1600,.3,'sine',.07,.7);tone(2100,.25,'sine',.04,.8,null,.05);break;
    case'clink':tone(1900,.06,'triangle',.05);break;
    case'snip':noise(.1,.2,1400);break;
    case'fire':noise(.22,.12,800);break;
    case'coin':tone(1320,.08,'sine',.1);tone(1760,.12,'sine',.08,0,null,.06);break;
    case'build':tone(440,.1,'triangle',.12);tone(660,.14,'triangle',.12,0,null,.08);break;
    case'up':[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.1,0,null,i*.07));break;
    case'sell':tone(880,.12,'sine',.12,.7);tone(1320,.1,'sine',.08,0,null,.08);break;
    case'life':tone(330,.35,'triangle',.14,.6);break;
    case'round':[392,523,659].forEach((f,i)=>tone(f,.25,'triangle',.1,0,null,i*.1));break;
    case'boss':[220,208,196].forEach((f,i)=>tone(f,.45,'triangle',.14,0,null,i*.3));break;
    case'win':[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.3,'triangle',.11,0,null,i*.13));break;
    case'lose':[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.11,0,null,i*.25));break;
    case'ab':[392,523,784,1046,1318].forEach((f,i)=>tone(f,.35,'sine',.12,0,null,i*.06));noise(.6,.15,600);break;
    case'gift':[880,1175,1568].forEach((f,i)=>tone(f,.25,'sine',.08,0,null,i*.09));break;
    case'take':[784,988,1175,1568].forEach((f,i)=>tone(f,.22,'triangle',.11,0,null,i*.06));break;
    case'click':tone(820,.04,'sine',.07);break;
    case'no':tone(220,.14,'triangle',.08);break;
  }
}

const CH=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]]; // C, Am, F, G
const MEL=[12,null,9,7, null,4,7,null, 9,null,7,4, 2,null,null,null, 7,null,9,12, null,14,12,null, 9,7,null,4, 7,null,null,null];
let mStep=0,mNext=0;
setInterval(()=>{
  if(!AC||!SET.music||AC.state!=='running')return;
  const spd=.34;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.3){
    const st=mStep%64,w=mNext-AC.currentTime,bar=Math.floor(st/8)%4,ch=CH[bar];
    if(st%8===0){for(const n of ch)tone(261.6*Math.pow(2,n/12),spd*8,'sine',.05,0,musG,w,.6);tone(130.8*Math.pow(2,ch[0]/12),spd*8,'triangle',.06,0,musG,w,.3)}
    const m=MEL[st%32];if(m!==null&&(st<32||Math.random()<.85))tone(261.6*Math.pow(2,m/12),spd*2.6,'sine',.075,0,musG,w,.04);
    if(st%4===2)tone(261.6*Math.pow(2,(ch[(st>>2)%3]+12)/12),spd*1.5,'triangle',.025,0,musG,w,.02);
    mNext+=spd;mStep++;
  }
},60);

/* ============ Path ============ */
function chaikin(p,it){for(let k=0;k<it;k++){const o=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];o.push({x:a.x*.75+b.x*.25,y:a.y*.75+b.y*.25},{x:a.x*.25+b.x*.75,y:a.y*.25+b.y*.75})}o.push(p[p.length-1]);p=o}return p}
function buildPath(cp){
  const p=chaikin(cp.map(([x,y])=>({x,y})),4),pts=[];let d=0;
  for(let i=0;i<p.length;i++){if(i>0)d+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);pts.push({x:p[i].x,y:p[i].y,d})}
  return{pts,total:d};
}
function posAt(P,d){
  const a=P.pts;if(d<=0)d=0;if(d>=P.total)d=P.total-1e-6;
  let lo=0,hi=a.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(a[m].d<=d)lo=m;else hi=m}
  const A=a[lo],B=a[hi],sl=B.d-A.d||1e-6,k=(d-A.d)/sl;
  return{x:A.x+(B.x-A.x)*k,y:A.y+(B.y-A.y)*k,dx:(B.x-A.x)/sl,dy:(B.y-A.y)/sl};
}
function distToPath(P,x,y){
  let m=1e9;const a=P.pts;
  for(let i=0;i<a.length-1;i++){const A=a[i],B=a[i+1],vx=B.x-A.x,vy=B.y-A.y,l2=vx*vx+vy*vy||1e-9;
    let k=((x-A.x)*vx+(y-A.y)*vy)/l2;k=k<0?0:k>1?1:k;const dx=A.x+vx*k-x,dy=A.y+vy*k-y,d=dx*dx+dy*dy;if(d<m)m=d}
  return Math.sqrt(m);
}
function rnd(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ============ Rounds ============ */
function roundDef(n,mi){
  const fm=n>30?1+(n-30)*.12:1,m=[1,1.12,1.2][mi]*fm,g=[];
  const cap=(v,c)=>n>30?v:Math.min(c,v);
  const add=(type,count,gap,camo,re)=>{count=Math.round(count*m);if(count>0)g.push({type,count,gap:gap/(n>30?Math.min(2,fm):1),camo:!!camo,re:!!re})};
  add('t1',n<=14?10+n*2.2:(n<=19?20:0),.45);
  add('t2',n>=3&&n<=34?cap((n-2)*2.4,35):0,.4);
  add('t3',n>=7?cap((n-6)*2.2,40):0,.35);
  add('t4',n>=11?cap((n-10)*2,40):0,.3);
  add('t5',n>=16?cap((n-15)*2.6,50):0,.25);
  if(n>=9&&n%3===0)add('t2',6+n*.4,.3,true);
  if(n>=14&&n%4===2)add('t4',8+n*.3,.3,false,true);
  if(n>=19&&n%2===1)add('t4',6+n*.3,.25,true);
  if(n>=21&&n%3===0)add('t5',10,.25,false,true);
  add('armor',n>=13?Math.floor((n-11)/2)*(n>=24?2:1):0,.9);
  const zc={22:1,24:1,25:2,27:2,28:3,29:3,30:2}[n]||(n>30?2+Math.floor((n-30)/2):0);if(zc)g.push({type:'zep',count:zc,gap:3,camo:false,re:false});
  if(n===20||n===26)g.push({type:'boss',count:1,gap:5});
  if(n===30)g.push({type:'boss',count:2,gap:6});
  if(n>30&&n%3===0)g.push({type:'boss',count:1+Math.floor((n-30)/6),gap:5});
  return g;
}
function buildQueue(n,mi){
  const sp=[1,1.05,1.1][mi],q=[];
  roundDef(n,mi).forEach((gr,i)=>{for(let k=0;k<gr.count;k++)q.push({type:gr.type,camo:gr.camo,re:gr.re,at:i*1.3+k*gr.gap/sp})});
  q.sort((a,b)=>a.at-b.at);return q;
}

    const x=.6+r()*(WW-1.2),y=.6+r()*(WH-1.2),rad=.32+r()*.12;
    if(distToPath(P,x,y)<rad+.75)continue;if(obs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+rad+.5))continue;

  }

  for(const tw of G.towers)if(tw.type==='farm'){tw.left=tw.S.fruits;tw.fint=16/tw.S.fruits;tw.ft=tw.fint*.4}
  const has=ty=>G.queue.some(q=>q.type===ty);

}
function roundCleared(){
  G.inRound=false;const bonus=100+Math.min(G.round,40)*3;G.money+=bonus;
  G.projs=G.projs.filter(p=>p.k==='bomb');
  for(const f of G.fruits)collect(f);G.fruits=[];
  for(const tw of G.towers)if(tw.type==='farm'&&tw.S.chest){G.money+=tw.S.chest;G.texts.push({x:tw.x,y:tw.y-.4,txt:'+'+tw.S.chest,life:1.4,col:'#ffd34d'})}
  if(G.hero){G.hero.xp+=40+G.round*8;heroCheck()}
  if(G.free&&G.round>(PROG.best[G.mi]||0)){PROG.best[G.mi]=G.round;saveProg()}
  if(G.round===ROUNDS&&!G.free){win();return}
  G.banner={txt:t('cleared')+bonus+' 💰',life:1.5,col:'#ffd34d'};sfx('coin');
  if(G.round%2===0){G.factI=(G.factI+3)%FACTS.length;G.fact={txt:t('fact')+FACTS[G.factI][LI[SET.lang]],life:7}}

}

  if(G.over)return;const n=rbeE(e);G.lives=Math.max(0,G.lives-n);G.shake=.25;sfx('life');vib(40);
  G.texts.push({x:G.end.x,y:G.end.y-.6,txt:'-'+n,life:1,col:'#ff6b5a'});updateHUD(true);

function spawn(type,camo,d,hp,re,orig){

  const p=posAt(G.P,Math.max(0,d));e.x=p.x;e.y=p.y;e.dx=p.dx;e.dy=p.dy;G.enemies.push(e);return e;
}
function spawnQ(q){
  let hp=0;const n=G.round,mm=[1,1.15,1.22][G.mi];
  if(q.type==='boss')hp=Math.round(ET.boss.hp*(1+Math.max(0,n-20)*.07)*mm);
  if(q.type==='zep')hp=Math.round(ET.zep.hp*(1+Math.max(0,n-22)*.06)*mm);
  spawn(q.type,q.camo,0,hp,q.re);
}
function hurt(e,dmg,src){
  if(e.dead||dmg<=0)return false;
  const T=ET[e.type];
  if(T.armor&&!src.heavy){G.parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*3,vy:-1.5,life:.25,max:.25,col:'#fff',sz:.05,g:0});sfx('clink');return true}
  if(e.frozen>0&&e.brittle)dmg+=1;
  if(T.big&&src.bossX)dmg=Math.round(dmg*src.bossX);
  const dealt=Math.min(dmg,e.hp);e.hp-=dmg;e.hit=.08;e.regT=0;G.money+=dealt;
  if(src.tw){src.tw.pops+=dealt;if(src.tw.hero)src.tw.xp+=dealt*.6}
  if(G.hero&&src.tw!==G.hero)G.hero.xp+=dealt*.06;
  if(e.hp<=0)popE(e,-e.hp,src);
  return true;
}
function popE(e,over,src){
  e.dead=true;const T=ET[e.type];
  G.pops.push({x:e.x,y:e.y,r:T.r,life:.22,col:T.col});
  const n=T.big?40:T.armor?12:6;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*(T.big?5:3);G.parts.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.8,life:.5,max:.5,col:T.col,sz:T.big?.1:.065,g:7})}
  if(T.big){G.shake=.5;sfx('boom');vib(100)}else sfx('pop');
  let first=null,k=0;
  for(const[ty,cnt]of T.kids)for(let i=0;i<cnt;i++){const c=spawn(ty,e.camo,e.d-k*.18,0,e.re,e.orig);if(!first)first=c;k++}
  if(first&&over>0)hurt(first,over,src);
}
function heroCheck(){
  const h=G.hero;if(!h)return;let up=false;
  while(h.lvl<10&&h.xp>=HXP[h.lvl+1]){h.lvl++;up=true}
  if(up){recalc();h.pop=.5;sfx('up');G.texts.push({x:h.x,y:h.y-.5,txt:t('lvUp',{n:h.lvl}),life:1.6,col:'#ffd34d'});
    if(h.lvl===3){say('ready',true)}else say('level');renderPanel(true)}
}

    {const want=Math.atan2(tw.ay-tw.y,tw.ax-tw.x);let da=want-tw.wa;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;tw.wa+=da*Math.min(1,dt*14)}
    tw.eng=Math.max(0,(tw.eng||0)-dt*1.2);if(tw.spin>0)tw.spin=Math.max(0,tw.spin-dt*1.5);
    tw.cd-=dt;tw.recoil=Math.max(0,tw.recoil-dt*3.2);tw.pop=Math.max(0,tw.pop-dt);if(tw.flash>0)tw.flash-=dt;
    if(tw.hero){if(tw.abCd>0){tw.abCd-=dt;if(tw.abCd<=0&&tw.lvl>=3)say('ready')}}

      if(G.inRound&&tw.left>0){tw.ft-=dt;if(tw.ft<=0){tw.left--;tw.ft=tw.fint;tw.recoil=1;
        const a=Math.random()*6.28,r=.5+Math.random()*.4;G.fruits.push({sx:tw.x,sy:tw.y,x:tw.x+Math.cos(a)*r,y:tw.y+Math.sin(a)*r,v:S.value,age:0,gold:tw.b>=2})}}

        G.projs.push({k:'bomb',fire:true,x:tw.x,y:tw.y,tx:f.x,ty:f.y,spd:7,dmg:S.fireDmg,pierce:10,splash:.6,src:{heavy:true,tw},frag:0,spin:0});tw.cd2=1/S.fireRate;sfx('fire')}}
    }

      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.star)p.spin+=dt*12;
      const pr=p.big?.22:p.star?.14:.09;let gone=p.life<=0||p.x<-1||p.y<-1||p.x>WW+1||p.y>WH+1;

        if((e.x-p.x)**2+(e.y-p.y)**2>rr*rr)continue;p.hit.add(e.id);hurt(e,p.dmg,p.src);p.pierce--}

      if(k>=1){if(p.tgt&&!p.tgt.dead)hurt(p.tgt,p.dmg,p.src);G.rings.push({x:p.tx,y:p.ty,r0:.05,r1:.5,life:.25,max:.25,col:'255,235,130'});G.projs.splice(i,1)}
    }else{

  G.fruits=G.fruits.filter(f=>!f.done);
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.inRound&&!G.over&&!G.queue.length&&!G.enemies.length)roundCleared();
  for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.vx*=.96;p.vy*=.96}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.parts.length>700)G.parts.splice(0,G.parts.length-700);
  for(const x of G.texts){x.life-=dt;x.y-=dt*.8}G.texts=G.texts.filter(x=>x.life>0);
  for(const r of G.rings)r.life-=dt;G.rings=G.rings.filter(r=>r.life>0);
  for(const b of G.bolts)b.life-=dt;G.bolts=G.bolts.filter(b=>b.life>0);
  for(const b of G.beams)b.life-=dt;G.beams=G.beams.filter(b=>b.life>0);
  for(const p of G.pops)p.life-=dt;G.pops=G.pops.filter(p=>p.life>0);
  for(const q of G.smoke){q.life-=dt;q.r+=dt*.7;q.y-=dt*.25}G.smoke=G.smoke.filter(q=>q.life>0);

  if(G.fact){G.fact.life-=dt/(G.speed||1);if(G.fact.life<=0)G.fact=null}
}

    let f=Math.round(Math.min(W/(b.small?22:13),S*(b.small?.55:.95)));ctx.font=`900 ${f}px system-ui`;
    let tw2=ctx.measureText(b.txt).width;if(tw2>W*.9){f=Math.floor(f*W*.9/tw2);ctx.font=`900 ${f}px system-ui`;tw2=ctx.measureText(b.txt).width}
    const by=H*.38+(1-Math.min(1,(b.life)*4))*-10;
    {const bg2=ctx.createLinearGradient(0,by-f*.9,0,by+f*.9);bg2.addColorStop(0,'rgba(40,60,45,.82)');bg2.addColorStop(1,'rgba(10,20,14,.82)');rrect(ctx,W/2-tw2/2-f*.7,by-f*.9,tw2+f*1.4,f*1.8,f*.9);ctx.fillStyle=bg2;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.stroke()}
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#000';ctx.lineWidth=f*.14;ctx.strokeText(b.txt,W/2,by);ctx.fillStyle=b.col;ctx.fillText(b.txt,W/2,by);ctx.restore();ctx.globalAlpha=1}
}
function drawFact(f){
  const fsz=13,maxW=Math.min(W-24,520);ctx.font=`700 ${fsz}px system-ui`;
  const words=f.txt.split(' '),lines=[];let cur='';
  for(const w of words){const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>maxW-28&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);
  const lh=fsz*1.35,h=lines.length*lh+16,w=Math.min(maxW,Math.max(...lines.map(l=>ctx.measureText(l).width))+28),x=(W-w)/2,y=H-h-96;
  const a=Math.min(1,f.life*1.5,(8-f.life)*3+.2);ctx.globalAlpha=Math.max(0,Math.min(1,a));
  rrect(ctx,x,y,w,h,12);ctx.fillStyle='rgba(255,250,235,.95)';ctx.fill();ctx.strokeStyle='#c98a2c';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#4a2f0a';ctx.textAlign='center';ctx.textBaseline='middle';lines.forEach((l,i)=>ctx.fillText(l,W/2,y+8+lh*(i+.5)));ctx.globalAlpha=1;
}
function drawPreview(){
  const n=G.round+1,g=roundDef(n,G.mi),agg={};
  for(const gr of g){const k=gr.type+(gr.camo?'c':'')+(gr.re?'r':'');if(!agg[k])agg[k]={type:gr.type,camo:gr.camo,re:gr.re,n:0};agg[k].n+=gr.count}
  const items=Object.values(agg).slice(0,8);if(!items.length)return;
  ctx.font='800 12px system-ui';const lw0=ctx.measureText(t('nextR')).width+28;const R=11,iw=50,w=items.length*iw+lw0+8,h=34,x=8,y=8;
  ctx.fillStyle='rgba(0,0,0,.45)';rrect(ctx,x,y,w,h,h/2);ctx.fill();
  ctx.font='800 12px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(t('nextR'),x+12,y+h/2);
  items.forEach((it,i)=>{const X=x+lw0+12+i*iw,Y=y+h/2;const rr=ET[it.type].big?R*1.05:R*(.8+ET[it.type].r);
    drawJelly(ctx,it.type,X,Y+2,it.type==='zep'?R*.75:rr*.85,1,0,G.time,i,{camo:it.camo,re:it.re});
    ctx.fillStyle='#fff';ctx.font='800 11px system-ui';ctx.textAlign='left';ctx.fillText('×'+it.n,X+R+1,Y+1)});
}
function drawMenuBg(){

      ${tgt}<button class="btn red" data-sell="1">${t('sell')} +${sellVal(tw)}</button></div>

      +`<button class="card hero ${hd||G.money<hc?'dis':''} ${G.place&&G.place.type===hero?'act':''}" data-buy="${hero}"><img src="${ICON[hero]}" alt=""><span class="cd"><b>🦸 ${t(hero)}</b><span class="cost">${hd?'✓':'💰'+hc}</span></span></button></div>`;
    if(G.place)h+=`<button class="btn xbtn red" data-x="1">✕</button>`;
  }

function livePanel(){
  const tw=G&&G.sel;if(!tw)return;const q=id=>document.getElementById(id);

$('panel').addEventListener('pointerdown',ev=>{

function updGhost(ev){
  const rc=cv.getBoundingClientRect();let px=ev.clientX-rc.left,py=ev.clientY-rc.top;
  const inside=px>=0&&py>=0&&px<=rc.width&&py<=rc.height;
  if(!inside){G.place.has=false;return}
  if(ev.pointerType==='touch')py-=Math.min(56,S*1.1);
  const w=toWorld(px,py);G.place.x=w.x;G.place.y=w.y;G.place.has=true;G.place.ok=canPlace(G.place.type,w.x,w.y);
}
document.addEventListener('pointermove',ev=>{if(G&&G.place&&(G.place.drag||ev.pointerType==='mouse'))updGhost(ev)});
document.addEventListener('pointerup',ev=>{
  if(!G||!G.place)return;const pl=G.place;
  if(pl.drag||pl.tap){updGhost(ev);pl.drag=false;pl.tap=false;
    if(pl.has){if(pl.ok)placeTower(pl.type,pl.x,pl.y);else sfx('no')}
    renderPanel(true)}
});
cv.addEventListener('pointerdown',ev=>{
  if(!G||G.over)return;initAudio();
  const rc=cv.getBoundingClientRect(),gpx=ev.clientX-rc.left,gpy=ev.clientY-rc.top;
  for(const g of G.gifts){const R=Math.max(18,S*.42);if(Math.hypot(g.fx*W-gpx,g.fy*H-(gpy+R*.6))<R*1.9){takeGift(g);return}}
  if(G.place){G.place.tap=true;G.place.drag=true;updGhost(ev);return}
  const w=toWorld(gpx,gpy);
  for(const f of G.fruits){if(Math.hypot(f.x-w.x,f.y-w.y)<.45&&f.age>.4){collect(f);return}}
  let best=null,bd=.55;for(const tw of G.towers){const d=Math.hypot(tw.x-w.x,tw.y-w.y);if(d<bd){bd=d;best=tw}}
  G.sel=best;if(best)sfx('click');renderPanel(true);
});

function showResult(won,s){
  if(!G)return;
  $('resTitle').textContent=won?t('win'):t('lose');

if(window.speechSynthesis)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

/* ============ Loop ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  frameDt=dt;
  if(G){if(G.mShow===undefined)G.mShow=G.money;G.mShow+=(G.money-G.mShow)*Math.min(1,dt*9);if(Math.abs(G.money-G.mShow)<.6)G.mShow=G.money}
  if(G&&!G.paused){G.time+=dt;let sim=dt*G.speed;while(sim>1e-6){const st=Math.min(sim,.02);update(st);sim-=st}updateHUD()}
  if(!G){const gb=$('goBtn');if(gb.style.display!=='none')gb.style.display='none'}
  updateAb();if(G&&G.sel)livePanel();
  render();requestAnimationFrame(frame);
}
makeIcons();drawLogo();resize();applyLang();requestAnimationFrame(frame);
