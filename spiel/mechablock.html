  .how{max-width:340px;font-size:15px;line-height:1.5;opacity:.9;margin-bottom:12px;text-align:left}

  .big{pointer-events:auto;font-size:20px;font-weight:800;padding:14px 32px;border-radius:16px;border:none;cursor:pointer;color:#07060f;background:linear-gradient(90deg,#00f0ff,#ff3df2);box-shadow:0 0 24px rgba(0,240,255,.45);margin:5px;min-width:220px}

  .levels{display:grid;grid-template-columns:repeat(5,52px);gap:8px;margin:12px 0 8px;max-height:30vh;overflow-y:auto;padding:4px;position:relative}
  .lv{height:52px;border-radius:12px;font-size:18px;font-weight:800;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;position:relative}

    s.y+=.00025*s.z*(1+pulse*2); if(s.y>1) s.y-=1;

    ctx.globalAlpha=tw*s.z*.8; ctx.fillStyle=`hsl(${(hue+s.p*40)%360},100%,80%)`;

  }

  ctx.save(); ctx.beginPath(); ctx.rect(0,hz,W,H-hz); ctx.clip();
  ctx.strokeStyle=`hsla(${(hue+180)%360},100%,60%,${.22+pulse*.25})`; ctx.lineWidth=1.2;
  for(let i=0;i<10;i++){ const k=(i+scroll)/10, y=hz+(H-hz)*k*k; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let i=-8;i<=8;i++){ ctx.beginPath(); ctx.moveTo(CX+i*14,hz); ctx.lineTo(CX+i*W*.18,H); ctx.stroke(); }
  ctx.restore();
  const hg=ctx.createLinearGradient(0,hz-30,0,hz+10); hg.addColorStop(0,"rgba(0,0,0,0)"); hg.addColorStop(1,`hsla(${(hue+180)%360},100%,60%,.18)`);
  ctx.fillStyle=hg; ctx.fillRect(0,hz-30,W,40);
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  drawBackground(t);
  if(!grid){ drawMenuWheel(t); return; }
  const boss=cfg.boss;
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  ctx.translate(CX,CY); ctx.scale(sc,sc); ctx.translate(-CX,-CY);

  // Zahnrad-Rand: dicker Stahl mit kraeftigen Zaehnen (Cover-Stil)

  const rimCol=boss?"#ff3d6e":`hsl(${(t/12)%360},100%,62%)`;
  const TO=RB+Math.max(14,RB*.13), TI=RB+Math.max(5,RB*.04), nT=Math.max(12,SEGS);

    ctx.arc(0,0,TI,a,b0); ctx.lineTo(Math.cos(b1)*TO,Math.sin(b1)*TO); ctx.arc(0,0,TO,b1,b2); ctx.lineTo(Math.cos(b3)*TI,Math.sin(b3)*TI); ctx.arc(0,0,TI,b3,a+w); }
  ctx.closePath(); ctx.moveTo(RB-1,0); ctx.arc(0,0,RB-1,0,Math.PI*2,true);
  const mg=ctx.createLinearGradient(-TO,-TO,TO,TO); mg.addColorStop(0,"#f4f6ff"); mg.addColorStop(.3,"#9aa2c4"); mg.addColorStop(.5,"#e2e6f6"); mg.addColorStop(.72,"#6c7396"); mg.addColorStop(1,"#c6cbe2");
  ctx.fillStyle=mg; if(opts.fx){ctx.shadowColor=rimCol; ctx.shadowBlur=16+pulse*16;} ctx.fill("evenodd"); ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(20,22,48,.85)"; ctx.lineWidth=2; ctx.stroke();
  // innere Stahlkante + Neonlinie

  ctx.beginPath(); ctx.arc(0,0,TI-1.5,0,Math.PI*2); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1; ctx.stroke();
  for(let i=0;i<SEGS;i++){ const a=(i+.5)*SEG_A, rr=(RB+TI)/2; ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,Math.max(2,RB*.018),0,Math.PI*2);
    const bg=ctx.createRadialGradient(Math.cos(a)*rr-1,Math.sin(a)*rr-1,0,Math.cos(a)*rr,Math.sin(a)*rr,4); bg.addColorStop(0,"#ffffff"); bg.addColorStop(1,"#4a5076"); ctx.fillStyle=bg; ctx.fill(); }
  ctx.restore();
  // dunkle Grundplatte
  const pg=ctx.createRadialGradient(CX,CY,HUB,CX,CY,RB); pg.addColorStop(0,"rgba(10,8,30,.85)"); pg.addColorStop(1,"rgba(30,24,70,.85)");
  ctx.beginPath(); ctx.arc(CX,CY,RB-1,0,Math.PI*2); ctx.fillStyle=pg; ctx.fill();

  for(let r=0;r<RINGS;r++) for(let s=0;s<SEGS;s++){ sector(r,s,rot); ctx.fillStyle=(r+s)%2?"rgba(255,255,255,.055)":"rgba(255,255,255,.035)"; ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=1; ctx.stroke(); }
  for(let r=0;r<RINGS;r++){ const n=grid[r].filter(Boolean).length;
    if(n>=SEGS-2&&n<SEGS){ ctx.beginPath(); ctx.arc(CX,CY,HUB+(r+.5)*RW,0,Math.PI*2); ctx.strokeStyle=`rgba(255,225,77,${.15+.15*Math.sin(t/110)})`; ctx.lineWidth=RW; ctx.stroke(); } }
  if(state==="play"&&!flying&&opts.ghost){
    const s0=bottomSeg(), r0=landingRing(cur.cells,s0);
    if(r0>=0) for(const [dr,ds] of cur.cells) drawCell(r0+dr,mod(s0+ds,SEGS),cur.color,rot,.25+.1*Math.sin(t/150));
  }
  for(let r=0;r<RINGS;r++) for(let s=0;s<SEGS;s++) if(grid[r][s]) drawCell(r,s,grid[r][s],rot);
  if(state==="play"&&opts.coach&&levelNo<=10) drawCoachWheel(t);

  // Nabe: Stahlring + Buko (Cover-Stil)
  { const hr=HUB-3;
    ctx.beginPath(); ctx.arc(CX,CY,hr,0,Math.PI*2);
    const sg=ctx.createLinearGradient(CX-hr,CY-hr,CX+hr,CY+hr); sg.addColorStop(0,"#f4f6ff"); sg.addColorStop(.45,"#8a92b8"); sg.addColorStop(.6,"#dfe3f4"); sg.addColorStop(1,"#4c5378");

    ctx.beginPath(); ctx.arc(CX,CY,hr*.74,0,Math.PI*2); const ig=ctx.createRadialGradient(CX,CY-hr*.2,1,CX,CY,hr*.74); ig.addColorStop(0,"#2a2160"); ig.addColorStop(1,"#0a0820"); ctx.fillStyle=ig; ctx.fill();
    ctx.strokeStyle="rgba(10,10,30,.8)"; ctx.lineWidth=1.5; ctx.stroke();
    const bs=hr*1.35*(1+pulse*.06);

    else { ctx.font=`${HUB*.9}px system-ui`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🦎",CX,CY+2); }

    const k=Math.min(1,sw.t/.45), rr=HUB+(sw.r+.5)*RW, a0=Math.PI/2+rot;
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.lineCap="round";
    const segs=24;
    for(let i=0;i<segs;i++){ const f0=i/segs, f1=(i+1)/segs; if(f0>k) break;
      ctx.globalAlpha=Math.max(0,1-sw.t/0.9)*(.55+.45*(f0/k||0));
      ctx.strokeStyle=`hsl(${(f0*360+t/5)%360},100%,62%)`; ctx.lineWidth=RW*.8;
      ctx.beginPath(); ctx.arc(CX,CY,rr,a0+f0*Math.PI*2,a0+Math.min(f1,k)*Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }
  // Wellen
  for(const w of ripples){ ctx.globalAlpha=Math.max(0,w.life); ctx.strokeStyle=w.c; ctx.lineWidth=3*w.life+1; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.restore();

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const mY=CY+RB+22;
  ctx.beginPath(); ctx.moveTo(CX,mY-8); ctx.lineTo(CX-10,mY+7); ctx.lineTo(CX+10,mY+7); ctx.closePath();
  ctx.fillStyle="#ffe14d"; if(opts.fx){ctx.shadowColor="#ffe14d"; ctx.shadowBlur=12+pulse*10;} ctx.fill(); ctx.shadowBlur=0;

  const launchY=H*0.86, size=Math.min(RW*1.05,38);
  if(state==="play"||state==="paused"){
    // Neon-Kanone
    const ky=launchY+size*.55+cannonKick*8, cw=size*2.1, chh=size*.9, col=`hsl(${(t/12)%360},100%,62%)`;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(CX,ky+chh*.95,cw*.95,size*.32,0,0,Math.PI*2); ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(CX-cw/2,ky+chh); ctx.lineTo(CX-cw*.32,ky); ctx.lineTo(CX+cw*.32,ky); ctx.lineTo(CX+cw/2,ky+chh); ctx.closePath();
    const cg=ctx.createLinearGradient(0,ky,0,ky+chh); cg.addColorStop(0,"#3b3f78"); cg.addColorStop(1,"#14122e"); ctx.fillStyle=cg; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=col; if(opts.fx){ctx.shadowColor=col; ctx.shadowBlur=12+pulse*12;} ctx.stroke(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(CX,ky+chh*.55,size*.16,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
    ctx.restore();
  }
  if(flying&&opts.fx){ const fy=flying.y, tl=Math.min(140,launchY-fy+20);
    ctx.save(); ctx.globalCompositeOperation="lighter"; const fg=ctx.createLinearGradient(0,fy,0,fy+tl); fg.addColorStop(0,"rgba(255,240,170,.95)"); fg.addColorStop(.35,"rgba(255,150,40,.7)"); fg.addColorStop(1,"rgba(255,60,0,0)");
    ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(CX-size*.45,fy); ctx.quadraticCurveTo(CX,fy+tl*1.05,CX+size*.45,fy); ctx.closePath(); ctx.fill(); ctx.restore(); }
  if(flying) drawPieceFlat(flying.p,CX,flying.y,size*(.6+.4*Math.max(0,(flying.y-CY-RB)/(launchY-CY-RB))));
  else if(state==="play") drawPieceFlat(cur,CX,launchY+Math.sin(t/260)*3,size);
  if(state==="play"||state==="paused"){
    ctx.globalAlpha=.6; ctx.font="12px system-ui"; ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.fillText("▶",18,launchY-4); ctx.globalAlpha=1;
    drawPieceFlat(next,52,launchY,size*.6,.8);
  }
  if(state==="play"&&opts.coach&&levelNo<=10) drawCoachUI(t,launchY,size);
  if(combo>1){ ctx.font=`${20+pulse*4}px "Russo One", system-ui`; ctx.textAlign="center"; const cy=CY-RB-32;
    const cgr=ctx.createLinearGradient(CX-70,0,CX+70,0); cgr.addColorStop(0,"#ffe14d"); cgr.addColorStop(.5,fever?"#ff3df2":"#ff9e3d"); cgr.addColorStop(1,"#ffe14d");
    ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.strokeText("COMBO x"+combo,CX,cy); ctx.fillStyle=cgr; ctx.fillText("COMBO x"+combo,CX,cy); }

  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; if(opts.fx){ctx.shadowColor=p.c; ctx.shadowBlur=8;} ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.sq?1:Math.max(.3,p.life)),0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  for(const f of floaters){ ctx.globalAlpha=Math.max(0,Math.min(1,f.life)); const s=f.size*(1+Math.max(0,f.life-1.1)*1.5); ctx.font=`${s}px "Russo One", system-ui`; ctx.textAlign="center";
    ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.c; if(opts.fx){ctx.shadowColor=f.c; ctx.shadowBlur=18;} ctx.fillText(f.txt,f.x,f.y); ctx.shadowBlur=0; }

// ---------- Rehber (Helfer) ----------
function targetRing(){ let best=-1,bc=-1; for(let r=0;r<RINGS;r++){ const c=grid[r].filter(Boolean).length; if(c<SEGS&&c>bc){bc=c;best=r;} } return best; }
function coachState(){
  const tr=targetRing(); if(tr<0||flying) return {tr,good:false};
  const s0=bottomSeg(), r0=landingRing(cur.cells,s0); let good=false;
  if(r0>=0) for(const [dr,ds] of cur.cells) if(r0+dr===tr) good=true;
  return {tr,good};
}
function drawCoachWheel(t){
  const {tr}=coachState(); if(tr<0) return;
  ctx.save();
  for(let s=0;s<SEGS;s++) if(!grid[tr][s]){
    sector(tr,s,rot,3); ctx.lineWidth=2.5; ctx.strokeStyle=`rgba(255,255,255,${.45+.45*Math.sin(t/160)})`; ctx.setLineDash([5,4]); ctx.stroke();
  }
  ctx.restore();
}
function wrapText(txt,maxW){ const words=txt.split(" "), lines=[]; let line="";
  for(const w of words){ const test=line?line+" "+w:w; if(ctx.measureText(test).width>maxW&&line){ lines.push(line); line=w; } else line=test; }
  if(line) lines.push(line); return lines; }
function drawCoachUI(t,launchY,size){
  const cs=coachState();
  let key;
  if(coachIntro&&coachIntroT>0) key=coachIntro;
  else if(shots===0) key="c_tap";
  else if(levelNo<=5) key=cs.good?"c_now":(shots<3&&levelNo===1?"c_fill":"c_wait");
  else key=cs.good?"c_now":null;
  // Pfeil vom Werfer zum Rad
  if(!flying){
    const y1=launchY-size*.9, y2=CY+RB+34, col=cs.good||shots===0?"#5dff7a":"rgba(255,255,255,.35)";
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.setLineDash([8,7]); ctx.lineDashOffset=-t/30;
    ctx.beginPath(); ctx.moveTo(CX,y1); ctx.lineTo(CX,y2); ctx.stroke(); ctx.restore();
    if(cs.good||shots===0){
      const by=launchY+size*.6+Math.abs(Math.sin(t/220))*10;
      ctx.font="34px system-ui"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("👆",CX+size*1.6,by);
    }
  }
  if(!key) return;
  const txt=L()[key];
  ctx.font="15px \"Russo One\", system-ui";
  const maxW=W-130, lines=wrapText(txt,maxW-20), bh=16+lines.length*19, bw=Math.min(maxW,Math.max(...lines.map(l=>ctx.measureText(l).width))+28);
  const bx=CX-bw/2, by=H-bh-12;
  const good=key==="c_now";
  ctx.save();
  ctx.globalAlpha=good?.85+.15*Math.sin(t/90):.95;
  roundRect(bx,by,bw,bh,14); ctx.fillStyle=good?"rgba(40,160,70,.9)":"rgba(20,16,50,.92)"; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=good?"#5dff7a":"rgba(0,240,255,.7)"; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  lines.forEach((l,i)=>ctx.fillText(l,CX,by+8+19*i+10));
  ctx.restore();
}
function drawMenuWheel(t){
  // dekoratives Rad hinter dem Menü
  const r=Math.min(W,H)*.42, cx=W/2, cy=H*.5, n=12, pal=PALETTES[0];
  ctx.save(); ctx.globalAlpha=.35;
  for(let ring=0;ring<4;ring++) for(let s=0;s<n;s++){
    if((s*7+ring*3)%5===0) continue;
    const r1=r*.25+ring*r*.18+2, r2=r1+r*.18-4, a1=s*Math.PI*2/n+t/3000*(ring%2?1:-1), a2=a1+Math.PI*2/n-.04;
    ctx.beginPath(); ctx.arc(cx,cy,r2,a1,a2); ctx.arc(cx,cy,r1,a2,a1,true); ctx.closePath();
    ctx.fillStyle=pal[(s+ring)%pal.length]; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=opts.fx?14:0; ctx.fill();
  }
  ctx.restore();
}

// ================= Logik =================
function shoot(){
  if(state!=="play"||flying) return;
  ensureAudio(); sfx.shoot(); buzz(8); shots++; cannonKick=1;
  flying={p:cur,y:H*0.86,vy:-(H*2.4)};
  cur=next; next=pickShape();
}
function impact(p){
  const s0=bottomSeg(), r0=landingRing(p.cells,s0);
  if(r0<0){
    // Kein Platz an dieser Stelle: Block prallt ab (kinderfreundlich), verloren ist erst, wenn nirgends mehr Platz ist
    if(!canPlaceAnywhere(p)){ levelFail(); return; }
    for(let i=0;i<8;i++) particles.push({x:CX+(Math.random()-.5)*30,y:CY+RB,vx:(Math.random()-.5)*200,vy:60+Math.random()*160,r:3,c:p.color,life:.8});
    floater("✖","#ff6b6b",40,RB*.9,0.9); tone(160,.15,"square",.06,0,.5); buzz(30); shake=6; combo=0; fever=false;
    return;
  }
  for(const [dr,ds] of p.cells){ const r=r0+dr, s=mod(s0+ds,SEGS); grid[r][s]=p.color;
    const a=(s+.5)*SEG_A+rot, rr=HUB+(r+.5)*RW; ripples.push({x:CX+Math.cos(a)*rr,y:CY+Math.sin(a)*rr,r:4,v:90,life:1,c:p.color}); }
  addScore(p.cells.length*(fever?2:1));
  sfx.land(); buzz(12); shake=Math.max(shake,3); pulse=Math.max(pulse,.5);
  resolveClears();
  if(state==="play"&&!canPlaceAnywhere(cur)) setTimeout(()=>{ if(state==="play") levelFail(); },500);
}
function canPlaceAnywhere(p){ for(let s=0;s<SEGS;s++) if(landingRing(p.cells,s)>=0) return true; return false; }
function resolveClears(){
  let total=0, chain=0;
  while(true){
    const full=[]; for(let r=0;r<RINGS;r++) if(grid[r].every(Boolean)) full.push(r);
    if(!full.length) break;
    chain++; total+=full.length;
    for(const r of full){ for(let s=0;s<SEGS;s++){ burst(r,s,grid[r][s]); grid[r][s]=null; } ripples.push({x:CX,y:CY,r:HUB+(r+.5)*RW,v:260,life:1.2,c:"#ffffff"}); sweeps.push({r,t:0}); }
    for(let s=0;s<SEGS;s++){ const col=[]; for(let r=0;r<RINGS;r++) if(grid[r][s]) col.push(grid[r][s]); for(let r=0;r<RINGS;r++) grid[r][s]=col[r]||null; }
  }
  if(total>0){
    combo++; missStreak=0;
    if(combo>=3&&!fever){ fever=true; floater(L().fever,"#ff3df2",32,-60); }
    const pts=Math.round(100*total*total*(1+(combo-1)*.5)*(chain>1?chain:1)*(fever?2:1));
    addScore(pts);
    floater(total>=2?"MEGA x"+total+"!":(chain>1?"CHAIN!":"PERFECT!"),total>=2?"#ffe14d":"#00f0ff",total>=2?42:34,0);
    floater("+"+pts,"#fff",22,36);
    sfx.clear(total,combo); buzz([30,30,60]); shake=10+total*6; flash=.6+total*.2; pulse=1;
    cleared+=total; updateHud();
    if(cleared>=cfg.goal) setTimeout(levelWin,700);
  } else { missStreak++; if(missStreak>=3){ combo=0; fever=false; } }
}
function levelWin(){
  if(state!=="play") return;
  state="won"; sfx.win(); buzz([40,40,40,40,120]);
  for(let r=0;r<RINGS;r++) for(let s=0;s<SEGS;s++) if(grid[r][s]) burst(r,s,grid[r][s]);
  confetti();
  const cells=SEGS*cfg.goal, ratio=shots/Math.max(1,cells/1.6), stars=ratio<=1?3:ratio<=1.5?2:1;
  starsSaved[levelNo]=Math.max(starsSaved[levelNo]||0,stars); store.set("mechablock_stars",JSON.stringify(starsSaved));
  if(levelNo+1>unlocked){ unlocked=levelNo+1; store.set("mechablock_unlocked",unlocked); }
  const w=L().win;
  floater(w[(Math.random()*w.length)|0],"#5dff7a",46,-40,1.5);
  floater("★".repeat(stars)+"☆".repeat(3-stars),"#ffe14d",34,10,1.5);
  if(levelNo%10===0){
    $("tWin").textContent=w[(Math.random()*w.length)|0];
    $("vStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
    $("tWinSub").textContent=levelNo===MAXLV?L().allDone:L().winSub(levelNo);
    setTimeout(()=>{ if(state==="won") $("oWin").classList.remove("hidden"); },1000);
  } else { const n=levelNo; setTimeout(()=>{ if(state==="won"&&levelNo===n) startLevel(n+1); },1400); }
}
function levelFail(){
  if(state!=="play") return;
  state="failed"; flying=null; sfx.fail(); buzz([60,40,60]); shake=8;
  setTimeout(()=>{ if(state==="failed") $("oFail").classList.remove("hidden"); },700);
}
function addScore(n){ score+=n; updateHud(); }
function updateHud(){ $("vScore").textContent=score; $("vLevel").textContent=levelNo; $("vGoal").textContent=Math.min(cleared,cfg.goal)+"/"+cfg.goal; }
function burst(r,s,color){
  const a=(s+.5)*SEG_A+rot, rr=HUB+(r+.5)*RW, x=CX+Math.cos(a)*rr, y=CY+Math.sin(a)*rr, n=opts.fx?12:5;
  for(let i=0;i<n;i++){ const ang=Math.random()*Math.PI*2, sp=80+Math.random()*360; particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:2+Math.random()*4,c:Math.random()<.25?"#fff":color,life:1}); }
}
function confetti(){ if(!opts.fx) return; const pal=palette(); for(let i=0;i<70;i++){ particles.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-.5)*80,vy:120+Math.random()*200,r:3+Math.random()*3,c:pal[i%pal.length],life:2.2,sq:1}); } }
function floater(txt,c,size,dy,life=1.3){ floaters.push({txt,c,size,x:CX,y:CY-RB*.1+dy,life}); }

// ================= Schleife =================
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if(mus.mp3&&analyser&&mEl&&!mEl.paused){ analyser.getByteFrequencyData(fData); let e=0; for(let i=1;i<7;i++) e+=fData[i]; e/=6*255;
    if(e>lastE*1.15&&e>.5) pulse=Math.max(pulse,.75); lastE=lastE*.85+e*.15; }
  if(actx){ while(mus.pulses.length&&mus.pulses[0]<=actx.currentTime){ mus.pulses.shift(); if(mus.on) pulse=Math.max(pulse,.7); } if(mus.pulses.length>40) mus.pulses.splice(0,20); }
  if(state==="play"){
    if(cfg.boss){ bossTimer-=dt; if(bossTimer<=0){ dir*=-1; bossTimer=cfg.boss*(0.7+Math.random()*0.6); } }
    rot+=dir*cfg.speed*dt; if(coachIntroT>0) coachIntroT-=dt;
    if(flying){
      flying.y+=flying.vy*dt;
      if(opts.fx) particles.push({x:CX+(Math.random()-.5)*14,y:flying.y+14,vx:(Math.random()-.5)*30,vy:90,r:2.5,c:flying.p.color,life:.5});
      if(flying.y<=CY+RB+6){ const p=flying.p; flying=null; impact(p); }
    }
  }
  if(state!=="paused"){
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; if(!p.sq){p.vx*=.96; p.vy=p.vy*.96+260*dt;} p.life-=dt*1.1; }
    particles=particles.filter(p=>p.life>0&&p.y<H+20);
    for(const f of floaters){ f.y-=30*dt; f.life-=dt; } floaters=floaters.filter(f=>f.life>0);
    for(const w of ripples){ w.r+=w.v*dt; w.life-=dt*2; } ripples=ripples.filter(w=>w.life>0);
    for(const sw of sweeps) sw.t+=dt; sweeps=sweeps.filter(sw=>sw.t<.9); cannonKick=Math.max(0,cannonKick-dt*6);
    shake=Math.max(0,shake-dt*40); flash=Math.max(0,flash-dt*2.5); pulse=Math.max(0,pulse-dt*3.2); wheelPop=Math.max(0,wheelPop-dt*2.5);
  }
  draw(t); requestAnimationFrame(loop);
}

// ================= Menüs & Einstellungen =================
function applyLang(){
  const t=L();
  $("lScore").textContent=t.score; $("lLevel").textContent=t.level; $("lGoal").textContent=t.goal;
  document.title=t.name+" · Buko Games";
  $("tSub").textContent=t.sub; $("tPause").textContent=t.pause; $("bResume").textContent=t.resume;
  ["bMenu1","bMenu2","bMenu3"].forEach(id=>$(id).textContent=t.menu);
  $("bRestart2").textContent=t.restart; $("bSet1").textContent=t.settings; $("bSet2").textContent=t.settings;
  $("bNext").textContent=t.next; $("bRetry").textContent=t.retry; $("tFail").textContent=t.fail; $("tFailSub").textContent=t.failSub;
  $("tSet").textContent=t.setTitle; $("bSetClose").textContent=t.ok;
  $("sMusic").textContent=t.music; $("sSfx").textContent=t.sfx; $("sVib").textContent=t.vib; $("sGhost").textContent=t.ghost; $("sFx").textContent=t.fx; $("sLang").textContent=t.lang; $("sReset").textContent=t.reset;
  $("tHow").innerHTML=t.how.map(x=>"<div>"+x+"</div>").join("");
  $("sCoach").textContent=t.coach; $("bHelp1").textContent=t.help; $("bHelp2").textContent=t.help; $("tHelp").textContent=t.helpTitle; $("bHelpClose").textContent=t.gotit;
  t.hs.forEach((h,i)=>{ $("h"+(i+1)+"t").textContent=h[0]; $("h"+(i+1)+"d").textContent=h[1]; });
  document.documentElement.lang=opts.lang;
  buildLevelGrid(); renderSettings();
}
function renderSettings(){
  document.querySelectorAll(".tg[data-k]").forEach(b=>{ const on=!!opts[b.dataset.k]; b.classList.toggle("on",on); b.textContent=on?L().on:L().off; });
  document.querySelectorAll(".tg[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===opts.lang));
  const r=$("bReset"); if(!r.dataset.st) r.textContent=L().resetBtn;
}
document.querySelectorAll(".tg[data-k]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); ensureAudio(); const k=b.dataset.k; opts[k]=!opts[k]; saveOpts(); applyAudioOpts(); renderSettings(); sfx.click(); if(k==="vib"&&opts.vib) buzz(40); }));
document.querySelectorAll(".tg[data-l]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); opts.lang=b.dataset.l; saveOpts(); try{const h=JSON.parse(store.get("disfirlat2","{}"))||{}; h.lang=opts.lang; store.set("disfirlat2",JSON.stringify(h));}catch(e){} applyLang(); sfx.click(); }));
$("bReset").addEventListener("click",e=>{ e.stopPropagation(); const r=$("bReset");
  if(r.dataset.st!=="ask"){ r.dataset.st="ask"; r.textContent=L().resetSure; setTimeout(()=>{ if(r.dataset.st==="ask"){ r.dataset.st=""; r.textContent=L().resetBtn; } },3000); return; }
  unlocked=1; starsSaved={}; store.del("mechablock_unlocked"); store.del("mechablock_stars"); score=0;
  r.dataset.st="done"; r.textContent=L().resetDone; setTimeout(()=>{ r.dataset.st=""; renderSettings(); },1500); buildLevelGrid(); });
function buildLevelGrid(){
  $("bPlay").textContent=L().play+" · "+L().level+" "+unlocked;
  const g=$("levels"); g.innerHTML="";
  const count=Math.max(MAXLV,unlocked);
  for(let i=1;i<=count;i++){
    const b=document.createElement("button"), boss=!!levelCfg(i).boss;
    b.className="lv"+(i<unlocked?" done":"")+(boss?" boss":"")+(i>unlocked?" lock":"");
    b.innerHTML=i+(starsSaved[i]?"<small>"+"★".repeat(starsSaved[i])+"</small>":(boss?"<small>BOSS</small>":""));
    if(i<=unlocked) b.addEventListener("click",e=>{e.stopPropagation();startLevel(i);});
    g.appendChild(b);
  }
  setTimeout(()=>{ const el=g.children[Math.max(0,unlocked-1)]; if(el) g.scrollTop=el.offsetTop-g.offsetTop-60; },0);
}

// ================= Steuerung =================
const on=(id,f)=>$(id).addEventListener("click",e=>{ e.stopPropagation(); ensureAudio(); f(); });
on("bPlay",()=>startLevel(unlocked));
on("bNext",()=>startLevel(levelNo+1));
on("bRetry",()=>startLevel(levelNo));
on("bRestart",()=>{ if(state==="play"||state==="failed"||state==="paused") startLevel(levelNo); });
on("bRestart2",()=>startLevel(levelNo));
on("bBack",()=>showMenu());
["bMenu1","bMenu2","bMenu3"].forEach(id=>on(id,()=>showMenu()));
on("bPause",()=>{ if(state==="play") pauseGame(); else if(state==="paused") resumeGame(); });
on("bResume",()=>resumeGame());
on("bSet1",()=>openSettings("oStart"));
on("bSet2",()=>openSettings("oPause"));
on("bSetClose",()=>closeSettings());
on("bHelp1",()=>{ retOverlay="oStart"; hideAll(); $("oHelp").classList.remove("hidden"); });
on("bHelp2",()=>{ retOverlay="oPause"; hideAll(); $("oHelp").classList.remove("hidden"); });
on("bHelpClose",()=>{ $("oHelp").classList.add("hidden"); if(retOverlay) $(retOverlay).classList.remove("hidden"); if(retOverlay==="oStart") buildLevelGrid(); });
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); if(state==="menu"){ ensureAudio(); musicPlay("menu"); return; } shoot(); });
$("oStart").addEventListener("pointerdown",()=>{ ensureAudio(); if(!mus.on) musicPlay("menu"); });
window.addEventListener("keydown",e=>{
  if(["Space","KeyW","ArrowUp","Enter"].includes(e.code)){ e.preventDefault();
    if(state==="play") shoot();
    else if(state==="menu"&&$("oSet").classList.contains("hidden")) startLevel(unlocked);
    else if(state==="won"&&!$("oWin").classList.contains("hidden")) startLevel(levelNo+1);
    else if(state==="failed"&&!$("oFail").classList.contains("hidden")) startLevel(levelNo);
  }
  if(e.code==="KeyR"&&(state==="play"||state==="failed")) startLevel(levelNo);
  if(e.code==="KeyP"||e.code==="Escape"){ if(state==="play") pauseGame(); else if(state==="paused") resumeGame(); }
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ if(state==="play") pauseGame(); else musicStop(); } });


// ================= MechaBlock-Logo (Chrom-Schrift, Zahnrad als „O“) =================
function buildLogo(){
  const svg=document.getElementById("logo"); if(!svg) return;
  const NS="http://www.w3.org/2000/svg";
  const teeth=12, R1=70, R2=86, cx=0, cy=0; let gp="";
  for(let i=0;i<teeth;i++){ const a0=(i/teeth)*Math.PI*2, a1=a0+Math.PI/teeth*0.45, a2=a0+Math.PI/teeth*1.0, a3=a0+Math.PI/teeth*1.55;
    const P=(r,a)=>(cx+Math.cos(a)*r).toFixed(1)+","+(cy+Math.sin(a)*r).toFixed(1);
    gp+=(i?"L":"M")+P(R1,a0)+"L"+P(R2,a1)+"L"+P(R2,a2)+"L"+P(R1,a3); }
  gp+="Z";
  const sec=(c,a0,a1)=>{ const P=(r,a)=>(Math.cos(a)*r).toFixed(1)+","+(Math.sin(a)*r).toFixed(1); return `<path d="M${P(24,a0)}L${P(58,a0)}A58 58 0 0 1 ${P(58,a1)}L${P(24,a1)}A24 24 0 0 0 ${P(24,a0)}Z" fill="${c}" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>`; };
  const Q=Math.PI/2, gems=["#00f0ff","#ff3df2","#ffe14d","#5dff7a"].map((c,i)=>sec(`url(#gem${i})`,i*Q-Q/2+0.06,(i+1)*Q-Q/2-0.06)).join("");
  svg.innerHTML=`
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".30" stop-color="#e6ebff"/><stop offset=".47" stop-color="#8b93cc"/>
      <stop offset=".50" stop-color="#3b3f78"/><stop offset=".56" stop-color="#c9d1ff"/><stop offset=".80" stop-color="#f4f6ff"/><stop offset="1" stop-color="#8f97d6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#ff3df2"/><stop offset="1" stop-color="#ffe14d"/></linearGradient>
    <linearGradient id="gearMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f4ff"/><stop offset=".45" stop-color="#7a82bd"/><stop offset=".6" stop-color="#d4daff"/><stop offset="1" stop-color="#3b3f78"/></linearGradient>
    ${["#00f0ff","#ff3df2","#ffe14d","#5dff7a"].map((c,i)=>`<radialGradient id="gem${i}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".75"/></radialGradient>`).join("")}
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="txtClip"></clipPath>
  </defs>
  <g id="lg"></g>`;
  const lg=svg.querySelector("#lg");
  const mk=(tag,attrs,txt)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!=null) e.textContent=txt; return e; };
  const FS=150, base=172, font="Orbitron, 'Russo One', system-ui, sans-serif";
  // Breiten messen
  const probe=mk("text",{x:0,y:base,"font-family":font,"font-weight":"900","font-size":FS,"letter-spacing":"4"},"MECHABL"); lg.appendChild(probe);
  const w1=probe.getComputedTextLength(); probe.textContent="CK"; const w2=probe.getComputedTextLength(); lg.removeChild(probe);
  const GS=.74, gearW=2*R2*GS+26, total=w1+gearW+w2, sc=Math.min(1,960/total), x0=(1000-total*sc)/2;
  const g=mk("g",{transform:`translate(${x0.toFixed(1)} 0) scale(${sc.toFixed(3)})`}); lg.appendChild(g);
  const gx=w1+gearW/2, gy=base-FS*0.36;
  const words=[["MECHABL",0],["CK",w1+gearW]];
  const addText=(attrs)=>words.forEach(([t,x])=>g.appendChild(mk("text",Object.assign({x,y:base,"font-family":font,"font-weight":"900","font-size":FS,"letter-spacing":"4"},attrs),t)));
  // Neon-Glow
  addText({fill:"url(#edge)",filter:"url(#glow)",opacity:".75"});
  // 3D-Tiefe
  for(let i=8;i>=1;i--){ const t=mk("g",{transform:`translate(${i*0.9} ${i*1.4})`}); g.appendChild(t);
    words.forEach(([w,x])=>t.appendChild(mk("text",{x,y:base,"font-family":font,"font-weight":"900","font-size":FS,"letter-spacing":"4",fill:i>6?"#07061a":"#1d1a52"},w))); }
  // Chrom + Kante
  addText({fill:"url(#chrome)",stroke:"#0b0828","stroke-width":"3.5","paint-order":"stroke"});
  addText({fill:"none",stroke:"url(#edge)","stroke-width":"1.6",opacity:".9"});
  // Glanz-Streifen nur über den Buchstaben
  const clip=svg.querySelector("#txtClip");
  words.forEach(([w,x])=>clip.appendChild(mk("text",{x:x0+x*sc,y:base,"font-family":font,"font-weight":"900","font-size":FS*sc,"letter-spacing":4*sc},w)));
  clip.querySelectorAll("text").forEach(t=>t.setAttribute("transform",`translate(0 ${(base-base*sc).toFixed(1)}) scale(1)`));
  // (Clip-Texte werden unten genau so wie die Gruppe transformiert)
  clip.innerHTML=""; words.forEach(([w,x])=>clip.appendChild(mk("text",{x,y:base,"font-family":font,"font-weight":"900","font-size":FS,"letter-spacing":"4",transform:`translate(${x0.toFixed(1)} 0) scale(${sc.toFixed(3)})`},w)));
  const sh=mk("g",{"clip-path":"url(#txtClip)"}); lg.appendChild(sh);
  sh.appendChild(mk("rect",{class:"sweep",x:"0",y:"0",width:"160",height:"250",fill:"url(#shine)",transform:"skewX(-20)",opacity:".8"}));
  // Zahnrad als „O“
  const gear=mk("g",{transform:`translate(${gx.toFixed(1)} ${gy.toFixed(1)}) scale(${GS})`}); g.appendChild(gear);
  gear.innerHTML=`<circle r="${R2+10}" fill="url(#edge)" filter="url(#glow)" opacity=".7"/>
    <g transform="translate(5 7)"><path d="${gp}" fill="#07061a"/></g>
    <g class="gearSpin"><path d="${gp}" fill="url(#gearMetal)" stroke="#0b0828" stroke-width="3.5"/><circle r="62" fill="#120c2a" stroke="#0b0828" stroke-width="3"/>${gems}
      ${Array.from({length:6},(_,i)=>{const a=i/6*Math.PI*2;return `<circle cx="${(Math.cos(a)*66).toFixed(1)}" cy="${(Math.sin(a)*66).toFixed(1)}" r="3.2" fill="#2a2e52" stroke="#fff" stroke-opacity=".8" stroke-width="1.2"/>`;}).join("")}</g>
    <circle r="21" fill="#2a1d55" stroke="#a6ff4d" stroke-width="3.5"/><text y="9" text-anchor="middle" font-size="26">🦎</text>`;
}
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load("900 150px Orbitron"),document.fonts.load("40px 'Russo One'")]).catch(()=>{}):Promise.resolve()).then(buildLogo);
// Werkzeug nur für Store-Screenshots (aktiv nur mit #shot in der Adresse)
if(location.hash==="#shot"){ window.MBshot={
  start:n=>startLevel(n),
  fill:(keep)=>{ const pal=palette(); for(let r=0;r<RINGS;r++) for(let s=0;s<SEGS;s++) if(Math.random()<keep*(1-r/RINGS*.6)) grid[r][s]=pal[(r*3+s)%pal.length]; for(let s=0;s<SEGS;s++){ const col=[]; for(let r=0;r<RINGS;r++) if(grid[r][s]) col.push(grid[r][s]); for(let r=0;r<RINGS;r++) grid[r][s]=col[r]||null; } },
  blast:()=>{ const pal=palette(); for(let s=0;s<SEGS;s++) grid[0][s]=grid[0][s]||pal[s%pal.length]; combo=2; resolveClears(); },
  freeze:()=>{ cfg.speed=0; }
}; }
applyLang(); resize(); updateHud(); setHud(false); requestAnimationFrame(loop);
})();
