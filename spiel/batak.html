<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Batak · Buko Games</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#3a2214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buko Games">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Neon Batak – ihaleli batak, 3 bilgisayar rakibe karşı. Nostaljik kahvehane masası, akıllı rakipler, yardımcı mod.">
<style>
  :root{--a:#f0b64e;--b:#c8642d;--glass:rgba(40,22,10,.55);--cw:60px;--ch:86px;--av:46px}
  html,body{margin:0;height:100%;background:#2a170c;color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:0}
  #probe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
  #top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:8;pointer-events:none;z-index:10}
  #top>*{pointer-events:auto}
  .pill{background:var(--glass);border:1px solid rgba(255,214,150,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap;color:#fff3df;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.25)}
  .sw{cursor:pointer;padding:6px 10px}
  #info{background:linear-gradient(90deg,rgba(200,100,45,.75),rgba(232,176,74,.6));max-width:46vw;overflow:hidden;text-overflow:ellipsis;border-color:rgba(255,220,160,.5)}
  #info .si,#trumpBadge .si,.si{height:1em;width:auto;vertical-align:-.14em}
  /* oyuncular */
  .seat{position:fixed;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;width:84px}
  .av{width:var(--av);height:var(--av);border-radius:50%;overflow:hidden;border:3px solid var(--ring,#e8c060);box-shadow:0 5px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.3);background:#2a170c;transition:transform .25s,box-shadow .25s}
  .av svg{width:100%;height:100%;display:block}
  .seat.turn .av{box-shadow:0 0 0 3px rgba(255,214,110,.35),0 0 22px var(--ring,#ffcf6a),0 5px 16px rgba(0,0,0,.45);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .nm{font-size:12px;font-weight:800;background:rgba(28,14,6,.78);padding:2px 9px;border-radius:999px;border:1px solid var(--ring,rgba(255,255,255,.25));white-space:nowrap;color:#fff6e6}
  .st{display:flex;gap:4px;font-size:11px;font-weight:800;white-space:nowrap}
  .st span{background:rgba(28,14,6,.7);border-radius:8px;padding:1px 6px;border:1px solid rgba(255,220,160,.18)}
  .st .tk{color:#bfffb0} .st .sc{color:#ffd56a} .st .bd{color:#1a0e05;background:linear-gradient(90deg,#ffd56a,#f0a040);border:0}
  .seat.s0{flex-direction:row;width:auto;gap:6px;transform:translateX(-50%)}
  .seat.s0 .nm{font-size:13px;padding:3px 11px}
  .seat.land0{transform:none;flex-direction:column;align-items:flex-start;gap:4px}
  .bubble{position:fixed;z-index:70;background:#fffaf0;color:#3a1d0a;font-weight:900;font-size:14px;padding:5px 11px;border-radius:14px;white-space:nowrap;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.4);border:2px solid #e8c060}
  .bubble.show{opacity:1;transform:scale(1)}
  .bubble .si{height:1.15em}
  /* kartlar */
  .card{position:fixed;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.09);z-index:4;background-size:100% 100%;background-repeat:no-repeat;background-color:transparent;
    transition:left .42s cubic-bezier(.25,1.2,.45,1),top .42s cubic-bezier(.25,1.2,.45,1),transform .42s cubic-bezier(.25,1.2,.45,1),opacity .3s,box-shadow .2s,filter .2s;
    box-shadow:0 3px 8px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);will-change:left,top,transform}
  .card.mine{cursor:pointer}
  .card.mine.ok{box-shadow:0 0 0 2px #9dff7a,0 0 14px rgba(157,255,122,.65),0 6px 12px rgba(0,0,0,.45)}
  .card.mine.no{filter:brightness(.66) saturate(.65)}
  .card.trump.mine::before{content:'';position:absolute;right:calc(var(--cw)*.06);top:calc(var(--cw)*.06);width:calc(var(--cw)*.13);height:calc(var(--cw)*.13);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#e8a020);box-shadow:0 0 6px #ffd23f}
  .card.hint{box-shadow:0 0 0 3px #ffd23f,0 0 24px #ffd23f,0 6px 12px rgba(0,0,0,.45)!important;filter:none!important}
  .card.hint::after{content:'💡';position:absolute;right:-6px;top:-10px;font-size:calc(var(--cw)*.3);filter:drop-shadow(0 0 4px #ffd23f)}
  .card.win{box-shadow:0 0 0 2px #ffd23f,0 0 22px rgba(255,210,63,.85),0 6px 14px rgba(0,0,0,.5)}
  .card.flipin{animation:flipin .4s ease-out}
  @keyframes flipin{0%{filter:brightness(1.8)}100%{filter:none}}
  body.shake{animation:shk .28s}
  @keyframes shk{20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}60%{transform:translate(2px,2px)}80%{transform:translate(-2px,-1px)}}
  #help{position:fixed;z-index:7;font-weight:800;font-size:13px;line-height:1.35;text-align:center;box-sizing:border-box;pointer-events:none;padding:7px 12px;border-radius:14px;background:rgba(36,20,9,.9);border:1px solid rgba(240,182,78,.65);color:#fff3dc;opacity:0;transition:opacity .25s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  #help.show{opacity:1}
  #help .hl{color:#ffd23f}
  #help.err{border-color:#ff7a8a;background:rgba(70,14,20,.92)}
  #hbtn{position:fixed;z-index:8;right:10px;top:calc(56px + env(safe-area-inset-top));font:inherit;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,220,160,.3);background:var(--glass);color:#fff;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #hbtn.on{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.6)}
  #trumpBadge{position:fixed;z-index:8;left:10px;top:calc(56px + env(safe-area-inset-top));font-weight:800;font-size:13px;display:none;align-items:center;gap:6px;padding:4px 10px 4px 12px}
  #trumpBadge .tchip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#efdcb4);box-shadow:0 0 0 2px #e8c060,0 0 10px rgba(255,210,63,.5)}
  #trumpBadge .tchip .si{height:17px;vertical-align:0}
  /* panel */
  #panel{position:fixed;z-index:9;display:none;flex-wrap:wrap;justify-content:center;gap:7px;width:min(92vw,360px);box-sizing:border-box;padding:12px 12px 14px;border-radius:20px;background:linear-gradient(160deg,rgba(104,62,30,.97),rgba(44,24,10,.97));border:1px solid rgba(255,214,150,.45);box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,210,.2);transform:translate(-50%,-50%)}
  #panel .tt{width:100%;text-align:center;font-weight:800;font-size:15px;margin-bottom:2px;color:#fff3df}
  #panel .tip{width:100%;text-align:center;font-size:13px;font-weight:800;color:#ffd23f;margin-bottom:4px}
  #panel .tip .si{height:1.1em}
  .pb{font:inherit;font-weight:900;font-size:18px;min-width:46px;height:44px;border-radius:12px;border:1px solid rgba(255,220,160,.35);background:rgba(255,240,220,.12);color:#fff;cursor:pointer}
  .pb.main{background:linear-gradient(180deg,#ffd27a,#e0893a);color:#2a1305;border:0;box-shadow:0 3px 0 #8a4a1a}
  .pb.pass{padding:0 14px;min-width:72px}
  .pb.sug{box-shadow:0 0 0 3px #ffd23f,0 0 16px #ffd23f!important}
  .pb.suit{width:64px;height:76px;background:linear-gradient(180deg,#fffaf0,#efdcb4);border:2px solid #d8c49a;box-shadow:0 4px 0 #8a6a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#4a2a10;font-size:12px}
  .pb.suit img{height:34px}
  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);font-size:26px;font-weight:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.5);z-index:70}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast .si{height:1em;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
  #card2{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,8,2,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .3s;z-index:80}
  #card2.hide{opacity:0;pointer-events:none}
  .box{position:relative;background:linear-gradient(165deg,rgba(110,66,32,.98),rgba(46,25,11,.98));border:1px solid rgba(255,214,150,.45);border-radius:24px;padding:20px 20px 18px;text-align:center;width:min(380px,90vw);max-height:90vh;max-height:90dvh;overflow-y:auto;box-sizing:border-box;box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,210,.25),inset 0 0 0 5px rgba(40,20,8,.35),inset 0 0 0 6px rgba(232,192,96,.35)}
  .box h1{margin:0 0 4px;font-size:34px;font-weight:800;line-height:1.05;background:linear-gradient(90deg,#ffd27a,#f08a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .box h2{margin:0 0 6px;font-size:24px;font-weight:800;color:#ffd27a}
  .box p{margin:6px 0 10px;color:#f6e8d2;font-size:14px;line-height:1.45}
  .brand{font-weight:900;font-size:12px;letter-spacing:2px;color:#a6ff4d;text-shadow:0 0 10px rgba(166,255,77,.6);margin-bottom:2px}
  .heroCards{display:flex;justify-content:center;margin:4px 0 6px;height:64px}
  .heroCards img{width:44px;height:62px;border-radius:5px;box-shadow:0 4px 10px rgba(0,0,0,.5);margin:0 -6px}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .btn{font:inherit;font-weight:800;font-size:17px;color:#2a1305;border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(180deg,#ffd27a,#e0893a);box-shadow:0 4px 0 #8a4a1a,0 0 22px rgba(255,170,80,.3);cursor:pointer}
  .btn.ghost{background:rgba(255,240,220,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,220,160,.35)}
  .langs{display:flex;justify-content:center;gap:10px;margin:0 0 8px}
  .lg{font-size:24px;line-height:1;padding:5px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;opacity:.6}
  .lg.sel{opacity:1;border-color:var(--a);box-shadow:0 0 12px var(--a)}
  .row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .seg{display:inline-flex;border-radius:999px;overflow:hidden;border:1px solid rgba(255,220,160,.4)}
  .seg button{font:inherit;font-weight:800;font-size:13px;padding:7px 12px;border:0;background:rgba(255,240,220,.08);color:#f6e8d2;cursor:pointer}
  .seg button.sel{background:linear-gradient(180deg,#ffd27a,#e0893a);color:#2a1305}
  .lbl{font-size:12px;font-weight:800;color:#e9cfa6}
  .chip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,240,220,.1);border:1px solid rgba(255,220,160,.35);color:#fff;font-family:inherit;cursor:pointer}
  .chip.coin{color:#ffd56a;cursor:default}
  table.sc{width:100%;border-collapse:separate;border-spacing:0 5px;margin:8px 0 4px;font-size:14px}
  table.sc td{padding:6px 5px;background:rgba(255,240,220,.07)}
  table.sc td:first-child{border-radius:12px 0 0 12px;text-align:left} table.sc td:last-child{border-radius:0 12px 12px 0}
  table.sc tr.me td{background:rgba(255,210,100,.16)}
  table.sc th{color:#e9cfa6;font-size:11px;font-weight:800;padding:0 4px}
  .mini{display:inline-block;width:24px;height:24px;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:5px;border:2px solid var(--ring,#e8c060)}
  .mini svg{width:100%;height:100%;display:block}
  .plus{color:#9dff7a;font-weight:900} .minus{color:#ff7a8a;font-weight:900}
  .verdict{display:inline-block;font-weight:900;font-size:14px;padding:5px 12px;border-radius:999px;margin:2px 0 4px}
  .verdict.ok{background:rgba(125,255,106,.16);color:#b6ff9e;border:1px solid rgba(125,255,106,.5)}
  .verdict.bad{background:rgba(255,107,138,.16);color:#ffb0bf;border:1px solid rgba(255,107,138,.5)}
  .small{font-size:12px;color:#e9cfa6;margin-top:8px;line-height:1.4}
  #picker{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:flex-start;background:rgba(0,0,0,.25)}
  #picker .pk{margin:calc(52px + env(safe-area-inset-top)) 0 0 10px;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:16px;background:linear-gradient(160deg,rgba(92,56,30,.96),rgba(48,28,14,.95));border:1px solid rgba(255,255,255,.35)}
  #picker a{color:#fff;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1)}
  #top .lft{display:flex;gap:6px;align-items:center}
  .ib{pointer-events:auto;cursor:pointer;font-family:inherit;color:#fff;min-width:36px;height:34px;padding:0 9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .ib.off{opacity:.45}
  .ib.muted{background:rgba(255,80,100,.35)!important;border-color:#ff6b8a!important;opacity:1}
  body[data-device=big] .ib{height:44px;min-width:48px;font-size:22px}
  body[data-device=big] #top .pill{font-size:16px}
  @media (max-height:460px){ .box{padding:12px 16px;width:min(560px,92vw)} .box h1{font-size:26px} .box h2{font-size:19px;margin-bottom:2px} table.sc{font-size:13px;border-spacing:0 3px;margin:4px 0} table.sc td{padding:3px 5px} .mini{width:20px;height:20px} .btns{flex-direction:row;margin:6px -16px -12px;padding:8px 16px 10px;position:sticky;bottom:-12px;background:linear-gradient(180deg,rgba(46,25,11,.0),rgba(46,25,11,.97) 30%);z-index:2} .btns .btn{flex:1;padding:9px 14px;font-size:15px} .btns .btn.ghost{background:#4a2a14} .heroCards{display:none} .box p{margin:4px 0 6px;font-size:13px} .verdict{font-size:12px;padding:3px 10px} }
  @media (max-width:400px){ #top{left:6px;right:6px;gap:4px} #top .pill{font-size:12px;padding:5px 8px} #top .ib{min-width:32px;height:30px;padding:0 6px;font-size:15px} #hbtn{font-size:11px;padding:5px 8px;right:6px} #trumpBadge{left:6px} }
  @media (max-width:480px){ #top{left:calc(6px + env(safe-area-inset-left))!important;right:calc(6px + env(safe-area-inset-right))!important;gap:4px!important} #top .lft{gap:4px!important} #top .ib{min-width:30px!important;height:32px!important;padding:0 6px!important;font-size:15px!important} #top .pill{font-size:13px;padding:5px 8px} }
  @media (orientation:landscape) and (max-height:500px){ #top{top:calc(6px + env(safe-area-inset-top))!important;left:calc(8px + env(safe-area-inset-left))!important;right:calc(8px + env(safe-area-inset-right))!important} }
</style>
<script>
/* Buko Games özel simge seti */
window.BI=(()=>{const w=(p,extra='')=>`<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const spk='<path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" fill-opacity=".25"/>';
return{
home:w('<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.6V19.5h12.4V9.6"/><path d="M10 19.5v-4.6a2 2 0 0 1 4 0v4.6"/><circle cx="12" cy="10.4" r="1.3" fill="currentColor"/><path d="M17.4 6.2c1.6-.4 2.8.6 2.4 1.9" stroke-width="1.8"/>'),
games:w('<path d="M7.2 8.2h9.6a4.3 4.3 0 0 1 4.2 5.2l-.6 2.8a2.4 2.4 0 0 1-4.1 1.1L14.6 15.5H9.4l-1.7 1.8a2.4 2.4 0 0 1-4.1-1.1L3 13.4a4.3 4.3 0 0 1 4.2-5.2z" fill="currentColor" fill-opacity=".18"/><path d="M8 10.6v3.2M6.4 12.2h3.2"/><circle cx="15.6" cy="11.2" r="1" fill="currentColor"/><circle cx="17.4" cy="13.2" r="1" fill="currentColor"/>'),
music:w('<path d="M9 17.5V6.2l10-2.2v11.3"/><ellipse cx="6.6" cy="17.6" rx="2.6" ry="2.1" fill="currentColor"/><ellipse cx="16.6" cy="15.4" rx="2.6" ry="2.1" fill="currentColor"/><path d="M9 9.4l10-2.2"/>'),
musicOff:w('<path d="M9 17.5V6.2l10-2.2v11.3"/><ellipse cx="6.6" cy="17.6" rx="2.6" ry="2.1" fill="currentColor"/><ellipse cx="16.6" cy="15.4" rx="2.6" ry="2.1" fill="currentColor"/><path d="M3.5 3.5l17 17" stroke="#ff8a9a"/>'),
v1:w(spk+'<path d="M15.2 10a3 3 0 0 1 0 4"/>'),
v2:w(spk+'<path d="M15.2 10a3 3 0 0 1 0 4"/><path d="M17.6 7.8a6.2 6.2 0 0 1 0 8.4"/>'),
v3:w(spk+'<path d="M15.2 10a3 3 0 0 1 0 4"/><path d="M17.6 7.8a6.2 6.2 0 0 1 0 8.4"/><path d="M20 5.6a9.4 9.4 0 0 1 0 12.8"/>'),
mute:w(spk+'<path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="#ff8a9a"/>'),
bulb:w('<path d="M9 17.5h6M10 20.5h4"/><path d="M12 3.5a5.6 5.6 0 0 0-3.4 10c.6.5.9 1.2.9 2v.5h5v-.5c0-.8.3-1.5.9-2a5.6 5.6 0 0 0-3.4-10z" fill="currentColor" fill-opacity=".2"/>')};})();
BI.gear='<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l1.6 2.4 2.8-.8.5 2.9 2.9.5-.8 2.8 2.4 1.6-2.4 1.6.8 2.8-2.9.5-.5 2.9-2.8-.8L12 21.2l-1.6-2.4-2.8.8-.5-2.9-2.9-.5.8-2.8L2.6 12l2.4-1.6-.8-2.8 2.9-.5.5-2.9 2.8.8z" fill="currentColor" fill-opacity=".2"/><circle cx="12" cy="12" r="3"/></svg>';
BI.blocks='<svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="12" width="6" height="6" rx="1.5" fill="#ff4f6d"/><rect x="9" y="12" width="6" height="6" rx="1.5" fill="#5dff8a"/><rect x="9" y="6" width="6" height="6" rx="1.5" fill="#38e1ff"/><rect x="15" y="12" width="6" height="6" rx="1.5" fill="#ffd23f"/></svg>';

    if (mode==='big'){ // raf: çay bardakları ve demlik + Boğaz tablosu

      const fx=W*0.3, fy=wallTop+8, fw=Math.min(150,W*0.15), fh=fw*0.66;
      g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(fx-fw/2+4,fy+5,fw,fh); g.fillStyle='#8a5a22'; g.fillRect(fx-fw/2-5,fy-5,fw+10,fh+10); g.fillStyle='#e8c060'; g.fillRect(fx-fw/2-2,fy-2,fw+4,fh+4);
      const sk=g.createLinearGradient(0,fy,0,fy+fh); sk.addColorStop(0,'#f6a35c'); sk.addColorStop(.55,'#f7d48a'); sk.addColorStop(.56,'#3a6f9a'); sk.addColorStop(1,'#1d3f63'); g.fillStyle=sk; g.fillRect(fx-fw/2,fy,fw,fh);
      g.fillStyle='#ffe9b0'; g.beginPath(); g.arc(fx+fw*0.18,fy+fh*0.42,fh*0.1,0,7); g.fill();

      g.strokeStyle='#8a8f9a'; g.lineWidth=2; g.beginPath(); g.moveTo(tx+14,ty-16); g.quadraticCurveTo(tx+24,ty-20,tx+26,ty-28); g.stroke();

    // masa gölgesi + ahşap kenar
    g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(cx,cy+ry*0.1+8,rx+22,ry+20,0,0,7); g.fill();
    const wood=g.createLinearGradient(0,cy-ry-16,0,cy+ry+16); wood.addColorStop(0,'#9a6434'); wood.addColorStop(.5,'#6a3f1c'); wood.addColorStop(1,'#3a2010');
    g.fillStyle=wood; g.beginPath(); g.ellipse(cx,cy,rx+16,ry+16,0,0,7); g.fill();
    g.save(); g.beginPath(); g.ellipse(cx,cy,rx+16,ry+16,0,0,7); g.clip();
    for (let k=0;k<26;k++){ g.strokeStyle=R()<.5?'rgba(40,18,6,.22)':'rgba(255,210,150,.08)'; g.lineWidth=0.8+R(); const o=R()*14; g.beginPath(); g.ellipse(cx,cy,rx+2+o,ry+2+o,0,0,7); g.stroke(); }
    g.restore();
    g.strokeStyle='rgba(255,226,170,.45)'; g.lineWidth=1.5; g.beginPath(); g.ellipse(cx,cy,rx+14,ry+14,0,Math.PI*1.08,Math.PI*1.92); g.stroke();
    g.strokeStyle='#c8963a'; g.lineWidth=2.2; g.beginPath(); g.ellipse(cx,cy,rx+1,ry+1,0,0,7); g.stroke();

    g.restore();
    g.strokeStyle='rgba(255,230,170,.28)'; g.setLineDash([5,6]); g.lineWidth=1.2; g.beginPath(); g.ellipse(cx,cy,rx-12,ry-12,0,0,7); g.stroke(); g.setLineDash([]);

    bgCache=c;
    motes=Array.from({length:mode==='big'?40:26},()=>({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.4+.4,v:4+Math.random()*10,p:Math.random()*6}));

  function teaGlass(g,x,y,s,empty){
    g.fillStyle='rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x,y+s*0.62,s*0.75,s*0.2,0,0,7); g.fill();
    const sg=g.createLinearGradient(x-s*0.7,0,x+s*0.7,0); sg.addColorStop(0,'#e9e9ef'); sg.addColorStop(.5,'#ffffff'); sg.addColorStop(1,'#c9cbd8');
    g.fillStyle=sg; g.beginPath(); g.ellipse(x,y+s*0.55,s*0.7,s*0.17,0,0,7); g.fill(); g.strokeStyle='#c0392b'; g.lineWidth=Math.max(1,s*0.06); g.stroke();
    g.save(); g.beginPath();

    g.fillStyle='rgba(255,255,255,.18)'; g.fill(); g.clip();

    g.restore();

  function drawSteam(x,y,s){
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=Math.max(2,s*0.1); ctx.lineCap='round';
    for (let k=0;k<3;k++){ const ph=time*1.2+k*2.1, prog=((time*14+k*12)%(s*0.9))/(s*0.9), yy=y-s*0.7-prog*s*0.9; ctx.globalAlpha=0.55*(1-prog);
      ctx.beginPath(); ctx.moveTo(x+(k-1)*s*0.12, y-s*0.62); ctx.bezierCurveTo(x+Math.sin(ph)*s*0.3, yy+s*0.3, x-Math.sin(ph)*s*0.3, yy+s*0.1, x+Math.sin(ph+1)*s*0.2, yy); ctx.stroke(); }
    ctx.restore();
  }
  function drawKahve(){
    if (!bgCache) buildBg();
    ctx.drawImage(bgCache,0,0,W,H);
    const {cx,cy,rx,ry}=LAY;
    // canlı saat
    if (DECO.clock){ const [x,y,r]=DECO.clock, d=new Date(), hA=((d.getHours()%12)+d.getMinutes()/60)*Math.PI/6-Math.PI/2, mA=(d.getMinutes()+d.getSeconds()/60)*Math.PI/30-Math.PI/2, sA=d.getSeconds()*Math.PI/30-Math.PI/2;
      ctx.strokeStyle='#2a170c'; ctx.lineCap='round'; ctx.lineWidth=Math.max(2,r*0.09); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(hA)*r*0.5,y+Math.sin(hA)*r*0.5); ctx.stroke();
      ctx.lineWidth=Math.max(1.5,r*0.06); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(mA)*r*0.75,y+Math.sin(mA)*r*0.75); ctx.stroke();
      ctx.strokeStyle='#c0392b'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(sA)*r*0.8,y+Math.sin(sA)*r*0.8); ctx.stroke(); ctx.lineCap='butt';
      ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r*0.07),0,7); ctx.fill(); }
    // radyo ışığı (müzikle atar)
    if (DECO.radio){ const [x,y,w2,h2]=DECO.radio; const gl=ctx.createRadialGradient(x-w2*0.2,y-h2*0.12,0,x-w2*0.2,y-h2*0.12,w2*0.6); gl.addColorStop(0,`rgba(255,200,90,${0.22+beat*0.5})`); gl.addColorStop(1,'rgba(255,200,90,0)'); ctx.fillStyle=gl; ctx.fillRect(x-w2,y-h2,w2*2,h2*2); }
    // sıcak lamba ışığı
    const fl=0.92+0.05*Math.sin(time*7.3)+0.03*Math.sin(time*13.1);
    const lx=W/2, ly=SAT+(mode==='land'?0:mode==='big'?66:52);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const lg=ctx.createRadialGradient(lx,ly,0,cx,cy*0.9,Math.max(W,H)*0.75); lg.addColorStop(0,`rgba(255,190,110,${0.36*fl})`); lg.addColorStop(.45,`rgba(255,150,70,${0.12*fl})`); lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
    for (const m of motes){ m.y-=m.v*0.016; m.x+=Math.sin(time*0.5+m.p)*0.15; if (m.y<0){ m.y=H*0.7; m.x=Math.random()*W; }
      ctx.globalAlpha=0.2+0.3*Math.sin(time+m.p)**2; ctx.fillStyle='#ffe2b0'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha=1;
    if (mode!=='land'){ // lamba
      ctx.strokeStyle='#1a0e07'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,ly-10); ctx.stroke();
      const lw=mode==='big'?30:20; const sh=ctx.createLinearGradient(lx-lw,0,lx+lw,0); sh.addColorStop(0,'#6a4a1a'); sh.addColorStop(.45,'#e8c060'); sh.addColorStop(1,'#5a3a12');
      ctx.fillStyle=sh; ctx.beginPath(); ctx.moveTo(lx-lw,ly+4); ctx.quadraticCurveTo(lx-lw*0.8,ly-12,lx,ly-12); ctx.quadraticCurveTo(lx+lw*0.8,ly-12,lx+lw,ly+4); ctx.closePath(); ctx.fill();

    // masada ısınma + parıltı
    const heat=(bid||0)>=5?(bid-4)/9:0; tableFlash*=0.93;
    if (heat>0 || tableFlash>0.02){ ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.clip(); ctx.globalCompositeOperation='lighter'; const hg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry)); hg.addColorStop(0,`rgba(${90+heat*60},${50+tableFlash*80},20,${0.12*heat+0.25*tableFlash})`); hg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=hg; ctx.fillRect(cx-rx,cy-ry,rx*2,ry*2); ctx.restore(); }

    // sıra kimdeyse o kenar parlar

    // çay bardağı (masanın kenarında)
    const ts=Math.max(14,Math.min(mode==='big'?30:22, CW*0.42)), ang=mode==='land'?2.45:2.35;
    const tx=cx+Math.cos(ang)*rx*0.86, ty=cy+Math.sin(ang)*ry*0.8;
    teaGlass(ctx,tx,ty,ts,false); drawSteam(tx,ty,ts);
  }
  function resize(){
    const oldCW=CW, oldTS=TS;
    bgCache=null; dpr=Math.min(2.5,devicePixelRatio||1); sizes(); cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    const key=CW+'_'+TS+'_'+dpr; if (key!==faceKey){ faceKey=key; for (const k in FACE) delete FACE[k]; BACKURL=null; Object.values(cardEls).forEach(el=>setUp(el,el._up)); }
    void oldCW; void oldTS;
    helperBtn();
    if (hands){ layoutBots(); layoutHand(); trick.forEach(x=>{ const [a,b]=trickXY(x.p); const el=cardEls[x.c.id]; if (el) place(el,a,b,`scale(${TS})`); }); }
    if ($('panel').style.display==='flex'){ $('panel').style.left=LAY.cx+'px'; $('panel').style.top=LAY.cy+'px'; }
  }
  function sparks(x,y,color){ for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, s=60+Math.random()*260; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7+Math.random()*0.4,color,r:1.5+Math.random()*2.5}); } }
  function frame(ts){
    const dt=Math.min(0.05,(ts-(lastT||ts))/1000); lastT=ts; time+=dt;
    if (analyser && freq && SAVE.music){ analyser.getByteFrequencyData(freq); let b=0; for(let i=1;i<6;i++) b+=freq[i]; b=b/5/255; beat=Math.max(beat*0.88, Math.pow(Math.max(0,b-0.35)/0.65,1.6)); } else beat*=0.9;
    drawKahve();
    for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; } parts=parts.filter(p=>p.life>0);
    for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(frame);
  }
  let rzT=null; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(resize,80); });
  addEventListener('keydown',e=>{ if(!$('card2').classList.contains('hide') && (e.code==='Enter'||e.code==='Space')){ e.preventDefault(); $('box').querySelector('.btn')?.dispatchEvent(new Event('pointerdown')); } });
  for (const p of [1,2,3]) $('seat'+p).querySelector('.av').innerHTML=AVATAR[p];
  resize(); helperBtn(); menu(); requestAnimationFrame(frame);
