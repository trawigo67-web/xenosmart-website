        made:'İhale tuttu!', failed:'İhale battı!', batak:'BATTI (0 el)', next:'Sonraki el →', handRes:'El sonucu', total:'Toplam', player:'Oyuncu', got:'Aldı', pts:'Puan', winner:n=>`🏆 Kazanan: ${n}`, youWin:'🎉 Tebrikler, kazandın!', again:'Tekrar oyna', menu:'Menü',
        rules:'Puanlama: İhaleyi tutturan aldığı el kadar puan alır, tutturamayan ihale kadar puan kaybeder. Diğerleri aldıkları el kadar puan alır; hiç el alamayan ihale kadar kaybeder.', stats:(w,g)=>`Galibiyet: ${w} / ${g} oyun`, forced:n=>`Herkes pas – ${n} 5 ile mecbur`, broken:'Koz kırıldı! 💥', music:'Müzik', on:'Açık', off:'Kapalı', helper:'Yardımcı', hintTxt:'Önerilen kart sarı parlıyor', trumpLeft:(s,n)=>`rakiplerde ${n} ${s} koz kaldı`, rNoLeadTrump:'Koz henüz kırılmadı – koz ile başlayamazsın', rFree:'İstediğin kartla başlayabilirsin', rBeat:s=>`${s} atmalı ve masadaki en büyük ${s}'yi geçmelisin`, rFollow:s=>`${s} atmak zorundasın`, rTrump:s=>`Bu renk sende yok – koz (${s}) atmalısın`, rAny:'Ne renk ne koz var – istediğini atabilirsin', sugBid:(v,s)=>`Önerim: ${v} ihale, koz ${s}`, sugPass:'Önerim: pas geç (elin zayıf)', sugTrump:(s,n)=>`Önerim: ${s} (elinde ${n} tane)`},
    de:{title:'Neon Batak', intro:'Batak mit Ansage – gegen 3 Computergegner.<br>Wer am höchsten bietet, wählt Trumpf und spielt aus.<br>Farbe bedienen und überstechen ist Pflicht; ohne Farbe musst du trumpfen.', quick:'⚡ Schnelles Spiel (5 Hände)', normal:'🃏 Normales Spiel (9 Hände)', back:'⚙️ Diş Fırlat', names:['Du','Vexa','Orbo','Lunara'],
        hand:(a,b)=>`Hand ${a}/${b}`, bidTitle:(c)=>`Gebot abgeben (aktuell: ${c||'—'})`, pass:'Passe', passSay:'Passe', trumpTitle:'Trumpf wählen', bidInfo:(n,b)=>`${n} · Gebot ${b}`, trump:'Trumpf', yourTurn:'Du bist dran', tricks:(t,b)=>b?`${t}/${b}`:`${t}`,
        made:'Gebot erfüllt!', failed:'Gebot verfehlt!', batak:'NULL STICHE', next:'Nächste Hand →', handRes:'Ergebnis der Hand', total:'Gesamt', player:'Spieler', got:'Stiche', pts:'Punkte', winner:n=>`🏆 Gewinner: ${n}`, youWin:'🎉 Glückwunsch, du hast gewonnen!', again:'Nochmal', menu:'Menü',

    en:{title:'Neon Batak', intro:'Bidding Batak – against 3 computer players.<br>The highest bidder picks trump and leads.<br>You must follow suit and beat the trick; if void, you must trump.', quick:'⚡ Quick game (5 hands)', normal:'🃏 Normal game (9 hands)', back:'⚙️ Diş Fırlat', names:['You','Vexa','Orbo','Lunara'],
        hand:(a,b)=>`Hand ${a}/${b}`, bidTitle:(c)=>`Place a bid (current: ${c||'—'})`, pass:'Pass', passSay:'Pass', trumpTitle:'Choose trump', bidInfo:(n,b)=>`${n} · bid ${b}`, trump:'Trump', yourTurn:'Your turn', tricks:(t,b)=>b?`${t}/${b}`:`${t}`,
        made:'Bid made!', failed:'Bid failed!', batak:'ZERO TRICKS', next:'Next hand →', handRes:'Hand result', total:'Total', player:'Player', got:'Tricks', pts:'Points', winner:n=>`🏆 Winner: ${n}`, youWin:'🎉 Congratulations, you won!', again:'Play again', menu:'Menu',
        rules:'Scoring: the bidder scores their tricks if the bid is made, otherwise loses the bid. Others score their tricks; anyone with no tricks loses the bid amount.', stats:(w,g)=>`Wins: ${w} / ${g} games`, forced:n=>`Everyone passed – ${n} must play 5`, broken:'Trump broken! 💥', music:'Music', on:'On', off:'Off', helper:'Helper', hintTxt:'Suggested card glows yellow', trumpLeft:(s,n)=>`opponents hold ${n} ${s} trumps`, rNoLeadTrump:'Trump not broken yet – you can\'t lead trump', rFree:'You can lead any card', rBeat:s=>`You must play ${s} and beat the highest ${s}`, rFollow:s=>`You must follow ${s}`, rTrump:s=>`You have none of that suit – you must trump (${s})`, rAny:'No suit and no trump – play anything', sugBid:(v,s)=>`Tip: bid ${v}, trump ${s}`, sugPass:'Tip: pass (weak hand)', sugTrump:(s,n)=>`Tip: ${s} (you hold ${n})`},
  };
  const FLAGS={tr:'🇹🇷',de:'🇩🇪',en:'🇬🇧'};
  const QUIPS={tr:{1:['Risk alıyorum! 🔥','Bu el benim!','Hadi bakalım!'],2:['Hesapladım 😎','Planım tıkır tıkır','Sabır…'],3:['Temkinli gidiyorum','Oh be! 😅','Güzel hamle!']},
    de:{1:['Volles Risiko! 🔥','Der gehört mir!','Los geht\'s!'],2:['Alles berechnet 😎','Läuft nach Plan','Geduld…'],3:['Ganz vorsichtig','Puh! 😅','Schöner Zug!']},
    en:{1:['Going all in! 🔥','This one\'s mine!','Let\'s go!'],2:['All calculated 😎','Going to plan','Patience…'],3:['Playing it safe','Phew! 😅','Nice move!']}};
  const quip=p=>{ const a=(QUIPS[LANG]||QUIPS.tr)[p]; return a[Math.floor(Math.random()*a.length)]; };
  const t=(k,...a)=>{ const v=(I18N[LANG]||I18N.tr)[k]; return typeof v==='function'?v(...a):v; };

  // ---- 🦎 Buko Games: renk değiştiren palet ----
  const CHAM_H=[150,175,95,32,320,150];
  function chamHue(tm,off=0){ const pos=((tm*0.018+off)%5+5)%5, i=Math.floor(pos), f=pos-i; const a=CHAM_H[i], b=CHAM_H[i+1]; const d=((b-a+540)%360)-180; return (a+d*f+360)%360; }
  function hsl2hex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
  const chamBg=(tm,off)=>{ const h=chamHue(tm,off); return [hsl2hex(h,68,34),hsl2hex((h+28)%360,70,20),hsl2hex((h+55)%360,70,10)]; };
  const chamBl=(tm,off)=>{ const h=chamHue(tm,off); return [hsl2hex(h,90,58),hsl2hex((h+45)%360,90,60),hsl2hex((h+320)%360,90,60),hsl2hex((h+150)%360,90,64)]; };
  // ---------- kart mantığı ----------
  const SUITS=['S','H','D','C'], SYM={S:'♠',H:'♥',D:'♦',C:'♣'}, RED={H:1,D:1};
  const RN={11:'J',12:'Q',13:'K',14:'A'}; const rname=r=>RN[r]||String(r);
  const next=p=>(p+3)%4;   // saat yönünün tersine: sen → sağ → üst → sol
  let hands, trump, bid, bidder, dealer=0, tricks, trick, leader, turn, trumpBroken, phase='menu', handNo=0, HANDS=5, scores=[0,0,0,0], bids, passed, history=[];
  const sortHand=h=>h.sort((a,b)=> a.s===b.s ? b.r-a.r : SUITS.indexOf(a.s)-SUITS.indexOf(b.s));

  function deal(){
    const deck=[]; for(const s of SUITS) for(let r=2;r<=14;r++) deck.push({s,r,id:s+r});
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    hands=[0,1,2,3].map(p=>sortHand(deck.slice(p*13,p*13+13)));
  }
  function legal(p){
    const h=hands[p];
    if (!trick.length){
      if (!trumpBroken){ const nt=h.filter(c=>c.s!==trump); if (nt.length) return nt; }
      return h.slice();
    }
    const lead=trick[0].c.s, follow=h.filter(c=>c.s===lead);
    const trumped = lead!==trump && trick.some(x=>x.c.s===trump);
    if (follow.length){
      if (trumped) return follow;
      const hi=Math.max(...trick.filter(x=>x.c.s===lead).map(x=>x.c.r));
      const beat=follow.filter(c=>c.r>hi); return beat.length?beat:follow;
    }

    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+d+0.02); }catch(e){} }
  function noise(d,v=0.08,hp=1500){ try{ if(!ac) return; const len=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,len,ac.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2); const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); f.type='highpass'; f.frequency.value=hp; g.gain.value=v; s.buffer=b; s.connect(f).connect(g).connect(ac.destination); s.start(); }catch(e){} }
  const sfx={ card:()=>{ noise(0.07,0.12,2500); }, deal:()=>{ for(let i=0;i<10;i++) setTimeout(()=>noise(0.04,0.06,3000),i*35); }, bid:()=>tone(880,0.1,'triangle',0.05),
    trump:()=>[523,784,1047].forEach((f,i)=>tone(f,0.16,'triangle',0.06,i*0.07)), win:me=>me?[880,1319].forEach((f,i)=>tone(f,0.14,'sine',0.07,i*0.07)):tone(440,0.12,'sine',0.04),
    made:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,0.2,'triangle',0.06,i*0.08)), fail:()=>[392,330,262].forEach((f,i)=>tone(f,0.25,'sawtooth',0.04,i*0.12)), no:()=>tone(150,0.12,'square',0.04) };
  function musicStart(){
    if(!ac||musSrc) return;
    const play=()=>{ if(!SAVE.music||musSrc) return; if(!musGain){ musGain=ac.createGain(); musGain.gain.value=0.0001; analyser=ac.createAnalyser(); analyser.fftSize=128; analyser.smoothingTimeConstant=0.75; musGain.connect(analyser); analyser.connect(ac.destination); freq=new Uint8Array(analyser.frequencyBinCount); }
      musSrc=ac.createBufferSource(); musSrc.buffer=musBuf; musSrc.loop=true; musSrc.connect(musGain); musSrc.start(); musGain.gain.setTargetAtTime(0.38,ac.currentTime,0.4); };
    if (musBuf) return play(); if (musTried) return; musTried=true;
    try{ const x=new XMLHttpRequest(); x.open('GET','music-gears.mp3'); x.responseType='arraybuffer'; x.onload=()=>{ if(x.response&&x.response.byteLength>1000) ac.decodeAudioData(x.response,b=>{ musBuf=b; play(); },()=>{}); }; x.send(); }catch(e){}
  }
  function musicStop(){ if(musSrc){ const s0=musSrc; musGain.gain.setTargetAtTime(0.0001,ac.currentTime,0.2); setTimeout(()=>{ try{s0.stop();}catch(e){} },600); musSrc=null; } }

  // ---------- arka plan (canvas) ----------
  const cv=$('c'), ctx=cv.getContext('2d'); let tableFlash=0, dpr, time=0, lastT, beat=0, stars=[], bokeh=[], parts=[];
  const hexA=hex=>{ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},`; };
  function resize(){ dpr=Math.min(2.5,devicePixelRatio||1); sizes(); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,p:Math.random()*6}));
    bokeh=Array.from({length:12},(_,i)=>({x:Math.random(),y:Math.random(),r:0.04+Math.random()*0.09,s:0.2+Math.random()*0.5,p:Math.random()*6,c:i%4}));
    if (hands){ layoutBots(); layoutHand(); trick.forEach(x=>{ const [a,b]=trickXY(x.p); const el=cardEls[x.c.id]; el.style.left=a+'px'; el.style.top=b+'px'; }); } }
  function sparks(x,y,color){ for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, s=60+Math.random()*260; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.7+Math.random()*0.4,color,r:1.5+Math.random()*2.5}); } }
  function frame(ts){
    const dt=Math.min(0.05,(ts-(lastT||ts))/1000); lastT=ts; time+=dt;
    if (analyser && freq && SAVE.music){ analyser.getByteFrequencyData(freq); let b=0; for(let i=1;i<6;i++) b+=freq[i]; b=b/5/255; beat=Math.max(beat*0.88, Math.pow(Math.max(0,b-0.35)/0.65,1.6)); } else beat*=0.9;
    const g0=chamBg(time), lg=ctx.createLinearGradient(0,0,W*0.4,H); lg.addColorStop(0,g0[0]); lg.addColorStop(.55,g0[1]); lg.addColorStop(1,g0[2]); ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
    const bl=chamBl(time), M=Math.max(W,H);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<4;i++){ const x=W*(0.5+0.42*Math.sin(time*0.13+i*1.7)), y=H*(0.45+0.38*Math.cos(time*0.11+i*2.3)), r=M*(0.45+0.1*Math.sin(time*0.2+i));
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(bl[i])+'0.3)'); g.addColorStop(1,hexA(bl[i])+'0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    for (const b of bokeh){ const x=((b.x+Math.sin(time*0.05*b.s+b.p)*0.05)%1)*W, y=(((b.y-time*0.012*b.s)%1)+1)%1*H, r=b.r*Math.min(W,H);
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,hexA(bl[b.c])+'0.2)'); g.addColorStop(1,hexA(bl[b.c])+'0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    for (const s of stars){ ctx.globalAlpha=0.35+0.55*Math.sin(time*1.6+s.p)**2; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    // masa: neon oval
    const cx=W/2, cy=H*0.47, rx=Math.min(W*0.46, CW*3.4), ry=Math.min(H*0.2, CH*1.6);
    const heat = (bid||0)>=5 ? (bid-4)/9 : 0; tableFlash*=0.93;
    const tg=ctx.createRadialGradient(cx,cy,0,cx,cy,rx); tg.addColorStop(0,`rgba(40,${200-heat*80},${150-heat*60},${.38+heat*0.2+tableFlash*0.25})`); tg.addColorStop(1,'rgba(10,40,60,.35)');
    ctx.fillStyle=tg; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
    // enerji çizgileri
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip(); ctx.globalAlpha=0.12; ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){ const yy=cy-ry+((time*18+i*ry*0.4)%(ry*2)); ctx.beginPath(); ctx.moveTo(cx-rx,yy); ctx.bezierCurveTo(cx-rx/3,yy-12,cx+rx/3,yy+12,cx+rx,yy); ctx.stroke(); } ctx.restore();
    // koz hologramı
    if (trump){ ctx.save(); ctx.globalAlpha=0.16+0.06*Math.sin(time*2); ctx.font=`900 ${ry*1.5}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = RED[trump]?'#ff4f8b':'#a6ff4d'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=30; ctx.translate(cx,cy); ctx.scale(1+0.04*Math.sin(time*1.5),1); ctx.fillText(SYM[trump],0,ry*0.06); ctx.restore(); }
    // sıra kimdeyse masanın o kenarı parlar
    if ((phase==='play'||phase==='bid') && turn>=0){ const ang=[Math.PI/2,Math.PI,-Math.PI/2,0][turn]; const ex=cx+Math.cos(ang)*rx, ey=cy+Math.sin(ang)*ry;
      const gl=ctx.createRadialGradient(ex,ey,0,ex,ey,rx*0.7); gl.addColorStop(0,`rgba(166,255,77,${0.35+0.15*Math.sin(time*6)})`); gl.addColorStop(1,'rgba(166,255,77,0)');
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip(); ctx.fillStyle=gl; ctx.fillRect(0,0,W,H); ctx.restore(); }
    let bord; try{ bord=ctx.createConicGradient(time*0.6,cx,cy); ['#2ee6c8','#a6ff4d','#ffd23f','#ff8c42','#2ee6c8'].forEach((c,i)=>bord.addColorStop(i/4,c)); }catch(e){ bord='#fff'; }
    ctx.save(); ctx.strokeStyle=bord; ctx.lineWidth=3+beat*4+tableFlash*3; ctx.shadowColor='#fff'; ctx.shadowBlur=14+beat*24; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    // ekolayzer
    const nb=26, bw=W/nb;
    for (let i=0;i<nb;i++){ const v=freq&&SAVE.music ? freq[Math.min(freq.length-1,1+Math.floor(i*freq.length*0.7/nb))]/255 : (0.2+0.15*Math.sin(time*3+i*0.7)*Math.sin(time*1.3+i));
      const h=Math.max(4,v*H*0.2); const g=ctx.createLinearGradient(0,H-h,0,H); g.addColorStop(0,'rgba(255,255,255,.4)'); g.addColorStop(0.3,hexA(bl[i%4])+'0.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.fillRect(i*bw+bw*0.2,H-h,bw*0.6,h); }
    for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.96; p.vy=p.vy*.96+300*dt; } parts=parts.filter(p=>p.life>0);
    for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(frame);
  }
  addEventListener('resize',resize);
  addEventListener('keydown',e=>{ if(!$('card2').classList.contains('hide') && (e.code==='Enter'||e.code==='Space')){ e.preventDefault(); $('box').querySelector('.btn')?.dispatchEvent(new Event('pointerdown')); } });
  document.documentElement.style.setProperty('--sat','env(safe-area-inset-top)');
  resize(); helperBtn(); menu(); requestAnimationFrame(frame);
})();
</script>
