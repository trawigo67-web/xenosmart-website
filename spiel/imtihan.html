:root{color-scheme:dark;--night:#14112a;--deep:#0d0b1c;--sand:#e8c47c;--sand2:#c9963f;--light:#fff6e3;--ink:#f6efe2;--muted:#c3b9d3;--kept:#bfe0ff;--loss:#e58a78;--glass:rgba(20,17,42,.78);--line:rgba(232,196,124,.28)}
:root[data-theme=light]{color-scheme:dark}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);overflow:hidden}
html,body{touch-action:pan-x pan-y}
body{font:16px/1.5 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--night)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center top;transition:opacity .9s ease}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,11,28,.62) 0%,rgba(13,11,28,.18) 30%,rgba(13,11,28,.55) 58%,rgba(13,11,28,.94) 100%);transition:background .9s ease}
.app.dark .shade{background:rgba(9,8,20,.9)}
.app.black .bg{opacity:0}
.app.black .shade{background:#05040b}
.hud,.stage,.ctl{position:relative;z-index:2}
.hud{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px 10px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 6px}
.hud.off{display:none}
.hud.abar,.hud.start{display:flex;align-items:center;gap:10px}
.hud.abar b{font:800 17px/1.1 Alegreya,serif;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.steps i{width:8px;height:8px;border-radius:50%;background:rgba(255,246,227,.22)}
.steps i.done{background:var(--sand2)}
.steps i.now{background:var(--sand);box-shadow:0 0 0 3px rgba(232,196,124,.25)}
.home{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;padding:0;border-radius:12px;border:1px solid rgba(255,246,227,.25);background:rgba(13,11,28,.5);color:var(--light);cursor:pointer}
.home svg{width:20px;height:20px}
.bukolink{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:99px;background:rgba(13,11,28,.55);border:1px solid rgba(255,246,227,.25);color:var(--light);font:700 14px Nunito,sans-serif;text-decoration:none}
.hg{width:26px;height:40px}
.who b{display:block;font:800 17px/1.1 Alegreya,serif;color:var(--light)}
.who span{font-size:13px;color:var(--muted)}
.sus{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font:800 14px Nunito;background:linear-gradient(180deg,#f6dd9f,#d6a548);color:#2c1d03;box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.pill svg{width:14px;height:14px}
.pill.lbl{background:none;color:var(--sand);box-shadow:none;padding-left:0;font-weight:700}
.tovbe{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid rgba(191,224,255,.45);background:rgba(191,224,255,.1);color:var(--kept);font:800 15px Nunito;cursor:pointer}
.tovbe svg{width:18px;height:18px}
.tovbe.glow{animation:glow 1.8s ease-in-out infinite;background:rgba(191,224,255,.2)}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(191,224,255,.18),0 0 22px rgba(191,224,255,.5)}}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.stage>:first-child{margin-top:auto}
.stage.top>:first-child{margin-top:0}
.stage.sur>:last-child{margin-bottom:auto}
.ctl{display:grid;gap:10px;padding:10px 16px max(16px,env(safe-area-inset-bottom))}
.ctl.row{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.card{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kick{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--sand)}
h1,h2{font-family:Alegreya,Georgia,serif;font-weight:800;line-height:1.05;letter-spacing:-.01em;margin:0;color:var(--light);text-wrap:balance}
h1{font-size:clamp(46px,14vw,64px);color:var(--sand);text-shadow:0 2px 18px rgba(0,0,0,.5)}
h2{font-size:27px;margin-bottom:8px}
h3{font:800 18px/1.2 Alegreya,serif;margin:14px 0 6px;color:var(--sand)}
p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.src{font-size:13px;color:var(--muted);margin-top:6px}
.src::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sand);margin-right:7px;vertical-align:middle}
.note{border-left:3px solid var(--kept);padding:6px 0 6px 12px;color:var(--kept);font-weight:700}
.note.loss{border-color:var(--loss);color:var(--loss)}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,246,227,.28);background:rgba(20,17,42,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);font:700 16px/1.3 Nunito,sans-serif;text-align:left;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,#f6dd9f,#d3a14a);color:#2a1c04;border:0;text-align:center;font-weight:800}
.btn.ghost{text-align:center;background:rgba(255,246,227,.06)}
.btn.small{min-height:44px;padding:8px 10px;text-align:center;font-size:15px}
.btn.on{border-color:var(--sand);color:var(--sand)}
button:focus-visible{outline:3px solid var(--kept);outline-offset:2px}
.hero{padding-top:6vh}
.slogan{font:800 20px/1.2 Alegreya,serif;color:var(--light);margin:6px 0 0}
.verse{background:rgba(13,11,28,.6);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.ar{font:400 21px/1.9 Amiri,serif;color:var(--light);text-align:right;margin:0 0 6px}
.lead{font-size:16px;color:var(--ink)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--ctlh,170px) + 8px);z-index:5;background:#1f1a3d;border:1px solid rgba(191,224,255,.5);color:var(--kept);border-radius:14px;padding:12px 14px;font-weight:700;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:4px 10px;border-radius:99px;background:rgba(232,196,124,.16);color:var(--sand);font-weight:700;font-size:14px}
.gone .chip{text-decoration:line-through;opacity:.55}
.bars{display:grid;gap:8px;margin:8px 0 12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.bar i{grid-column:1/-1;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:9px;background:var(--kept);transition:width 1s ease}
.bar.c i b{background:var(--loss)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.badge{padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:700;color:var(--muted);background:rgba(13,11,28,.5)}
.badge.got{color:#2a1c04;background:linear-gradient(180deg,#fff3cf,#e8c47c);border-color:transparent;box-shadow:0 0 18px rgba(232,196,124,.45)}
.heat{height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}
.heat b{display:block;height:100%;background:linear-gradient(90deg,#f6dd9f,#e58a78);border-radius:9px;transition:width 1.2s ease}
.log{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.log li{padding:10px 12px;border-radius:12px;background:rgba(13,11,28,.55);border:1px solid rgba(255,255,255,.1);font-size:15px}
.log li span{display:block;font-size:13px;color:var(--muted)}
.tag{display:inline-block;margin:4px 4px 0 0;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(191,224,255,.16);color:var(--kept)}
.tag.bad,.tag.kh,.tag.riya,.tag.wasted{background:rgba(229,138,120,.16);color:var(--loss)}
.tag.rep{background:rgba(255,255,255,.12);color:var(--muted)}
.scale{width:100%;height:auto;display:block;margin:4px 0 8px}
.line{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.sur p{font:800 22px/1.3 Alegreya,serif;color:var(--light);text-align:center}
.sur .src{text-align:center;font:700 13px/1.4 Nunito,sans-serif;color:var(--muted)}
.fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.app.sirat .bg{background-size:auto 128%;background-position:center bottom;background-color:#0b1020}
.runner{position:absolute;left:50%;top:60%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fffaf0 0 35%,#ffd98a 60%,rgba(255,217,138,0) 72%);transition:top .55s cubic-bezier(.3,.7,.3,1),transform .55s ease}
.runner.init{transition:none}
.runner::after{content:"";position:absolute;left:50%;top:50%;width:var(--halo,120px);height:var(--halo,120px);margin:calc(var(--halo,120px)/-2) 0 0 calc(var(--halo,120px)/-2);border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.42),rgba(255,226,160,0) 70%)}
.pillar{position:absolute;top:36%;padding:6px 10px;border-radius:10px;font-weight:800;font-size:13px;background:rgba(13,11,28,.7);border:1px solid rgba(255,255,255,.2);color:var(--muted)}
.pillar.l{left:12px}
.pillar.r{right:12px}
.pillar.got{color:#2a1c04;background:linear-gradient(180deg,#fff3cf,#e8c47c);border-color:transparent}
.card h2.q{font-size:23px;line-height:1.15}
.door{width:132px;height:184px;margin:6px auto 14px;border-radius:66px 66px 10px 10px;background:radial-gradient(ellipse at 50% 60%,#fffef6 0%,#fff1c9 38%,rgba(255,225,150,.5) 62%,rgba(255,225,150,0) 78%);box-shadow:0 0 60px 18px rgba(255,230,170,.35);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 80px 26px rgba(255,230,170,.5)}}
.qa{display:grid;gap:8px;margin:6px 0 12px}
.qa div{padding:10px 12px;border-radius:12px;background:rgba(13,11,28,.55);border:1px solid rgba(255,255,255,.1)}
.qa b{display:block;font:800 16px/1.25 Alegreya,serif;color:var(--light)}
.qa span{font-size:14px;color:var(--muted)}
.end{font:800 22px/1.25 Alegreya,serif;color:var(--sand);text-align:center;margin:14px 0 6px}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{margin:0;text-align:center;font-weight:700;color:var(--light)}
.pick span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.reflist{font-size:14px;color:var(--muted)}
.reflist b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line{opacity:1}}
</style>
</head>

de:{slogan:"Was hast du vorbereitet?",lead:"Dir wurde ein Leben anvertraut. Jede Entscheidung kostet Zeit. Was glänzt, bleibt beim Tod zurück; das Gute, das niemand sieht, geht mit dir.",verse:"Besitz und Söhne sind der Schmuck des diesseitigen Lebens. Die bleibenden guten Werke aber sind bei deinem Herrn besser an Lohn und besser an Hoffnung.",who:"Als wer lebst du?",f:"Frau · Emetullah",m:"Mann · Abdullah",names:"Beide Namen bedeuten „Diener(in) Allahs“.",age:"Alter",tovbe:"Reue",tovbeDone:"Du hast bereut. Bis die Sonne im Westen aufgeht, wird Reue angenommen (Muslim 2703).",tovbeKh:"Unrecht an Menschen aber löscht nur deren Vergebung (Bukhari 2449).",tovbeClean:"Keine offene Sünde im Buch. Um Vergebung bitten ist trotzdem schön.",next:"Weiter",open:"Die Tür der Reue ist offen.",shareQ:"Soll ich diese gute Tat teilen?",shareYes:"Teilen, alle sollen es sehen",shareNo:"Geheim halten",shareDone:"+200 Likes. Alle sagten „was für ein guter Mensch“; was du wolltest, wurde gesagt. In dein Buch kam es als „für die Leute“.",secretDone:"Niemand hat es gesehen. Es wurde für Allah aufgeschrieben.",gold:"Gold",likes:"Likes",items:"Dinge",sus:"Schmuck",dTitle:"Das Leben ist zu Ende",dAge:"Mit {n} Jahren. Niemand weiß, in welchem Land er sterben wird.",dSus:"Der Schmuck blieb zurück:",dFollow:"Drei folgten dir: deine Familie, dein Besitz und deine Taten. Zwei kehrten um; deine Taten blieben bei dir.",dForward:"Deine vorausgeschickten Spenden gingen mit dir: {n}.",dPending:"Aufgeschobene Reue: offene Sünden im Buch: {n}.",toKabir:"Zum Grab",kTitle:"Das Grab",kQ:"„Was hast du über diesen Mann gesagt?“",kA1:"Der Gläubige: „Er ist Allahs Diener und Gesandter.“",kA2:"Der Heuchler oder Zweifler: „Ich weiß nicht; die Leute sagten etwas, also sagte ich es auch.“",kLife:"Welcher Antwort war dein Leben näher?",kHak:"Momente für das Richtige",kCrowd:"Momente mit der Menge",kCont:"Dein Buch wird weitergeschrieben:",kCar:"Fortlaufende Spende",kIlim:"Nützliches Wissen",kEvlat:"Betendes Kind",  {h:"Mocking in class",p:"The whole class is mocking the new kid.",c:["Sit next to him and defend him","Watch quietly","Laugh along"],r:["Nothing is heavier on the scale than good character.","Staying quiet was easy. And next time?","A broken heart was recorded: a wrong done to a person."]}),
C('kehf',0,14,[{good:1,kehf:1,youth:1},{wasted:2}],['M 809|Q 18:7','B 6412'],
 {h:"Kehf'in ilk on ayeti",p:"Annen sana Kehf suresinin ilk on ayetini ve anlamını öğretmek istiyor.",c:["Otur, öğren","Sonra, şimdi oyun var"],r:["Kehf'in ilk on ayetini ezberleyen Deccal'den korunur. 7. ayet: Yeryüzündekiler insanları sınamak için bir süstür.","Boş vakit de bir nimettir; insanların çoğu onda aldanır."]},
 {h:"Die ersten zehn Verse",p:"Deine Mutter möchte dir die ersten zehn Verse der Sure al-Kahf und ihre Bedeutung beibringen.",c:["Hinsetzen und lernen","Später, jetzt wird gespielt"],r:["Wer die ersten zehn Verse von al-Kahf auswendig lernt, ist vor dem Dadschal geschützt. Vers 7: Was auf der Erde ist, ist ein Schmuck, um die Menschen zu prüfen.","Freie Zeit ist auch ein Segen; die meisten Menschen lassen sich darin täuschen."]},
 {h:"The first ten verses",p:"Your mother wants to teach you the first ten verses of Surah al-Kahf and their meaning.",c:["Sit down and learn","Later, it's playtime"],r:["Whoever memorises the first ten verses of al-Kahf is protected from the Dajjal. Verse 7: what is on earth is an adornment to test people.","Free time is a blessing too; most people are deceived in it."]}),
C('scroll',1,16,[{hak:1},{wasted:3,likes:120}],['T 2417','B 6412'],
 {h:"Sadece beş dakika",p:"Gece yarısı, telefon elinde. “Sadece beş dakika” diyorsun.",c:["Telefonu bırak, uyu","Kaydırmaya devam et"],r:["Kıyamet günü ömrünü nerede tükettiğin sorulacak.","Üç saat geçti. Beğeni geldi, ömür gitti."]},
 {h:"Nur fünf Minuten",p:"Mitternacht, das Handy in der Hand. „Nur fünf Minuten“, sagst du.",c:["Handy weglegen, schlafen","Weiter scrollen"],r:["Am Tag des Gerichts wirst du gefragt, wofür du dein Leben verbraucht hast.","Drei Stunden sind vergangen. Die Likes kamen, das Leben ging."]},
 {h:"Just five minutes",p:"Midnight, phone in hand. “Just five minutes,” you say.",c:["Put the phone down and sleep","Keep scrolling"],r:["On the Day of Judgement you will be asked how you spent your life.","Three hours passed. The likes came, the life went."]}),
C('maas',1,18,[{good:1,sadaka:1,share:1,charity:1,money:10},{items:'phone',likes:40}],['M 2958','M 2959'],
 {h:"İlk maaş",p:"İlk maaşını aldın. Mahallede zor durumda bir aile var.",c:["Bir kısmını o aileye ver","Hepsiyle yeni telefon al"],r:["Malından sana kalan, verip ileriye gönderdiğindir.","Yeni telefon parlıyor. Ama malından sana kalan, yiyip tükettiğin, giyip eskittiğin ve verdiğindir; gerisini bırakıp gideceksin."]},
 {h:"Das erste Gehalt",p:"Du hast dein erstes Gehalt bekommen. In der Nachbarschaft lebt eine Familie in Not.",c:["Einen Teil dieser Familie geben","Alles für ein neues Handy"],r:["Von deinem Besitz bleibt dir, was du gegeben und vorausgeschickt hast.","Das neue Handy glänzt. Doch dir gehört nur, was du gegessen, abgetragen und gegeben hast; den Rest lässt du zurück."]},
 {h:"First salary",p:"You've received your first salary. A family in the neighbourhood is struggling.",c:["Give part of it to that family","Spend it all on a new phone"],r:["What remains yours of your wealth is what you gave and sent ahead.","The new phone shines. But yours is only what you ate, wore out and gave; the rest you leave behind."]}),
C('gibet',1,20,[{good:1,ahlak:1,hak:1},{kh:'gossip',bad:1,crowd:1,likes:30}],['T 2002','M 2581'],
 {h:"Dedikodu",p:"Arkadaş grubunda biri, orada olmayan bir arkadaşınızın sırrını anlatıyor.",c:["Konuyu değiştir, gıybete katılma","Sen de bildiğini anlat"],r:["Dilini tuttun. Bu da güzel ahlaktır.","Arkadaşının hakkı sende kaldı: kul hakkı. Hadiste, iyilikleri hak sahiplerine dağıtılan “müflis” anlatılır."]},
 {h:"Klatsch",p:"In deiner Clique erzählt jemand das Geheimnis eines Freundes, der nicht da ist.",c:["Thema wechseln, nicht mitlästern","Erzählen, was du auch weißt"],r:["Du hast deine Zunge gehütet. Auch das ist guter Charakter.","Das Recht deines Freundes liegt nun bei dir. Der Hadith beschreibt den „Bankrotten“, dessen gute Taten an die Geschädigten verteilt werden."]},
 {h:"Gossip",p:"In your group, someone reveals the secret of a friend who isn't there.",c:["Change the subject, don't join in","Tell what you know too"],r:["You held your tongue. That too is good character.","Your friend's right now rests with you. The hadith describes the “bankrupt” whose good deeds are handed to those he wronged."]}),
C('kolaypara',1,22,[{avoid:1,hak:1,emanet:1},{money:60,haram:1,bad:1}],['B 7501','T 2417'],
 {h:"Kolay para",p:"Biri “kimse bilmez” diyerek şüpheli bir işten büyük para teklif ediyor.",c:["Reddet","Kabul et"],r:["Kötülüğe niyet edip Allah için vazgeçene bir iyilik yazılır.","Cüzdanın doldu. Ama malını nereden kazandığın sorulacak."]},
 {h:"Schnelles Geld",p:"Jemand bietet dir mit „Niemand wird es erfahren“ viel Geld für ein zwielichtiges Geschäft an.",c:["Ablehnen","Annehmen"],r:["Wer eine schlechte Tat um Allahs willen unterlässt, dem wird eine gute Tat geschrieben.","Die Brieftasche ist voll. Aber du wirst gefragt, woher dein Besitz kam."]},
 {h:"Easy money",p:"Someone offers you big money for a shady job: “No one will know.”",c:["Refuse","Accept"],r:["Whoever leaves a bad deed for Allah's sake has a good deed written for them.","Your wallet is full. But you will be asked where your wealth came from."]}),
C('dost',1,24,[{good:1,shade:4,ahlak:1},{}],['B 660',''],
 {h:"Allah için dostluk",p:"Camide tanıştığın bir arkadaşın çok sıkıntılı ve seninle konuşmak istiyor.",c:["Saatlerce dinle, yanında ol","“Meşgulüm” de"],r:["Allah için birbirini seven iki kişi, Allah'ın gölgelendireceği yedi kişidendir.","Meşgul olduğun şeyler de bir gün geride kalacak."]},
 {h:"Freundschaft um Allahs willen",p:"{Ein Freund|Eine Freundin} aus der Moschee steckt in großen Sorgen und möchte mit dir reden.",c:["Stundenlang zuhören, für {ihn|sie} da sein","„Ich habe keine Zeit“ sagen"],r:["Zwei, die einander um Allahs willen lieben, gehören zu den Sieben, denen Allah Schatten gibt.","Auch das, was dich so beschäftigt, bleibt eines Tages zurück."]},
 {h:"Friendship for Allah",p:"A friend you met at the mosque is in deep trouble and wants to talk to you.",c:["Listen for hours, stay with {him|her}","Say “I'm busy”"],r:["Two who love each other for Allah's sake are among the seven whom Allah will shade.","What keeps you busy will also stay behind one day."]}),
C('davet',1,26,[{avoid:1,shade:5,hak:1},{bad:1}],['B 660','Q 17:13-14'],
 {h:"Gizli davet",p:"Makam ve güzellik sahibi biri seni gizlice harama davet ediyor.",c:["“Ben Allah'tan korkarım” de","“Kimse görmez” de"],r:["Bu cümle, Allah'ın gölgelendireceği yedi kişiden birinin cümlesidir.","Kimse görmese de defter yazar."]},
 {h:"Eine heimliche Einladung",p:"Eine Person mit Rang und Schönheit lädt dich heimlich zu etwas Verbotenem ein.",c:["„Ich fürchte Allah“ sagen","„Niemand sieht es“ sagen"],r:["Das ist der Satz eines der Sieben, denen Allah Schatten gibt.","Auch wenn niemand es sieht: das Buch schreibt mit."]},
 {h:"A secret invitation",p:"A person of rank and beauty secretly invites you to something forbidden.",c:["Say “I fear Allah”","Say “No one will see”"],r:["These are the words of one of the seven whom Allah will shade.","Even if no one sees, the book keeps writing."]}),
C('akraba',1,28,[{good:1,rahim:1,ahlak:1},{rahim:-1}],['M 195','M 195'],
 {h:"Küs akraba",p:"Yıllardır küs olduğun bir akraban hastanede yatıyor.",c:["Git, barış","“Önce o arasın”"],r:["Akrabalık bağı, sıratın bir yanında duracak.","Akrabalık bağı sıratın bir yanında duracak; sen onu kopardın."]},
 {h:"Zerstrittene Verwandte",p:"Ein Verwandter, mit dem du seit Jahren zerstritten bist, liegt im Krankenhaus.",c:["Hingehen, sich versöhnen","„Er soll sich zuerst melden“"],r:["Die Verwandtschaft wird an einer Seite der Brücke stehen.","Die Verwandtschaft wird an einer Seite der Brücke stehen; du hast das Band zerrissen."]},
 {h:"Estranged relative",p:"A relative you haven't spoken to in years is in hospital.",c:["Go and make peace","“He should call first”"],r:["Kinship will stand on one side of the Bridge.","Kinship will stand on one side of the Bridge; you cut the tie."]}),
C('aile',2,31,[{good:1,evlat:1,ilim:1,rahim:1},{items:'toys'}],['M 1631',''],
 {h:"Çocukların",p:"Bir ailen var. Çocukların seni örnek alıyor.",c:["Onlara namazı, dürüstlüğü, merhameti öğret","En pahalı oyuncakları al, gerisi okulun işi"],r:["Sana dua eden salih bir evlat, ölümünden sonra da defterine yazılır.","Oyuncaklar eskir; öğrettiğin şeyler kalır."]},
 {h:"Deine Kinder",p:"Du hast eine Familie. Deine Kinder nehmen sich ein Beispiel an dir.",c:["Gebet, Ehrlichkeit und Barmherzigkeit lehren","Die teuersten Spielsachen kaufen, der Rest ist Sache der Schule"],r:["Ein rechtschaffenes Kind, das für dich betet, wird auch nach deinem Tod in dein Buch geschrieben.","Spielsachen gehen kaputt; was du lehrst, bleibt."]},
 {h:"Your children",p:"You have a family. Your children follow your example.",c:["Teach them prayer, honesty and mercy","Buy the most expensive toys; the rest is the school's job"],r:["A righteous child who prays for you is written in your book even after your death.","Toys wear out; what you teach remains."]}),
C('ev',2,35,[{items:'house',wasted:4,likes:80},{good:1,cariye:1,sadaka:1,share:1,charity:1}],['Q 102:1-2','M 1631|B 2363'],
 {h:"Daha büyük ev",p:"Daha büyük bir ev için yıllarca fazla mesai yapabilirsin. Ya da ihtiyacın kadarıyla yetinip bir köye çeşme yaptırabilirsin.",c:["Büyük ev için çalış","Çeşmeyi yaptır"],r:["Ev büyüdü, mesai saatleri de. Çoğaltma yarışı insanı kabre kadar oyalar.","Çeşmeden su içen her canlı için sevap yazılmaya devam eder: sadaka-i câriye."]},
 {h:"Ein größeres Haus",p:"Für ein größeres Haus könntest du jahrelang Überstunden machen. Oder du bleibst bei dem, was du brauchst, und lässt in einem Dorf einen Brunnen bauen.",c:["Für das große Haus arbeiten","Den Brunnen bauen lassen"],r:["Das Haus wurde größer, die Arbeitszeit auch. Das Streben nach mehr lenkt ab bis ins Grab.","Für jedes Lebewesen, das daraus trinkt, wird weiter Lohn geschrieben: eine fortlaufende Spende."]},
 {h:"A bigger house",p:"You could work overtime for years to afford a bigger house. Or settle for what you need and build a water fountain for a village.",c:["Work for the big house","Build the fountain"],r:["The house grew, and so did the working hours. The race for more distracts until the grave.","Reward keeps being written for every creature that drinks from it: an ongoing charity."]}),
C('mudur',2,39,[{good:1,shade:1,emanet:1,hak:1},{kh:'unfair',bad:1,emanet:-1}],['B 660','B 59'],
 {h:"Müdür oldun",p:"İş yerinde müdür oldun. Akrabanın oğlu da başvurdu, ama başka bir aday daha uygun.",c:["Adil ol, uygun olanı al","Akrabanı işe al"],r:["Adil yönetici, Allah'ın gölgelendireceği yedi kişinin ilkidir.","İş ehline verilmeyince emanet zayi olur."]},
 {h:"Du bist Chef geworden",p:"Du leitest jetzt die Abteilung. Der Sohn eines Verwandten hat sich beworben, doch jemand anderes ist besser geeignet.",c:["Gerecht sein, den Geeigneten nehmen","Den Verwandten einstellen"],r:["Der gerechte Leiter ist der erste der Sieben, denen Allah Schatten gibt.","Wird eine Aufgabe Ungeeigneten gegeben, geht das anvertraute Gut verloren."]},
 {h:"You became the boss",p:"You now run the department. A relative's son applied, but another candidate is better suited.",c:["Be fair, hire the right person","Hire your relative"],r:["The just leader is the first of the seven whom Allah will shade.","When a task is given to those unfit for it, the trust is lost."]}),
C('ezan2',2,43,[{good:1,shade:3,hak:1},{bad:1,crowd:1}],['B 660',''],
 {h:"Toplantı",p:"Önemli bir toplantıdasın. Namaz vakti çıkmak üzere.",c:["İzin iste, namazını kıl","Toplantı daha önemli"],r:["Kalbi mescide (namaza) bağlı olan, Allah'ın gölgelendireceği yedi kişidendir.","Toplantı bitti. Vakit de çıktı."]},
 {h:"Die Besprechung",p:"Du bist in einer wichtigen Besprechung. Die Gebetszeit läuft gleich ab.",c:["Um eine Pause bitten und beten","Die Besprechung ist wichtiger"],r:["Wessen Herz an der Moschee (am Gebet) hängt, gehört zu den Sieben, denen Allah Schatten gibt.","Die Besprechung ist vorbei. Die Gebetszeit auch."]},
 {h:"The meeting",p:"You're in an important meeting. The prayer time is about to end.",c:["Excuse yourself and pray","The meeting is more important"],r:["The one whose heart is attached to the mosque (to prayer) is among the seven whom Allah will shade.","The meeting is over. So is the prayer time."]}),
C('helal',2,47,[{khClear:1,good:1,ahlak:1},{}],['B 2449','M 2581'],
 {h:"Kırdığın kalpler",p:"Yıllar içinde kalbini kırdığın, hakkını yediğin insanlar aklına geliyor.",c:["Hepsini bul, helalleş","Geçmiş geçmişte kaldı"],r:["Dinarın dirhemin olmadığı gün gelmeden helalleştin.","Kul hakkı tövbeyle silinmez; o gün iyiliklerle ödenir."]},
 {h:"Verletzte Herzen",p:"Dir kommen die Menschen in den Sinn, deren Herz du verletzt oder deren Recht du genommen hast.",c:["Alle aufsuchen und um Vergebung bitten","Vergangen ist vergangen"],r:["Du hast es geregelt, bevor der Tag kommt, an dem es weder Dinar noch Dirham gibt.","Unrecht an Menschen löscht keine Reue; an jenem Tag wird mit guten Taten bezahlt."]},
 {h:"Hearts you broke",p:"You remember the people whose hearts you broke or whose rights you took.",c:["Find them all and settle","The past is the past"],r:["You settled it before the Day when there is no dinar or dirham.","Wrongs to people are not erased by repentance; on that Day they are paid with good deeds."]}),
C('gece',2,51,[{dhikr:1,shade:7},{wasted:2}],['B 660|B 7563',''],
 {h:"Gece yalnızken",p:"Herkes uyuyor. Yalnızsın.",c:["Allah'ı an, gözyaşın aksın","Bir bölüm daha izle"],r:["Tenhada Allah'ı anıp ağlayan, gölgelenecek yedi kişidendir. “Sübhânallahi ve bihamdihî” dile hafif, mizanda ağırdır.","Gece bitti, dizi bitmedi."]},
 {h:"Nachts allein",p:"Alle schlafen. Du bist allein.",c:["Allahs gedenken, Tränen fließen lassen","Noch eine Folge schauen"],r:["Wer in der Stille Allahs gedenkt und weint, gehört zu den Sieben im Schatten. „Subhanallahi wa bihamdihi“ ist leicht auf der Zunge und schwer auf der Waage.","Die Nacht ist vorbei, die Serie nicht."]},
 {h:"Alone at night",p:"Everyone is asleep. You are alone.",c:["Remember Allah, let your tears flow","Watch one more episode"],r:["Whoever remembers Allah in solitude and weeps is among the seven in His shade. “Subhanallahi wa bihamdihi” is light on the tongue, heavy on the scale.","The night ended; the series didn't."]}),
C('komsu',2,55,[{good:1,ahlak:1,share:1},{niyet:1}],['M 2626','B 6491'],
 {h:"Hasta komşu",p:"Yaşlı komşun hasta. Kimse ziyaretine gitmiyor.",c:["Ziyaret et, yemek götür","Yarın giderim"],r:["Hiçbir iyiliği küçük görme.","Niyetin yazıldı. Ama yarın herkese gelmez."]},
 {h:"Der kranke Nachbar",p:"Dein alter Nachbar ist krank. Niemand besucht ihn.",c:["Besuchen, Essen mitbringen","Ich gehe morgen"],r:["Halte keine gute Tat für gering.","Deine Absicht wurde geschrieben. Aber nicht jeder erlebt das Morgen."]},
 {h:"The sick neighbour",p:"Your elderly neighbour is ill. No one visits him.",c:["Visit him, bring food","I'll go tomorrow"],r:["Do not belittle any good deed.","Your intention was written. But not everyone reaches tomorrow."]}),
C('daha',2,59,[{good:1,sadaka:1,charity:1,secret:1},{money:80,wasted:3}],['B 660','Q 102:1-2'],
 {h:"Daha fazla",p:"Hesabında para birikti. Telefonun bildirimlerle dolu: “Daha fazla kazan!”",c:["“Yeter” de, bir kısmını gizlice ver","Hepsini “daha fazla” için yatır"],r:["Sağ elin verdi, sol elin bilmedi.","Çoğaltma yarışı sizi oyaladı, ta kabirlere varıncaya kadar."]},
 {h:"Noch mehr",p:"Auf deinem Konto hat sich Geld angesammelt. Dein Handy ist voller Meldungen: „Verdiene noch mehr!“",c:["„Genug“ sagen, einen Teil heimlich spenden","Alles für „noch mehr“ anlegen"],r:["Deine Rechte gab, und deine Linke wusste es nicht.","Das Streben nach mehr hat euch abgelenkt, bis ihr die Gräber besucht."]},
 {h:"More",p:"Money has piled up in your account. Your phone is full of alerts: “Earn more!”",c:["Say “enough”, give part of it in secret","Put it all into “more”"],r:["Your right hand gave and your left hand did not know.","The race for more distracted you until you reached the graves."]}),
C('torun',3,64,[{good:1,ilim:1,rahim:1},{}],['M 1631','B 6514'],
 {h:"Torunlar",p:"Torunların başına toplandı. Onlara ne anlatacaksın?",c:["Bildiğin hayırlı şeyleri öğret","Eski zenginliğini anlat"],r:["Faydalanılan ilim, ölümden sonra da yazılmaya devam eder.","Hikâye güzeldi. Ama mal ölümde geri döner."]},
 {h:"Die Enkel",p:"Deine Enkel sitzen um dich herum. Was erzählst du ihnen?",c:["Das Gute lehren, das du weißt","Von deinem früheren Reichtum erzählen"],r:["Nützliches Wissen wird auch nach dem Tod weitergeschrieben.","Die Geschichte war schön. Doch der Besitz kehrt beim Tod um."]},
 {h:"Grandchildren",p:"Your grandchildren gather around you. What will you tell them?",c:["Teach them the good you know","Talk about your past wealth"],r:["Beneficial knowledge keeps being written after death.","The story was nice. But wealth turns back at death."]}),
C('fidan',3,72,[{good:1,cariye:1},{}],['AM 479|B 2320',''],
 {h:"Bir fidan",p:"Bahçende boş bir yer var, elinde bir fidan. “Bu yaştan sonra ağaç mı dikilir?” diye düşünüyorsun.",c:["Yine de dik","Boş ver"],r:["Peygamberimiz (s.a.s.): “Kıyamet kopacak olsa ve birinizin elinde bir fidan bulunsa, onu dikebiliyorsa diksin.” Ondan yiyen her kuş, insan ve hayvan sana sadaka olur.","Fırsat geçti."]},
 {h:"Ein Setzling",p:"In deinem Garten ist ein freier Platz, in deiner Hand ein Setzling. „Pflanzt man in diesem Alter noch Bäume?“, denkst du.",c:["Trotzdem pflanzen","Lass es"],r:["Unser Prophet (s.) sagte: „Wenn die Stunde anbricht und einer von euch hat einen Setzling in der Hand, soll er ihn pflanzen, wenn er kann.“ Isst ein Vogel, Mensch oder Tier davon, ist es eine Spende für dich.","Die Gelegenheit ist vorbei."]},
 {h:"A sapling",p:"There's an empty spot in your garden and a sapling in your hand. “Who plants trees at this age?” you think.",c:["Plant it anyway","Never mind"],r:["Our Prophet (peace be upon him) said: “If the Hour comes while one of you holds a sapling, let him plant it if he can.” Whatever bird, person or animal eats from it is charity for you.","The chance has passed."]})

 begin:g=>{S=Object.assign(fresh(S.lang),{g,scr:'life'});render()},
 choose:k=>{k=+k;const c=CARDS[S.i];apply(c,k);S.k=k;S.note='';S.scr=(c.fx[k]||{}).share?'share':'result';render()},
 share:y=>{const c=CARDS[S.i],fx=c.fx[S.k]||{},e=S.log[S.log.length-1];if(+y){['good','ahlak','sadaka','cariye'].forEach(q=>{S[q]-=fx[q]||0});S.riya+=1;S.likes+=200;e.tags=e.tags.filter(g=>g!=='good').concat('riya');S.note='shareDone'}else{if(fx.charity){S.secret++;S.shade[5]=1;e.tags.push('secret')}S.note='secretDone'}S.scr='result';render()},
 next:()=>{S.i++;S.k=-1;S.note='';S.scr='life';render()},
 tovbe:()=>{if(S.bad>0){S.rep+=S.bad;S.bad=0;S.log.forEach(e=>{if(e.tags.includes('bad')&&!e.tags.includes('rep'))e.tags.push('rep')});toast(t('tovbeDone')+(S.kh.length?' '+t('tovbeKh'):''))}else toast(t('tovbeClean')+(S.kh.length?' '+t('tovbeKh'):''));showHud('life')},
 go:s=>{S.scr=s;render();stage.scrollTop=0},
 home:()=>{const n=Date.now();if(n-(S.homeT||0)<3500){S=fresh(S.lang);render();toastEl.classList.remove('show')}else{S.homeT=n;toast(t('homeAgain'))}},
 step:()=>{const m=S.mz||weigh();S.sp+=TIERS[S.tier][1];if(m.g<=m.b&&S.sp>=60){S.sp=60;render();return}if(S.sp>=100){S.sp=100;render();setTimeout(()=>{if(S.scr==='sirat'){S.scr='final';render();stage.scrollTop=0}},650)}else render()},
 again:()=>{S=fresh(S.lang);render()}};
function render(){document.documentElement.lang=S.lang;(SCR[S.scr]||SCR.start)()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg)});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',()=>{app.style.setProperty('--ctlh',ctl.offsetHeight+'px');if(S&&S.scr==='sirat')placeFx()});
const start=data=>{S=(data&&data.scr)?Object.assign(fresh(data.lang||'tr'),data):fresh(savedLang());render()};
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if('serviceWorker' in navigator&&location.protocol==='https:'&&/\/spiel\//.test(location.pathname))navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
}
</script>
</body>
